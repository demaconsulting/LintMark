---
# CodeQL configuration for LintMark
# Suppresses intentional generic catch clauses

name: "LintMark CodeQL Config"

# Query filters to disable specific queries for certain paths
query-filters:
  - exclude:
      id: cs/catch-of-all-exceptions
    paths:
      - src/DemaConsulting.LintMark/Context.cs
      - src/DemaConsulting.LintMark/Validation.cs
  # Exclude path-combine warnings in PathHelpers (validated safe usage)
  - exclude:
      id: cs/path-combine
    paths:
      - src/DemaConsulting.LintMark/PathHelpers.cs
