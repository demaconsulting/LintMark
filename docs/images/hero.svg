<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="640" viewBox="0 0 1600 640">
  <!-- The README hero banner. Markdown docs, READMEs, a .lintmark.yaml, and CI and coding agents flow into the
       lintmark tool, which reports findings as file:line:col: rule-id, rewrites files (fix), previews the
       rewrite (diff), and gates CI with its exit code.
       The definitions and the left panel follow the shared DEMA Consulting hero (CanvasNet and BuildMark).
       This file is docs/images/hero.svg, beside its rendered docs/images/hero.png (matching base names, per the
       diagram documentation standard); the files it embeds are in docs/images/hero/. -->
  <defs>
    <style>
      .word { font: bold 92px sans-serif; fill: #ffffff; }
      .eyebrow { font: bold 25px sans-serif; fill: #a5b4fc; }
      .tag { font: bold 40px sans-serif; fill: #f8fafc; }
      .body { font: 25px sans-serif; fill: #cbd5e1; }
      .cmd { font: 25px monospace; fill: #e2e8f0; }
      .prompt { fill: #5eead4; }
      .file { fill: #f9a8d4; }
      .brandText { fill: url(#brand); }
      .note { font: italic 25px sans-serif; fill: #94a3b8; }
      .label { font: bold 25px sans-serif; fill: #f1f5f9; text-anchor: middle; }
      .engine { font: bold 32px monospace; fill: #ffffff; }
      .api { font: bold 25px sans-serif; fill: #c4b5fd; }
      .card { fill: url(#glass); stroke: url(#rim); stroke-width: 1.5; filter: url(#shadow); }
      .panel { fill: #0a1022; stroke: #ffffff; stroke-opacity: 0.06; }
      .flow { fill: none; stroke-width: 3; stroke-linecap: round; }
      .page { fill: #ffffff; filter: url(#paper); }
    </style>

    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b1f"/>
      <stop offset="0.55" stop-color="#130f3b"/>
      <stop offset="1" stop-color="#071a2e"/>
    </linearGradient>
    <radialGradient id="glowViolet" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#06b6d4" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPink" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#db2777" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#db2777" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1.2" fill="#a5b4fc" fill-opacity="0.16"/>
    </pattern>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="engineFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#0b1022"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="paper" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <filter id="blur" x="-30%" y="-150%" width="160%" height="400%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="heat" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>

    <marker id="headPink" viewBox="0 0 10 10" refX="2.5" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L10,5 L0,10 L2.5,5 z" fill="#f472b6"/>
    </marker>
    <marker id="headAmber" viewBox="0 0 10 10" refX="2.5" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L10,5 L0,10 L2.5,5 z" fill="#fbbf24"/>
    </marker>
    <marker id="headCyan" viewBox="0 0 10 10" refX="2.5" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L10,5 L0,10 L2.5,5 z" fill="#22d3ee"/>
    </marker>
    <marker id="headViolet" viewBox="0 0 10 10" refX="2.5" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L10,5 L0,10 L2.5,5 z" fill="#a78bfa"/>
    </marker>
    <marker id="headBlue" viewBox="0 0 10 10" refX="2.5" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L10,5 L0,10 L2.5,5 z" fill="#60a5fa"/>
    </marker>
    <marker id="headMint" viewBox="0 0 10 10" refX="2.5" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L10,5 L0,10 L2.5,5 z" fill="#5eead4"/>
    </marker>

    <!-- The text and shapes inside the mini illustrations -->
    <style>
      .mini { font: bold 22px sans-serif; }
      .miniMono { font: bold 22px monospace; }
      .bar { fill: #cbd5e1; }
      .ink { fill: #1e293b; }
    </style>
  </defs>

  <!-- Background: deep gradient, soft glows, and a dot grid -->
  <rect width="1600" height="640" fill="url(#bg)"/>
  <ellipse cx="250" cy="170" rx="420" ry="300" fill="url(#glowViolet)"/>
  <ellipse cx="1070" cy="294" rx="420" ry="220" fill="url(#glowCyan)"/>
  <ellipse cx="1480" cy="620" rx="380" ry="260" fill="url(#glowPink)"/>
  <rect width="1600" height="640" fill="url(#dots)"/>

  <!-- Wordmark and tagline -->
  <image href="hero/dc-logo-dark.svg" x="46" y="54" width="50" height="50"/>
  <text class="eyebrow" x="100" y="90">DEMA Consulting</text>
  <text class="word" x="52" y="176">Lint</text>
  <text class="word brandText" x="220.6" y="176">Mark</text>
  <rect x="58" y="200" width="132" height="6" rx="3" fill="url(#brand)"/>
  <text class="tag" x="56" y="266">One Markdown style.</text>
  <text class="tag brandText" x="56" y="316">Flagged, then fixed.</text>
  <text class="body" x="58" y="368">Checks Markdown against one style,</text>
  <text class="body" x="58" y="402">rewrites it with --fix, previews with</text>
  <text class="body" x="58" y="436">--diff. Configured by .lintmark.yaml.</text>
  <rect x="56" y="468" width="480" height="54" rx="12" fill="#0a1022" fill-opacity="0.8" stroke="#a78bfa" stroke-opacity="0.45" stroke-width="1.5"/>
  <text class="cmd prompt" x="78" y="503">$</text>
  <text class="cmd" x="108" y="503">lintmark --fix</text>
  <text class="cmd file" x="333" y="503">README.md</text>
  <text class="note" x="58" y="568">Replaces markdownlint. No Node.js.</text>

  <!-- Input cards -->
  <g>
    <!-- Markdown docs: a stack of .md pages -->
    <rect class="card" x="580" y="40" width="196" height="160" rx="16"/>
    <rect x="622" y="40" width="112" height="3" rx="1.5" fill="#fbbf24"/>
    <rect class="panel" x="588" y="48" width="180" height="112" rx="10"/>
    <g transform="translate(588 48)">
      <path d="M30 6 L66 6 L80 20 L80 88 L30 88 Z" fill="#94a3b8"/>
      <path class="page" d="M20 16 L58 16 L72 30 L72 100 L20 100 Z"/>
      <path d="M58 16 L58 30 L72 30 Z" fill="#cbd5e1"/>
      <text class="mini" x="28" y="52" fill="#d97706">#</text>
      <rect x="44" y="40" width="20" height="5" rx="2.5" fill="#fbbf24"/>
      <rect class="bar" x="28" y="62" width="36" height="5" rx="2.5"/>
      <rect class="bar" x="28" y="74" width="28" height="5" rx="2.5"/>
      <rect class="bar" x="28" y="86" width="34" height="5" rx="2.5"/>
      <rect x="96" y="18" width="70" height="32" rx="7" fill="#fbbf24" fill-opacity="0.16" stroke="#fbbf24" stroke-width="1.5"/>
      <text class="mini" x="131" y="42" fill="#fde68a" text-anchor="middle">.md</text>
      <rect class="bar" x="96" y="66" width="70" height="8" rx="4" fill-opacity="0.75"/>
      <rect class="bar" x="96" y="84" width="48" height="8" rx="4" fill-opacity="0.75"/>
    </g>
    <text class="label" x="678" y="190">Markdown</text>

    <!-- README and CHANGELOG: hand-written Markdown with mixed styles -->
    <rect class="card" x="788" y="40" width="236" height="160" rx="16"/>
    <rect x="850" y="40" width="112" height="3" rx="1.5" fill="#22d3ee"/>
    <rect class="panel" x="796" y="48" width="220" height="112" rx="10"/>
    <g transform="translate(796 48)">
      <text class="miniMono" x="18" y="32" fill="#67e8f9">#</text>
      <text class="miniMono" x="31" y="32" fill="#f8fafc">Intro</text>
      <text class="miniMono" x="18" y="66" fill="#67e8f9">*</text>
      <text class="miniMono" x="44" y="66" fill="#f8fafc">setup</text>
      <text class="miniMono" x="18" y="100" fill="#67e8f9">+</text>
      <text class="miniMono" x="44" y="100" fill="#f8fafc">usage</text>
      <rect x="128" y="50" width="70" height="8" rx="4" fill="#cbd5e1" fill-opacity="0.45"/>
      <rect x="128" y="84" width="54" height="8" rx="4" fill="#cbd5e1" fill-opacity="0.45"/>
    </g>
    <text class="label" x="906" y="190">README.md</text>

    <!-- .lintmark.yaml: the style settings -->
    <rect class="card" x="1036" y="40" width="316" height="160" rx="16"/>
    <rect x="1138" y="40" width="112" height="3" rx="1.5" fill="#f472b6"/>
    <rect class="panel" x="1044" y="48" width="300" height="112" rx="10"/>
    <g transform="translate(1044 48)">
      <text class="miniMono" x="20" y="32" fill="#f9a8d4">line-length:</text>
      <text class="miniMono" x="198" y="32" fill="#f8fafc">120</text>
      <text class="miniMono" x="20" y="66" fill="#f9a8d4">wrap:</text>
      <text class="miniMono" x="106" y="66" fill="#f8fafc">fill</text>
      <text class="miniMono" x="20" y="100" fill="#f9a8d4">tables:</text>
      <text class="miniMono" x="132" y="100" fill="#f8fafc">aligned</text>
    </g>
    <text class="label" x="1194" y="190">.lintmark.yaml</text>

    <!-- CI and coding agents: a pipeline step that runs lintmark -->
    <rect class="card" x="1364" y="40" width="196" height="160" rx="16"/>
    <rect x="1406" y="40" width="112" height="3" rx="1.5" fill="#60a5fa"/>
    <rect class="panel" x="1372" y="48" width="180" height="112" rx="10"/>
    <g transform="translate(1372 48)">
      <rect x="16" y="14" width="148" height="56" rx="8" fill="#111827" stroke="#60a5fa" stroke-opacity="0.6" stroke-width="1.5"/>
      <circle cx="30" cy="26" r="4" fill="#f472b6"/>
      <circle cx="44" cy="26" r="4" fill="#fbbf24"/>
      <circle cx="58" cy="26" r="4" fill="#4ade80"/>
      <text class="miniMono" x="26" y="58" fill="#5eead4">&gt;</text>
      <rect x="46" y="49" width="100" height="8" rx="4" fill="#bfdbfe" fill-opacity="0.8"/>
      <g stroke="#60a5fa" stroke-width="2.5">
        <line x1="40" y1="92" x2="140" y2="92"/>
      </g>
      <circle cx="40" cy="92" r="9" fill="#60a5fa"/>
      <circle cx="90" cy="92" r="9" fill="#60a5fa"/>
      <circle cx="140" cy="92" r="9" fill="#0a1022" stroke="#60a5fa" stroke-width="2.5"/>
    </g>
    <text class="label" x="1462" y="190">CI &amp; agents</text>
  </g>

  <!-- Flows into the engine -->
  <g class="flow">
    <path d="M678,206 C678,236 950,226 950,253" stroke="#fbbf24" marker-end="url(#headAmber)"/>
    <path d="M906,206 C906,236 1030,226 1030,253" stroke="#22d3ee" marker-end="url(#headCyan)"/>
    <path d="M1194,206 C1194,236 1110,226 1110,253" stroke="#f472b6" marker-end="url(#headPink)"/>
    <path d="M1462,206 C1462,236 1190,226 1190,253" stroke="#60a5fa" marker-end="url(#headBlue)"/>
  </g>
  <g stroke="#0a1022" stroke-width="2">
    <circle cx="678" cy="206" r="5" fill="#fbbf24"/>
    <circle cx="906" cy="206" r="5" fill="#22d3ee"/>
    <circle cx="1194" cy="206" r="5" fill="#f472b6"/>
    <circle cx="1462" cy="206" r="5" fill="#60a5fa"/>
  </g>
  <!-- The engine -->
  <rect x="860" y="262" width="420" height="64" rx="32" fill="url(#brand)" opacity="0.55" filter="url(#blur)"/>
  <rect x="860" y="262" width="420" height="64" rx="32" fill="url(#engineFill)" stroke="url(#brand)" stroke-width="2.5"/>
  <rect x="884" y="276" width="36" height="36" rx="9" fill="url(#brand)"/>
  <path d="M893 282 L906 282 L912 288 L912 306 L893 306 Z" fill="#ffffff"/>
  <g fill="#7c3aed">
    <rect x="897" y="290" width="11" height="2.5" rx="1.2"/>
    <rect x="897" y="295" width="11" height="2.5" rx="1.2"/>
    <rect x="897" y="300" width="7" height="2.5" rx="1.2"/>
  </g>
  <text class="engine" x="936" y="305">lintmark</text>
  <line x1="1120" y1="278" x2="1120" y2="310" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1.5"/>
  <text class="api" x="1140" y="303">.NET tool</text>

  <!-- Flows out of the engine -->
  <g class="flow" stroke="#5eead4">
    <path d="M980,330 C980,356 728,356 728,381" marker-end="url(#headMint)"/>
    <path d="M1040,330 C1040,356 999,356 999,381" marker-end="url(#headMint)"/>
    <path d="M1100,330 C1100,356 1232,356 1232,381" marker-end="url(#headMint)"/>
    <path d="M1160,330 C1160,356 1457,356 1457,381" marker-end="url(#headMint)"/>
  </g>
  <g fill="#5eead4" stroke="#0a1022" stroke-width="2">
    <circle cx="980" cy="330" r="5"/>
    <circle cx="1040" cy="330" r="5"/>
    <circle cx="1100" cy="330" r="5"/>
    <circle cx="1160" cy="330" r="5"/>
  </g>

  <!-- Output tiles -->
  <g>
    <!-- Findings: file:line:col: rule-id lines, as lintmark prints them -->
    <rect class="card" x="580" y="390" width="296" height="210" rx="16"/>
    <rect class="panel" x="588" y="398" width="280" height="152" rx="10"/>
    <text class="miniMono" x="602" y="440" fill="#f9a8d4">a.md:4:1:</text>
    <text class="miniMono" x="734" y="440" fill="#f8fafc">bullet</text>
    <text class="miniMono" x="602" y="482" fill="#f9a8d4">a.md:9:7:</text>
    <text class="miniMono" x="734" y="482" fill="#f8fafc">hard-tabs</text>
    <text class="miniMono" x="602" y="524" fill="#f9a8d4">b.md:2:5:</text>
    <text class="miniMono" x="734" y="524" fill="#f8fafc">emphasis</text>
    <text class="label" x="728" y="585">Findings</text>

    <!-- Fix: a list item rewritten to the canonical marker -->
    <rect class="card" x="889" y="390" width="220" height="210" rx="16"/>
    <rect class="panel" x="897" y="398" width="204" height="152" rx="10"/>
    <text class="miniMono" x="999" y="436" fill="#fca5a5" text-anchor="middle">* item</text>
    <line x1="958" y1="429" x2="1040" y2="429" stroke="#fca5a5" stroke-width="2"/>
    <path d="M999 450 L999 482" stroke="#5eead4" stroke-width="3" stroke-linecap="round" marker-end="url(#headMint)"/>
    <rect x="944" y="498" width="110" height="36" rx="18" fill="#4ade80" fill-opacity="0.18" stroke="#4ade80" stroke-width="1.5"/>
    <text class="miniMono" x="999" y="523" fill="#bbf7d0" text-anchor="middle">- item</text>
    <text class="label" x="999" y="585">--fix rewrite</text>

    <!-- Diff: a unified diff preview -->
    <rect class="card" x="1122" y="390" width="220" height="210" rx="16"/>
    <rect class="panel" x="1130" y="398" width="204" height="152" rx="10"/>
    <text class="miniMono" x="1146" y="440" fill="#a5b4fc">@@ -4 +4 @@</text>
    <rect x="1140" y="458" width="184" height="34" rx="6" fill="#f87171" fill-opacity="0.16"/>
    <text class="miniMono" x="1146" y="482" fill="#fca5a5">-* item</text>
    <rect x="1140" y="500" width="184" height="34" rx="6" fill="#4ade80" fill-opacity="0.16"/>
    <text class="miniMono" x="1146" y="524" fill="#bbf7d0">+- item</text>
    <text class="label" x="1232" y="585">--diff preview</text>

    <!-- CI gate: exit code 0 when clean -->
    <rect class="card" x="1355" y="390" width="205" height="210" rx="16"/>
    <rect class="panel" x="1363" y="398" width="189" height="152" rx="10"/>
    <circle cx="1457" cy="448" r="26" fill="#4ade80" fill-opacity="0.18" stroke="#4ade80" stroke-width="2.5"/>
    <path d="M1444 448 L1453 458 L1471 437" fill="none" stroke="#4ade80" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="1395" y="494" width="124" height="38" rx="8" fill="#ffffff" fill-opacity="0.08" stroke="#5eead4" stroke-opacity="0.6" stroke-width="1.5"/>
    <text class="miniMono" x="1457" y="520" fill="#e2e8f0" text-anchor="middle">exit 0</text>
    <text class="label" x="1457" y="585">CI gate</text>
  </g>
</svg>
