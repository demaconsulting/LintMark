<svg xmlns="http://www.w3.org/2000/svg" width="1156" height="340" viewBox="0 0 1156 340" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <!-- Transparent canvas; a white rounded card keeps the diagram readable in light and dark themes -->
  <rect x="14" y="16" width="1140" height="318" rx="28" fill="#d5dce6"/>
  <rect x="10" y="10" width="1140" height="318" rx="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>

  <g transform="translate(30,34)">
    <!-- 1. Prepare inputs -->
    <rect x="0" y="0" width="250" height="242" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="125" y="30" font-size="16" font-weight="600" fill="#1e3a8a" text-anchor="middle">1. Prepare inputs</text>
    <rect x="14" y="46" width="222" height="54" rx="6" fill="#ffffff" stroke="#2563eb"/>
    <text x="125" y="68" font-size="14" font-weight="600" fill="#1e3a8a" text-anchor="middle">Markdown files</text>
    <text x="125" y="88" font-size="12" fill="#1e40af" text-anchor="middle">*.md paths, directories, globs</text>
    <rect x="14" y="110" width="222" height="54" rx="6" fill="#ffffff" stroke="#2563eb"/>
    <text x="125" y="132" font-size="14" font-weight="600" fill="#1e3a8a" text-anchor="middle">.lintmark.yaml</text>
    <text x="125" y="152" font-size="12" fill="#1e40af" text-anchor="middle">Optional style settings</text>
    <rect x="14" y="174" width="222" height="54" rx="6" fill="#ffffff" stroke="#2563eb"/>
    <text x="125" y="196" font-size="14" font-weight="600" fill="#1e3a8a" text-anchor="middle">.editorconfig</text>
    <text x="125" y="216" font-size="12" fill="#1e40af" text-anchor="middle">Line endings (end_of_line)</text>
    <line x1="254" y1="121" x2="276" y2="121" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>

    <!-- 2. Run LintMark -->
    <rect x="280" y="0" width="250" height="242" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="405" y="30" font-size="16" font-weight="600" fill="#92400e" text-anchor="middle">2. Run LintMark</text>
    <rect x="294" y="46" width="222" height="54" rx="6" fill="#ffffff" stroke="#d97706"/>
    <text x="405" y="68" font-size="14" font-weight="600" font-family="Consolas, monospace" fill="#92400e" text-anchor="middle">lintmark --check</text>
    <text x="405" y="88" font-size="12" fill="#92400e" text-anchor="middle">Report only (the default)</text>
    <rect x="294" y="110" width="222" height="54" rx="6" fill="#ffffff" stroke="#d97706"/>
    <text x="405" y="132" font-size="14" font-weight="600" font-family="Consolas, monospace" fill="#92400e" text-anchor="middle">lintmark --fix  |  --diff</text>
    <text x="405" y="152" font-size="12" fill="#92400e" text-anchor="middle">Rewrite in place, or preview</text>
    <rect x="294" y="174" width="222" height="54" rx="6" fill="#ffffff" stroke="#d97706"/>
    <text x="405" y="196" font-size="14" font-weight="600" fill="#92400e" text-anchor="middle">Where it runs</text>
    <text x="405" y="216" font-size="12" fill="#92400e" text-anchor="middle">Locally, in CI, or by coding agents</text>
    <line x1="534" y1="121" x2="556" y2="121" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>

    <!-- 3. Get results -->
    <rect x="560" y="0" width="250" height="242" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="685" y="30" font-size="16" font-weight="600" fill="#4c1d95" text-anchor="middle">3. Get results</text>
    <rect x="574" y="46" width="222" height="54" rx="6" fill="#ffffff" stroke="#7c3aed"/>
    <text x="685" y="68" font-size="14" font-weight="600" fill="#4c1d95" text-anchor="middle">Findings</text>
    <text x="685" y="88" font-size="11" font-family="Consolas, monospace" fill="#5b21b6" text-anchor="middle">file:line:col: rule-id message</text>
    <rect x="574" y="110" width="222" height="54" rx="6" fill="#ffffff" stroke="#7c3aed"/>
    <text x="685" y="132" font-size="14" font-weight="600" fill="#4c1d95" text-anchor="middle">Rewrite or diff</text>
    <text x="685" y="152" font-size="12" fill="#5b21b6" text-anchor="middle">Updated files or a unified diff</text>
    <rect x="574" y="174" width="222" height="54" rx="6" fill="#ffffff" stroke="#7c3aed"/>
    <text x="685" y="196" font-size="14" font-weight="600" fill="#4c1d95" text-anchor="middle">Exit code</text>
    <text x="685" y="216" font-size="12" fill="#5b21b6" text-anchor="middle">0 clean, 1 findings or errors</text>
    <line x1="814" y1="121" x2="836" y2="121" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>

    <!-- 4. Use them -->
    <rect x="840" y="0" width="250" height="242" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="965" y="30" font-size="16" font-weight="600" fill="#14532d" text-anchor="middle">4. Use them</text>
    <rect x="854" y="46" width="222" height="54" rx="6" fill="#ffffff" stroke="#16a34a"/>
    <text x="965" y="68" font-size="14" font-weight="600" fill="#14532d" text-anchor="middle">CI quality gate</text>
    <text x="965" y="88" font-size="12" fill="#166534" text-anchor="middle">Fail the build on findings</text>
    <rect x="854" y="110" width="222" height="54" rx="6" fill="#ffffff" stroke="#16a34a"/>
    <text x="965" y="132" font-size="14" font-weight="600" fill="#14532d" text-anchor="middle">Auto-formatting</text>
    <text x="965" y="152" font-size="12" fill="#166534" text-anchor="middle">Agents skip hand-wrapping</text>
    <rect x="854" y="174" width="222" height="54" rx="6" fill="#ffffff" stroke="#16a34a"/>
    <text x="965" y="196" font-size="14" font-weight="600" fill="#14532d" text-anchor="middle">Consistent style</text>
    <text x="965" y="216" font-size="12" fill="#166534" text-anchor="middle">One style across repositories</text>

    <text x="545" y="274" font-size="13" font-style="italic" fill="#475569" text-anchor="middle">Need tool qualification evidence? Run lintmark --validate --results validation-results.trx</text>
  </g>
</svg>
