---
# LintMark System-Level Requirements
#
# PURPOSE:
# - Define the externally visible behavior that users need from the tool, at feature level
# - System requirements are validated through integration tests that run the published dotnet DLL end to end
# - Each requirement is decomposed into the subsystem requirements and the requirements of the units directly
#   under the system (Program, Context, Validation) that provide it

sections:
  - title: LintMark Requirements
    requirements:
      - id: LintMark-System-Version
        title: The tool shall print its version, and nothing else, when the version option is given.
        tags: [system]
        justification: |
          Users and scripts need to identify the installed version for troubleshooting and compatibility checks.
        children:
          - LintMark-Program-Dispatch
          - LintMark-Context-Options
        tests:
          - LintMark_VersionFlag_Provided_OutputsVersion

      - id: LintMark-System-Help
        title: The tool shall print usage information that describes every option when a help option is given.
        tags: [system]
        justification: |
          Users need the option reference at the command line without an external document.
        children:
          - LintMark-Program-Dispatch
          - LintMark-Context-Options
        tests:
          - LintMark_HelpFlag_Provided_OutputsUsageInformation

      - id: LintMark-System-DefaultBehavior
        title: >-
          The tool shall, when no path is given, print its banner and check every Markdown file below the working
          directory except those in the folders that the default ignore patterns exclude (`.git`, `node_modules`,
          `.venv`, `generated`, `thirdparty`, and `.agent-logs`).
        tags: [system]
        justification: |
          Running the tool in a repository root must do the useful thing without any arguments.
        children:
          - LintMark-Program-Banner
          - LintMark-Engine-Discovery
        tests:
          - LintMark_DefaultBehavior_NoPaths_ProcessesMarkdownUnderWorkingDirectory

      - id: LintMark-System-SelectFiles
        title: >-
          The tool shall process the Markdown files named by file paths, directories, and glob patterns, minus the
          files matched by exclusion patterns, each file once, including a file named explicitly inside a folder
          that is skipped by default, and without being stopped by a link that leads back into a folder it is
          already searching.
        tags: [system]
        justification: |
          Users must be able to target a whole repository, a folder, or a few files and exclude what they do not
          own, while a file they name on purpose is never silently skipped. Repositories contain links between
          folders, and a link that loops must not make the tool fail.
        children:
          - LintMark-Engine-Discovery
        tests:
          - LintMark_PathsProvided_ValidMarkdown_ReturnsSuccess
          - LintMark_SelectFiles_DirectoryGlobAndExclusion_SelectEachFileOnce
          - LintMark_SelectFiles_DirectoryLinkCycle_ChecksEachFileOnceAndExitsNormally

      - id: LintMark-System-Check
        title: >-
          The tool shall, by default and with the check option, report the problems it finds and never write a
          file.
        tags: [system]
        justification: |
          Checking is the safe default, so it can run in continuous integration and on a user's documents
          without any risk.
        children:
          - LintMark-Engine-Processing
          - LintMark-Engine-Reporting
        tests:
          - LintMark_CheckFlag_Provided_LintsWithoutWriting
          - LintMark_CleanFileNoFindings
          - LintMark_ViolationsReported

      - id: LintMark-System-Fix
        title: >-
          The tool shall, with the fix option, rewrite each file into its canonical form and then report the
          problems that remain.
        tags: [system]
        justification: |
          Most formatting problems have exactly one correct fix, and users want the tool to apply it instead
          of only complaining.
        children:
          - LintMark-Engine-Processing
          - LintMark-Engine-Writing
        tests:
          - LintMark_FixFlag_CrlfFile_RewritesToLf
          - LintMark_FixFlag_Twice_SecondRunReportsNothing
          - LintMark_FixRewritesToCanonicalForm

      - id: LintMark-System-Diff
        title: >-
          The tool shall, with the diff option, print the changes the fix option would make as a unified diff
          and write nothing.
        tags: [system]
        justification: |
          Users want to review a rewrite before they allow it, and tools can apply a diff.
        children:
          - LintMark-Engine-Reporting
        tests:
          - LintMark_DiffFlag_FormattingViolations_ShowsTheChange
          - LintMark_DiffPreviewsFixes

      - id: LintMark-System-OptionConflicts
        title: >-
          The tool shall reject unknown options, conflicting options, and invalid option values as usage errors
          that exit with status 1.
        tags: [system]
        justification: |
          A mistyped or contradictory command line must fail loudly instead of doing something different from
          what the user asked.
        children:
          - LintMark-Context-Options
          - LintMark-Program-ErrorHandling
        tests:
          - LintMark_UnknownArgument_Provided_ReturnsError
          - LintMark_FixWithCheck_Combined_ReturnsError
          - LintMark_EnableFlag_UnknownRule_IsAUsageError

      - id: LintMark-System-ExplicitConfig
        title: >-
          The tool shall use the configuration file named by the config option instead of discovering one, and
          use the defaults, ignoring editor settings too, when the no-config option is given.
        tags: [system]
        justification: |
          Users must be able to pin the configuration in a script and to run with known defaults.
        children:
          - LintMark-Configuration-Discovery
        tests:
          - LintMark_ExplicitConfig_ConfigFileGiven_ReplacesDiscovery
          - LintMark_ExplicitConfig_NoConfigGiven_UsesDefaultsAndIgnoresEditorConfig
          - LintMark_ConfigurationHonored

      - id: LintMark-System-RuleSwitches
        title: >-
          The tool shall switch rules on and off by id or by markdownlint number with the enable and disable
          options, which win over the configuration file.
        tags: [system]
        justification: |
          A single run must be able to add or drop a rule without editing the configuration.
        children:
          - LintMark-Configuration-Settings
          - LintMark-Linting-Catalog
          - LintMark-Context-Options
        tests:
          - LintMark_EnableAndDisableFlags_Provided_SwitchLintOnlyRules
          - LintMark_EnableFlag_UnknownRule_IsAUsageError

      - id: LintMark-System-Silent
        title: The tool shall print nothing to the console when the silent option is given.
        tags: [system]
        justification: |
          Scripts that only need the exit status must be able to run the tool without console noise.
        children:
          - LintMark-Context-Output
        tests:
          - LintMark_SilentFlag_Provided_SuppressesOutput

      - id: LintMark-System-Log
        title: The tool shall also write everything it prints to the file named by the log option.
        tags: [system]
        justification: |
          Build systems keep the report of a run as an artifact.
        children:
          - LintMark-Context-LogFile
        tests:
          - LintMark_LogFlag_Provided_WritesOutputToFile

      - id: LintMark-System-SelfValidation
        title: >-
          The tool shall run built-in self-validation tests and print a summary, headed at the Markdown heading
          depth given by the depth option (one by default), when the validate option is given.
        tags: [system]
        justification: |
          Regulated environments need evidence that the installed tool works before they rely on it, and the
          summary is pasted into documents whose heading structure the user controls.
        children:
          - LintMark-Validation-SelfTests
          - LintMark-Validation-FunctionalSelfTests
          - LintMark-Program-Dispatch
          - LintMark-Context-Options
        tests:
          - LintMark_ValidateFlag_Provided_RunsValidation
          - LintMark_ValidateWithDepthFlag_Provided_HeadsSummaryAtThatDepth
          - LintMark_VersionDisplay
          - LintMark_HelpDisplay
          - LintMark_CleanFileNoFindings
          - LintMark_ViolationsReported
          - LintMark_FixRewritesToCanonicalForm
          - LintMark_DiffPreviewsFixes
          - LintMark_ConfigurationHonored

      - id: LintMark-System-ValidationResults
        title: >-
          The tool shall write the self-validation results to the TRX or JUnit file named by the results option.
        tags: [system]
        justification: |
          Qualification evidence must be machine readable, so that requirements tracing tools can use it.
        children:
          - LintMark-Validation-ResultsFile
          - LintMark-Validation-ResultsFormatError
        tests:
          - LintMark_ValidateWithTrxResults_Requested_GeneratesTrxFile

      - id: LintMark-System-ExitCodes
        title: >-
          The tool shall exit with status 0 when nothing is reported, and with status 1 when it reports any
          finding or error, or when the command line is invalid.
        tags: [system]
        justification: |
          Scripts and pipelines decide whether a step failed from the exit status.
        children:
          - LintMark-Context-ExitStatus
          - LintMark-Program-ErrorHandling
        tests:
          - LintMark_PathsProvided_ValidMarkdown_ReturnsSuccess
          - LintMark_PathsProvided_MissingFile_ReportsReadErrorAndReturnsError
          - LintMark_UnknownArgument_Provided_ReturnsError

      - id: LintMark-System-ProblemReports
        title: >-
          The tool shall report every finding as a line with the file path, line, column, rule id, and message,
          in a stable order.
        tags: [system]
        justification: |
          Editors and build systems parse findings to link them to the source, and the same input must always
          give the same report.
        children:
          - LintMark-Engine-Reporting
          - LintMark-Linting-Findings
        tests:
          - LintMark_ConfigErrors_Reported_AsPathLineColRuleMessage
          - LintMark_CheckFlag_OverlongParagraph_ReportsLineLengthAtTheFirstColumnBeyondTheWidth
          - LintMark_ViolationsReported

      - id: LintMark-System-ConfigDiscovery
        title: >-
          The tool shall apply to each file the nearest .lintmark.yaml in its folder or above it, without merging
          configuration files.
        tags: [system]
        justification: |
          Different parts of a repository need different settings, and the rule that decides which applies must
          be simple enough to predict.
        children:
          - LintMark-Configuration-Discovery
        tests:
          - LintMark_ConfigDiscovery_NearestConfigInvalid_ReportsItsErrors
          - LintMark_ConfigurationHonored

      - id: LintMark-System-ConfigSettings
        title: >-
          The tool shall provide every documented setting with its documented default, and apply a changed setting
          to the behavior it names.
        tags: [system]
        justification: |
          Teams have different house styles, and an unset setting must behave the same on every machine.
        children:
          - LintMark-Configuration-Settings
        tests:
          - LintMark_ConfigSettings_StyleValues_ChangeTheFormattedOutput
          - LintMark_ConfigSettings_NumericAndSwitchValues_ChangeWhatIsKept
          - LintMark_ConfigurationHonored

      - id: LintMark-System-ConfigValidation
        title: >-
          The tool shall report each problem in a configuration file, once, with its position, and shall not
          rewrite any file that the faulty configuration applies to.
        tags: [system]
        justification: |
          A mistyped setting must be found and fixed, and a rewrite based on settings that were misread could
          damage documents.
        children:
          - LintMark-Configuration-Validation
          - LintMark-Engine-Processing
        tests:
          - LintMark_ConfigValidation_InvalidValue_ReportsErrorAndReturnsError
          - LintMark_FixFlag_InvalidConfig_LeavesFileUntouched

      - id: LintMark-System-IgnorePatterns
        title: >-
          The tool shall skip the files matched by the ignore patterns of a configuration file, except files named
          explicitly on the command line.
        tags: [system]
        justification: |
          Generated and vendored documents must be excluded once, in the repository, but a user who names a file
          wants it processed.
        children:
          - LintMark-Configuration-Ignore
          - LintMark-Engine-Discovery
        tests:
          - LintMark_IgnorePatterns_GlobSelected_SkipsMatches
          - LintMark_ConfigurationHonored

      - id: LintMark-System-LineEndings
        title: >-
          The tool shall write the line ending named by the configuration, else by the editor settings, else the
          majority line ending of the file, and keep a byte order mark and the text.
        tags: [system]
        justification: |
          Mixed line endings create noisy differences, but forcing a line ending on a repository that does not
          want one would be worse.
        children:
          - LintMark-Configuration-LineEnding
          - LintMark-Document-Parsing
          - LintMark-Formatting-Orchestration
        tests:
          - LintMark_LineEnding_ConfigWins_FixWritesCrlf
          - LintMark_FixFlag_BomFile_KeepsBomAndText
          - LintMark_EditorConfig_UnreadableSettings_ReportedAtMarkdownFile

      - id: LintMark-System-RuleAliases
        title: >-
          The tool shall accept markdownlint rule numbers wherever a rule id is accepted, ignore the numbers of
          rules it dropped, and report findings with rule ids.
        tags: [system]
        justification: |
          Teams migrating from markdownlint keep their configuration and comments, and reports stay readable.
        children:
          - LintMark-Linting-Catalog
          - LintMark-Configuration-Settings
        tests:
          - LintMark_RuleAliases_MdNumbersInConfigAndComments_AreAcceptedAndFindingsUseIds

      - id: LintMark-System-SuppressionComments
        title: >-
          The tool shall leave a passage alone, and report nothing for it, between a disable comment naming a rule
          (or all rules) and the matching enable comment.
        tags: [system]
        justification: |
          Some text must stay as written on purpose, and the exemption must be visible in the document itself.
        children:
          - LintMark-Document-Suppression
          - LintMark-Linting-LintChecks
        tests:
          - LintMark_SuppressionComments_DisabledFormattingRule_LeavesPassageAlone
          - LintMark_SuppressionComments_DisabledLintRuleByNumber_ReportsNothingInTheRegion

      - id: LintMark-System-SafeRewrite
        title: >-
          The tool shall replace a file atomically, never over a file that changed in the meantime, and write
          nothing for a document that is unsafe to format.
        tags: [system]
        justification: |
          A formatter must never lose or corrupt a user's work, even when interrupted, raced, or given a
          document it cannot understand.
        children:
          - LintMark-Engine-Writing
          - LintMark-Formatting-Protection
        tests:
          - LintMark_FixFlag_Rewrite_LeavesNoTemporaryFiles
          - LintMark_FixFlag_GridTableFallback_LeavesFileUntouched
          - LintMark_FixFlag_InvalidConfig_LeavesFileUntouched

      - id: LintMark-System-FixStability
        title: >-
          The tool shall produce output that a second fix run does not change, and never change code, HTML, math,
          or front matter.
        tags: [system]
        justification: |
          A formatter that keeps changing its own output cannot be used in a pipeline, and text it does not
          understand must keep its meaning.
        children:
          - LintMark-Formatting-Protection
          - LintMark-Formatting-Edits
          - LintMark-Formatting-Orchestration
        tests:
          - LintMark_FixFlag_Twice_SecondRunReportsNothing
          - LintMark_FixFlag_FormattingRules_SecondRunReportsNothing

      - id: LintMark-System-FixKeepsLintFindings
        title: >-
          The tool shall never edit a file to resolve a lint-only finding, and shall report the remaining
          findings of a fixed file at their positions in the written file.
        tags: [system]
        justification: |
          Problems that need an author's judgment must stay visible, and their positions must be correct
          after the rewrite.
        children:
          - LintMark-Engine-Processing
          - LintMark-Linting-Findings
        tests:
          - LintMark_FixFlag_LintOnlyFindings_AreKeptAndReportedAtWrittenPositions

      - id: LintMark-System-Whitespace
        title: >-
          The tool shall remove trailing whitespace, replace tabs, limit consecutive blank lines, and end the file
          with exactly one line ending.
        tags: [system]
        justification: |
          Whitespace noise hides real differences in reviews.
        children:
          - LintMark-Formatting-Passes
        tests:
          - LintMark_Whitespace_TrailingTabsBlankLinesAndFinalNewline_AreFixed

      - id: LintMark-System-Headings
        title: >-
          The tool shall write headings in the ATX style with one space after the number signs, no closing number
          signs, no indentation, and one blank line around them.
        tags: [system]
        justification: |
          A single heading style keeps documents consistent and parses the same in every renderer.
        children:
          - LintMark-Formatting-Blocks-LeafBlocks
        tests:
          - LintMark_Headings_SetextClosedIndentedAndSpacing_AreNormalized

      - id: LintMark-System-BlockSpacing
        title: The tool shall keep one blank line around fenced code blocks, lists, and tables.
        tags: [system]
        justification: |
          Some renderers fail to recognize a block that runs into the text before it.
        children:
          - LintMark-Formatting-Passes
        tests:
          - LintMark_BlockSpacing_FencesListsAndTables_GetSurroundingBlankLines

      - id: LintMark-System-CodeBlocks
        title: The tool shall write code blocks as fenced blocks with the configured fence character.
        tags: [system]
        justification: |
          One code block style is easier to read and to edit, and fenced blocks can carry a language.
        children:
          - LintMark-Formatting-Blocks-LeafBlocks
        tests:
          - LintMark_CodeBlocks_IndentedAndTildeFence_AreWrittenAsBacktickFences

      - id: LintMark-System-ThematicBreaks
        title: The tool shall write thematic breaks in the configured style.
        tags: [system]
        justification: |
          One style distinguishes breaks from emphasis and list markers at a glance.
        children:
          - LintMark-Formatting-Blocks-LeafBlocks
        tests:
          - LintMark_ThematicBreaks_StarsAndUnderscores_AreWrittenAsDashes

      - id: LintMark-System-Lists
        title: >-
          The tool shall write lists with the configured bullet marker, numbering, indentation, and marker spacing,
          without merging or splitting lists.
        tags: [system]
        justification: |
          List style is a visible part of a house style, but changing the structure of a list changes the meaning
          of the document.
        children:
          - LintMark-Formatting-Blocks-Containers
        tests:
          - LintMark_Lists_BulletOrderedIndentAndMarkerSpace_AreNormalized
          - LintMark_Lists_AdjacentListsWithDifferentMarkers_AreNeverMerged

      - id: LintMark-System-BlockQuotes
        title: The tool shall write block quotes with one space after each quote marker.
        tags: [system]
        justification: |
          Uniform quotes are easier to read and to edit.
        children:
          - LintMark-Formatting-Blocks-Containers
        tests:
          - LintMark_BlockQuotes_ExtraSpacesAfterMarker_AreReducedToOne

      - id: LintMark-System-InlineStyle
        title: >-
          The tool shall write emphasis, strong text, and bare URLs in the configured style and remove padding
          inside code spans, outside code, HTML, and links.
        tags: [system]
        justification: |
          Inline spellings vary a lot between authors, and one style keeps differences small.
        children:
          - LintMark-Formatting-Inline-Normalization
        tests:
          - LintMark_InlineStyle_EmphasisStrongBareUrlAndCodeSpan_AreNormalized

      - id: LintMark-System-Tables
        title: >-
          The tool shall write pipe tables with a leading and trailing pipe in the compact layout by default or in
          the aligned layout when configured.
        tags: [system]
        justification: |
          Tables are edited often, and a consistent layout keeps differences small, while the compact layout
          avoids rewriting a whole table for one long cell.
        children:
          - LintMark-Formatting-Blocks-Tables
        tests:
          - LintMark_Tables_DefaultCompactAndAlignedSetting_AreLaidOut

      - id: LintMark-System-LinkRefactor
        title: >-
          The tool shall, only when enabled, convert long inline links to reference links with one block of
          definitions.
        tags: [system]
        justification: |
          Long link destinations make lines unreadable, but converting links is a style decision that the user must
          opt in to.
        children:
          - LintMark-Formatting-Inline-LinkRefactor
        tests:
          - LintMark_LinkRefactor_LongInlineLink_BecomesReferenceLinkOnlyWhenEnabled

      - id: LintMark-System-WrapFill
        title: >-
          The tool shall rewrap only the paragraphs that have a breakable line longer than the line length (120 by
          default, 0 for unlimited), and keep all other paragraphs byte for byte.
        tags: [system]
        justification: |
          Rewrapping everything would turn a formatting run into a huge difference, so only text that violates the
          limit may change.
        children:
          - LintMark-Formatting-Blocks-Paragraphs
        tests:
          - LintMark_CheckFlag_OverlongParagraph_ReportsLineLengthAtTheFirstColumnBeyondTheWidth
          - LintMark_FixFlag_OverlongParagraph_IsWrappedWithinTheWidth
          - LintMark_FixFlag_ParagraphsWithinTheWidth_StayByteIdentical

      - id: LintMark-System-WrapModes
        title: >-
          The tool shall, when configured, put one sentence on each line (sentence) or break only too-long
          sentences at clauses (semantic), and report paragraphs in another layout under the paragraph-wrap rule.
        tags: [system]
        justification: |
          Teams that write one sentence per line get small, readable differences, and need the tool to keep it.
        children:
          - LintMark-Formatting-Blocks-Paragraphs
          - LintMark-Formatting-Inline-Wrapping
        tests:
          - LintMark_WrapModes_SentenceAndSemantic_PlaceLineBreaksAtBoundaries
          - LintMark_WrapModes_ParagraphWrapRule_ReportsLayoutAndCanBeDisabled

      - id: LintMark-System-WrapSafety
        title: >-
          The tool shall keep links, code spans, HTML, and hard breaks whole when it breaks lines, never start a
          line with block syntax, and report an overflow it cannot fix instead of guessing.
        tags: [system]
        justification: |
          A line break in the wrong place changes the rendered document, so a long line is better than a broken
          one.
        children:
          - LintMark-Formatting-Inline-Wrapping
          - LintMark-Formatting-Blocks-Paragraphs
        tests:
          - LintMark_WrapSafety_AtomsHardBreaksAndBlockSyntax_AreKeptIntact
          - LintMark_WrapSafety_LazyListContinuation_IsReportedAndLeftAsWritten

      - id: LintMark-System-DisplayWidth
        title: >-
          The tool shall measure line length in display columns, counting wide characters as two columns.
        tags: [system]
        justification: |
          Text that is too wide on screen must be found even when the number of characters is small.
        children:
          - LintMark-Document-DisplayWidth
        tests:
          - LintMark_DisplayWidth_WideCharacters_CountAsTwoColumns

      - id: LintMark-System-LintHeadings
        title: >-
          The tool shall report the heading problems that need an author's judgment: skipped levels, duplicate
          headings, trailing punctuation, emphasis used as a heading, and a missing space after number signs.
        tags: [system]
        justification: |
          These problems hurt navigation and accessibility, and only the author knows the right fix.
        children:
          - LintMark-Linting-LintChecks
        tests:
          - LintMark_LintHeadings_HeadingProblems_AreReportedWithRuleAndPosition

      - id: LintMark-System-LintLinks
        title: >-
          The tool shall report the link and image problems that need an author's judgment: missing alt text,
          empty links, broken fragments, undefined or unused references, reversed syntax, and spaces in links.
        tags: [system]
        justification: |
          Broken links and inaccessible images are found by readers, so authors need to find them first.
        children:
          - LintMark-Linting-LintChecks
        tests:
          - LintMark_LintLinks_LinkProblems_AreReportedWithRuleAndPosition

      - id: LintMark-System-LintCode
        title: >-
          The tool shall report code block problems: a fence without a language, an unclosed fence, and dollar
          signs in shell code.
        tags: [system]
        justification: |
          Code blocks without a language lose highlighting, and an unclosed fence swallows the rest of the page.
        children:
          - LintMark-Linting-LintChecks
        tests:
          - LintMark_LintCode_FenceAndShellProblems_AreReportedWithRuleAndPosition

      - id: LintMark-System-LintTables
        title: >-
          The tool shall report table problems: rows with the wrong number of cells, tables wider than the line
          length, and damaged or unformatted grid tables.
        tags: [system]
        justification: |
          Malformed tables render wrongly, and the tool will not rewrite what it cannot read with certainty.
        children:
          - LintMark-Linting-LintChecks
        tests:
          - LintMark_LintTables_TableProblems_AreReportedWithRuleAndPosition

      - id: LintMark-System-LintMisc
        title: >-
          The tool shall report unused footnotes, blank lines inside block quotes, and spaces inside emphasis
          markers.
        tags: [system]
        justification: |
          These mistakes silently change how a document renders, and authors need to be told.
        children:
          - LintMark-Linting-LintChecks
        tests:
          - LintMark_LintMisc_FootnoteQuoteAndEmphasisProblems_AreReportedWithRuleAndPosition

      - id: LintMark-System-FileProblems
        title: >-
          The tool shall report files it cannot read, decode, or parse as findings, and continue with the other
          files, including a file whose inline elements are nested too deeply for the tool to process.
        tags: [system]
        justification: |
          One unreadable file must not hide the problems in all the others or abort a long run, and a hostile or
          generated file must not be able to crash the tool.
        children:
          - LintMark-Document-Parsing
          - LintMark-Engine-Processing
        tests:
          - LintMark_PathsProvided_MissingFile_ReportsReadErrorAndReturnsError
          - LintMark_FileProblems_UnreadableFiles_AreReportedWithoutStoppingTheRun
          - LintMark_FileProblems_DeeplyNestedEmphasis_IsReportedWithoutStoppingTheRun
