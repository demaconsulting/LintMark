---
# LintMark System-Level Requirements
#
# PURPOSE:
# - Define system-level requirements describing what end-users need the tool to provide
# - These requirements capture the externally visible behavior of the complete system
# - System requirements are validated through integration tests that exercise the
#   published dotnet DLL end-to-end

sections:
  - title: LintMark Requirements
    requirements:
      - id: LintMark-System-Version
        title: The tool shall display version information when the version flag is provided.
        tags: [system]
        justification: |
          Users need to quickly identify the version of the tool they are using for
          troubleshooting and compatibility verification. The version display must
          work from a standard dotnet invocation without additional configuration.
        children:
          - LintMark-Program-Version
          - LintMark-Cli-Version
        tests:
          - LintMark_VersionFlag_Provided_OutputsVersion

      - id: LintMark-System-Help
        title: The tool shall display usage information when the help flag is provided.
        tags: [system]
        justification: |
          Users need access to command-line usage documentation without requiring
          external resources. Help output must be accessible from a standard dotnet
          invocation and must list the available options so that users can self-serve.
        children:
          - LintMark-Program-Help
          - LintMark-Cli-Help
        tests:
          - LintMark_HelpFlag_Provided_OutputsUsageInformation
          - LintMark_HelpFlag_Provided_ListsPathsAndCheckOption
          - LintMark_HelpFlag_Provided_ListsConfigOptions

      - id: LintMark-System-Validate
        title: The tool shall execute self-validation tests when the validate flag is provided.
        tags: [system]
        justification: |
          Regulated environments require tool qualification evidence to demonstrate
          that the tool functions correctly in its deployment environment before it
          is used to generate compliance artifacts. The validation mode exercises
          core behaviors and produces a structured test result file, providing the
          qualification evidence required by quality management systems.
        children:
          - LintMark-Program-Validate
          - LintMark-Cli-Validate
          - LintMark-SelfTest-Qualification
        tests:
          - LintMark_ValidateFlag_Provided_RunsValidation

      - id: LintMark-System-Silent
        title: The tool shall suppress console output when the silent flag is provided.
        tags: [system]
        justification: |
          Enables automated scripts and CI/CD pipelines to run the tool without
          cluttering output logs when only the exit code is needed.
        children:
          - LintMark-Cli-Silent
        tests:
          - LintMark_SilentFlag_Provided_SuppressesOutput

      - id: LintMark-System-Log
        title: The tool shall write output to a log file when the log flag is provided.
        tags: [system]
        justification: |
          Provides persistent logging for debugging and compliance audit trails.
          Log files enable post-run inspection of tool output without requiring
          console capture.
        children:
          - LintMark-Cli-Log
        tests:
          - LintMark_LogFlag_Provided_WritesOutputToFile

      - id: LintMark-System-ErrorHandling
        title: The tool shall return a non-zero exit code for unrecognized arguments.
        tags: [system]
        justification: |
          A non-zero exit code enables CI/CD pipelines to detect and
          surface misconfiguration failures automatically.
        children:
          - LintMark-Program-ExitCode
          - LintMark-Cli-ExitCode
        tests:
          - LintMark_UnknownArgument_Provided_ReturnsError

      - id: LintMark-System-ErrorMessage
        title: The tool shall report an error message for unrecognized arguments.
        tags: [system]
        justification: |
          Clear feedback for unrecognized arguments helps users quickly correct
          mistakes and prevents silent misconfiguration.
        children:
          - LintMark-Cli-InvalidArgs
          - LintMark-Cli-ErrorOutput
        tests:
          - LintMark_UnknownArgument_Provided_ReturnsError

      - id: LintMark-System-Results
        title: >-
          The tool shall write self-validation results to a standard test result
          file when the `--results` flag is provided.
        tags: [system]
        justification: |
          Enables integration with CI/CD systems that expect standard test result formats.
          TRX format is compatible with MSTest; JUnit XML is compatible with many CI tools.
        children:
          - LintMark-Cli-Results
          - LintMark-SelfTest-ResultsOutput
        tests:
          - LintMark_ValidateWithTrxResults_Requested_GeneratesTrxFile
          - LintMark_ValidateWithXmlResults_Requested_GeneratesJUnitFile

      - id: LintMark-System-Depth
        title: The tool shall adjust the heading depth of validation output when the `--depth` flag is provided.
        tags: [system]
        justification: |
          Enables validation output to be embedded within larger markdown documents at
          the appropriate heading level, supporting documentation workflows that combine
          multiple reports.
        children:
          - LintMark-Cli-Depth
        tests:
          - LintMark_ValidateFlag_Provided_RunsValidation
          - LintMark_ValidateWithDepth_DepthThree_OutputsCorrectHeadingLevel

      - id: LintMark-System-ValidateFailure
        title: The tool shall return a non-zero exit code when the results file cannot be written.
        tags: [system]
        justification: |
          A non-zero exit code on results-write failure enables CI/CD pipelines to detect
          and surface output errors automatically, preventing silent loss of validation
          evidence in compliance-critical workflows.
        children:
          - LintMark-SelfTest-InvalidExtension
        tests:
          - LintMark_ValidateWithBadExtension_ExtensionInvalid_ReturnsNonZero

      - id: LintMark-System-DefaultBehavior
        title: The tool shall display a banner then run the default tool logic when invoked without any action flags.
        tags: [system]
        justification: |
          When a user invokes the tool without any recognized action flag, the tool shall
          display a banner identifying itself and run its primary logic so that the
          invocation is never silently empty.
        children:
          - LintMark-Cli-ArgumentParsing
          - LintMark-Cli-OutputChannels
        tests:
          - LintMark_NoArguments_Invoked_DisplaysBanner

      - id: LintMark-System-ResultAlias
        title: The tool shall accept `--result` as a legacy alias for `--results`.
        tags: [system]
        justification: |
          Backward compatibility with scripts that use the earlier `--result` spelling
          prevents breakage when upgrading to newer tool versions.
        children:
          - LintMark-Cli-ResultAlias
        tests:
          - LintMark_ResultAlias_LegacyFlag_WritesResultsFile

      - id: LintMark-System-SelectFiles
        title: >-
          The tool shall select the Markdown files to process from the paths, directories, glob patterns, and
          exclusions given on the command line, and from the current directory when none is given.
        tags: [system]
        justification: |
          Users need to point the tool at individual files, whole folders, or patterns, and to leave
          some files out. Markdown that belongs to third-party packages or to version control is not
          the user's own and must not be processed unless the user names the file deliberately.
        children:
          - LintMark-Cli-Paths
          - LintMark-Engine-Discovery
          - LintMark-Engine-ThirdPartyFolders
        tests:
          - LintMark_DirectoryProvided_ParsesAllMarkdownBeneathIt
          - LintMark_GlobAndExclude_Provided_SkipsExcludedFiles
          - LintMark_ThirdPartyFolderProvided_SkipsItsFiles
          - LintMark_ExplicitFileInThirdPartyFolder_IsProcessed

      - id: LintMark-System-ParseFiles
        title: >-
          The tool shall read and understand every selected Markdown file, including its suppression comments
          and link reference definitions, without reporting a problem for valid content.
        tags: [system]
        justification: |
          Reading and understanding Markdown files faithfully, so that a file can later be rewritten
          without being altered, is the foundation of linting and formatting them. A capability that is
          correct for the repository's own documentation is the prerequisite for every later lint rule
          and formatting feature, and a problem in one file must not stop the others from being read.
        children:
          - LintMark-Program-Lint
          - LintMark-Engine-Processing
          - LintMark-Document-Load
          - LintMark-Document-WriteBack
          - LintMark-Document-LineEndingStyle
          - LintMark-Document-Blocks
          - LintMark-Document-Dialect
          - LintMark-Document-Suppressions
          - LintMark-Document-References
          - LintMark-Document-ReferenceLookup
          - LintMark-Document-ImmutableResults
        tests:
          - LintMark_PathsProvided_ValidMarkdown_ReturnsSuccess
          - LintMark_PathsWithSuppressionAndReferences_Provided_ReturnsSuccess
          - LintMark_RepositoryDocumentation_Provided_ReturnsSuccess

      - id: LintMark-System-ReportFailures
        title: >-
          The tool shall report each problem it finds in a selected Markdown file, such as a file that cannot
          be read or decoded or content that does not follow the preferred style, on its own line as
          `path:line:col: rule-id message`.
        tags: [system]
        justification: |
          Users and build pipelines need to be told precisely which file has a problem and what it is,
          in a regular format that editors and scripts can read. Every rule identifier in a report must
          be one that the tool documents, so that users can look it up and switch it off where that is
          allowed.
        children:
          - LintMark-Engine-FailureReport
          - LintMark-Document-InvalidContent
          - LintMark-Document-Positions
          - LintMark-Reporting-TextLineFormat
          - LintMark-Reporting-TextRelativePath
          - LintMark-Reporting-TextForwardSlashes
          - LintMark-Reporting-TextOutsidePath
          - LintMark-Reporting-TextDiagnosticOnce
          - LintMark-Linting-DiagnosticContent
          - LintMark-Linting-DiagnosticValidity
          - LintMark-Linting-DiagnosticEquality
          - LintMark-Linting-RuleIdentifiers
        tests:
          - LintMark_PathsProvided_UnreadableFile_ReportsDiagnosticAndReturnsError
          - LintMark_PathsProvided_MissingFile_ReportsReadErrorAndReturnsError
          - LintMark_LineEnding_MixedFile_ReportsAndFixes
          - LintMark_GridTableInvalid_Provided_ReportsAtOffendingLine

      - id: LintMark-System-SilentOnSuccess
        title: The tool shall report nothing for a selected Markdown file in which it finds no problem.
        tags: [system]
        justification: |
          Silence for good files keeps the logs of large runs short and makes any output a sign that
          something needs attention.
        children:
          - LintMark-Engine-SilentOnSuccess
          - LintMark-Reporting-TextSilentWhenEmpty
        tests:
          - LintMark_PathsProvided_ValidMarkdown_ReturnsSuccess
          - LintMark_RepositoryDocumentation_Provided_ReturnsSuccess

      - id: LintMark-System-FailureExitStatus
        title: >-
          The tool shall exit with a non-zero status when it reported a problem, and with zero when it
          reported none.
        tags: [system]
        justification: |
          Build pipelines and scripts act on the exit status without reading the output, so it must
          distinguish a clean run from a run with problems.
        children:
          - LintMark-Engine-FailureExitStatus
          - LintMark-Reporting-ExitStatusOnDiagnostic
          - LintMark-Reporting-ExitStatusWhenSilent
          - LintMark-Reporting-ExitStatusDiffOnly
        tests:
          - LintMark_PathsProvided_ValidMarkdown_ReturnsSuccess
          - LintMark_PathsProvided_UnreadableFile_ReportsDiagnosticAndReturnsError
          - LintMark_PathsProvided_MissingFile_ReportsReadErrorAndReturnsError
          - LintMark_GridTableInvalid_Provided_ReportsAtOffendingLine

      - id: LintMark-System-Check
        title: The tool shall accept a check option that reports problems without modifying any file.
        tags: [system]
        justification: |
          CI/CD pipelines and pre-commit hooks need a mode that can only observe files. Accepting the
          option explicitly lets scripts state that intent, also next to modes that modify files. The
          problems it reports are those that the fix option would remove or refuse to remove.
        children:
          - LintMark-Cli-Check
        tests:
          - LintMark_CheckFlag_Provided_LintsWithoutWriting

      - id: LintMark-System-DeterministicOutput
        title: >-
          The tool shall produce the same output, the same files, and the same exit code for the same inputs
          regardless of how many files are processed concurrently or in what order the arguments are given.
        tags: [system]
        justification: |
          Build logs, code review comments, and automated comparisons depend on reproducible output, and
          a rewrite must give the same files however the work was scheduled. Reports must therefore
          never depend on scheduling or on the order in which paths were typed.
        children:
          - LintMark-Engine-DeterministicOrder
          - LintMark-Cli-ThreadSafeOutput
          - LintMark-Document-ConcurrentParse
          - LintMark-Configuration-ConcurrentUse
          - LintMark-Configuration-ImmutableResults
          - LintMark-Engine-ConfigurationIndependence
          - LintMark-Engine-DeterministicFix
          - LintMark-Reporting-DeterministicOutput
        tests:
          - LintMark_MultipleFiles_Provided_ReportsFailuresInPathOrder
          - LintMark_ConfigErrors_MultipleFiles_ReportedInPathOrder

      - id: LintMark-System-ValidateExclusive
        title: >-
          The tool shall reject the validate option combined with paths, the check option, the fix option, the
          diff option, the config option, or the no-config option with an error.
        tags: [system]
        justification: |
          Self-validation is a separate mode of operation. Silently ignoring file or configuration
          arguments while reporting a successful validation could give users the false impression that
          their files were checked.
        children:
          - LintMark-Cli-ValidateExclusive
        tests:
          - LintMark_ValidateWithPaths_Combined_ReturnsError
          - LintMark_ValidateWithCheck_Combined_ReturnsError
          - LintMark_ValidateWithFix_Combined_ReturnsError
          - LintMark_ValidateWithDiff_Combined_ReturnsError
          - LintMark_ValidateWithConfig_Combined_ReturnsError
          - LintMark_ValidateWithNoConfig_Combined_ReturnsError

      - id: LintMark-System-ConfigDiscovery
        title: >-
          The tool shall process each Markdown file with the nearest `.lintmark.yaml` in the file's directory or
          a parent directory up to and including the repository root, without combining it with any other
          configuration file.
        tags: [system]
        justification: |
          Users keep a configuration with the documents it governs. Looking upward from each document, and
          never beyond the repository, makes it easy to tell which file governs a document and keeps
          settings of unrelated projects out. Different folders of one repository can then have their
          own settings.
        children:
          - LintMark-Configuration-Discovery
          - LintMark-Configuration-NoMerging
          - LintMark-Engine-EffectiveConfiguration
        tests:
          - LintMark_ConfigDiscovery_NearestConfigInvalid_ReportsItsErrors
          - LintMark_ConfigDiscovery_FartherConfigInvalidNearestValid_ReturnsSuccess
          - LintMark_ConfigDiscovery_ConfigAboveRepositoryRoot_IsNotUsed

      - id: LintMark-System-ConfigOption
        title: >-
          The tool shall process every selected file with the configuration file named by the config option,
          instead of discovering one.
        tags: [system]
        justification: |
          Teams that share one configuration between several projects, and users who run the tool outside
          a repository, need to name the file to use.
        children:
          - LintMark-Cli-ConfigOption
          - LintMark-Configuration-ExplicitFile
          - LintMark-Engine-ExplicitConfiguration
        tests:
          - LintMark_ConfigOption_FileProvided_UsesItInsteadOfDiscovery

      - id: LintMark-System-ConfigOptionProblems
        title: >-
          The tool shall report a problem with the configuration file named by the config option as a
          configuration problem, also when no Markdown file is selected.
        tags: [system]
        justification: |
          A configuration file that was named but cannot be used must be reported instead of replaced by
          other settings, whether or not the selection of files happens to contain any.
        children:
          - LintMark-Configuration-ExplicitFileProblems
          - LintMark-Engine-ExplicitConfigurationProblems
        tests:
          - LintMark_ConfigOption_MissingFile_ReportsErrorAndReturnsError
          - LintMark_ConfigOption_MissingFileNoMarkdownFiles_ReportsErrorAndReturnsError

      - id: LintMark-System-NoConfigOption
        title: >-
          The tool shall ignore both `.lintmark.yaml` and `.editorconfig` files and use the built-in defaults
          when the no-config option is provided.
        tags: [system]
        justification: |
          Running the tool exactly as shipped is the way to rule configuration out as the cause of a
          surprise, and the way to get a result that does not depend on the machine.
        children:
          - LintMark-Cli-NoConfigOption
          - LintMark-Engine-NoConfig
        tests:
          - LintMark_NoConfigOption_InvalidConfigPresent_IgnoresIt

      - id: LintMark-System-ConfigExclusive
        title: The tool shall reject the config option combined with the no-config option with an error.
        tags: [system]
        justification: |
          Naming a configuration file and asking for none contradict each other. Silently choosing one
          would hide the contradiction.
        children:
          - LintMark-Cli-ConfigExclusive
        tests:
          - LintMark_ConfigAndNoConfig_Combined_ReturnsError

      - id: LintMark-System-ConfigDefaults
        title: >-
          The tool shall use the documented default for every setting that is not configured, including when
          there is no configuration file or the file is empty.
        tags: [system]
        justification: |
          The tool must work without any configuration, and a configuration should state only what differs
          from the preferred style.
        children:
          - LintMark-Configuration-Defaults
        tests:
          - LintMark_ConfigDefaults_NoConfigFile_ReturnsSuccess
          - LintMark_ConfigDefaults_EmptyConfigFile_ReturnsSuccess
          - LintMark_ConfigDefaults_PartialConfigFile_ReturnsSuccess

      - id: LintMark-System-ConfigSettings
        title: >-
          The tool shall accept a `.lintmark.yaml` file that uses any documented setting.
        tags: [system]
        justification: |
          The configuration file is how users express their preferred style and which checks they want:
          the formatting and linting settings, rules switched on or off by name or legacy rule number,
          link conversion, and ignore patterns. Users who come from other Markdown tools write the rule
          numbers they know, and equivalent files must mean the same however they are laid out.
        children:
          - LintMark-Configuration-Settings
          - LintMark-Configuration-EquivalentLayouts
          - LintMark-Configuration-RuleRegistryUse
          - LintMark-Linting-RuleIdentifiers
          - LintMark-Linting-RuleLegacyNumbers
          - LintMark-Linting-RuleDefaults
        tests:
          - LintMark_ConfigSettings_FullSampleFile_ReturnsSuccess

      - id: LintMark-System-ConfigInvalidSyntax
        title: >-
          The tool shall report a configuration file that cannot be read as a set of settings, because its
          syntax, structure, or text encoding is not supported, as a configuration problem.
        tags: [system]
        justification: |
          A configuration that is silently ignored would reformat a documentation set in a style the user
          did not choose. Failing loudly protects the user's files.
        children:
          - LintMark-Configuration-InvalidSyntax
          - LintMark-Configuration-UnsupportedStructure
          - LintMark-Configuration-UnsupportedText
        tests:
          - LintMark_ConfigValidation_MalformedYaml_ReportsErrorAndReturnsError
          - LintMark_ConfigValidation_TwoDocuments_ReportsErrorAndReturnsError
          - LintMark_ConfigValidation_Utf16File_ReportsErrorAndReturnsError

      - id: LintMark-System-ConfigUnknownSettings
        title: >-
          The tool shall report a setting, rule, or link conversion option that it does not know as a
          configuration problem.
        tags: [system]
        justification: |
          A misspelled setting that is silently ignored would reformat a documentation set in a style the
          user did not choose. Failing loudly protects the user's files.
        children:
          - LintMark-Configuration-UnknownSettings
        tests:
          - LintMark_ConfigValidation_UnknownKey_ReportsErrorAndReturnsError

      - id: LintMark-System-ConfigInvalidValues
        title: >-
          The tool shall reject a setting value that is not allowed and report it as a configuration problem.
        tags: [system]
        justification: |
          An invalid value that is ignored or partially applied would reformat a documentation set in a
          style the user did not choose. Failing loudly protects the user's files.
        children:
          - LintMark-Configuration-InvalidValues
        tests:
          - LintMark_ConfigValidation_InvalidValue_ReportsErrorAndReturnsError

      - id: LintMark-System-ConfigConflictingEntries
        title: >-
          The tool shall report a setting given more than once, or a rule named more than once, as a
          configuration problem.
        tags: [system]
        justification: |
          Which of two conflicting entries would win is not obvious, and silently taking one would hide a
          mistake in the user's configuration.
        children:
          - LintMark-Configuration-ConflictingEntries
        tests:
          - LintMark_ConfigValidation_DuplicateSetting_ReportsErrorAndReturnsError

      - id: LintMark-System-ConfigInputLimits
        title: >-
          The tool shall report a configuration file that exceeds the size or nesting limits documented in the
          user guide as a configuration problem.
        tags: [system]
        justification: |
          A damaged or hostile configuration file, for example one arriving in a pull request that a build
          pipeline checks, must be rejected promptly and must not be able to stall or bring down the run.
        children:
          - LintMark-Configuration-SizeLimit
          - LintMark-Configuration-NestingLimit
        tests:
          - LintMark_ConfigLimits_OversizedFile_ReportsErrorAndReturnsError
          - LintMark_ConfigLimits_DeeplyNestedFile_ReportsErrorWithinTimeBound

      - id: LintMark-System-ConfigErrorFormat
        title: >-
          The tool shall report each configuration problem on its own line as `path:line:col: config-error
          message`, with the position inside the configuration file.
        tags: [system]
        justification: |
          Users and build pipelines need to be told precisely what is wrong with a configuration and where,
          in the same regular format as every other problem, without having to fix problems one run at a
          time.
        children:
          - LintMark-Engine-ConfigErrorFormat
          - LintMark-Configuration-ErrorPositions
          - LintMark-Configuration-AllErrorsReported
        tests:
          - LintMark_ConfigErrors_Reported_AsPathLineColRuleMessage

      - id: LintMark-System-ConfigErrorPathDisplay
        title: >-
          The tool shall show the path of a configuration problem relative to the current directory with
          forward slashes, also when the file lies outside the current directory.
        tags: [system]
        justification: |
          The user must be able to open the named file from where the tool was run, whatever the platform
          separator.
        children:
          - LintMark-Engine-ConfigErrorPathDisplay
        tests:
          - LintMark_ConfigErrors_ConfigOutsideCurrentDirectory_ReportedWithRelativeForwardSlashPath

      - id: LintMark-System-ConfigErrorOnce
        title: >-
          The tool shall report a configuration problem once, however many Markdown files use that
          configuration.
        tags: [system]
        justification: |
          One broken configuration used by hundreds of files would otherwise bury the report.
        children:
          - LintMark-Engine-ConfigErrorOnce
        tests:
          - LintMark_ConfigErrors_SharedByManyFiles_ReportedOnce

      - id: LintMark-System-ConfigErrorOrder
        title: >-
          The tool shall order configuration problems together with the other problems by path and then by
          position.
        tags: [system]
        justification: |
          Reproducible output is required for comparing runs and for stable build logs.
        children:
          - LintMark-Engine-ConfigErrorOrder
          - LintMark-Configuration-ErrorOrder
        tests:
          - LintMark_ConfigErrors_MultipleFiles_ReportedInPathOrder

      - id: LintMark-System-ConfigErrorIsolation
        title: >-
          The tool shall still read and check every selected Markdown file when a configuration problem is
          reported.
        tags: [system]
        justification: |
          A configuration problem must not hide the state of the documents, so that one run shows every
          problem there is to fix.
        children:
          - LintMark-Engine-ConfigErrorIsolation
        tests:
          - LintMark_ConfigErrors_InvalidConfig_StillReportsFileFailures

      - id: LintMark-System-ConfigErrorExitStatus
        title: The tool shall exit with a non-zero status when a configuration problem was reported.
        tags: [system]
        justification: |
          Build pipelines and scripts act on the exit status without reading the output, and a run with an
          invalid configuration did not do what the user asked.
        children:
          - LintMark-Engine-ConfigErrorExitStatus
        tests:
          - LintMark_ConfigErrors_Reported_ReturnsError

      - id: LintMark-System-EditorConfigTolerance
        title: >-
          The tool shall not report an error for `.editorconfig` settings that it cannot use.
        tags: [system]
        justification: |
          Projects keep editor settings for other file types and tools in the same files. Settings meant for
          them, such as an unsupported or unset line ending, malformed lines, or unrelated properties, must
          never break a run. The line ending that the editor settings do give is used like the one of a
          configuration file, and settings that cannot be read at all are reported.
        children:
          - LintMark-Configuration-EditorConfigTolerance
        tests:
          - LintMark_EditorConfig_UnsupportedOrUnusedSettings_Provided_ReturnsSuccess

      - id: LintMark-System-EditorSettingsProblems
        title: >-
          The tool shall report `.editorconfig` settings that apply to a Markdown file but cannot be read as a
          configuration problem at line 1 and column 1 of that Markdown file.
        tags: [system]
        justification: |
          Settings that cannot be read leave the tool without the line ending that the project asked
          for. Using another one in silence would rewrite files in a style nobody chose, so the problem
          must be shown. The Markdown file is the only place that the tool can point to, because the
          settings file may be unreadable as a whole.
        children:
          - LintMark-Configuration-EditorSettingsProblems
          - LintMark-Engine-EditorSettingsProblems
        tests:
          - LintMark_EditorConfig_UnreadableSettings_ReportedAtMarkdownFile

      - id: LintMark-System-FixOption
        title: >-
          The tool shall accept a fix option that rewrites each selected file so that it follows the preferred
          style.
        tags: [system]
        justification: |
          Reporting problems is not enough for large documentation sets. Users want the tool to repair
          what it can, and a second run of the fix option must find nothing more to repair.
        children:
          - LintMark-Cli-Fix
          - LintMark-Engine-Fix
          - LintMark-Formatting-ApplyEdits
        tests:
          - LintMark_FixFlag_CrlfFile_RewritesToLf
          - LintMark_FixFlag_CleanFile_LeavesBytesUnchanged
          - LintMark_FixFlag_Twice_SecondRunReportsNothing

      - id: LintMark-System-FixReportsRemaining
        title: >-
          The tool shall report with the fix option only the problems that remain after the files were
          rewritten.
        tags: [system]
        justification: |
          A problem that was repaired must not be reported as if it were still there, or a pipeline that
          fixes and then checks could never succeed. Problems that the tool cannot repair must still
          fail the run.
        children:
          - LintMark-Engine-FixReportsRemaining
          - LintMark-Linting-DiagnosticFixable
          - LintMark-Linting-RuleKinds
        tests:
          - LintMark_FixFlag_CrlfFile_RewritesToLf
          - LintMark_FixFlag_Twice_SecondRunReportsNothing

      - id: LintMark-System-FixKeepsByteOrderMark
        title: The tool shall keep the byte order mark of a file that it rewrites.
        tags: [system]
        justification: |
          A byte order mark is part of how the author's tools recognize the encoding of the file.
          Removing or adding it is a change that nobody asked for.
        children:
          - LintMark-Engine-FixKeepsByteOrderMark
          - LintMark-Document-WriteBack
        tests:
          - LintMark_FixFlag_BomFile_KeepsBomAndText

      - id: LintMark-System-FixKeepsOtherText
        title: >-
          The tool shall leave the text of a rewritten file exactly as it was wherever the preferred style
          requires no change or the author suppressed the rule.
        tags: [system]
        justification: |
          Rewriting must change only what the style asks for. Every other character is the author's, and
          an author who switched a rule off for a passage expects the passage to stay as written.
          Only line endings are rewritten by the tool as shipped, so the system tests show this for
          files that need no change.
        children:
          - LintMark-Formatting-VerbatimByDefault
          - LintMark-Formatting-SuppressedBlocksVerbatim
          - LintMark-Formatting-SuppressionInsideBlockVerbatim
          - LintMark-Formatting-UnchangedTextKept
        tests:
          - LintMark_FixFlag_CleanFile_LeavesBytesUnchanged
          - LintMark_FixFlag_BomFile_KeepsBomAndText

      - id: LintMark-System-FixExclusive
        title: The tool shall reject the fix option combined with the check option or the diff option with an error.
        tags: [system]
        justification: |
          Asking to check only and to modify files in the same command contradict each other. Choosing
          one silently could modify files that the user meant only to look at.
        children:
          - LintMark-Cli-FixExclusive
        tests:
          - LintMark_FixWithCheck_Combined_ReturnsError
          - LintMark_FixWithDiff_Combined_ReturnsError

      - id: LintMark-System-DiffOption
        title: >-
          The tool shall accept a diff option that prints a unified diff of what the fix option would change.
        tags: [system]
        justification: |
          Users and reviewers want to see a rewrite before it is made, in the form that code review and
          patch tools already understand.
        children:
          - LintMark-Cli-Diff
          - LintMark-Engine-Diff
          - LintMark-Reporting-UnifiedDiff
          - LintMark-Reporting-LineEndingNote
        tests:
          - LintMark_DiffFlag_CrlfFile_PrintsNoteAndWritesNothing
          - LintMark_DiffFlag_CleanFile_PrintsNothing

      - id: LintMark-System-NoWriteWithoutFix
        title: The tool shall modify no file unless the fix option is given.
        tags: [system]
        justification: |
          Checking and previewing must be safe to run anywhere, on any files, at any time. Only an
          explicit request may change the user's files.
        children:
          - LintMark-Engine-NoWriteWithoutFix
        tests:
          - LintMark_CheckFlag_Provided_LintsWithoutWriting
          - LintMark_DiffFlag_CrlfFile_PrintsNoteAndWritesNothing

      - id: LintMark-System-LineEndingStyle
        title: >-
          The tool shall give a file the line ending named by the `end-of-line` setting of its configuration,
          otherwise the one named by its `.editorconfig` settings, otherwise the one that most of its lines use.
        tags: [system]
        justification: |
          Projects decide their line ending in a configuration file or in their editor settings, and
          files that nobody decided about must not be converted wholesale. The order follows the
          specificity of the source: the tool's own configuration first, the shared editor settings
          next, and the file's own habit last.
        children:
          - LintMark-Engine-LineEndingStyle
          - LintMark-Configuration-EditorConfigLineEnding
          - LintMark-Formatting-LineEndingConfigured
          - LintMark-Formatting-LineEndingMajority
        tests:
          - LintMark_LineEnding_ConfigWins_FixWritesCrlf
          - LintMark_LineEnding_EditorConfigUsed_FixWritesCrlf
          - LintMark_LineEnding_MajorityUsed_FixWritesMajority

      - id: LintMark-System-LineEndingReport
        title: >-
          The tool shall report a file whose line endings are not all the line ending that the file should
          have as a `line-ending` problem.
        tags: [system]
        justification: |
          Mixed or unwanted line endings produce noisy changes in version control and confuse editors.
          The fix option repairs them, and a check must show them.
        children:
          - LintMark-Formatting-LineEndingViolation
          - LintMark-Formatting-LineEndingNoViolation
          - LintMark-Reporting-TextLineFormat
        tests:
          - LintMark_LineEnding_MixedFile_ReportsAndFixes

      - id: LintMark-System-AtomicReplace
        title: >-
          The tool shall never leave a partly written file or a temporary file behind when it rewrites a
          file.
        tags: [system]
        justification: |
          A run that is interrupted, or a disk that fills up, must not cost the user a document. The
          file is either the old one or the new one, and the directory holds nothing else.
        children:
          - LintMark-Engine-AtomicReplace
        tests:
          - LintMark_FixFlag_Rewrite_LeavesNoTemporaryFiles

      - id: LintMark-System-SafeRewrite
        title: >-
          The tool shall leave a file exactly as it is, and report why, when it cannot show that rewriting it
          keeps the meaning of the document.
        tags: [system]
        justification: |
          A formatter that damages a document is worse than none. Rewriting is therefore allowed only
          when rendering, structure, and stability of the result have been checked, and a refusal is
          reported so that it cannot pass unnoticed. A change of the line endings can change how a document
          renders, so it is checked in the same way as a change of the text; the other text checks matter
          for the rules that change text.
          The tool as shipped does not yet have such a rule, so the system tests show the refusals that
          do not depend on one, and the refusals caused by a rule that damages a document are shown by
          the Engine subsystem tests with deliberately faulty rules.
        children:
          - LintMark-Engine-SafeRewrite
          - LintMark-Safety-HtmlEquivalence
          - LintMark-Safety-LineEndingEquivalence
          - LintMark-Safety-StructureEquivalence
          - LintMark-Safety-Idempotency
          - LintMark-Safety-IdempotencyFailsClosed
          - LintMark-Safety-ReportsDifference
          - LintMark-Safety-PassedCheckHasNoDescription
          - LintMark-Formatting-ConflictingEdits
          - LintMark-Formatting-OutOfRangeEdits
          - LintMark-Formatting-FormatterFailuresPropagate
        tests:
          - LintMark_FixFlag_GridTableFallback_LeavesFileUntouched
          - LintMark_FixFlag_CodeSpanLineEndingChange_LeavesFileUntouched
          - LintMark_FixFlag_InvalidConfig_LeavesFileUntouched

      - id: LintMark-System-GridTableInvalid
        title: >-
          The tool shall report a document that contains a line that looks like the border of a grid table
          but is not part of a valid grid table as a `grid-table-invalid` problem at that line.
        tags: [system]
        justification: |
          A table that is written wrongly is read by the Markdown parser as ordinary text, and a rewrite
          that treats it as text would change it. The author must be told which line to repair.
        children:
          - LintMark-Document-GridFallback
          - LintMark-Engine-GridTableInvalid
        tests:
          - LintMark_GridTableInvalid_Provided_ReportsAtOffendingLine

      - id: LintMark-System-GridTableNeverRewritten
        title: >-
          The tool shall never rewrite a document that contains a line that looks like the border of a grid
          table but is not part of a valid grid table, whether or not the problem is reported.
        tags: [system]
        justification: |
          The document cannot be understood reliably, so no rewrite can be shown to be safe.
          Switching off the report of the problem must not switch off this protection.
        children:
          - LintMark-Engine-GridTableNeverRewritten
          - LintMark-Formatting-FormatUnsafeUntouched
        tests:
          - LintMark_GridTableInvalid_Disabled_StillNotRewritten
          - LintMark_FixFlag_GridTableFallback_LeavesFileUntouched

      - id: LintMark-System-IgnorePatterns
        title: >-
          The tool shall skip a selected file that matches an `ignore` pattern of its configuration, with the
          pattern taken relative to the directory of that configuration file.
        tags: [system]
        justification: |
          Generated, vendored, or draft documents belong to a project without being its to format.
          Listing them once in the configuration is simpler than excluding them in every command.
        children:
          - LintMark-Engine-IgnorePatterns
        tests:
          - LintMark_IgnorePatterns_GlobSelected_SkipsMatches
          - LintMark_IgnorePatterns_ExcludeOnCommandLine_StillApplies

      - id: LintMark-System-IgnoreExplicitFile
        title: >-
          The tool shall process a file that is named on the command line even when an `ignore` pattern
          matches it.
        tags: [system]
        justification: |
          Naming a file is a deliberate choice, as it already is for files in third-party folders. It
          also keeps pre-commit hooks that pass the files they were given predictable.
        children:
          - LintMark-Engine-IgnoreExplicitFile
        tests:
          - LintMark_IgnorePatterns_ExplicitFile_IsProcessed

      - id: LintMark-System-DisplayWidth
        title: >-
          The tool shall measure the length of a line of text in terminal display columns, counting wide
          East Asian characters and emoji as two columns and combining and control characters as none.
        tags: [system]
        justification: |
          Line length limits exist for readers, and readers see columns, not characters. A limit that
          counted characters would make Japanese, Korean, Chinese, and emoji text look much longer
          than the limit. The measurement is not observable through the command line yet, because the
          rules that apply a width limit are added later, so the only evidence available at this
          level is the Utilities subsystem test.
        children:
          - LintMark-Utilities-DisplayWidth
        tests:
          - UtilitiesSubsystem_TextWidth_MixedScriptLine_MeasuresDisplayColumns
