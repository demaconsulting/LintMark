---
# Document Subsystem Requirements
#
# The Document subsystem turns the bytes of a Markdown file into text and a tree of blocks with exact source
# ranges, finds the suppression comments, and measures text in display columns.

sections:
  - title: LintMark Requirements
    sections:
      - title: Document Requirements
        requirements:
          - id: LintMark-Document-Parsing
            title: >-
              The Document subsystem shall turn a UTF-8 file with LF or CRLF line endings into text and a tree of
              blocks with exact source ranges and positions, and report input it cannot read.
            justification: |
              Every report and every rewrite is based on exact source positions, and a file that cannot be read
              reliably must be reported instead of being guessed at.
            children:
              - LintMark-Document-SourceDocument-Decoding
              - LintMark-Document-SourceDocument-LineEndings
              - LintMark-Document-SourceDocument-Positions
              - LintMark-Document-DocumentParser-Blocks
              - LintMark-Document-DocumentParser-References
              - LintMark-Document-DocumentParser-GridTableFallback
              - LintMark-Document-DocumentParser-Extensions
            tests:
              - DocumentSubsystem_Parsing_Utf8CrlfBytes_BecomeBlockTreeAndUnreadableInputIsReported

          - id: LintMark-Document-Suppression
            title: >-
              The Document subsystem shall provide the source ranges in which comment directives switch named
              rules, or all rules, off.
            justification: |
              Authors need to leave a passage alone on purpose, and the tool must know exactly where the
              exemption starts and ends.
            children:
              - LintMark-Document-SuppressionMap-Directives
              - LintMark-Document-SuppressionMap-Rules
              - LintMark-Document-SuppressionMap-Ranges
            tests:
              - DocumentSubsystem_Suppression_DisableEnableComments_CoverOnlyTheNamedRuleInsideTheRange

          - id: LintMark-Document-DisplayWidth
            title: The Document subsystem shall measure the width of text in display columns.
            justification: |
              Line lengths are judged by how wide the text looks to a reader, which differs from the number of
              characters for wide, combining, and zero-width characters.
            children:
              - LintMark-Document-TextWidth-DisplayWidth
              - LintMark-Document-TextWidth-ZeroWidth
            tests:
              - DocumentSubsystem_DisplayWidth_WideCombiningAndTabCharacters_AreMeasuredInColumns
