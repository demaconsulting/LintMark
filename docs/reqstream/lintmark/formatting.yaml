---
# Formatting Subsystem Requirements
#
# PURPOSE:
# - Define requirements for the LintMark Formatting subsystem
# - The Formatting subsystem turns the changes that rules propose for a document into one rewritten text, and
#   decides which line ending the document should have
# - Subsystem requirements describe what the formatting step guarantees to the safety checks and to the engine
# - The rules that change text (whitespace, blank lines, headings, code blocks, thematic breaks, and the end of
#   the file) are part of this subsystem: the DocumentFormatter unit applies the rules that concern every document
#   and the Blocks subsystem applies the rules of single kinds of blocks; the tests of the contract of the
#   formatter itself use rules that exist only in the tests

sections:
  - title: LintMark Requirements
    sections:
      - title: Formatting Requirements
        requirements:
          - id: LintMark-Formatting-ApplyEdits
            title: >-
              The Formatting subsystem shall turn the changes that rules propose for a document into one
              rewritten text.
            justification: |
              Rules propose small changes to a document, and the rewritten text must be the document with
              those changes. Changes from different rules to different places must all be applied,
              and the outcome must not depend on the order in which they were proposed.
            children:
              - LintMark-Formatting-EditSet-AllowsAdjacent
              - LintMark-Formatting-EditSet-OrdersByPosition
              - LintMark-Formatting-EditSet-InsertionBeforeReplacement
              - LintMark-Formatting-EditSet-SnapshotUnaffectedByLaterAdds
              - LintMark-Formatting-EditSet-ImmutableResults
              - LintMark-Formatting-EditSet-RejectsNegativeRange
              - LintMark-Formatting-EditSet-RejectsRangeOverflow
              - LintMark-Formatting-EditSet-RejectsMissingReplacement
              - LintMark-Formatting-EditSet-RejectsMissingRuleId
              - LintMark-Formatting-EditSet-ExposesValues
              - LintMark-Formatting-EditSet-ReportsEnd
              - LintMark-Formatting-EditSet-ReportsContents
              - LintMark-Formatting-SourcePatcher-AppliesEdits
              - LintMark-Formatting-SourcePatcher-AppliesEditAtEnd
              - LintMark-Formatting-SourcePatcher-UsesUtf16Positions
              - LintMark-Formatting-SourcePatcher-RejectsMissingDocument
              - LintMark-Formatting-SourcePatcher-RejectsUninitializedList
              - LintMark-Formatting-SourcePatcher-RejectsUninitializedEdit
              - LintMark-Formatting-DocumentFormatter-CollectsEdits
              - LintMark-Formatting-DocumentFormatter-OneFormatterPerBlock
              - LintMark-Formatting-DocumentFormatter-DeterministicResult
              - LintMark-Formatting-DocumentFormatter-UnsuppressedBlocksFormatted
              - LintMark-Formatting-DocumentFormatter-OtherRuleSuppressionIgnored
              - LintMark-Formatting-DocumentFormatter-RejectsMissingArguments
              - LintMark-Formatting-DocumentFormatter-RejectsMissingBlockFormatter
              - LintMark-Formatting-DocumentFormatter-NoListMeansNoFormatters
              - LintMark-Formatting-DocumentFormatter-FormatterListIsCopied
              - LintMark-Formatting-DocumentFormatter-FormatContextRejectsMissingArguments
              - LintMark-Formatting-DocumentFormatter-FormatContextExposesValues
              - LintMark-Formatting-DocumentFormatter-FormatResultRejectsDefaultEditList
              - LintMark-Formatting-DocumentFormatter-FormatResultRejectsDefaultEdit
              - LintMark-Formatting-DocumentFormatter-FormatResultRejectsDefaultDiagnosticList
              - LintMark-Formatting-DocumentFormatter-FormatResultRejectsNullDiagnostic
              - LintMark-Formatting-DocumentFormatter-FormatResultRejectsUndefinedLineEnding
              - LintMark-Formatting-DocumentFormatter-FormatResultExposesValues
              - LintMark-Formatting-Blocks-HeadingFormatterProvided
              - LintMark-Formatting-Blocks-CodeBlockFormatterProvided
              - LintMark-Formatting-Blocks-ThematicBreakFormatterProvided
              - LintMark-Formatting-Blocks-DeterministicResult
            tests:
              - FormattingSubsystem_Format_TwoFormatters_AppliesBothEditsInOrder

          - id: LintMark-Formatting-UnchangedTextKept
            title: >-
              The Formatting subsystem shall leave every character of the rewritten text that no change covers
              as it was in the document.
            justification: |
              The rewritten text must be the document with the proposed changes and nothing else. Every
              other character, also one outside the basic plane, belongs to the author.
            children:
              - LintMark-Formatting-SourcePatcher-LeavesUnchangedText
              - LintMark-Formatting-Blocks-LineEndingsKept
              - LintMark-Formatting-Blocks-ByteOrderMarkKept
            tests:
              - FormattingSubsystem_Format_TwoFormatters_AppliesBothEditsInOrder
              - FormattingSubsystem_Format_OneEdit_UnchangedCharactersKept

          - id: LintMark-Formatting-ConflictingEdits
            title: >-
              The Formatting subsystem shall refuse changes that overlap instead of applying them.
            justification: |
              Two changes to the same characters have no single correct result. Guessing would damage the
              document, so the rewrite must fail and leave the decision to the safety logic of the caller.
            children:
              - LintMark-Formatting-EditSet-RejectsOverlap
              - LintMark-Formatting-EditSet-RejectsSecondInsertionAtPosition
              - LintMark-Formatting-SourcePatcher-RejectsOverlappingEdits
              - LintMark-Formatting-SourcePatcher-RejectsTwoInsertionsAtOnePosition
              - LintMark-Formatting-SourcePatcher-RejectsUnorderedEdits
              - LintMark-Formatting-DocumentFormatter-RejectsConflictingEdits
            tests:
              - FormattingSubsystem_Format_OverlappingEdits_Throws

          - id: LintMark-Formatting-OutOfRangeEdits
            title: >-
              The Formatting subsystem shall refuse changes that lie outside the text instead of applying them.
            justification: |
              A change outside the text cannot be applied, and ignoring it would hide a defect in the rule
              that proposed it, so the rewrite must fail and leave the decision to the safety logic of the
              caller.
            children:
              - LintMark-Formatting-SourcePatcher-RejectsOutOfRange
            tests:
              - FormattingSubsystem_Format_OutOfRangeEdit_PatchingThrows

          - id: LintMark-Formatting-FormatterFailuresPropagate
            title: >-
              The Formatting subsystem shall let a failure of a rule that proposes changes reach the caller
              instead of hiding it.
            justification: |
              A failing rule is a defect that the caller must see, so that the safety logic can leave the
              document untouched and report the failure. Hiding it could let a partial result through.
            children:
              - LintMark-Formatting-DocumentFormatter-PropagatesFormatterExceptions
            tests:
              - FormattingSubsystem_Format_ThrowingFormatter_ExceptionReachesCaller

          - id: LintMark-Formatting-VerbatimByDefault
            title: >-
              The Formatting subsystem shall leave a block of a document exactly as it is when no rule proposes
              a change to it.
            justification: |
              Only what a rule asks to change may change. Everything else belongs to the author, and a
              document without proposed changes must come out identical.
            children:
              - LintMark-Formatting-DocumentFormatter-VerbatimByDefault
              - LintMark-Formatting-SourcePatcher-NoEditsIdentity
              - LintMark-Formatting-DocumentFormatter-ClaimedLinesNotEdited
            tests:
              - FormattingSubsystem_Format_NoFormatter_LeavesTextIdentical

          - id: LintMark-Formatting-SuppressedBlocksVerbatim
            title: >-
              The Formatting subsystem shall leave a block exactly as it is when a suppression comment of the
              document suppresses a rule that would change it.
            justification: |
              An author who switched a rule off for a passage expects the passage to stay as written.
            children:
              - LintMark-Formatting-DocumentFormatter-SuppressedByRuleComment
              - LintMark-Formatting-DocumentFormatter-SuppressedByDisableAll
              - LintMark-Formatting-DocumentFormatter-SuppressedByIgnoreComment
              - LintMark-Formatting-DocumentFormatter-SuppressedRuleKeptByIdentifier
              - LintMark-Formatting-DocumentFormatter-SuppressedRuleKeptByAlias
              - LintMark-Formatting-DocumentFormatter-BlankRunsKeptWhereSuppressed
              - LintMark-Formatting-DocumentFormatter-RunWhitespaceKeptWhereSuppressed
              - LintMark-Formatting-DocumentFormatter-SpacingNotAfterDirective
              - LintMark-Formatting-Blocks-SuppressedBlocksKept
            tests:
              - FormattingSubsystem_Format_SuppressedBlock_LeftVerbatim

          - id: LintMark-Formatting-SuppressionInsideBlockVerbatim
            title: >-
              The Formatting subsystem shall leave a block exactly as it is when the suppression of a rule that
              would change it takes effect anywhere inside the block.
            justification: |
              An author who switched a rule off in the middle of a passage expects the whole passage to stay
              as written, also when the comment sits in the middle of the block.
            children:
              - LintMark-Formatting-DocumentFormatter-SuppressionAnywhereInBlock
            tests:
              - FormattingSubsystem_Format_SuppressionInsideBlock_LeftVerbatim

          - id: LintMark-Formatting-FormatUnsafeUntouched
            title: >-
              The Formatting subsystem shall propose no change and report no problem for a document that the
              Document subsystem flagged as unsafe to rewrite.
            justification: |
              The document cannot be understood reliably, so no change can be shown to be safe, and a
              line ending problem would invite a fix that the tool must not make.
            children:
              - LintMark-Formatting-DocumentFormatter-FormatUnsafeNoEdit
              - LintMark-Formatting-DocumentFormatter-FormatUnsafeNoProblem
            tests:
              - FormattingSubsystem_Format_FormatUnsafeDocument_ProducesNothing

          - id: LintMark-Formatting-LineEndingConfigured
            title: >-
              The Formatting subsystem shall give a document the line ending of its configuration.
            justification: |
              A project that decided on a line ending gets it.
            children:
              - LintMark-Formatting-DocumentFormatter-LineEndingConfigured
            tests:
              - FormattingSubsystem_Format_CrlfDocument_PatchedTextKeepsLfAndReportsLineEnding

          - id: LintMark-Formatting-LineEndingMajority
            title: >-
              The Formatting subsystem shall give a document the line ending that most of the document's lines
              use when its configuration gives none.
            justification: |
              For a file that nobody decided about, the predominant style changes the fewest lines and gives a
              deterministic answer.
            children:
              - LintMark-Formatting-DocumentFormatter-LineEndingMajority
              - LintMark-Formatting-DocumentFormatter-LineEndingTieDefaultsToLf
            tests:
              - FormattingSubsystem_Format_NoConfiguredLineEnding_UsesMajority

          - id: LintMark-Formatting-LineEndingViolation
            title: >-
              The Formatting subsystem shall report a document in which any line ending differs from the line
              ending that the document should have as one `line-ending` problem.
            justification: |
              Mixed or unwanted line endings are a property of the whole file, so they are reported once,
              in a way that the fix option repairs by rewriting every line ending.
            children:
              - LintMark-Formatting-DocumentFormatter-LineEndingViolation
              - LintMark-Formatting-DocumentFormatter-LineEndingViolationPosition
              - LintMark-Formatting-DocumentFormatter-LineEndingViolationNamesFound
              - LintMark-Formatting-DocumentFormatter-LineEndingViolationNamesExpected
            tests:
              - FormattingSubsystem_Format_CrlfDocument_PatchedTextKeepsLfAndReportsLineEnding
              - FormattingSubsystem_Format_NoConfiguredLineEnding_UsesMajority

          - id: LintMark-Formatting-LineEndingNoViolation
            title: >-
              The Formatting subsystem shall report no `line-ending` problem for a document in which no line
              ending differs from the line ending that the document should have.
            justification: |
              A file that already has the right line ending needs no repair, and reporting it would invite a
              change that does nothing.
            children:
              - LintMark-Formatting-DocumentFormatter-LineEndingNoViolation
            tests:
              - FormattingSubsystem_Format_UniformDocument_ReportsNoLineEndingProblem

          - id: LintMark-Formatting-TrailingWhitespaceRemoved
            title: >-
              The Formatting subsystem shall remove the spaces and tabs at the end of each line of text of a
              document, but not where they are part of literal text.
            justification: |
              Trailing whitespace carries no meaning in text, while in code, HTML, and similar blocks it is
              content that belongs to the author.
            children:
              - LintMark-Formatting-DocumentFormatter-TrailingWhitespaceRemoved
              - LintMark-Formatting-DocumentFormatter-HeadingTrailingWhitespaceRemoved
              - LintMark-Formatting-DocumentFormatter-TableRowTrailingWhitespaceRemoved
              - LintMark-Formatting-DocumentFormatter-DefinitionTrailingWhitespaceRemoved
              - LintMark-Formatting-DocumentFormatter-BreakTrailingWhitespaceRemoved
              - LintMark-Formatting-DocumentFormatter-MarkerLinesTrailingWhitespaceRemoved
              - LintMark-Formatting-DocumentFormatter-WhitespaceOnlyLinesEmptied
              - LintMark-Formatting-DocumentFormatter-ProtectedSpansKept
              - LintMark-Formatting-DocumentFormatter-LinkTitleKept
              - LintMark-Formatting-Blocks-HeadingTrailingWhitespaceRemoved
              - LintMark-Formatting-Blocks-FenceTrailingWhitespaceRemoved
              - LintMark-Formatting-Blocks-BreakTrailingWhitespaceRemoved
            tests:
              - FormattingSubsystem_Format_TrailingWhitespace_IsRemovedFromTextOnly

          - id: LintMark-Formatting-HardBreakKept
            title: >-
              The Formatting subsystem shall keep each hard line break of a document a hard line break when it
              removes trailing whitespace.
            justification: |
              Two spaces at the end of a line are a line break in Markdown. Removing them would join lines and
              change how the document renders.
            children:
              - LintMark-Formatting-DocumentFormatter-HardBreakKept
            tests:
              - FormattingSubsystem_Format_HardBreaks_KeepTheirMeaning

          - id: LintMark-Formatting-TabsExpanded
            title: >-
              The Formatting subsystem shall replace each tab character in the text of a document by spaces up
              to the next tab stop of four columns, but not where the tab is part of literal text or of the
              indentation.
            justification: |
              Tabs in text show at different widths in different tools. A tab in code, or one that makes a
              block part of a list or quote, is content or structure and must stay.
            children:
              - LintMark-Formatting-DocumentFormatter-TabsExpanded
              - LintMark-Formatting-DocumentFormatter-TabsKeptWhereTheyMatter
              - LintMark-Formatting-DocumentFormatter-TabsKeptAtLineEnd
              - LintMark-Formatting-Blocks-TabsExpanded
            tests:
              - FormattingSubsystem_Format_Tabs_AreExpandedOnlyInPlainText

          - id: LintMark-Formatting-BlankRunsCollapsed
            title: >-
              The Formatting subsystem shall reduce each run of blank lines between the blocks of a document to
              the maximum that the configuration allows.
            justification: |
              Long runs of blank lines carry no meaning in Markdown.
            children:
              - LintMark-Formatting-DocumentFormatter-BlankRunsCollapsed
            tests:
              - FormattingSubsystem_Format_BlankRuns_CollapseToTheConfiguredMaximum

          - id: LintMark-Formatting-FinalNewline
            title: >-
              The Formatting subsystem shall end a document with exactly one line ending when the configuration
              asks for a final line ending.
            justification: |
              Tools and version control treat files without a final line ending, or with extra blank lines at
              the end, differently, and projects choose one convention.
            children:
              - LintMark-Formatting-DocumentFormatter-FinalNewlineSingle
              - LintMark-Formatting-DocumentFormatter-FinalNewlineUnclosedHtmlKept
              - LintMark-Formatting-DocumentFormatter-FinalNewlineAfterClosedHtml
              - LintMark-Formatting-DocumentFormatter-BlankDocumentUntouched
            tests:
              - FormattingSubsystem_Format_FinalNewlineOn_EndsWithExactlyOneLineEnding

          - id: LintMark-Formatting-FinalNewlineOptional
            title: >-
              The Formatting subsystem shall end a document with no line ending when the configuration asks for
              none.
            justification: |
              Some projects keep files without a final line ending, and the convention that the configuration
              names must be applied.
            children:
              - LintMark-Formatting-DocumentFormatter-FinalNewlineOptional
            tests:
              - FormattingSubsystem_Format_FinalNewlineOff_EndsWithoutLineEnding

          - id: LintMark-Formatting-HeadingSpacing
            title: >-
              The Formatting subsystem shall separate each heading of a document that is not inside a quote or
              list from the blocks around it by a blank line.
            justification: |
              A heading that touches the blocks around it is hard to read and is not recognized by every parser.
            children:
              - LintMark-Formatting-DocumentFormatter-HeadingSpacing
              - LintMark-Formatting-DocumentFormatter-SpacingNotForParagraphText
              - LintMark-Formatting-DocumentFormatter-OneInsertionPerBoundary
            tests:
              - FormattingSubsystem_Format_HeadingTouchingText_GetsBlankLines

          - id: LintMark-Formatting-FenceSpacing
            title: >-
              The Formatting subsystem shall separate each fenced code block of a document that is not inside a
              quote or list from the blocks around it by a blank line.
            justification: |
              A fence that touches the text around it is hard to read and is not recognized by every parser.
            children:
              - LintMark-Formatting-DocumentFormatter-FenceSpacing
            tests:
              - FormattingSubsystem_Format_FenceTouchingText_GetsBlankLines

          - id: LintMark-Formatting-ListSpacing
            title: >-
              The Formatting subsystem shall separate each list of a document that is not inside a quote or
              list from the blocks around it by a blank line.
            justification: |
              A list that touches the text around it is hard to read and is not recognized by every parser.
            children:
              - LintMark-Formatting-DocumentFormatter-ListSpacing
              - LintMark-Formatting-DocumentFormatter-SpacingNotForLazyContinuation
            tests:
              - FormattingSubsystem_Format_ListTouchingText_GetsBlankLine

          - id: LintMark-Formatting-TableSpacing
            title: >-
              The Formatting subsystem shall separate each table of a document that is not inside a quote or
              list from the blocks around it by a blank line.
            justification: |
              A table that touches the text around it is not recognized by every parser.
            children:
              - LintMark-Formatting-DocumentFormatter-TableSpacing
              - LintMark-Formatting-DocumentFormatter-SpacingNotForTableRows
            tests:
              - FormattingSubsystem_Format_TableTouchingText_GetsBlankLine

          - id: LintMark-Formatting-HeadingStyle
            title: >-
              The Formatting subsystem shall write each setext heading of a document in the ATX form, unless the
              conversion could change the meaning of the text.
            justification: |
              One heading style makes a document consistent, and a conversion that could change the meaning of
              the text is not made.
            children:
              - LintMark-Formatting-Blocks-HeadingStyle
            tests:
              - FormattingSubsystem_Format_SetextHeadings_BecomeAtxWhereSafe

          - id: LintMark-Formatting-HeadingClosingSigns
            title: >-
              The Formatting subsystem shall remove the closing number signs of each ATX heading of a document.
            justification: |
              Closing number signs add nothing to a heading, and headings with and without them make a document
              inconsistent.
            children:
              - LintMark-Formatting-Blocks-HeadingClosingSigns
            tests:
              - FormattingSubsystem_Format_ClosedHeadings_LoseTheClosingSigns

          - id: LintMark-Formatting-HeadingSpace
            title: >-
              The Formatting subsystem shall put exactly one space between the number signs of each heading of a
              document and its text.
            justification: |
              Extra spaces or tabs after the number signs have no meaning and make headings inconsistent.
            children:
              - LintMark-Formatting-Blocks-HeadingSpace
            tests:
              - FormattingSubsystem_Format_HeadingMarkerSpacing_BecomesOneSpace

          - id: LintMark-Formatting-HeadingStartLeft
            title: >-
              The Formatting subsystem shall start each heading of a document that is not inside a quote or list
              at the left margin.
            justification: |
              An indented heading looks like a mistake, and four spaces turn it into code.
            children:
              - LintMark-Formatting-Blocks-HeadingStartLeft
            tests:
              - FormattingSubsystem_Format_IndentedHeading_StartsAtTheLeftMargin

          - id: LintMark-Formatting-ThematicBreakStyle
            title: >-
              The Formatting subsystem shall write each thematic break of a document as three characters of the
              style that the configuration names, where that keeps the meaning of the document.
            justification: |
              One way to write a break makes a document consistent, and a break whose conversion would change
              the text around it is left as written.
            children:
              - LintMark-Formatting-Blocks-ThematicBreakStyle
            tests:
              - FormattingSubsystem_Format_ThematicBreaks_UseTheConfiguredStyle

          - id: LintMark-Formatting-CodeFenceStyle
            title: >-
              The Formatting subsystem shall write the fence of each fenced code block of a document with the
              fence character that the configuration names, where that keeps the meaning of the block.
            justification: |
              One fence character makes a document consistent, and a fence that cannot be converted without
              changing the block stays as written.
            children:
              - LintMark-Formatting-Blocks-CodeFenceStyle
            tests:
              - FormattingSubsystem_Format_CodeFences_UseTheConfiguredFenceCharacter

          - id: LintMark-Formatting-CodeBlockStyle
            title: >-
              The Formatting subsystem shall write each indented code block of a document that is not inside a
              quote or list as a fenced code block with the same content.
            justification: |
              Indented code is easily confused with other indented text and cannot carry a language, while a
              fence is explicit.
            children:
              - LintMark-Formatting-Blocks-CodeBlockStyle
            tests:
              - FormattingSubsystem_Format_IndentedCode_BecomesFencedCode

          - id: LintMark-Formatting-CodeContentKept
            title: >-
              The Formatting subsystem shall never change the content of code, HTML, math, front matter, or grid
              tables of a document.
            justification: |
              The whitespace and the blank lines of literal text are part of its content, and changing them
              changes what the document means or how it renders.
            children:
              - LintMark-Formatting-Blocks-CodeContentKept
              - LintMark-Formatting-DocumentFormatter-ProtectedBlocksKept
              - LintMark-Formatting-DocumentFormatter-FrontMatterKept
              - LintMark-Formatting-DocumentFormatter-GridTablesKept
              - LintMark-Formatting-DocumentFormatter-BlankLinesInProtectedBlocksKept
              - LintMark-Formatting-DocumentFormatter-IndentedCodeWideBlankLineKept
            tests:
              - FormattingSubsystem_Format_LiteralBlocks_KeepTheirContent

          - id: LintMark-Formatting-GridBorderLookalikeNotEdited
            title: >-
              The Formatting subsystem shall not change a line of a document that looks like the border of a
              grid table.
            justification: |
              Whether Pandoc reads such a line as part of a table can depend on its exact text, so a change to
              it cannot be shown to keep the meaning of the document.
            children:
              - LintMark-Formatting-DocumentFormatter-GridBorderLookalikeNotEdited
            tests:
              - FormattingSubsystem_Format_GridBorderLookalike_IsNotEdited

          - id: LintMark-Formatting-GridBorderLookalikeNotSeparated
            title: >-
              The Formatting subsystem shall insert no blank line next to a line of a document that looks like
              the border of a grid table.
            justification: |
              Whether Pandoc reads such a line as part of a table can depend on the lines around it, so a blank
              line next to it cannot be shown to keep the meaning of the document.
            children:
              - LintMark-Formatting-DocumentFormatter-GridBorderLookalikeNotSeparated
            tests:
              - FormattingSubsystem_Format_GridBorderLookalike_IsNotSeparated

          - id: LintMark-Formatting-NestedBlocksKept
            title: >-
              The Formatting subsystem shall not add or remove blank lines inside a quote or list of a document.
            justification: |
              A blank line inside a list can turn a tight list into a loose one and change how it renders.
            children:
              - LintMark-Formatting-Blocks-NestedBlocksKept
              - LintMark-Formatting-DocumentFormatter-ContainerBlankRunsKept
              - LintMark-Formatting-DocumentFormatter-SpacingNotInContainers
            tests:
              - FormattingSubsystem_Format_QuotesAndLists_KeepTheirBlankLines

          - id: LintMark-Formatting-UnclosedFencesKept
            title: >-
              The Formatting subsystem shall leave a fenced code block that the document never closes exactly as
              it is, together with the blank lines that follow it.
            justification: |
              The content of an unclosed fence runs to the end of its container, so the lines that follow it,
              blank or not, belong to the code.
            children:
              - LintMark-Formatting-Blocks-UnclosedFencesKept
              - LintMark-Formatting-DocumentFormatter-UnclosedFenceKept
            tests:
              - FormattingSubsystem_Format_UnclosedFence_StaysAsWritten

          - id: LintMark-Formatting-EditsReported
            title: >-
              The Formatting subsystem shall report each change that a formatting rule proposes as a problem of
              that rule at the place of the change.
            justification: |
              Checking a file is formatting it and listing what would change, so every change that rewriting
              would make is a problem that the check reports.
            children:
              - LintMark-Formatting-DocumentFormatter-ViolationsReportedPerEdit
              - LintMark-Formatting-DocumentFormatter-ViolationPositionAtEdit
              - LintMark-Formatting-DocumentFormatter-ViolationPositionAtInsertion
              - LintMark-Formatting-DocumentFormatter-OneViolationPerRulePerLine
              - LintMark-Formatting-Blocks-EditsAttributedToRules
            tests:
              - FormattingSubsystem_Format_Violations_AreReportedPerRuleAtTheirPlace

          - id: LintMark-Formatting-FormattingStable
            title: >-
              The Formatting subsystem shall propose no change and report no problem for a document that is
              already in canonical form, in particular for the result of its own changes.
            justification: |
              A rewrite that needed to be repeated, or that undid itself, could not be trusted, and a file that
              is already canonical must not be reported.
            children:
              - LintMark-Formatting-Blocks-CanonicalBlocksUnchanged
            tests:
              - FormattingSubsystem_Format_CanonicalDocumentAndOwnResult_ProposeNothing
