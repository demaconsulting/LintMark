---
# Formatting Subsystem Requirements
#
# PURPOSE:
# - Define requirements for the LintMark Formatting subsystem
# - The Formatting subsystem turns the changes that rules propose for a document into one rewritten text, and
#   decides which line ending the document should have
# - Subsystem requirements describe what the formatting step guarantees to the safety checks and to the engine
# - The rules that change text (whitespace, blank lines, headings, code blocks, thematic breaks, lists, block quotes,
#   emphasis, bare URLs, code span padding, the length of the lines of paragraphs, and the end of the file) are part
#   of this subsystem: the DocumentFormatter unit applies the rules that concern every document and composes the wrap
#   of paragraphs with the other rules, the Blocks subsystem applies the rules of single kinds of blocks (including
#   the wrap of paragraphs), and the Inline subsystem applies the rules of the text inside paragraphs and cuts
#   paragraphs into the words that a wrap may move; the tests of the contract of the formatter itself use rules that
#   exist only in the tests

sections:
  - title: LintMark Requirements
    sections:
      - title: Formatting Requirements
        requirements:
          - id: LintMark-Formatting-ApplyEdits
            title: >-
              The Formatting subsystem shall turn the changes that rules propose for a document into one
              rewritten text.
            justification: |
              Rules propose small changes to a document, and the rewritten text must be the document with
              those changes. Changes from different rules to different places must all be applied,
              and the outcome must not depend on the order in which they were proposed.
            children:
              - LintMark-Formatting-EditSet-AllowsAdjacent
              - LintMark-Formatting-EditSet-OrdersByPosition
              - LintMark-Formatting-EditSet-InsertionBeforeReplacement
              - LintMark-Formatting-EditSet-SnapshotUnaffectedByLaterAdds
              - LintMark-Formatting-EditSet-ImmutableResults
              - LintMark-Formatting-EditSet-RejectsNegativeRange
              - LintMark-Formatting-EditSet-RejectsRangeOverflow
              - LintMark-Formatting-EditSet-RejectsMissingReplacement
              - LintMark-Formatting-EditSet-RejectsMissingRuleId
              - LintMark-Formatting-EditSet-ExposesValues
              - LintMark-Formatting-EditSet-ReportsEnd
              - LintMark-Formatting-EditSet-ReportsContents
              - LintMark-Formatting-SourcePatcher-AppliesEdits
              - LintMark-Formatting-SourcePatcher-AppliesEditAtEnd
              - LintMark-Formatting-SourcePatcher-UsesUtf16Positions
              - LintMark-Formatting-SourcePatcher-RejectsMissingDocument
              - LintMark-Formatting-SourcePatcher-RejectsUninitializedList
              - LintMark-Formatting-SourcePatcher-RejectsUninitializedEdit
              - LintMark-Formatting-DocumentFormatter-CollectsEdits
              - LintMark-Formatting-DocumentFormatter-InlineRulesApplied
              - LintMark-Formatting-DocumentFormatter-OneFormatterPerBlock
              - LintMark-Formatting-DocumentFormatter-DeterministicResult
              - LintMark-Formatting-DocumentFormatter-UnsuppressedBlocksFormatted
              - LintMark-Formatting-Blocks-BlocksFormattedWhereEnabled
              - LintMark-Formatting-DocumentFormatter-OtherRuleSuppressionIgnored
              - LintMark-Formatting-DocumentFormatter-RejectsMissingArguments
              - LintMark-Formatting-DocumentFormatter-RejectsMissingBlockFormatter
              - LintMark-Formatting-DocumentFormatter-NoListMeansNoFormatters
              - LintMark-Formatting-DocumentFormatter-FormatterListIsCopied
              - LintMark-Formatting-DocumentFormatter-FormatContextRejectsMissingArguments
              - LintMark-Formatting-DocumentFormatter-FormatContextExposesValues
              - LintMark-Formatting-DocumentFormatter-FormatResultRejectsDefaultEditList
              - LintMark-Formatting-DocumentFormatter-FormatResultRejectsDefaultEdit
              - LintMark-Formatting-DocumentFormatter-FormatResultRejectsDefaultDiagnosticList
              - LintMark-Formatting-DocumentFormatter-FormatResultRejectsNullDiagnostic
              - LintMark-Formatting-DocumentFormatter-FormatResultRejectsUndefinedLineEnding
              - LintMark-Formatting-DocumentFormatter-FormatResultExposesValues
              - LintMark-Formatting-Blocks-HeadingFormatterProvided
              - LintMark-Formatting-Blocks-CodeBlockFormatterProvided
              - LintMark-Formatting-Blocks-ThematicBreakFormatterProvided
              - LintMark-Formatting-Blocks-ListFormatterProvided
              - LintMark-Formatting-Blocks-BlockQuoteFormatterProvided
              - LintMark-Formatting-Blocks-DeterministicResult
              - LintMark-Formatting-Inline-InlineNormalizerProvided
              - LintMark-Formatting-Inline-DeterministicResult
              - LintMark-Formatting-Inline-OtherRulesStillApplied
              - LintMark-Formatting-DocumentFormatter-FormatContextExposesLayoutAndOwnership
              - LintMark-Formatting-DocumentFormatter-FormatContextBuildsLayoutAndOwnership
              - LintMark-Formatting-DocumentFormatter-DeterministicWrap
              - LintMark-Formatting-Blocks-DeterministicWrap
              - LintMark-Formatting-EditSet-EditsRebasedOntoOriginal
              - LintMark-Formatting-EditSet-RebaseAbsorbsEditsInsideReplacedRange
              - LintMark-Formatting-EditSet-RebaseExtendsEditsInsideOutput
              - LintMark-Formatting-EditSet-RebaseMergesEditsInOneOutput
              - LintMark-Formatting-EditSet-RebaseKeepsTouchingEdits
              - LintMark-Formatting-EditSet-RebaseMergesTouchingInsertions
              - LintMark-Formatting-EditSet-RebaseDropsNoOps
              - LintMark-Formatting-EditSet-RebaseRejectsInvalidLists
              - LintMark-Formatting-EditSet-OffsetsMappedToOriginal
              - LintMark-Formatting-EditSet-RebaseIsDeterministic
            tests:
              - FormattingSubsystem_Format_TwoFormatters_AppliesBothEditsInOrder
              - FormattingSubsystem_Format_ParallelCallsOnListsAndInlineText_GiveTheSameResult

          - id: LintMark-Formatting-UnchangedTextKept
            title: >-
              The Formatting subsystem shall leave every character of the rewritten text that no change covers
              as it was in the document.
            justification: |
              The rewritten text must be the document with the proposed changes and nothing else. Every
              other character, also one outside the basic plane, belongs to the author.
            children:
              - LintMark-Formatting-SourcePatcher-LeavesUnchangedText
              - LintMark-Formatting-Blocks-LineEndingsKept
              - LintMark-Formatting-Blocks-ByteOrderMarkKept
            tests:
              - FormattingSubsystem_Format_TwoFormatters_AppliesBothEditsInOrder
              - FormattingSubsystem_Format_OneEdit_UnchangedCharactersKept

          - id: LintMark-Formatting-ConflictingEdits
            title: >-
              The Formatting subsystem shall refuse changes that overlap instead of applying them.
            justification: |
              Two changes to the same characters have no single correct result. Guessing would damage the
              document, so the rewrite must fail and leave the decision to the safety logic of the caller.
            children:
              - LintMark-Formatting-EditSet-RejectsOverlap
              - LintMark-Formatting-EditSet-RejectsSecondInsertionAtPosition
              - LintMark-Formatting-SourcePatcher-RejectsOverlappingEdits
              - LintMark-Formatting-SourcePatcher-RejectsTwoInsertionsAtOnePosition
              - LintMark-Formatting-SourcePatcher-RejectsUnorderedEdits
              - LintMark-Formatting-DocumentFormatter-RejectsConflictingEdits
            tests:
              - FormattingSubsystem_Format_OverlappingEdits_Throws

          - id: LintMark-Formatting-OutOfRangeEdits
            title: >-
              The Formatting subsystem shall refuse changes that lie outside the text instead of applying them.
            justification: |
              A change outside the text cannot be applied, and ignoring it would hide a defect in the rule
              that proposed it, so the rewrite must fail and leave the decision to the safety logic of the
              caller.
            children:
              - LintMark-Formatting-SourcePatcher-RejectsOutOfRange
            tests:
              - FormattingSubsystem_Format_OutOfRangeEdit_PatchingThrows

          - id: LintMark-Formatting-FormatterFailuresPropagate
            title: >-
              The Formatting subsystem shall let a failure of a rule that proposes changes reach the caller
              instead of hiding it.
            justification: |
              A failing rule is a defect that the caller must see, so that the safety logic can leave the
              document untouched and report the failure. Hiding it could let a partial result through.
            children:
              - LintMark-Formatting-DocumentFormatter-PropagatesFormatterExceptions
            tests:
              - FormattingSubsystem_Format_ThrowingFormatter_ExceptionReachesCaller

          - id: LintMark-Formatting-VerbatimByDefault
            title: >-
              The Formatting subsystem shall leave a block of a document exactly as it is when no rule proposes
              a change to it.
            justification: |
              Only what a rule asks to change may change. Everything else belongs to the author, and a
              document without proposed changes must come out identical.
            children:
              - LintMark-Formatting-DocumentFormatter-VerbatimByDefault
              - LintMark-Formatting-SourcePatcher-NoEditsIdentity
              - LintMark-Formatting-DocumentFormatter-ClaimedLinesNotEdited
              - LintMark-Formatting-DocumentFormatter-InlineRulesNotForClaimedParagraphs
              - LintMark-Formatting-Inline-ParagraphsOnly
              - LintMark-Formatting-Inline-CodeSpansKept
              - LintMark-Formatting-Inline-LinkDestinationsKept
              - LintMark-Formatting-Inline-HtmlKept
              - LintMark-Formatting-Inline-MathKept
              - LintMark-Formatting-Inline-WwwAddressesKept
              - LintMark-Formatting-Inline-MailAddressesKept
              - LintMark-Formatting-Inline-OnlyBareUrlsWrapped
              - LintMark-Formatting-Inline-FootnoteEndingEmphasisKept
              - LintMark-Formatting-Inline-MeaningKept
            tests:
              - FormattingSubsystem_Format_NoFormatter_LeavesTextIdentical

          - id: LintMark-Formatting-SuppressedBlocksVerbatim
            title: >-
              The Formatting subsystem shall leave a block exactly as it is when a suppression comment of the
              document suppresses a rule that would change it.
            justification: |
              An author who switched a rule off for a passage expects the passage to stay as written.
            children:
              - LintMark-Formatting-DocumentFormatter-SuppressedByRuleComment
              - LintMark-Formatting-DocumentFormatter-SuppressedByDisableAll
              - LintMark-Formatting-DocumentFormatter-SuppressedByIgnoreComment
              - LintMark-Formatting-DocumentFormatter-SuppressedRuleKeptByIdentifier
              - LintMark-Formatting-DocumentFormatter-SuppressedRuleKeptByAlias
              - LintMark-Formatting-DocumentFormatter-BlankRunsKeptWhereSuppressed
              - LintMark-Formatting-DocumentFormatter-RunWhitespaceKeptWhereSuppressed
              - LintMark-Formatting-DocumentFormatter-SpacingNotAfterDirective
              - LintMark-Formatting-Blocks-SuppressedBlocksKept
              - LintMark-Formatting-DocumentFormatter-InlineSuppressedRuleKept
              - LintMark-Formatting-Inline-SuppressedRulesKept
              - LintMark-Formatting-Blocks-SuppressedParagraphsKept
              - LintMark-Formatting-Inline-CodeSpanSpaceSuppressed
            tests:
              - FormattingSubsystem_Format_SuppressedBlock_LeftVerbatim

          - id: LintMark-Formatting-SuppressionInsideBlockVerbatim
            title: >-
              The Formatting subsystem shall leave a block exactly as it is when the suppression of a rule that
              would change it takes effect anywhere inside the block.
            justification: |
              An author who switched a rule off in the middle of a passage expects the whole passage to stay
              as written, also when the comment sits in the middle of the block.
            children:
              - LintMark-Formatting-DocumentFormatter-SuppressionAnywhereInBlock
            tests:
              - FormattingSubsystem_Format_SuppressionInsideBlock_LeftVerbatim

          - id: LintMark-Formatting-FormatUnsafeUntouched
            title: >-
              The Formatting subsystem shall propose no change and report no problem for a document that the
              Document subsystem flagged as unsafe to rewrite.
            justification: |
              The document cannot be understood reliably, so no change can be shown to be safe, and a
              line ending problem would invite a fix that the tool must not make.
            children:
              - LintMark-Formatting-DocumentFormatter-FormatUnsafeNoEdit
              - LintMark-Formatting-DocumentFormatter-FormatUnsafeNoProblem
              - LintMark-Formatting-DocumentFormatter-WrapSkippedForUnsafeDocuments
            tests:
              - FormattingSubsystem_Format_FormatUnsafeDocument_ProducesNothing

          - id: LintMark-Formatting-LineEndingConfigured
            title: >-
              The Formatting subsystem shall give a document the line ending of its configuration.
            justification: |
              A project that decided on a line ending gets it.
            children:
              - LintMark-Formatting-DocumentFormatter-LineEndingConfigured
            tests:
              - FormattingSubsystem_Format_CrlfDocument_PatchedTextKeepsLfAndReportsLineEnding

          - id: LintMark-Formatting-LineEndingMajority
            title: >-
              The Formatting subsystem shall give a document the line ending that most of the document's lines
              use when its configuration gives none.
            justification: |
              For a file that nobody decided about, the predominant style changes the fewest lines and gives a
              deterministic answer.
            children:
              - LintMark-Formatting-DocumentFormatter-LineEndingMajority
              - LintMark-Formatting-DocumentFormatter-LineEndingTieDefaultsToLf
            tests:
              - FormattingSubsystem_Format_NoConfiguredLineEnding_UsesMajority

          - id: LintMark-Formatting-LineEndingViolation
            title: >-
              The Formatting subsystem shall report a document in which any line ending differs from the line
              ending that the document should have as one `line-ending` problem.
            justification: |
              Mixed or unwanted line endings are a property of the whole file, so they are reported once,
              in a way that the fix option repairs by rewriting every line ending.
            children:
              - LintMark-Formatting-DocumentFormatter-LineEndingViolation
              - LintMark-Formatting-DocumentFormatter-LineEndingViolationPosition
              - LintMark-Formatting-DocumentFormatter-LineEndingViolationNamesFound
              - LintMark-Formatting-DocumentFormatter-LineEndingViolationNamesExpected
            tests:
              - FormattingSubsystem_Format_CrlfDocument_PatchedTextKeepsLfAndReportsLineEnding
              - FormattingSubsystem_Format_NoConfiguredLineEnding_UsesMajority

          - id: LintMark-Formatting-LineEndingNoViolation
            title: >-
              The Formatting subsystem shall report no `line-ending` problem for a document in which no line
              ending differs from the line ending that the document should have.
            justification: |
              A file that already has the right line ending needs no repair, and reporting it would invite a
              change that does nothing.
            children:
              - LintMark-Formatting-DocumentFormatter-LineEndingNoViolation
            tests:
              - FormattingSubsystem_Format_UniformDocument_ReportsNoLineEndingProblem

          - id: LintMark-Formatting-TrailingWhitespaceRemoved
            title: >-
              The Formatting subsystem shall remove the spaces and tabs at the end of each line of text of a
              document, but not where they are part of literal text.
            justification: |
              Trailing whitespace carries no meaning in text, while in code, HTML, and similar blocks it is
              content that belongs to the author.
            children:
              - LintMark-Formatting-DocumentFormatter-TrailingWhitespaceRemoved
              - LintMark-Formatting-DocumentFormatter-HeadingTrailingWhitespaceRemoved
              - LintMark-Formatting-DocumentFormatter-TableRowTrailingWhitespaceRemoved
              - LintMark-Formatting-DocumentFormatter-DefinitionTrailingWhitespaceRemoved
              - LintMark-Formatting-DocumentFormatter-BreakTrailingWhitespaceRemoved
              - LintMark-Formatting-DocumentFormatter-MarkerLinesTrailingWhitespaceRemoved
              - LintMark-Formatting-DocumentFormatter-WhitespaceOnlyLinesEmptied
              - LintMark-Formatting-DocumentFormatter-ProtectedSpansKept
              - LintMark-Formatting-DocumentFormatter-LinkTitleKept
              - LintMark-Formatting-Blocks-HeadingTrailingWhitespaceRemoved
              - LintMark-Formatting-Blocks-FenceTrailingWhitespaceRemoved
              - LintMark-Formatting-Blocks-BreakTrailingWhitespaceRemoved
            tests:
              - FormattingSubsystem_Format_TrailingWhitespace_IsRemovedFromTextOnly

          - id: LintMark-Formatting-HardBreakKept
            title: >-
              The Formatting subsystem shall keep each hard line break of a document a hard line break when it
              removes trailing whitespace.
            justification: |
              Two spaces at the end of a line are a line break in Markdown. Removing them would join lines and
              change how the document renders.
            children:
              - LintMark-Formatting-DocumentFormatter-HardBreakKept
            tests:
              - FormattingSubsystem_Format_HardBreaks_KeepTheirMeaning

          - id: LintMark-Formatting-TabsExpanded
            title: >-
              The Formatting subsystem shall replace each tab character in the text of a document by spaces up
              to the next tab stop of four columns, but not where the tab is part of literal text or of the
              indentation.
            justification: |
              Tabs in text show at different widths in different tools. A tab in code, or one that makes a
              block part of a list or quote, is content or structure and must stay.
            children:
              - LintMark-Formatting-DocumentFormatter-TabsExpanded
              - LintMark-Formatting-DocumentFormatter-TabsKeptWhereTheyMatter
              - LintMark-Formatting-DocumentFormatter-TabsKeptAtLineEnd
              - LintMark-Formatting-Blocks-TabsExpanded
            tests:
              - FormattingSubsystem_Format_Tabs_AreExpandedOnlyInPlainText

          - id: LintMark-Formatting-BlankRunsCollapsed
            title: >-
              The Formatting subsystem shall reduce each run of blank lines between the blocks of a document to
              the maximum that the configuration allows.
            justification: |
              Long runs of blank lines carry no meaning in Markdown.
            children:
              - LintMark-Formatting-DocumentFormatter-BlankRunsCollapsed
            tests:
              - FormattingSubsystem_Format_BlankRuns_CollapseToTheConfiguredMaximum

          - id: LintMark-Formatting-FinalNewline
            title: >-
              The Formatting subsystem shall end a document with exactly one line ending when the configuration
              asks for a final line ending.
            justification: |
              Tools and version control treat files without a final line ending, or with extra blank lines at
              the end, differently, and projects choose one convention.
            children:
              - LintMark-Formatting-DocumentFormatter-FinalNewlineSingle
              - LintMark-Formatting-DocumentFormatter-FinalNewlineUnclosedHtmlKept
              - LintMark-Formatting-DocumentFormatter-FinalNewlineAfterClosedHtml
              - LintMark-Formatting-DocumentFormatter-BlankDocumentUntouched
            tests:
              - FormattingSubsystem_Format_FinalNewlineOn_EndsWithExactlyOneLineEnding

          - id: LintMark-Formatting-FinalNewlineOptional
            title: >-
              The Formatting subsystem shall end a document with no line ending when the configuration asks for
              none.
            justification: |
              Some projects keep files without a final line ending, and the convention that the configuration
              names must be applied.
            children:
              - LintMark-Formatting-DocumentFormatter-FinalNewlineOptional
            tests:
              - FormattingSubsystem_Format_FinalNewlineOff_EndsWithoutLineEnding

          - id: LintMark-Formatting-HeadingSpacing
            title: >-
              The Formatting subsystem shall separate each heading of a document that is not inside a quote or
              list from the blocks around it by a blank line.
            justification: |
              A heading that touches the blocks around it is hard to read and is not recognized by every parser.
            children:
              - LintMark-Formatting-DocumentFormatter-HeadingSpacing
              - LintMark-Formatting-DocumentFormatter-SpacingNotForParagraphText
              - LintMark-Formatting-DocumentFormatter-OneInsertionPerBoundary
            tests:
              - FormattingSubsystem_Format_HeadingTouchingText_GetsBlankLines

          - id: LintMark-Formatting-FenceSpacing
            title: >-
              The Formatting subsystem shall separate each fenced code block of a document that is not inside a
              quote or list from the blocks around it by a blank line.
            justification: |
              A fence that touches the text around it is hard to read and is not recognized by every parser.
            children:
              - LintMark-Formatting-DocumentFormatter-FenceSpacing
            tests:
              - FormattingSubsystem_Format_FenceTouchingText_GetsBlankLines

          - id: LintMark-Formatting-ListSpacing
            title: >-
              The Formatting subsystem shall separate each list of a document that is not inside a quote or
              list from the blocks around it by a blank line.
            justification: |
              A list that touches the text around it is hard to read and is not recognized by every parser.
            children:
              - LintMark-Formatting-DocumentFormatter-ListSpacing
              - LintMark-Formatting-DocumentFormatter-SpacingNotForLazyContinuation
            tests:
              - FormattingSubsystem_Format_ListTouchingText_GetsBlankLine

          - id: LintMark-Formatting-TableSpacing
            title: >-
              The Formatting subsystem shall separate each table of a document that is not inside a quote or
              list from the blocks around it by a blank line.
            justification: |
              A table that touches the text around it is not recognized by every parser.
            children:
              - LintMark-Formatting-DocumentFormatter-TableSpacing
              - LintMark-Formatting-DocumentFormatter-SpacingNotForTableRows
            tests:
              - FormattingSubsystem_Format_TableTouchingText_GetsBlankLine

          - id: LintMark-Formatting-HeadingStyle
            title: >-
              The Formatting subsystem shall write each setext heading of a document in the ATX form, unless the
              conversion could change the meaning of the text.
            justification: |
              One heading style makes a document consistent, and a conversion that could change the meaning of
              the text is not made.
            children:
              - LintMark-Formatting-Blocks-HeadingStyle
            tests:
              - FormattingSubsystem_Format_SetextHeadings_BecomeAtxWhereSafe

          - id: LintMark-Formatting-HeadingClosingSigns
            title: >-
              The Formatting subsystem shall remove the closing number signs of each ATX heading of a document.
            justification: |
              Closing number signs add nothing to a heading, and headings with and without them make a document
              inconsistent.
            children:
              - LintMark-Formatting-Blocks-HeadingClosingSigns
            tests:
              - FormattingSubsystem_Format_ClosedHeadings_LoseTheClosingSigns

          - id: LintMark-Formatting-HeadingSpace
            title: >-
              The Formatting subsystem shall put exactly one space between the number signs of each heading of a
              document and its text.
            justification: |
              Extra spaces or tabs after the number signs have no meaning and make headings inconsistent.
            children:
              - LintMark-Formatting-Blocks-HeadingSpace
            tests:
              - FormattingSubsystem_Format_HeadingMarkerSpacing_BecomesOneSpace

          - id: LintMark-Formatting-HeadingStartLeft
            title: >-
              The Formatting subsystem shall start each heading of a document that is not inside a quote or list
              at the left margin.
            justification: |
              An indented heading looks like a mistake, and four spaces turn it into code.
            children:
              - LintMark-Formatting-Blocks-HeadingStartLeft
            tests:
              - FormattingSubsystem_Format_IndentedHeading_StartsAtTheLeftMargin

          - id: LintMark-Formatting-ThematicBreakStyle
            title: >-
              The Formatting subsystem shall write each thematic break of a document as three characters of the
              style that the configuration names, where that keeps the meaning of the document.
            justification: |
              One way to write a break makes a document consistent, and a break whose conversion would change
              the text around it is left as written.
            children:
              - LintMark-Formatting-Blocks-ThematicBreakStyle
            tests:
              - FormattingSubsystem_Format_ThematicBreaks_UseTheConfiguredStyle

          - id: LintMark-Formatting-CodeFenceStyle
            title: >-
              The Formatting subsystem shall write the fence of each fenced code block of a document with the
              fence character that the configuration names, where that keeps the meaning of the block.
            justification: |
              One fence character makes a document consistent, and a fence that cannot be converted without
              changing the block stays as written.
            children:
              - LintMark-Formatting-Blocks-CodeFenceStyle
            tests:
              - FormattingSubsystem_Format_CodeFences_UseTheConfiguredFenceCharacter

          - id: LintMark-Formatting-CodeBlockStyle
            title: >-
              The Formatting subsystem shall write each indented code block of a document that is not inside a
              quote or list as a fenced code block with the same content.
            justification: |
              Indented code is easily confused with other indented text and cannot carry a language, while a
              fence is explicit.
            children:
              - LintMark-Formatting-Blocks-CodeBlockStyle
            tests:
              - FormattingSubsystem_Format_IndentedCode_BecomesFencedCode

          - id: LintMark-Formatting-CodeContentKept
            title: >-
              The Formatting subsystem shall never change the content of code, HTML, math, front matter, or grid
              tables of a document.
            justification: |
              The whitespace and the blank lines of literal text are part of its content, and changing them
              changes what the document means or how it renders.
            children:
              - LintMark-Formatting-Blocks-CodeContentKept
              - LintMark-Formatting-DocumentFormatter-ProtectedBlocksKept
              - LintMark-Formatting-DocumentFormatter-FrontMatterKept
              - LintMark-Formatting-DocumentFormatter-GridTablesKept
              - LintMark-Formatting-DocumentFormatter-BlankLinesInProtectedBlocksKept
              - LintMark-Formatting-DocumentFormatter-IndentedCodeWideBlankLineKept
            tests:
              - FormattingSubsystem_Format_LiteralBlocks_KeepTheirContent

          - id: LintMark-Formatting-GridBorderLookalikeNotEdited
            title: >-
              The Formatting subsystem shall not change a line of a document that looks like the border of a
              grid table.
            justification: |
              Whether Pandoc reads such a line as part of a table can depend on its exact text, so a change to
              it cannot be shown to keep the meaning of the document.
            children:
              - LintMark-Formatting-DocumentFormatter-GridBorderLookalikeNotEdited
            tests:
              - FormattingSubsystem_Format_GridBorderLookalike_IsNotEdited

          - id: LintMark-Formatting-GridBorderLookalikeNotSeparated
            title: >-
              The Formatting subsystem shall insert no blank line next to a line of a document that looks like
              the border of a grid table.
            justification: |
              Whether Pandoc reads such a line as part of a table can depend on the lines around it, so a blank
              line next to it cannot be shown to keep the meaning of the document.
            children:
              - LintMark-Formatting-DocumentFormatter-GridBorderLookalikeNotSeparated
            tests:
              - FormattingSubsystem_Format_GridBorderLookalike_IsNotSeparated

          - id: LintMark-Formatting-NestedBlocksKept
            title: >-
              The Formatting subsystem shall not add or remove blank lines inside a quote or list of a document.
            justification: |
              A blank line inside a list can turn a tight list into a loose one and change how it renders.
            children:
              - LintMark-Formatting-Blocks-NestedBlocksKept
              - LintMark-Formatting-DocumentFormatter-ContainerBlankRunsKept
              - LintMark-Formatting-DocumentFormatter-SpacingNotInContainers
            tests:
              - FormattingSubsystem_Format_QuotesAndLists_KeepTheirBlankLines

          - id: LintMark-Formatting-UnclosedFencesKept
            title: >-
              The Formatting subsystem shall leave a fenced code block that the document never closes exactly as
              it is, together with the blank lines that follow it.
            justification: |
              The content of an unclosed fence runs to the end of its container, so the lines that follow it,
              blank or not, belong to the code.
            children:
              - LintMark-Formatting-Blocks-UnclosedFencesKept
              - LintMark-Formatting-DocumentFormatter-UnclosedFenceKept
            tests:
              - FormattingSubsystem_Format_UnclosedFence_StaysAsWritten

          - id: LintMark-Formatting-EditsReported
            title: >-
              The Formatting subsystem shall report each change that a formatting rule proposes as a problem of
              that rule at the place of the change.
            justification: |
              Checking a file is formatting it and listing what would change, so every change that rewriting
              would make is a problem that the check reports.
            children:
              - LintMark-Formatting-DocumentFormatter-ViolationsReportedPerEdit
              - LintMark-Formatting-DocumentFormatter-ViolationPositionAtEdit
              - LintMark-Formatting-DocumentFormatter-ViolationPositionAtInsertion
              - LintMark-Formatting-DocumentFormatter-OneViolationPerRulePerLine
              - LintMark-Formatting-Blocks-EditsAttributedToRules
              - LintMark-Formatting-DocumentFormatter-InlineEditsReported
              - LintMark-Formatting-DocumentFormatter-AbsorbedEditsStillReported
            tests:
              - FormattingSubsystem_Format_Violations_AreReportedPerRuleAtTheirPlace

          - id: LintMark-Formatting-FormattingStable
            title: >-
              The Formatting subsystem shall propose no change and report no problem for a document that is
              already in canonical form, in particular for the result of its own changes.
            justification: |
              A rewrite that needed to be repeated, or that undid itself, could not be trusted, and a file that
              is already canonical must not be reported.
            children:
              - LintMark-Formatting-Blocks-CanonicalBlocksUnchanged
            tests:
              - FormattingSubsystem_Format_CanonicalDocumentAndOwnResult_ProposeNothing
              - FormattingSubsystem_Format_ListsQuotesAndInlineText_AreStableAfterOneRun

          - id: LintMark-Formatting-BulletMarkerStyle
            title: >-
              The Formatting subsystem shall write the marker of each item of a bullet list of a document as the
              marker character that the configuration names.
            justification: |
              One marker character makes the lists of a project consistent.
            children:
              - LintMark-Formatting-Blocks-BulletMarkerStyle
            tests:
              - FormattingSubsystem_Format_BulletMarkers_UseTheConfiguredCharacter

          - id: LintMark-Formatting-ListsNeverMergedOrSplit
            title: >-
              The Formatting subsystem shall never merge two lists of a document into one or split a list into two
              when it writes the markers of lists.
            justification: |
              Two lists that differ only by their markers are two lists, and the items of one list must stay one
              list, or the document would render differently.
            children:
              - LintMark-Formatting-Blocks-ListsNeverMergedOrSplit
            tests:
              - FormattingSubsystem_Format_BulletLists_AreNeverMergedOrSplit

          - id: LintMark-Formatting-OrderedNumberingIncrementing
            title: >-
              The Formatting subsystem shall number each item of an ordered list of a document one higher than the
              item before it, counting from the number of the first item, when the configuration asks for
              incrementing numbers.
            justification: |
              Counting numbers show the position of each item, also in the source text. The first number decides
              where the list starts counting when it is rendered, so it stays as written.
            children:
              - LintMark-Formatting-Blocks-OrderedNumbering
            tests:
              - FormattingSubsystem_Format_OrderedNumbers_FollowTheConfiguredStyle

          - id: LintMark-Formatting-OrderedNumberingOne
            title: >-
              The Formatting subsystem shall give each item of an ordered list of a document the number of the
              first item when the configuration asks for the number one.
            justification: |
              Projects that want to insert items without renumbering write every item with the same number.
            children:
              - LintMark-Formatting-Blocks-OrderedNumbering
            tests:
              - FormattingSubsystem_Format_OrderedNumbers_FollowTheConfiguredStyle

          - id: LintMark-Formatting-ListItemsAligned
            title: >-
              The Formatting subsystem shall start the items of each list of a document in the same column.
            justification: |
              Items in different columns look like a mistake and can change which item a line belongs to.
            children:
              - LintMark-Formatting-Blocks-ListItemsAligned
            tests:
              - FormattingSubsystem_Format_ListColumnsAndSpacing_AreCanonical

          - id: LintMark-Formatting-ListStartsAtMargin
            title: >-
              The Formatting subsystem shall start each bullet list of a document that is not inside a quote or list
              at the left margin.
            justification: |
              An indented list at the top level looks like a mistake and can be read as code.
            children:
              - LintMark-Formatting-Blocks-ListStartsAtMargin
            tests:
              - FormattingSubsystem_Format_ListColumnsAndSpacing_AreCanonical

          - id: LintMark-Formatting-NestedBulletIndent
            title: >-
              The Formatting subsystem shall indent a bullet list inside the item of a bullet list of a document by
              the number of spaces that the configuration names.
            justification: |
              One indentation for nested bullet lists makes the lists of a project consistent.
            children:
              - LintMark-Formatting-Blocks-NestedBulletIndent
            tests:
              - FormattingSubsystem_Format_ListColumnsAndSpacing_AreCanonical

          - id: LintMark-Formatting-ListMarkerSpace
            title: >-
              The Formatting subsystem shall put exactly one space between the marker of each list item of a
              document and its text, where that keeps the meaning of the text.
            justification: |
              Extra spaces after a marker have no meaning and make the lists of a project inconsistent. With five
              spaces the text is a code block, and removing spaces would change the block.
            children:
              - LintMark-Formatting-Blocks-ListMarkerSpace
            tests:
              - FormattingSubsystem_Format_ListColumnsAndSpacing_AreCanonical

          - id: LintMark-Formatting-ListStructureKept
            title: >-
              The Formatting subsystem shall keep every line and block of a list of a document in the item that it
              belongs to when it changes the list.
            justification: |
              Moving a marker or an item must not move text out of its item or into another one, or the list would
              render differently.
            children:
              - LintMark-Formatting-Blocks-ListStructureKept
            tests:
              - FormattingSubsystem_Format_ListItemsWithContent_StayInTheirItems

          - id: LintMark-Formatting-BlockQuoteMarkerSpace
            title: >-
              The Formatting subsystem shall put exactly one space after each block quote marker of a document,
              where the spaces are not content or structure of the quote.
            justification: |
              Extra spaces after a quote marker have no meaning and make the quotes of a project inconsistent. In
              code, HTML, lists, and tables the spaces are content or structure, so they stay.
            children:
              - LintMark-Formatting-Blocks-QuoteMarkerSpace
              - LintMark-Formatting-Blocks-QuoteContentKept
            tests:
              - FormattingSubsystem_Format_QuoteMarkers_AreFollowedByOneSpace

          - id: LintMark-Formatting-EmphasisStyle
            title: >-
              The Formatting subsystem shall write each emphasis in a paragraph of a document, also one inside a
              list or block quote, with the delimiter character that the configuration names, where that
              keeps the meaning of the text.
            justification: |
              Underscores and asterisks mean the same emphasis, and one of them makes the documents of a project
              consistent. An underscore does not emphasize inside a word, so such an emphasis keeps its asterisks.
            children:
              - LintMark-Formatting-Inline-EmphasisStyle
              - LintMark-Formatting-Inline-WithinWordEmphasisKept
              - LintMark-Formatting-Inline-ParagraphsInContainers
              - LintMark-Formatting-Inline-ParagraphsInFootnotes
            tests:
              - FormattingSubsystem_Format_EmphasisDelimiters_UseTheConfiguredCharacter
              - FormattingSubsystem_Format_EmphasisInListsAndQuotes_UsesTheConfiguredCharacter

          - id: LintMark-Formatting-StrongStyle
            title: >-
              The Formatting subsystem shall write each strong emphasis in a paragraph of a document with the
              delimiter character that the configuration names, where that keeps the meaning of the text.
            justification: |
              Double underscores and double asterisks mean the same strong emphasis, and one of them makes the
              documents of a project consistent.
            children:
              - LintMark-Formatting-Inline-StrongStyle
            tests:
              - FormattingSubsystem_Format_EmphasisDelimiters_UseTheConfiguredCharacter

          - id: LintMark-Formatting-BareUrlsAutolinked
            title: >-
              The Formatting subsystem shall wrap each bare http, https, or ftp URL in a paragraph of a document in
              angle brackets when the configuration asks for the autolink style, which is the default.
            justification: |
              A URL in angle brackets is explicitly a link in every Markdown processor, while a bare one is a link in
              some processors only.
            children:
              - LintMark-Formatting-Inline-BareUrlsAutolinked
            tests:
              - FormattingSubsystem_Format_BareUrls_AreWrappedUnlessConfiguredOtherwise

          - id: LintMark-Formatting-BareUrlsLeft
            title: >-
              The Formatting subsystem shall keep each bare URL in a paragraph of a document as written when the
              configuration asks to leave them.
            justification: |
              Projects that want bare URLs choose to keep them, and the other formatting rules still apply.
            children:
              - LintMark-Formatting-Inline-BareUrlsLeft
            tests:
              - FormattingSubsystem_Format_BareUrls_AreWrappedUnlessConfiguredOtherwise

          - id: LintMark-Formatting-LineLengthReported
            title: >-
              The Formatting subsystem shall report a line of a paragraph that is wider than the line length of the
              configuration and that holds a place where it can be broken as a problem of the `line-length` rule that
              rewriting repairs, at the first column beyond the width.
            justification: |
              Checking a file is formatting it and listing what would change, so a paragraph that the rewrite
              would wrap is a problem that the check reports, at the place where the line becomes too wide.
            children:
              - LintMark-Formatting-DocumentFormatter-OverflowReportedAtItsPosition
            tests:
              - FormattingSubsystem_Format_OverlongParagraph_ReportsLineLengthAtTheFirstColumnBeyondTheWidth

          - id: LintMark-Formatting-ParagraphsWrapped
            title: >-
              The Formatting subsystem shall fill each paragraph that has a line wider than the line length of the
              configuration with as many words on each line as fit within the width.
            justification: |
              Long lines are hard to read, to review side by side, and to compare in version control. Filling the
              lines up to the width is the one result that does not depend on how the author broke the lines, so
              it is the same for every author.
            children:
              - LintMark-Formatting-DocumentFormatter-ParagraphsWrappedAfterOtherRules
              - LintMark-Formatting-DocumentFormatter-ParagraphFormatterOptional
              - LintMark-Formatting-Blocks-ParagraphFormatterProvided
              - LintMark-Formatting-Blocks-ParagraphsWrapped
              - LintMark-Formatting-Inline-AtomTokenizerProvided
              - LintMark-Formatting-Inline-LineWrapperProvided
              - LintMark-Formatting-Inline-BlockSyntaxGuardProvided
            tests:
              - FormattingSubsystem_Format_OverlongParagraph_IsFilledUpToTheWidth
              - ParagraphCorpus_Format_RepositoryMarkdownAtFourWidths_AreSafeAndAFixedPointAfterOneRun
              - ParagraphCorpus_Format_RandomParagraphsAtFourWidths_AreSafeAndStable

          - id: LintMark-Formatting-WrapStable
            title: >-
              The Formatting subsystem shall propose no further change and report no problem that rewriting repairs
              for the text that a wrap produced, also when other rules changed the text in the same run.
            justification: |
              A wrap that needed to be repeated, or that other rules undid, could not be trusted in a pipeline
              that fixes and then checks.
            children:
              - LintMark-Formatting-DocumentFormatter-UnstableWrapWithdrawn
              - LintMark-Formatting-Inline-LineWrapper-WrappedTextIsFixedPoint
            tests:
              - FormattingSubsystem_Format_WrappedParagraphs_ProposeNothingMoreWhenFormattedAgain
              - ParagraphCorpus_Format_RandomParagraphsInEveryStoredForm_GiveTheSameText

          - id: LintMark-Formatting-LineLengthOverflowOnly
            title: >-
              The Formatting subsystem shall leave each paragraph in which no line is wider than the line length of
              the configuration exactly as written.
            justification: |
              The author chose where to break the lines of such a paragraph, and a line that keeps to the limit is
              not a problem. Moving it would change every paragraph of a project for no reason.
            children:
              - LintMark-Formatting-Blocks-ParagraphsWithinTheWidthKept
            tests:
              - FormattingSubsystem_Format_ParagraphsWithinTheWidth_StayByteIdentical

          - id: LintMark-Formatting-LineLengthSetting
            title: >-
              The Formatting subsystem shall take the width that it allows for a line of a paragraph from the line
              length of the configuration, which is 120 columns by default.
            justification: |
              Projects differ in the width they allow, and a default that suits most of them makes a
              configuration unnecessary for the common case.
            tests:
              - FormattingSubsystem_Format_ConfiguredWidth_DecidesWhatIsReported

          - id: LintMark-Formatting-LineLengthUnlimited
            title: >-
              The Formatting subsystem shall neither report nor change the length of any line of a paragraph when the
              line length of the configuration is 0.
            justification: |
              Projects that let their editors wrap the text need a way to switch the limit off, and zero is the
              value that means no limit.
            children:
              - LintMark-Formatting-DocumentFormatter-WrapSkippedWhenSettingsOff
              - LintMark-Formatting-Blocks-ParagraphFormatter-SettingsDisableWrapping
            tests:
              - FormattingSubsystem_Format_WidthZero_ReportsAndChangesNothing

          - id: LintMark-Formatting-LineLengthRuleSwitch
            title: >-
              The Formatting subsystem shall neither report nor change the length of any line of a paragraph when the
              configuration switches the `line-length` rule off.
            justification: |
              The line length rule can be switched off like the other rules that a configuration may switch, and
              the files must then come out as they went in.
            children:
              - LintMark-Formatting-DocumentFormatter-WrapSkippedWhenSettingsOff
              - LintMark-Formatting-Blocks-ParagraphFormatter-SettingsDisableWrapping
            tests:
              - FormattingSubsystem_Format_LineLengthRuleOff_ReportsAndChangesNothing

          - id: LintMark-Formatting-LineLengthUnbreakableKept
            title: >-
              The Formatting subsystem shall neither report nor change a line of a paragraph that is wider than the
              line length of the configuration only because of one link, URL, autolink, code span, or image.
            justification: |
              Such an item cannot be broken without changing the document, so a report about it could not be acted
              on and a rewrite of it would damage it.
            children:
              - LintMark-Formatting-Blocks-ParagraphFormatter-UnbreakableLineKept
            tests:
              - FormattingSubsystem_Format_LineWithOneLongUnbreakableItem_IsNotReportedOrChanged

          - id: LintMark-Formatting-LineLengthLiteralTextKept
            title: >-
              The Formatting subsystem shall neither report nor change a line of code, HTML, a table, a heading, a
              link reference definition, or front matter that is wider than the line length of the configuration.
            justification: |
              The lines of these blocks are content or structure that the author cannot break freely, so wrapping
              them would change the document.
            children:
              - LintMark-Formatting-Blocks-LiteralBlocksKept
            tests:
              - FormattingSubsystem_Format_LiteralBlocksWiderThanTheWidth_AreNeverReported

          - id: LintMark-Formatting-WrapKeepsInlineConstructsWhole
            title: >-
              The Formatting subsystem shall keep each link, code span, inline HTML element, inline math, footnote
              reference, character reference, Pandoc attribute group, and Pandoc citation of a paragraph whole, on one
              line, when it wraps the paragraph.
            justification: |
              Breaking a line inside one of these items changes what the document says or how it renders, so a
              wrap may only break the text between such items.
            children:
              - LintMark-Formatting-Inline-WrapKeepsInlineConstructsWhole
              - LintMark-Formatting-Blocks-ParagraphFormatter-InlineConstructsKept
              - LintMark-Formatting-Inline-AtomTokenizer-MathWhole
              - LintMark-Formatting-Inline-AtomTokenizer-EntitiesAndFootnoteRefsWhole
              - LintMark-Formatting-Inline-AtomTokenizer-PandocAtomsWhole
            tests:
              - FormattingSubsystem_Format_WrappedParagraph_KeepsInlineConstructsWhole

          - id: LintMark-Formatting-WrapKeepsHardBreaks
            title: >-
              The Formatting subsystem shall keep each hard line break of a paragraph, written with spaces or with a
              backslash, at the end of the line where it is when it wraps the paragraph.
            justification: |
              A hard line break is part of what the author wrote, and moving or dropping it changes how the
              paragraph renders.
            children:
              - LintMark-Formatting-Blocks-HardBreaksKept
              - LintMark-Formatting-Inline-WrapKeepsHardBreaks
            tests:
              - FormattingSubsystem_Format_WrappedParagraph_KeepsHardBreaks

          - id: LintMark-Formatting-WrapKeepsContainerPrefixes
            title: >-
              The Formatting subsystem shall write each line of a wrapped paragraph in a list item or a block quote
              with the indentation or the quote markers that keep the line in the item or the quote.
            justification: |
              A line without its prefix would leave the item or the quote, or would join the text of another
              block, and the document would no longer say what it said before.
            children:
              - LintMark-Formatting-Blocks-ListPrefixKept
              - LintMark-Formatting-Blocks-QuotePrefixKept
              - LintMark-Formatting-Blocks-LazyQuoteLinesPrefixed
            tests:
              - FormattingSubsystem_Format_WrappedListAndQuoteParagraphs_KeepTheirPrefixes

          - id: LintMark-Formatting-WrapNeverStartsBlockSyntax
            title: >-
              The Formatting subsystem shall not start a line of a wrapped paragraph with text that Markdown reads as
              a list marker, a number marker, a heading marker, a quote marker, a thematic break or setext underline,
              a code fence, a link definition, an HTML block, a table row, or a Pandoc fenced div.
            justification: |
              A line that starts with such text turns a part of the paragraph into another block, so the wrap
              would change what the document says.
            children:
              - LintMark-Formatting-Inline-WrapNeverStartsBlockSyntax
              - LintMark-Formatting-Blocks-ParagraphFormatter-BlockSyntaxKeptOffLineStarts
              - LintMark-Formatting-Inline-BlockSyntaxGuard-QuoteGuarded
              - LintMark-Formatting-Inline-BlockSyntaxGuard-FencesGuarded
              - LintMark-Formatting-Inline-BlockSyntaxGuard-DefinitionsGuarded
              - LintMark-Formatting-Inline-BlockSyntaxGuard-HtmlBlocksGuarded
              - LintMark-Formatting-Inline-BlockSyntaxGuard-ThematicAndSetextGuarded
              - LintMark-Formatting-Inline-BlockSyntaxGuard-TableRowsGuarded
              - LintMark-Formatting-Inline-BlockSyntaxGuard-PandocConstructsGuarded
            tests:
              - FormattingSubsystem_Format_WrappedParagraph_NeverStartsALineWithBlockSyntax

          - id: LintMark-Formatting-WrapKeepsPandocParagraphs
            title: >-
              The Formatting subsystem shall leave a paragraph that holds a Pandoc structural line exactly as written
              and shall report no line length problem for it.
            justification: |
              Pandoc reads such lines as commands or fences, and joining or moving them would change the output of
              the document.
            children:
              - LintMark-Formatting-Blocks-PandocParagraphsKept
            tests:
              - FormattingSubsystem_Format_PandocStructuralParagraph_IsLeftAsWritten

          - id: LintMark-Formatting-WrapKeepsFootnoteParagraphs
            title: >-
              The Formatting subsystem shall leave a paragraph inside a footnote definition exactly as written and
              shall report no line length problem for it.
            justification: |
              The parser adds a link back to the reference to the end of a footnote, which makes the effect of a
              rewrite there uncertain, and leaving the paragraph as written is always safe.
            children:
              - LintMark-Formatting-Blocks-FootnoteParagraphsKept
            tests:
              - FormattingSubsystem_Format_FootnoteParagraph_IsLeftAsWritten

          - id: LintMark-Formatting-LineLengthResidualReported
            title: >-
              The Formatting subsystem shall report each line of a paragraph that is wider than the line length of the
              configuration and that it could not shorten as a problem of the `line-length` rule that rewriting cannot
              repair.
            justification: |
              A line that stays too wide must not pass unnoticed, and rewriting must not claim to have repaired it.
            children:
              - LintMark-Formatting-DocumentFormatter-ResidualOverflowReportedLintOnly
              - LintMark-Formatting-Blocks-ResidualOverflowReported
              - LintMark-Formatting-Blocks-LazyListLinesKept
            tests:
              - FormattingSubsystem_Format_WrapThatCannotFit_ReportsLineLengthThatCannotBeFixed

          - id: LintMark-Formatting-WrapModesReserved
            title: >-
              The Formatting subsystem shall neither report nor change the length of any line of a paragraph when the
              configuration asks for the `sentence` or the `semantic` wrap mode.
            justification: |
              Configurations that name the modes that are planned must keep working, and a mode that is not applied
              must not change the documents of the users who chose it.
            children:
              - LintMark-Formatting-DocumentFormatter-WrapSkippedWhenSettingsOff
              - LintMark-Formatting-Blocks-ParagraphFormatter-SettingsDisableWrapping
            tests:
              - FormattingSubsystem_Format_ReservedWrapModes_AreAcceptedAndChangeNothing

          - id: LintMark-Formatting-CodeSpanSpace
            title: >-
              The Formatting subsystem shall report a code span that is padded with exactly one space on each side as
              a problem of the `code-span-space` rule that rewriting repairs by removing that padding.
            justification: |
              One space on each side of a code span is not part of the code, because the parser removes it, so it
              only makes the spans of a project inconsistent.
            children:
              - LintMark-Formatting-Inline-CodeSpanSpace
              - LintMark-Formatting-Inline-CodeSpanSpaceInContainers
            tests:
              - FormattingSubsystem_Format_PaddedCodeSpan_LosesItsPadding

          - id: LintMark-Formatting-CodeSpanSpaceBacktickKept
            title: >-
              The Formatting subsystem shall keep the padding of a code span whose content starts or ends with a
              backtick as written.
            justification: |
              The padding separates the content from the delimiters, so removing it would end or change the code
              span.
            children:
              - LintMark-Formatting-Inline-CodeSpanSpaceBacktickKept
            tests:
              - FormattingSubsystem_Format_CodeSpanWithBacktickAtAnEdge_KeepsItsPadding

          - id: LintMark-Formatting-CodeSpanSpaceUnevenKept
            title: >-
              The Formatting subsystem shall keep a code span whose padding is on one side only, or is more than one
              space on a side, as written.
            justification: |
              The parser removes the padding only when one space stands on each side, so any other padding is
              content of the code span.
            children:
              - LintMark-Formatting-Inline-CodeSpanSpaceUnevenKept
            tests:
              - FormattingSubsystem_Format_AsymmetricOrDoublePadding_IsKept

          - id: LintMark-Formatting-CodeSpanSpaceBlankKept
            title: >-
              The Formatting subsystem shall keep a code span that holds only spaces as written.
            justification: |
              The spaces are the whole content of the code span, and removing them would change what the code says.
            children:
              - LintMark-Formatting-Inline-CodeSpanSpaceBlankKept
            tests:
              - FormattingSubsystem_Format_CodeSpanOfSpaces_IsKept
