---
# Formatting Subsystem Requirements
#
# The Formatting subsystem turns a parsed document into the edits that bring it into canonical form. The block
# formatters (Blocks) and the inline processing (Inline) are nested subsystems with their own requirements.

sections:
  - title: LintMark Requirements
    sections:
      - title: Formatting Requirements
        requirements:
          - id: LintMark-Formatting-Orchestration
            title: >-
              The Formatting subsystem shall give every block of a document to exactly one formatter, compose
              the edits of all rule families into one conflict-free set, and decide the line ending of the
              document.
            justification: |
              Many rules rewrite the same document, so their edits must never collide or apply twice, and the
              result must have one consistent line ending.
            children:
              - LintMark-Formatting-DocumentFormatter-BlockClaiming
              - LintMark-Formatting-DocumentFormatter-LineEnding
              - LintMark-Formatting-Blocks-LeafBlocks
              - LintMark-Formatting-Blocks-Containers
              - LintMark-Formatting-Blocks-Tables
              - LintMark-Formatting-Blocks-Paragraphs
              - LintMark-Formatting-Inline-Normalization
              - LintMark-Formatting-Inline-Wrapping
              - LintMark-Formatting-Inline-LinkRefactor
            tests:
              - FormattingSubsystem_Orchestration_DefaultFormatter_ComposesEditsOfAllRuleFamilies

          - id: LintMark-Formatting-Passes
            title: >-
              The Formatting subsystem shall remove trailing whitespace, replace tabs, limit and normalize blank
              lines, and give the file its final line ending.
            justification: |
              Whitespace is the most common source of noisy differences, and fixing it must not depend on what
              the blocks contain.
            children:
              - LintMark-Formatting-WhitespacePasses-TrailingAndTabs
              - LintMark-Formatting-WhitespacePasses-BlankLines
              - LintMark-Formatting-WhitespacePasses-FinalNewline
            tests:
              - FormattingSubsystem_Passes_WhitespaceBlankLinesBlockSpacingAndFileEnd_AreApplied

          - id: LintMark-Formatting-Edits
            title: >-
              The Formatting subsystem shall compose proposed edits without conflicts, apply them to the text in
              one pass, and carry edits of later stages back to the original text.
            justification: |
              Edits come from independent stages, and composing them wrongly would lose or duplicate the
              author's text.
            children:
              - LintMark-Formatting-EditSet-Composition
              - LintMark-Formatting-EditSet-Patching
              - LintMark-Formatting-EditSet-Rebase
            tests:
              - FormattingSubsystem_Edits_ConflictsPatchAndRebase_ComposeWithoutLosingText

          - id: LintMark-Formatting-Protection
            title: >-
              The Formatting subsystem shall leave code, HTML, math, front matter, and documents that are unsafe
              to format exactly as written.
            justification: |
              Text in these regions has a meaning that a formatter cannot judge, so changing it risks changing the
              rendered document.
            children:
              - LintMark-Formatting-DocumentFormatter-ProtectedRegions
              - LintMark-Formatting-DocumentFormatter-FormatUnsafe
            tests:
              - FormattingSubsystem_Protection_CodeHtmlMathFrontMatterAndUnsafeDocuments_AreLeftAlone
