---
# Software Unit Requirements for the SourceDocument Class
#
# The SourceDocument class turns the bytes of a file into LF-normalized text and records what
# is needed to write the file back exactly as it was found.

sections:
  - title: SourceDocument Unit Requirements
    requirements:
      - id: LintMark-SourceDocument-Normalize
        title: >-
          The SourceDocument class shall present file content with every line terminator normalized to a
          line feed and record how many LF and CRLF terminators the file contained.
        justification: |
          One canonical line-ending form makes parsing and position arithmetic independent of the
          file's style, while the recorded counts allow the original style to be restored or
          reported.
        tests:
          - SourceDocument_Create_LfOnly_KeepsTextAndCountsLf
          - SourceDocument_Create_CrLf_NormalizesToLfAndCountsCrLf
          - SourceDocument_Create_MixedEndings_IsMixedAndMajorityResolved
          - SourceDocument_Create_EmptyFile_HasSingleEmptyLine
          - SourceDocument_Create_FinalNewline_IsDetected
          - SourceDocument_FromText_Crlf_NormalizesLikeCreate
          - SourceDocument_LineStarts_RecordEveryLine

      - id: LintMark-SourceDocument-MajorityEnding
        title: >-
          The SourceDocument class shall identify the line terminator that occurs most often in the file,
          treating a tie or a file without terminators as LF.
        justification: |
          Files with mixed line endings must still be restored to one consistent style. Choosing the
          majority style changes the fewest lines and gives a deterministic answer in every case.
        tests:
          - SourceDocument_Create_MixedEndings_IsMixedAndMajorityResolved
          - SourceDocument_MajorityLineEnding_Tie_IsLf
          - SourceDocument_MajorityLineEnding_NoTerminators_IsLf

      - id: LintMark-SourceDocument-Encoding
        title: >-
          The SourceDocument class shall accept only UTF-8 content, preserve a UTF-8 byte order mark, and
          report invalid UTF-8 or a UTF-16 or UTF-32 byte order mark as an encoding failure with the position
          of the problem.
        justification: |
          Silently substituting replacement characters for damaged bytes would corrupt a file the
          next time it is written. Reporting the exact position lets the author repair the file, and
          preserving the byte order mark keeps rewritten files byte-compatible with their origin.
        tests:
          - SourceDocument_Create_Utf8Bom_IsStrippedAndPreserved
          - SourceDocument_Create_NoBom_WritesNoBom
          - SourceDocument_Create_Utf16Bom_ThrowsEncodingError
          - SourceDocument_Create_InvalidUtf8_ThrowsWithPosition
          - SourceDocument_Create_NullPath_ThrowsArgumentNullException

      - id: LintMark-SourceDocument-LoneCr
        title: >-
          The SourceDocument class shall report a carriage return that is not part of a CRLF terminator as
          a line-ending failure with its position.
        justification: |
          Only LF and CRLF terminators can be restored faithfully. Rewriting a bare carriage return
          would silently change the file's meaning for some editors, so it is reported instead.
        tests:
          - SourceDocument_Create_LoneCr_ThrowsLineEndingErrorWithPosition
          - SourceDocument_FromText_TrailingCr_ThrowsLineEndingError

      - id: LintMark-SourceDocument-Positions
        title: >-
          The SourceDocument class shall convert between character offsets and 1-based line and column
          positions, counting UTF-16 code units and counting a tab as one column.
        justification: |
          Reports are given as line and column. A single, documented column definition keeps
          positions stable and reproducible across platforms and tools.
        tests:
          - SourceDocument_PositionOf_TabsAndSurrogates_CountsUtf16UnitsWithTabAsOne
          - SourceDocument_OffsetOf_RoundTripsWithPositionOf
          - SourceDocument_PositionAndOffset_OutOfRange_Throw
          - SourceDocument_Slice_ReturnsRequestedCharacters
          - SourceDocument_LineStarts_RecordEveryLine

      - id: LintMark-SourceDocument-ToDisk
        title: >-
          The SourceDocument class shall convert normalized text back to a requested line-ending style and
          encode it with the original byte order mark so that an unchanged file is restored byte for byte.
        justification: |
          A formatter must never alter a file that needs no change. Restoring the exact original
          bytes for unchanged content proves that normalization loses no information.
        tests:
          - SourceDocument_ToBytes_Lf_RestoresOriginalBytes
          - SourceDocument_ToBytes_CrLf_RestoresOriginalBytes
          - SourceDocument_ToBytes_BomAndCrLf_RestoresOriginalBytes
          - SourceDocument_ToDisk_Target_ConvertsLineEndings
