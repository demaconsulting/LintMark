---
# Software Unit Requirements for the SourceDocument Unit
#
# The SourceDocument unit turns the bytes of a Markdown file into trustworthy LF-normalized text, keeps the
# facts needed to write the file back as found, and answers position questions about the text.

sections:
  - title: LintMark Requirements
    sections:
      - title: Document Requirements
        sections:
          - title: SourceDocument Requirements
            requirements:
              - id: LintMark-Document-SourceDocument-Decoding
                title: >-
                  The SourceDocument unit shall decode a file as strict UTF-8, remember and strip a UTF-8 byte
                  order mark, and reject any other byte order mark or invalid UTF-8 with the position of the
                  offending byte.
                justification: |
                  Files must never be changed through a wrong guess about their encoding, and a problem file has
                  to be reported at the place where it can be fixed.
                tests:
                  - SourceDocument_Create_Utf8Bom_IsStrippedAndPreserved
                  - SourceDocument_Create_Utf16Bom_ThrowsEncodingError
                  - SourceDocument_Create_InvalidUtf8_ThrowsWithPosition
                  - SourceDocument_Create_EmptyFile_HasSingleEmptyLine

              - id: LintMark-Document-SourceDocument-LineEndings
                title: >-
                  The SourceDocument unit shall present the text with LF line endings, count the original LF and
                  CRLF terminators, reject a bare carriage return, and restore the original line endings and byte
                  order mark when the text is written back, using the majority style for a mixed file.
                justification: |
                  Rules work on one line ending, while the file keeps the line ending its owners chose, and a
                  file with mixed endings is repaired to its prevailing style.
                tests:
                  - SourceDocument_Create_CrLf_NormalizesToLfAndCountsCrLf
                  - SourceDocument_Create_MixedEndings_IsMixedAndMajorityResolved
                  - SourceDocument_Create_LoneCr_ThrowsLineEndingErrorWithPosition
                  - SourceDocument_ToBytes_BomAndCrLf_RestoresOriginalBytes
                  - SourceDocument_ToBytes_MixedFile_WritesMajorityStyle
                  - SourceDocument_ToDisk_Target_ConvertsLineEndings

              - id: LintMark-Document-SourceDocument-Positions
                title: >-
                  The SourceDocument unit shall convert between text offsets and 1-based line and column
                  positions, counting a tab and each UTF-16 code unit as one column, and reject positions outside
                  the document.
                justification: |
                  Every finding is reported as a line and column, and rewrites address the text by offset, so the
                  two must map exactly onto each other.
                tests:
                  - SourceDocument_PositionOf_TabsAndSurrogates_CountsUtf16UnitsWithTabAsOne
                  - SourceDocument_OffsetOf_RoundTripsWithPositionOf
                  - SourceDocument_PositionAndOffset_OutOfRange_Throw
                  - SourceDocument_Slice_ReturnsRequestedCharacters
