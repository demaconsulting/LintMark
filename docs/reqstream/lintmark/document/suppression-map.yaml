---
# Software Unit Requirements for the SuppressionMap Class
#
# The SuppressionMap class interprets suppression comments (HTML comments that disable and
# enable rules) and answers which rules are suppressed at a given position.

sections:
  - title: LintMark Requirements
    sections:
      - title: Document Requirements
        sections:
          - title: SuppressionMap Requirements
            requirements:
              - id: LintMark-Document-SuppressionMap-Vocabulary
                title: >-
                  The SuppressionMap class shall act on lintmark and markdownlint suppression comments written as
                  block-level or inline HTML comments and on prettier-ignore comments written as block-level
                  HTML comments, and shall ignore every other comment.
                justification: |
                  Authors already use these comments with other Markdown tools. Honoring the same comment
                  vocabulary lets existing documents work unchanged, while unrelated comments must never
                  suppress anything.
                tests:
                  - SuppressionMap_Build_NoDirectives_SuppressesNothing
                  - SuppressionMap_Build_UnknownDirectives_AreIgnored
                  - SuppressionMap_IsSuppressed_InlineComment_IsDirective
                  - SuppressionMap_Build_InlinePrettierComment_IsIgnored

              - id: LintMark-Document-SuppressionMap-DisableRegion
                title: >-
                  The SuppressionMap class shall suppress rules from a disable comment up to the matching enable
                  comment, or to the end of the file when none follows.
                justification: |
                  Disabling a rule for a stretch of a document is the most common use of suppression
                  comments, and an unterminated disable must not silently end.
                tests:
                  - SuppressionMap_IsSuppressed_DisableEnableRegion_CoversTextBetween
                  - SuppressionMap_IsSuppressed_UnterminatedDisable_RunsToEndOfFile

              - id: LintMark-Document-SuppressionMap-CaptureRestore
                title: >-
                  The SuppressionMap class shall return to the suppression state saved by a capture comment when
                  a restore comment follows it, and shall ignore a restore comment that has no capture.
                justification: |
                  Capture and restore let a document bracket a region without knowing which rules were
                  disabled before it.
                tests:
                  - SuppressionMap_IsSuppressed_CaptureRestore_ReturnsToCapturedState
                  - SuppressionMap_IsSuppressed_RestoreWithoutCapture_IsIgnored

              - id: LintMark-Document-SuppressionMap-DisableLine
                title: >-
                  The SuppressionMap class shall suppress rules on the line of a disable-line comment only.
                justification: |
                  A single-line exception must cover exactly its own line, so that nothing near the
                  exception is accidentally exempted.
                tests:
                  - SuppressionMap_IsSuppressed_DisableLine_CoversOwnLineOnly

              - id: LintMark-Document-SuppressionMap-DisableNextLine
                title: >-
                  The SuppressionMap class shall suppress rules on the line after a disable-next-line comment
                  only.
                justification: |
                  A single-line exception must cover exactly the line it names, and a comment on the last
                  line of a file has no next line to cover.
                tests:
                  - SuppressionMap_IsSuppressed_DisableNextLine_CoversFollowingLineOnly
                  - SuppressionMap_Build_DisableNextLineOnLastLine_ProducesNoRange

              - id: LintMark-Document-SuppressionMap-DisableFile
                title: >-
                  The SuppressionMap class shall suppress rules in the whole file for a disable-file comment.
                justification: |
                  Some documents, such as generated ones, are exempt from a rule altogether.
                tests:
                  - SuppressionMap_IsSuppressed_DisableFile_CoversWholeFile

              - id: LintMark-Document-SuppressionMap-PrettierIgnoreBlock
                title: >-
                  The SuppressionMap class shall suppress all rules for the whole block that follows a
                  prettier-ignore comment.
                justification: |
                  Prettier's ignore comment applies to a block, not to a line. Authors who protect a table or
                  a list with it expect the entire construct, however many lines it has, to be left alone.
                tests:
                  - SuppressionMap_IsSuppressed_PrettierIgnore_CoversNextBlock
                  - SuppressionMap_IsSuppressed_PrettierIgnoreBeforeList_CoversWholeList

              - id: LintMark-Document-SuppressionMap-PrettierIgnoreRegion
                title: >-
                  The SuppressionMap class shall suppress all rules between prettier-ignore-start and
                  prettier-ignore-end comments, up to the end of the file when no end comment follows.
                justification: |
                  Prettier's start and end comments protect a stretch of several blocks, and an unterminated
                  start must not silently end.
                tests:
                  - SuppressionMap_IsSuppressed_PrettierIgnoreStartEnd_CoversRegion
                  - SuppressionMap_IsSuppressed_UnterminatedPrettierStart_RunsToEndOfFile

              - id: LintMark-Document-SuppressionMap-RuleSelection
                title: >-
                  The SuppressionMap class shall limit a comment to the rules it lists, applying it to all rules
                  when none are listed, and shall track regions of different rules independently.
                justification: |
                  Comments may name one rule, several, or none to mean all of them, and regions for
                  different rules overlap in practice.
                tests:
                  - SuppressionMap_IsSuppressed_DisableWithRules_SuppressesOnlyListedRules
                  - SuppressionMap_IsSuppressed_EnableWithRules_ReEnablesOnlyListedRules
                  - SuppressionMap_IsSuppressed_OverlappingRuleRegions_TrackedIndependently

              - id: LintMark-Document-SuppressionMap-RangeQuery
                title: >-
                  The SuppressionMap class shall tell whether a rule is suppressed at a position and whether it
                  is suppressed anywhere within a range.
                justification: |
                  Checks that report a problem at one position ask about a point, while checks and rewrites
                  that act on a whole block need to know whether any part of it is exempt.
                tests:
                  - SuppressionMap_IsSuppressed_DisableEnableRegion_CoversTextBetween
                  - SuppressionMap_IsSuppressedRange_BlockIntersectingRegion_IsSuppressed

              - id: LintMark-Document-SuppressionMap-IgnoresCode
                title: >-
                  The SuppressionMap class shall not treat comment-like text inside code blocks, code spans, or
                  front matter as a suppression comment.
                justification: |
                  Documentation about suppression comments quotes them in code. Quoted examples must not
                  change how the surrounding document is checked.
                tests:
                  - SuppressionMap_Build_CommentsInCodeAndFrontMatter_AreIgnored
