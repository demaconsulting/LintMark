---
# Software Unit Requirements for the SuppressionMap Unit
#
# The SuppressionMap unit turns suppression directives written as HTML comments into ranges of the text and
# answers whether a rule is suppressed at a position or in a range.

sections:
  - title: LintMark Requirements
    sections:
      - title: Document Requirements
        sections:
          - title: SuppressionMap Requirements
            requirements:
              - id: LintMark-Document-SuppressionMap-Directives
                title: >-
                  The SuppressionMap unit shall recognize the disable, enable, disable-line, disable-next-line,
                  disable-file, capture, restore, and prettier-ignore comment directives, and shall ignore
                  unknown directives and comments in code and front matter.
                justification: |
                  Authors keep intentional deviations in the document itself, in the forms that other Markdown
                  tools already use, and ordinary text that looks like a directive must not suppress anything.
                tests:
                  - SuppressionMap_IsSuppressed_DisableLine_CoversOwnLineOnly
                  - SuppressionMap_IsSuppressed_DisableNextLine_CoversFollowingLineOnly
                  - SuppressionMap_IsSuppressed_DisableFile_CoversWholeFile
                  - SuppressionMap_IsSuppressed_CaptureRestore_ReturnsToCapturedState
                  - SuppressionMap_IsSuppressed_PrettierIgnore_CoversNextBlock
                  - SuppressionMap_Build_UnknownDirectives_AreIgnored
                  - SuppressionMap_Build_CommentsInCodeAndFrontMatter_AreIgnored

              - id: LintMark-Document-SuppressionMap-Rules
                title: >-
                  The SuppressionMap unit shall limit a directive to the rules it lists, by rule id or by legacy
                  rule-number alias, and to all rules when it lists none.
                justification: |
                  Authors suppress one rule without losing the checks of all others, and keep the rule numbers
                  they already use.
                tests:
                  - SuppressionMap_IsSuppressed_DisableWithRules_SuppressesOnlyListedRules
                  - SuppressionMap_IsSuppressed_EnableWithRules_ReEnablesOnlyListedRules
                  - SuppressionMap_IsSuppressed_OverlappingRuleRegions_TrackedIndependently
                  - SuppressionMap_Build_AliasResolver_ResolvesAliases

              - id: LintMark-Document-SuppressionMap-Ranges
                title: >-
                  The SuppressionMap unit shall treat the text from a disable directive to the matching enable
                  directive, or to the end of the file when there is none, as suppressed, and shall report a
                  rule as suppressed for a range that intersects a suppressed region.
                justification: |
                  Findings are suppressed at a position and rewrites are suppressed for whole blocks, so a block
                  touching a suppressed region has to be left unchanged.
                tests:
                  - SuppressionMap_IsSuppressed_DisableEnableRegion_CoversTextBetween
                  - SuppressionMap_IsSuppressed_UnterminatedDisable_RunsToEndOfFile
                  - SuppressionMap_IsSuppressedRange_BlockIntersectingRegion_IsSuppressed
                  - SuppressionMap_IsSuppressed_InlineComment_IsDirective
