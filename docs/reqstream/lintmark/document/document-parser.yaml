---
# Software Unit Requirements for the DocumentParser Unit
#
# The DocumentParser unit parses a document with the tool's fixed Markdown pipeline into a flat, source-ordered
# list of blocks whose ranges can be trusted, together with the reference definitions and suppressions.

sections:
  - title: LintMark Requirements
    sections:
      - title: Document Requirements
        sections:
          - title: DocumentParser Requirements
            requirements:
              - id: LintMark-Document-DocumentParser-Blocks
                title: >-
                  The DocumentParser unit shall produce the blocks of a document in source order with their kind,
                  nesting, and exact source range, ending each block on its last visible character, and shall
                  report the lines of a paragraph or heading with their exact content ranges.
                justification: |
                  Linting and rewriting locate and replace constructs by source range, so a range that is too
                  long or too short would damage the document or misplace a finding.
                children:
                  - LintMark-OTS-Markdig-Spans
                  - LintMark-OTS-Markdig-Extensions
                tests:
                  - DocumentParser_Parse_SimpleDocument_ReturnsBlocksInSourceOrder
                  - DocumentParser_Parse_NestedContainers_ReportsDepthAndParents
                  - DocumentParser_Parse_BlockConstructs_AreClassifiedWithExactSpans
                  - DocumentParser_Parse_UnclosedFence_ExtendsToEndOfDocument
                  - DocumentParser_Parse_ListFollowedByBlankLine_EndsOnLastVisibleCharacter
                  - DocumentParser_GetLines_ParagraphLines_HaveExactContentRanges

              - id: LintMark-Document-DocumentParser-References
                title: >-
                  The DocumentParser unit shall report every link reference definition and footnote definition
                  with its range, including those in quotes and list items, flag a footnote that is repeated or
                  never referenced, and look up definitions by label ignoring case and spacing.
                justification: |
                  Link and footnote rules and the link rewriting need a reliable index of what is defined where.
                tests:
                  - DocumentParser_Parse_DefinitionsAndFootnotes_AppearInSourceOrderWithOwnRanges
                  - DocumentParser_Parse_UnreferencedFootnote_IsReportedWithItsRange
                  - DocumentParser_Parse_DuplicateFootnoteDefinition_SecondIsReported
                  - ReferenceIndex_TryGet_CaseAndWhitespaceInsensitive_FindsDefinition
                  - ReferenceIndex_TryGet_DuplicateLabels_FirstWinsAndBothRetained
                  - ReferenceIndex_Build_DefinitionInBlockQuote_IsIndexed

              - id: LintMark-Document-DocumentParser-GridTableFallback
                title: >-
                  The DocumentParser unit shall mark a document as unsafe to format, with the position of the
                  offending line, when a line looks like a grid table border but is not part of a valid table,
                  while still producing its blocks for linting.
                justification: |
                  Such a document cannot be rewritten without risk to its tables, but it must still be checked
                  and the author told where the table is damaged.
                tests:
                  - DocumentParser_Parse_InvalidGridLine_MarksFormatUnsafeAtThatLine
                  - DocumentParser_Parse_GridTableFallback_StillProducesBlocks
                  - DocumentParser_Parse_InvalidGridLineInsideFence_NotMarked
                  - DocumentParser_Parse_PlainDocument_NotMarked

              - id: LintMark-Document-DocumentParser-Extensions
                title: >-
                  The DocumentParser unit shall recognize YAML front matter at the start of a document, pipe
                  tables, grid tables, footnotes, and math blocks, so that their content is handled as the
                  construct and not as ordinary text.
                justification: |
                  Documents written for Pandoc and similar tools use these constructs, and the tool must neither
                  report nor rewrite their content as if it were plain Markdown.
                tests:
                  - DocumentParser_Parse_FrontMatter_IsFrontMatterBlock
                  - DocumentParser_Parse_PipeTable_IsTableWithGfmCells
                  - DocumentParser_Parse_GridTable_IsGridTable
                  - DocumentParser_Parse_UnclosedMathBlock_ExtendsToEndOfDocument
                  - DocumentParser_Parse_InlineConstructs_AreRecognized
