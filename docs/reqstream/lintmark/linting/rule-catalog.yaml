---
# Software Unit Requirements for the RuleCatalog Unit
#
# RuleCatalog is the single registry of rule identifiers, their aliases, defaults, and command-line overrides, and
# defines the finding that carries a rule identifier to the report.

sections:
  - title: LintMark Requirements
    sections:
      - title: Linting Requirements
        sections:
          - title: RuleCatalog Requirements
            requirements:
              - id: LintMark-Linting-RuleCatalog-Registry
                title: >-
                  The RuleCatalog unit shall register every rule identifier with its kind, its default state, and
                  whether a configuration may switch it, and shall mark the always-applied formatting rules as fixed.
                justification: |
                  One place that defines the rules lets a configuration be validated, a finding be traced to a
                  registered rule, and the defaults be documented once.
                tests:
                  - RuleCatalog_TryResolve_KebabId_ReturnsCanonical
                  - RuleCatalog_TryResolve_LineEnding_ReturnsRuleButNotConfigurable
                  - RuleCatalog_TryGet_UnknownId_ReturnsFalse
                  - RuleCatalog_TryResolve_FormattingRuleAlias_ResolvesButIsNotConfigurable
                  - RuleCatalog_TryResolve_RuleNumberOfASpacingLintOnlyRule_IsConfigurableAndEnabled

              - id: LintMark-Linting-RuleCatalog-Aliases
                title: >-
                  The RuleCatalog unit shall resolve a rule identifier or a legacy rule number such as `MD013`, in any
                  letter case, to the canonical identifier, and shall not resolve unknown names or dropped numbers.
                justification: |
                  Users coming from other Markdown linters know the rule numbers, and suppression comments and
                  settings must name a rule in either form regardless of the system culture.
                tests:
                  - RuleCatalog_TryResolve_EveryAlias_ReturnsItsRule
                  - RuleCatalog_TryResolve_AnyLetterCase_ReturnsCanonical
                  - RuleCatalog_TryResolve_TurkishCulture_StillMatches
                  - RuleCatalog_TryResolve_UnknownName_ReturnsFalse
                  - RuleCatalog_TryResolve_DroppedAlias_ReturnsFalseAndIsDropped

              - id: LintMark-Linting-RuleCatalog-Overrides
                title: >-
                  The RuleCatalog unit shall turn the rule lists of the enable and disable options into forced
                  switches that win over the configuration, and shall reject unknown rules, always-applied rules, and
                  a rule named by both options.
                justification: |
                  A command-line switch is a deliberate choice for one run and must beat the stored settings, while
                  a typo or a contradiction must be an error instead of a silent no-op.
                tests:
                  - RuleOverrides_Create_NamesAndNumbers_AreResolvedToCanonicalIds
                  - RuleOverrides_Apply_Configuration_RulesAreForcedOnAndOff
                  - RuleOverrides_Create_InvalidList_Throws
                  - RuleOverrides_Create_RuleInBothLists_Throws

              - id: LintMark-Linting-RuleCatalog-Findings
                title: >-
                  The RuleCatalog unit shall define a finding that carries the rule identifier, the kind, the path, a
                  one-based line and column, and a one-line message.
                justification: |
                  Every report line is built from the same finding, so each part must be present and a message must
                  never break the one-line-per-finding output.
                tests:
                  - Diagnostic_LintOnly_MultiLineMessage_CarriesFieldsOnOneLine
