---
# Software Unit Requirements for the Diagnostic Type
#
# The Diagnostic record (with the DiagnosticKind enumeration) is one problem found in a file: what rule found it,
# where it is, what it says, and whether rewriting the file removes it.

sections:
  - title: LintMark Requirements
    sections:
      - title: Linting Requirements
        sections:
          - title: Diagnostic Requirements
            requirements:
              - id: LintMark-Linting-Diagnostic-Fields
                title: >-
                  The Diagnostic record shall expose the rule identifier, kind, path, line, column, and message
                  that it was created with.
                justification: |
                  Reporters and the fix option read these values to build report lines and to decide which
                  problems rewriting removes.
                tests:
                  - Diagnostic_Constructor_AllArguments_ExposesValues

              - id: LintMark-Linting-Diagnostic-NullArguments
                title: >-
                  The Diagnostic record shall refuse a missing rule identifier, path, or message.
                justification: |
                  A missing value is a programming error that must be reported as such, and a diagnostic
                  without one of these parts could not be turned into a report line.
                tests:
                  - Diagnostic_Constructor_NullRuleId_Throws
                  - Diagnostic_Constructor_NullPath_Throws
                  - Diagnostic_Constructor_NullMessage_Throws

              - id: LintMark-Linting-Diagnostic-RuleIdShape
                title: >-
                  The Diagnostic record shall refuse a rule identifier that is not written in lower-case words
                  joined by single hyphens.
                justification: |
                  A report line is read by editors and scripts. A rule identifier with spaces or capitals
                  would break that reading, so such a value must never exist.
                tests:
                  - Diagnostic_Constructor_ValidRuleId_Accepted
                  - Diagnostic_Constructor_UppercaseRuleId_Throws
                  - Diagnostic_Constructor_RuleIdWithTrailingHyphen_Throws
                  - Diagnostic_Constructor_RuleIdWithDoubleHyphen_Throws
                  - Diagnostic_Constructor_EmptyRuleId_Throws
                  - Diagnostic_Constructor_RuleIdStartingWithNonLetter_Throws
                  - Diagnostic_Constructor_RuleIdWithInvalidCharacter_Throws

              - id: LintMark-Linting-Diagnostic-BlankPathOrMessage
                title: >-
                  The Diagnostic record shall refuse a blank path or message.
                justification: |
                  A report line without a path or a message tells the reader nothing about the problem.
                tests:
                  - Diagnostic_Constructor_BlankPath_Throws
                  - Diagnostic_Constructor_BlankMessage_Throws

              - id: LintMark-Linting-Diagnostic-SingleLineMessage
                title: >-
                  The Diagnostic record shall refuse a message that spans several lines.
                justification: |
                  A message with a line break would split one report line into several, and editors and
                  scripts read one problem per line.
                tests:
                  - Diagnostic_Constructor_MultilineMessage_Throws

              - id: LintMark-Linting-Diagnostic-PositionAtLeastOne
                title: >-
                  The Diagnostic record shall refuse a line or column below one.
                justification: |
                  Positions in a report are counted from one, so a position of zero would point to nothing
                  in the file.
                tests:
                  - Diagnostic_Constructor_LineAndColumnOne_Accepted
                  - Diagnostic_Constructor_LineBelowOne_Throws
                  - Diagnostic_Constructor_ColumnBelowOne_Throws

              - id: LintMark-Linting-Diagnostic-DefinedKind
                title: >-
                  The Diagnostic record shall refuse a kind that is not defined.
                justification: |
                  The kind decides whether rewriting removes the problem, so an undefined kind would leave
                  that decision open.
                tests:
                  - Diagnostic_Constructor_UndefinedKind_Throws

              - id: LintMark-Linting-Diagnostic-FixableMatchesKind
                title: >-
                  The Diagnostic record shall report a problem as removable by rewriting exactly when its kind is
                  a formatting problem.
                justification: |
                  The fix option drops the problems that rewriting removes. A flag that could disagree with
                  the kind would drop problems that remain, or keep problems that are gone.
                tests:
                  - Diagnostic_Fixable_FormattingKind_IsTrue
                  - Diagnostic_Fixable_LintOnlyKind_IsFalse

              - id: LintMark-Linting-Diagnostic-ValueEquality
                title: >-
                  The Diagnostic record shall treat two diagnostics with the same values as equal, and two that
                  differ in any value as different.
                justification: |
                  A problem found twice, for example through two paths to the same file, must be reported
                  once, which needs a comparison by value.
                tests:
                  - Diagnostic_Equals_SameValues_AreEqual
                  - Diagnostic_Equals_DifferentColumn_AreNotEqual
                  - Diagnostic_Equals_AnyMemberDifferent_AreNotEqual
                  - Diagnostic_Equals_Null_AreNotEqual
                  - Diagnostic_GetHashCode_EqualDiagnostics_CollapseInHashSet
