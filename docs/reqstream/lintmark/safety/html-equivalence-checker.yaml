---
# Software Unit Requirements for the HtmlEquivalenceChecker Class
#
# The HtmlEquivalenceChecker class decides whether two texts of one document render to equivalent HTML, using the
# tool's fixed Markdown dialect, for normalized text and for text with its real line endings.

sections:
  - title: LintMark Requirements
    sections:
      - title: Safety Requirements
        sections:
          - title: HtmlEquivalenceChecker Requirements
            requirements:
              - id: LintMark-Safety-HtmlEquivalenceChecker-RendersWithFixedPipeline
                title: >-
                  The HtmlEquivalenceChecker class shall compare the HTML that the tool's fixed Markdown dialect
                  renders for the two texts.
                justification: |
                  Only the dialect that the rest of the tool uses shows how the author's document is read.
                children:
                  - LintMark-OTS-Markdig-HtmlRendering
                tests:
                  - HtmlEquivalenceChecker_Check_ReferenceCases_ReportExpectedVerdict

              - id: LintMark-Safety-HtmlEquivalenceChecker-AttributesCompared
                title: >-
                  The HtmlEquivalenceChecker class shall report a difference when the attributes of a rendered tag
                  differ, including a heading identifier that is changed, added, or removed.
                justification: |
                  The tool's fixed Markdown dialect makes no identifiers of its own, so the identifier of a
                  heading and every other attribute (a destination, a title, an alternative text, a class) was
                  written by the author. A change of one changes where a link to the page leads or what the
                  reader sees, so no attribute may be ignored.
                tests:
                  - HtmlEquivalenceChecker_Check_HeadingIdChanged_Different
                  - HtmlEquivalenceChecker_Check_RawHtmlHeadingIdChanged_Different
                  - HtmlEquivalenceChecker_Check_AttributeChanged_Different

              - id: LintMark-Safety-HtmlEquivalenceChecker-TagWhitespaceExact
                title: >-
                  The HtmlEquivalenceChecker class shall compare the whitespace inside a tag, including the value
                  of an attribute, character by character.
                justification: |
                  Whitespace in the value of a title, an alternative text, an address, or a class is part of the
                  value. Collapsing whitespace in a tag as well as in text would hide a change of the value.
                tests:
                  - HtmlEquivalenceChecker_Check_AttributeValueWhitespaceChanged_Different
                  - HtmlEquivalenceChecker_Check_RenderedTitleWhitespaceChanged_Different
                  - HtmlEquivalenceChecker_Check_SpacingInsideTagChanged_Different
                  - HtmlEquivalenceChecker_Check_GreaterThanInQuotedValue_ValueStillCompared

              - id: LintMark-Safety-HtmlEquivalenceChecker-CommentExact
                title: >-
                  The HtmlEquivalenceChecker class shall compare the content of an HTML comment character by
                  character.
                justification: |
                  A comment is not shown, but tools read it (directives, markers), so a rewrite must not change
                  it.
                tests:
                  - HtmlEquivalenceChecker_Check_CommentWhitespaceChanged_Different

              - id: LintMark-Safety-HtmlEquivalenceChecker-UnterminatedTagExact
                title: >-
                  The HtmlEquivalenceChecker class shall compare the text that follows a tag that never ends,
                  up to the end of the text, character by character.
                justification: |
                  Where a tag that never ends stops cannot be told, so nothing after it may be treated as
                  ordinary text; this is also what keeps the comparison in linear time.
                tests:
                  - HtmlEquivalenceChecker_Check_UnterminatedTagWhitespaceChanged_Different

              - id: LintMark-Safety-HtmlEquivalenceChecker-BlockTagSpacingEquivalent
                title: >-
                  The HtmlEquivalenceChecker class shall treat two texts that differ only in whitespace runs in
                  text and in whitespace between a block-level tag and text as equivalent.
                justification: |
                  A browser shows a run of whitespace as one space and shows no space at the edge of a block,
                  so a reader cannot see the difference.
                tests:
                  - HtmlEquivalenceChecker_Check_TextAndBlockTagWhitespace_Equivalent
                  - HtmlEquivalenceChecker_Check_SameHeadingIdOtherLayout_Equivalent

              - id: LintMark-Safety-HtmlEquivalenceChecker-RenderedAttributesEquivalent
                title: >-
                  The HtmlEquivalenceChecker class shall treat two texts as equivalent when they differ only in
                  layout that leaves the attributes of every rendered tag as they were, for links with titles,
                  images, aligned tables, task lists, footnotes, math, and alerts.
                justification: |
                  Comparing the attributes of tags exactly must not make a harmless rewrite of ordinary
                  Markdown look unsafe.
                tests:
                  - HtmlEquivalenceChecker_Check_RenderedAttributesHarmlessRewrite_Equivalent

              - id: LintMark-Safety-HtmlEquivalenceChecker-IdenticalTextEquivalent
                title: >-
                  The HtmlEquivalenceChecker class shall treat two identical texts as equivalent without
                  rendering them.
                justification: |
                  Identical texts render to the same page whatever the renderer does, so a rewrite that changes
                  nothing must never be refused because of a renderer failure.
                tests:
                  - HtmlEquivalenceChecker_Check_IdenticalTextRendererThrows_StillEquivalent

              - id: LintMark-Safety-HtmlEquivalenceChecker-SoftBreakEquivalent
                title: >-
                  The HtmlEquivalenceChecker class shall treat a line break inside a paragraph and a space as
                  equivalent.
                justification: |
                  Rewrapping a paragraph is what a formatter is for. A reader of the rendered document cannot
                  see where the source line ended.
                tests:
                  - HtmlEquivalenceChecker_Check_SoftBreakVersusSpace_Equivalent

              - id: LintMark-Safety-HtmlEquivalenceChecker-BulletMarkerEquivalent
                title: >-
                  The HtmlEquivalenceChecker class shall treat two bullet lists that differ only in the character
                  of the bullet as equivalent.
                justification: |
                  The character of a bullet is a matter of layout that a reader of the rendered document cannot
                  see.
                tests:
                  - HtmlEquivalenceChecker_Check_BulletMarkerChanged_Equivalent

              - id: LintMark-Safety-HtmlEquivalenceChecker-TableSpacingEquivalent
                title: >-
                  The HtmlEquivalenceChecker class shall treat two tables that differ only in the spacing of
                  their cells and rulers as equivalent.
                justification: |
                  Aligning the columns of a table is a matter of layout that a reader of the rendered document
                  cannot see.
                tests:
                  - HtmlEquivalenceChecker_Check_TableSpacingChanged_Equivalent

              - id: LintMark-Safety-HtmlEquivalenceChecker-SetextAtxEquivalent
                title: >-
                  The HtmlEquivalenceChecker class shall treat a setext heading and an ATX heading of the same
                  level and text as equivalent.
                justification: |
                  The syntax of a heading is a matter of layout that a reader of the rendered document cannot
                  see.
                tests:
                  - HtmlEquivalenceChecker_Check_SetextToAtx_Equivalent

              - id: LintMark-Safety-HtmlEquivalenceChecker-TrailingWhitespaceEquivalent
                title: >-
                  The HtmlEquivalenceChecker class shall treat two texts that differ only in trailing whitespace
                  as equivalent.
                justification: |
                  Trailing blanks and blank lines at the end of a line or of the text are a matter of layout
                  that a reader of the rendered document cannot see.
                tests:
                  - HtmlEquivalenceChecker_Check_TrailingWhitespaceOnly_Equivalent

              - id: LintMark-Safety-HtmlEquivalenceChecker-DetectsLostHardBreak
                title: >-
                  The HtmlEquivalenceChecker class shall treat two texts as different when a hard break is lost.
                justification: |
                  A hard break is a visible line break. Dropping the two trailing spaces that make it damages
                  the document without any visible sign in the source.
                tests:
                  - HtmlEquivalenceChecker_Check_HardBreakDropped_Different

              - id: LintMark-Safety-HtmlEquivalenceChecker-DetectsBreakCreatingList
                title: >-
                  The HtmlEquivalenceChecker class shall treat two texts as different when a line break makes
                  the text after it a list item.
                justification: |
                  Wrapping a paragraph in front of a list marker turns prose into a list. Missing this would let
                  the tool write the damage.
                tests:
                  - HtmlEquivalenceChecker_Check_BreakCreatesList_Different

              - id: LintMark-Safety-HtmlEquivalenceChecker-DetectsBreakCreatingHeading
                title: >-
                  The HtmlEquivalenceChecker class shall treat two texts as different when a line break makes
                  the text after it a heading.
                justification: |
                  Wrapping a paragraph in front of a heading marker turns prose into a heading. Missing this
                  would let the tool write the damage.
                tests:
                  - HtmlEquivalenceChecker_Check_BreakCreatesHeading_Different

              - id: LintMark-Safety-HtmlEquivalenceChecker-DetectsChangedLinkDestination
                title: >-
                  The HtmlEquivalenceChecker class shall treat two texts as different when the destination of a
                  link is changed.
                justification: |
                  The destination of a link is part of the rendered document, and a rewrite that changes it
                  sends the reader somewhere else.
                tests:
                  - HtmlEquivalenceChecker_Check_LinkUrlChanged_Different

              - id: LintMark-Safety-HtmlEquivalenceChecker-DetectsLostEmphasis
                title: >-
                  The HtmlEquivalenceChecker class shall treat two texts as different when emphasis is lost.
                justification: |
                  Emphasis is visible to a reader, and a rewrite that drops it changes how the document reads.
                tests:
                  - HtmlEquivalenceChecker_Check_EmphasisLost_Different

              - id: LintMark-Safety-HtmlEquivalenceChecker-DetectsGluedWords
                title: >-
                  The HtmlEquivalenceChecker class shall treat two texts as different when words, also words in
                  neighboring inline elements, are glued together.
                justification: |
                  A rewrite that joins two words changes what the document says, also when the words are in
                  separate emphasized or inline HTML elements.
                tests:
                  - HtmlEquivalenceChecker_Check_GluedWords_Different
                  - HtmlEquivalenceChecker_Check_EmphasisSpacingLost_Different
                  - HtmlEquivalenceChecker_Check_LostInlineTagSpace_Different
                  - HtmlEquivalenceChecker_Check_InlineTagWhitespaceChanged_Different

              - id: LintMark-Safety-HtmlEquivalenceChecker-CodeSpanExact
                title: >-
                  The HtmlEquivalenceChecker class shall compare the content of a code span character by
                  character.
                justification: |
                  Whitespace in code is part of its meaning, and a formatter must never touch it.
                tests:
                  - HtmlEquivalenceChecker_Check_CodeSpanDoubleSpaceCollapsed_Different

              - id: LintMark-Safety-HtmlEquivalenceChecker-FencedCodeExact
                title: >-
                  The HtmlEquivalenceChecker class shall compare the content of fenced code character by
                  character.
                justification: |
                  Whitespace in code is part of its meaning, and a formatter must never touch it.
                tests:
                  - HtmlEquivalenceChecker_Check_FencedCodeChanged_Different

              - id: LintMark-Safety-HtmlEquivalenceChecker-PreformattedHtmlExact
                title: >-
                  The HtmlEquivalenceChecker class shall compare the content of a preformatted raw HTML element
                  character by character.
                justification: |
                  Whitespace in a preformatted element is part of what it shows, and a formatter must never
                  touch it.
                tests:
                  - HtmlEquivalenceChecker_Check_RawHtmlPreWhitespaceChanged_Different

              - id: LintMark-Safety-HtmlEquivalenceChecker-ElementNameCaseInsensitive
                title: >-
                  The HtmlEquivalenceChecker class shall recognize the name of a verbatim raw HTML element in
                  any letter case.
                justification: |
                  The element names of raw HTML are written in any letter case, and an element that is written
                  in upper case must stay exact as well.
                tests:
                  - HtmlEquivalenceChecker_Check_UppercasePreWhitespaceChanged_Different

              - id: LintMark-Safety-HtmlEquivalenceChecker-UnclosedElementExact
                title: >-
                  The HtmlEquivalenceChecker class shall compare the text that follows the opening tag of a
                  verbatim raw HTML element that is never closed, up to the end of the text, character by
                  character.
                justification: |
                  An element that is never closed still runs to the end of the text, so the whitespace in it
                  is as visible as it is in a closed element.
                tests:
                  - HtmlEquivalenceChecker_Check_UnclosedPreWhitespaceChanged_Different
                  - HtmlEquivalenceChecker_Check_UnclosedCodeWhitespaceChanged_Different

              - id: LintMark-Safety-HtmlEquivalenceChecker-ScriptStyleTextareaExact
                title: >-
                  The HtmlEquivalenceChecker class shall compare the content of script, style, and textarea raw
                  HTML elements character by character.
                justification: |
                  Whitespace in a script, a style sheet, or a text area is part of what it says or shows, and
                  a formatter must never touch it.
                tests:
                  - HtmlEquivalenceChecker_Check_ScriptStyleTextareaWhitespaceChanged_Different

              - id: LintMark-Safety-HtmlEquivalenceChecker-VerbatimHeadingIdsExact
                title: >-
                  The HtmlEquivalenceChecker class shall compare the content of a verbatim raw HTML element,
                  including any tag and attribute written inside it (such as a heading identifier), character
                  by character.
                justification: |
                  The content of a preformatted element, a script, a style sheet, or a text area is content and
                  must stay exact; a tag written inside it is only text.
                tests:
                  - HtmlEquivalenceChecker_Check_HeadingIdInsidePreChanged_Different
                  - HtmlEquivalenceChecker_Check_AttributeInsideVerbatimElementChanged_Different

              - id: LintMark-Safety-HtmlEquivalenceChecker-HtmlWhitespaceCollapsed
                title: >-
                  The HtmlEquivalenceChecker class shall treat a tab, a line feed, and a form feed outside
                  verbatim elements as the same whitespace as a space.
                justification: |
                  HTML itself collapses every run of these characters to one space, so a change between them
                  cannot be seen by a reader.
                tests:
                  - HtmlEquivalenceChecker_Check_TabAndFormFeedCollapsed_Equivalent

              - id: LintMark-Safety-HtmlEquivalenceChecker-InlineWhitespaceSignificant
                title: >-
                  The HtmlEquivalenceChecker class shall treat a no-break space that is replaced by another
                  character as a difference.
                justification: |
                  A no-break space is visible to a reader and to a browser, while ordinary whitespace runs
                  are not. Collapsing more than HTML does would hide real changes.
                tests:
                  - HtmlEquivalenceChecker_Check_NoBreakSpaceChanged_Different

              - id: LintMark-Safety-HtmlEquivalenceChecker-ReportsFirstDifference
                title: >-
                  The HtmlEquivalenceChecker class shall describe the first difference that it finds with the
                  text around it.
                justification: |
                  The author must be able to find what the tool objected to without comparing two
                  documents by hand.
                tests:
                  - HtmlEquivalenceChecker_Check_FirstDifference_DescribedWithContext

              - id: LintMark-Safety-HtmlEquivalenceChecker-DescriptionIsOneBoundedLine
                title: >-
                  The HtmlEquivalenceChecker class shall describe a difference in one line of bounded length,
                  however long the texts are.
                justification: |
                  A refusal is reported in a format with one line per finding, and a description that spanned
                  several lines or grew with the texts would break it.
                tests:
                  - HtmlEquivalenceChecker_Check_Difference_DescriptionIsSingleLineAndBounded

              - id: LintMark-Safety-HtmlEquivalenceChecker-LinearTime
                title: >-
                  The HtmlEquivalenceChecker class shall complete its comparison in time that grows linearly with
                  the size of the texts, also for text with a very large number of unclosed tags (verbatim and
                  block-level), of tags with attributes, of tags whose quote or comment never ends, and for
                  text with a very large number of code spans.
                justification: |
                  A hostile or damaged document must not be able to stall a run in the way that a
                  pattern with backtracking could.
                tests:
                  - HtmlEquivalenceChecker_Check_PathologicalUnclosedTags_CompletesWithinBound
                  - HtmlEquivalenceChecker_Check_ManyVerbatimElements_CompletesWithinBound
                  - HtmlEquivalenceChecker_Check_ManyTagsWithAttributes_CompletesWithinBound
                  - HtmlEquivalenceChecker_Check_ManyUnterminatedQuotedTags_CompletesWithinBound

              - id: LintMark-Safety-HtmlEquivalenceChecker-FailsClosed
                title: >-
                  The HtmlEquivalenceChecker class shall report a difference, and name the kind of failure, when
                  the comparison of two different texts cannot be completed.
                justification: |
                  A comparison that could not be completed gives no evidence that the page is unchanged, so
                  the rewrite must be refused instead of allowed.
                tests:
                  - HtmlEquivalenceChecker_Check_RendererThrows_ReportsDifferenceNamingExceptionType

              - id: LintMark-Safety-HtmlEquivalenceChecker-ThreadSafe
                title: >-
                  The HtmlEquivalenceChecker class shall give the same result for the same texts when it is called
                  from several threads at once as when it is called one after another.
                justification: |
                  Files are checked in parallel, and a verdict that depended on timing could not be trusted.
                tests:
                  - HtmlEquivalenceChecker_Check_ParallelCalls_SameResult

              - id: LintMark-Safety-HtmlEquivalenceChecker-RejectsMissingText
                title: The HtmlEquivalenceChecker class shall refuse a missing text.
                justification: |
                  A missing text is a programming error that must be reported as such. Comparing it would give
                  a verdict about a document that does not exist.
                tests:
                  - HtmlEquivalenceChecker_Check_NullArguments_Throw

              - id: LintMark-Safety-HtmlEquivalenceChecker-RejectsCarriageReturn
                title: >-
                  The HtmlEquivalenceChecker class shall refuse a text that contains a carriage return when it is
                  asked to compare normalized text.
                justification: |
                  Normalized text is compared with normalized line endings, because a carriage return changes
                  how some constructs render. Comparing anything else would give a verdict about a different
                  document. Texts with their real line endings are compared on request, see the requirement
                  for comparing line endings.
                tests:
                  - HtmlEquivalenceChecker_Check_CarriageReturnInBefore_Throws
                  - HtmlEquivalenceChecker_Check_CarriageReturnInAfter_Throws

              - id: LintMark-Safety-HtmlEquivalenceChecker-ComparesLineEndings
                title: >-
                  The HtmlEquivalenceChecker class shall, when asked to compare texts with the line endings they
                  have on disk, report a difference when the two line ending styles render to different HTML.
                justification: |
                  The renderer shows a multi-line code span differently for CRLF and LF text, so converting the
                  line endings of a file can change its page. Only a comparison that keeps the real line endings
                  can show that.
                tests:
                  - HtmlEquivalenceChecker_CheckOnDisk_CrlfVersusLfCodeSpan_Different
                  - HtmlEquivalenceChecker_CheckOnDisk_TextChangedWithCrlf_Different

              - id: LintMark-Safety-HtmlEquivalenceChecker-ComparesLineEndingsEquivalent
                title: >-
                  The HtmlEquivalenceChecker class shall, when asked to compare texts with the line endings they
                  have on disk, report no difference when the two line ending styles render to the same HTML.
                justification: |
                  Most documents render the same with either line ending, and converting them must not be
                  refused.
                tests:
                  - HtmlEquivalenceChecker_CheckOnDisk_CrlfVersusLfOrdinaryText_Equivalent
                  - HtmlEquivalenceChecker_CheckOnDisk_IdenticalTextRendererThrows_StillEquivalent

              - id: LintMark-Safety-HtmlEquivalenceChecker-ComparesLineEndingsFailsClosed
                title: >-
                  The HtmlEquivalenceChecker class shall report a difference, and name the kind of failure, when
                  the comparison of two different texts with their line endings cannot be completed.
                justification: |
                  A comparison that could not be completed gives no evidence that the page is unchanged, so
                  the rewrite must be refused instead of allowed.
                tests:
                  - HtmlEquivalenceChecker_CheckOnDisk_RendererThrows_ReportsDifferenceNamingExceptionType

              - id: LintMark-Safety-HtmlEquivalenceChecker-ComparesLineEndingsRejectsMissingText
                title: The HtmlEquivalenceChecker class shall refuse a missing text when it compares line endings.
                justification: |
                  A missing text is a programming error that must be reported as such. Comparing it would give
                  a verdict about a document that does not exist.
                tests:
                  - HtmlEquivalenceChecker_CheckOnDisk_NullArguments_Throw
