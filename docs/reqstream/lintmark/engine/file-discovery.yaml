---
# Software Unit Requirements for the FileDiscovery Unit
#
# FileDiscovery expands the path arguments of a run into the Markdown files to process and decides whether the
# ignore patterns of a configuration skip a file.

sections:
  - title: LintMark Requirements
    sections:
      - title: Engine Requirements
        sections:
          - title: FileDiscovery Requirements
            requirements:
              - id: LintMark-Engine-FileDiscovery-Selection
                title: >-
                  The FileDiscovery unit shall expand file paths, directories, and glob patterns into the Markdown
                  files to process, and shall use every Markdown file below the current directory when no path is given.
                justification: |
                  Users name files in the way that suits them: one file, a whole folder, or a pattern. Without
                  arguments the tool must still know what to check.
                children:
                  - LintMark-OTS-FileSystemGlobbing-Match
                tests:
                  - FileDiscovery_Discover_ExplicitFile_IsNotSubjectToDefaultExcludesOrExtension
                  - FileDiscovery_Discover_Directory_ReturnsMarkdownFilesBeneathIt
                  - FileDiscovery_Discover_RecursiveGlob_ReturnsMatchingFiles
                  - FileDiscovery_Discover_SingleSegmentGlob_DoesNotDescend
                  - FileDiscovery_Discover_NoArguments_UsesDefaultPatternAndAppliesBuiltInExcludes
                  - FileDiscovery_Discover_MissingLiteralPath_PassesThrough

              - id: LintMark-Engine-FileDiscovery-Exclusions
                title: >-
                  The FileDiscovery unit shall remove every file matched by a `!` exclusion, including a file named
                  explicitly, and shall report whether a file lies under the ignore patterns of a configuration.
                justification: |
                  Users need to leave out generated or vendored documents, and a pattern that says "not this file"
                  must hold even when the same file was also named. The ignore patterns of a configuration are
                  judged relative to the directory of that configuration.
                tests:
                  - FileDiscovery_Discover_ExcludeGlob_RemovesMatches
                  - FileDiscovery_Discover_ExcludeDirectoryName_RemovesEverythingBeneath
                  - FileDiscovery_Discover_ExcludeMatchingExplicitFile_RemovesIt
                  - FileDiscovery_IsIgnored_PatternMatch_True
                  - FileDiscovery_IsIgnored_PatternRelativeToConfigDirectory_Matches
                  - FileDiscovery_IsIgnored_FileOutsideRoot_False

              - id: LintMark-Engine-FileDiscovery-SkippedFolders
                title: >-
                  The FileDiscovery unit shall skip `node_modules` and `.git` folders during directory and glob
                  expansion, except for files that the user names explicitly.
                justification: |
                  Dependency and repository-internal folders hold files that are not the user's documents, but a file
                  that the user names on purpose must still be checked.
                tests:
                  - FileDiscovery_Discover_DirectoryAndGlob_SkipNodeModulesAndGit
                  - FileDiscovery_Discover_NodeModulesDirectoryArgument_ReturnsNothing
                  - FileDiscovery_Discover_GlobRootedInNodeModules_ReturnsNothing
                  - FileDiscovery_Discover_DirectoryAndExplicitFileInNodeModules_ReturnsOnlyTheFile
                  - FileDiscovery_Discover_BaseDirectoryInsideNodeModules_StillFindsItsFiles

              - id: LintMark-Engine-FileDiscovery-DistinctOrdered
                title: >-
                  The FileDiscovery unit shall return each file once, in path order, matching file names with the case
                  rules of the platform.
                justification: |
                  Overlapping arguments must not process or report a file twice, and a stable order keeps the output
                  of a run reproducible. Case rules differ between platforms, so the platform decides.
                children:
                  - LintMark-OTS-FileSystemGlobbing-CaseSensitivity
                tests:
                  - FileDiscovery_Discover_OverlappingArguments_ReturnsDistinctFiles
                  - FileDiscovery_Discover_GlobCase_FollowsPlatformComparison
                  - FileDiscovery_Discover_CaseVariantSpellings_ReturnSameSpellingForAnyOrder
                  - FileDiscovery_IsIgnored_CaseRules_FollowPlatform
