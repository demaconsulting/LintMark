---
# Software Unit Requirements for the LintMarkEngine Class
#
# The LintMarkEngine class processes the selected files, rewrites them when asked to, and reports problems
# deterministically through the Context.

sections:
  - title: LintMark Requirements
    sections:
      - title: Engine Requirements
        sections:
          - title: LintMarkEngine Requirements
            requirements:
              - id: LintMark-Engine-LintMarkEngine-ProcessEach
                title: The LintMarkEngine class shall read and parse every selected file.
                justification: |
                  Reading and parsing every selected file is the work of the tool.
                tests:
                  - LintMarkEngine_Process_ValidFiles_ReturnsNoFailures
                  - LintMarkEngine_Run_CheckFlag_BehavesLikeDefault

              - id: LintMark-Engine-LintMarkEngine-IsolatedFailures
                title: The LintMarkEngine class shall continue with the remaining files when one file fails.
                justification: |
                  A defect or damaged content in one file must not hide the state of the rest of a
                  documentation set.
                tests:
                  - LintMarkEngine_Process_ParserThrows_ReportsParseErrorForThatFileOnly
                  - LintMarkEngine_Process_MissingFile_ReportsReadError

              - id: LintMark-Engine-LintMarkEngine-SilentOnSuccess
                title: >-
                  The LintMarkEngine class shall report nothing for files that succeed, including when no file is
                  selected.
                justification: |
                  Silence on success keeps the output of large runs readable, and an empty selection is a
                  valid outcome.
                tests:
                  - LintMarkEngine_Process_NoFiles_ReturnsEmpty
                  - LintMarkEngine_Run_ValidFiles_WritesNothingAndExitsZero
                  - LintMarkEngine_Run_GlobWithoutMatches_WritesNothingAndExitsZero

              - id: LintMark-Engine-LintMarkEngine-ReadFailure
                title: >-
                  The LintMarkEngine class shall report a file that does not exist, is denied, or cannot be read
                  as a read failure at line 1 and column 1 with a message that says what went wrong.
                justification: |
                  Users must be able to distinguish a mistyped or inaccessible path from a problem in a
                  file's content, and the report must not stop the processing of other files.
                tests:
                  - LintMarkEngine_Process_MissingFile_ReportsReadError
                  - LintMarkEngine_Process_DirectoryAsFile_ReportsReadError
                  - LintMarkEngine_Run_MissingExplicitFile_ReportsReadError

              - id: LintMark-Engine-LintMarkEngine-EncodingFailure
                title: >-
                  The LintMarkEngine class shall report a file whose bytes are not valid UTF-8, or that begins
                  with a UTF-16 or UTF-32 byte order mark, as an encoding failure at the position of the
                  problem.
                justification: |
                  Damaged or unsupported files must be named with enough precision to repair them, rather
                  than being read incorrectly.
                tests:
                  - LintMarkEngine_Process_InvalidUtf8_ReportsEncodingError
                  - LintMarkEngine_Process_Utf16File_ReportsEncodingError

              - id: LintMark-Engine-LintMarkEngine-LineEndingFailure
                title: >-
                  The LintMarkEngine class shall report a file with a carriage return that is not part of a CRLF
                  line ending as a line-ending failure at the position of the carriage return.
                justification: |
                  Only LF and CRLF line endings can be restored faithfully, so a bare carriage return must be
                  named with enough precision to repair it.
                tests:
                  - LintMarkEngine_Process_LoneCr_ReportsLineEndingError

              - id: LintMark-Engine-LintMarkEngine-ProcessingFailure
                title: >-
                  The LintMarkEngine class shall report a file whose processing fails unexpectedly as a failure of
                  that file at line 1 and column 1, naming the kind of failure.
                justification: |
                  A defect triggered by one file's content must be reported against that file and must
                  not abort a run over a whole documentation set.
                tests:
                  - LintMarkEngine_Process_ParserThrows_ReportsParseErrorForThatFileOnly
                  - LintMarkEngine_Run_ParserFailure_ReportsParseError

              - id: LintMark-Engine-LintMarkEngine-FailureFormat
                title: >-
                  The LintMarkEngine class shall write each problem on its own line as `path:line:col: rule-id
                  message` through the error output of the Context, with the path relative to the current
                  directory using forward slashes.
                justification: |
                  A single, regular format is machine readable and recognized by editors and build
                  systems. Relative paths with one separator style make output the same on every platform.
                tests:
                  - LintMarkEngine_Run_Failures_WritesFormattedLinesInPathOrder

              - id: LintMark-Engine-LintMarkEngine-FailureOrderWithinFile
                title: The LintMarkEngine class shall list the problems of one file in order of position.
                justification: |
                  A reader fixing a file works from top to bottom, and a fixed order keeps output
                  reproducible.
                tests:
                  - LintMarkEngine_Run_MultipleFailuresInFile_AreOrderedByPosition

              - id: LintMark-Engine-LintMarkEngine-ExitStatus
                title: >-
                  The LintMarkEngine class shall leave the exit status at zero when no problem was reported and
                  make it non-zero when at least one problem was reported.
                justification: |
                  Scripts and build pipelines act on the exit status alone.
                tests:
                  - LintMarkEngine_Run_ValidFiles_WritesNothingAndExitsZero
                  - LintMarkEngine_Run_Failures_WritesFormattedLinesInPathOrder
                  - LintMarkEngine_Run_GlobWithoutMatches_WritesNothingAndExitsZero

              - id: LintMark-Engine-LintMarkEngine-OrderedResults
                title: >-
                  The LintMarkEngine class shall return and report results ordered by path regardless of the
                  order of its inputs, the number of files processed at once, and the order in which processing
                  finishes.
                justification: |
                  Output that depends on scheduling cannot be compared between runs or machines, and a
                  flaky order makes failures hard to reproduce.
                tests:
                  - LintMarkEngine_Process_InputOrder_DoesNotAffectResultOrder
                  - LintMarkEngine_Process_CompletionOrderInverted_ResultsStillPathSorted
                  - LintMarkEngine_Process_ParallelVersusSequential_ProduceIdenticalResults
                  - LintMarkEngine_Run_ConfigErrors_ParallelAndSequentialProduceIdenticalOutput

              - id: LintMark-Engine-LintMarkEngine-ImmutableResults
                title: >-
                  The LintMarkEngine class shall return file results whose lists of problems cannot be changed by
                  their holders.
                justification: |
                  Results are produced by parallel workers and consumed later by the reporter. A list that
                  anyone could modify would make the report depend on who touched it.
                tests:
                  - FileResult_Diagnostics_CastToMutableTypes_CannotBeModified
                  - LintMarkEngine_Process_DiagnosticsCastToMutableTypes_CannotBeModified

              - id: LintMark-Engine-LintMarkEngine-ConfigPerFile
                title: >-
                  The LintMarkEngine class shall give each file the settings of the configuration that applies to
                  it, with the built-in defaults when none applies.
                justification: |
                  Files in different folders can have different configurations, and a file for which no
                  configuration exists must still be processed.
                tests:
                  - LintMarkEngine_Process_Files_AttachDefaultConfig
                  - LintMarkEngine_Process_DiscoveredConfigs_EachFileGetsItsNearestConfig

              - id: LintMark-Engine-LintMarkEngine-ConfigIndependentOfScheduling
                title: >-
                  The LintMarkEngine class shall give each file the same settings regardless of the other files,
                  the order of processing, and the number of files processed at once.
                justification: |
                  The settings of one file must never leak into another, and scheduling must never be visible
                  in the result.
                tests:
                  - LintMarkEngine_Process_ParallelWithConfigs_EqualsSequential

              - id: LintMark-Engine-LintMarkEngine-ImmutableConfigResults
                title: >-
                  The LintMarkEngine class shall return file results whose configuration problem lists cannot be
                  changed by their holders.
                justification: |
                  The same problems are shared by every file that uses a configuration, and a list that
                  anyone could modify would make the report depend on who touched it.
                tests:
                  - LintMarkEngine_Process_ConfigErrors_CastToMutableTypes_CannotBeModified

              - id: LintMark-Engine-LintMarkEngine-ExplicitConfig
                title: >-
                  The LintMarkEngine class shall give every file the settings of the configuration file named on
                  the command line instead of a discovered configuration.
                justification: |
                  Naming a configuration file is a deliberate choice that overrides discovery.
                tests:
                  - LintMarkEngine_Process_ExplicitConfig_UsedInsteadOfDiscoveredConfig

              - id: LintMark-Engine-LintMarkEngine-ExplicitConfigProblems
                title: >-
                  The LintMarkEngine class shall report the problems of the configuration file named on the
                  command line even when no Markdown file is selected.
                justification: |
                  A configuration that cannot be used is a problem whether or not the selection happens to
                  contain files.
                tests:
                  - LintMarkEngine_Run_ExplicitConfigMissing_ReportsErrorEvenWithNoFiles

              - id: LintMark-Engine-LintMarkEngine-NoConfig
                title: >-
                  The LintMarkEngine class shall give every file the default configuration, unaffected by any
                  configuration file or editor settings however invalid or unreadable, when the no-config option
                  is given.
                justification: |
                  The option exists to run the tool exactly as shipped. Any configuration source that
                  influenced the result, or made it fail, would defeat that purpose.
                tests:
                  - LintMarkEngine_Run_NoConfig_InvalidConfigAndUnreadableEditorConfig_ReportsNothing
                  - LintMarkEngine_Process_NoEditorConfigResolver_EndOfLineStaysNull

              - id: LintMark-Engine-LintMarkEngine-ConfigErrorFormat
                title: >-
                  The LintMarkEngine class shall write each configuration problem on its own line as
                  `path:line:col: config-error message` through the error output of the Context.
                justification: |
                  Configuration problems share the regular line format of all other problems, so that editors
                  and build systems can read them.
                tests:
                  - LintMarkEngine_Run_InvalidConfig_ReportsErrorLineAndExitsOne

              - id: LintMark-Engine-LintMarkEngine-ConfigErrorPathDisplay
                title: >-
                  The LintMarkEngine class shall show the path of a configuration problem relative to the
                  current directory with forward slashes, also when the file lies outside the current directory.
                justification: |
                  The user must be able to open the named file from where the tool was run, whatever the
                  platform separator.
                tests:
                  - LintMarkEngine_Run_ExplicitConfigRelative_ReportedWithRelativeDisplayPath
                  - LintMarkEngine_Run_ConfigOutsideCurrentDirectory_ReportedWithParentRelativePath

              - id: LintMark-Engine-LintMarkEngine-ConfigErrorOnce
                title: >-
                  The LintMarkEngine class shall report a configuration problem once, however many files use the
                  configuration that has it.
                justification: |
                  One broken configuration used by hundreds of files would otherwise bury the report.
                tests:
                  - LintMarkEngine_Run_ConfigErrorSharedByManyFiles_ReportedOnce

              - id: LintMark-Engine-LintMarkEngine-ConfigErrorOrder
                title: >-
                  The LintMarkEngine class shall order configuration problems together with the other problems by
                  path and then by position.
                justification: |
                  Reproducible output is required for comparing runs and for stable build logs.
                tests:
                  - LintMarkEngine_Run_ConfigErrorsAndFileFailures_MergedInPathThenPositionOrder

              - id: LintMark-Engine-LintMarkEngine-ConfigErrorIsolation
                title: >-
                  The LintMarkEngine class shall read and check a file whose configuration is invalid, so that its
                  own read and decoding failures are still reported.
                justification: |
                  A configuration problem must not hide the state of the files themselves.
                tests:
                  - LintMarkEngine_Process_InvalidConfig_FileStillParsedAndConfigNull
                  - LintMarkEngine_Run_InvalidConfig_StillReportsFileReadFailures

              - id: LintMark-Engine-LintMarkEngine-ConfigErrorExitStatus
                title: >-
                  The LintMarkEngine class shall make the exit status non-zero when at least one configuration
                  problem was reported.
                justification: |
                  Scripts and build pipelines act on the exit status alone.
                tests:
                  - LintMarkEngine_Run_InvalidConfig_ReportsErrorLineAndExitsOne
                  - LintMarkEngine_Run_ExplicitConfigMissing_ReportsErrorEvenWithNoFiles

              - id: LintMark-Engine-LintMarkEngine-RegisteredRuleIds
                title: >-
                  The LintMarkEngine class shall report every problem under a rule identifier that the rule
                  registry lists.
                justification: |
                  Users look up a rule identifier in the documentation and use it to switch a rule off where
                  that is allowed. An identifier that is not registered could not be looked up.
                tests:
                  - LintMarkEngine_Run_EmittedRuleIds_AreRegisteredInRuleCatalog

              - id: LintMark-Engine-LintMarkEngine-FormatFailure
                title: >-
                  The LintMarkEngine class shall report a file whose formatting fails, because a rule fails or
                  proposes changes that cannot be applied, as a `file-format-error` problem at line 1 and column 1
                  and leave the file as it is.
                justification: |
                  A defect in one rule must not abort the run over a whole documentation set or damage the
                  file that triggered it.
                tests:
                  - LintMarkEngine_Run_FixFormatterThrows_ReportsFormatErrorAndLeavesFile
                  - LintMarkEngine_Process_FormatterThrows_ReportsFormatErrorAndNoChange
                  - LintMarkEngine_Run_FixOverlappingEdits_ReportsFormatError
                  - LintMarkEngine_Run_FixEditOutsideText_ReportsFormatError
                  - LintMarkEngine_Run_FixCarriageReturnInserted_ReportsFormatError

              - id: LintMark-Engine-LintMarkEngine-WriteFailure
                title: >-
                  The LintMarkEngine class shall report a file that cannot be written as a `file-write-error`
                  problem at line 1 and column 1, keep the problems of that file, and leave the file as it was.
                justification: |
                  A read-only file, a full disk, or a file that changed after it was read must be reported
                  and must not cost the user the file.
                tests:
                  - LintMarkEngine_Run_FixWriterThrows_ReportsWriteErrorKeepsFormattingDiagnostic
                  - LintMarkEngine_Run_FixOneWriteFails_OtherFilesStillWritten
                  - LintMarkEngine_Run_FixFileChangedAfterRead_ReportsWriteErrorAndLeavesFile

              - id: LintMark-Engine-LintMarkEngine-CapturesResolvedTarget
                title: >-
                  The LintMarkEngine class shall record the full path of the file that a path resolves to, with
                  symbolic links followed, when it reads the file, read the bytes from that file, and hand the
                  recorded path to the writer with the rewrite.
                justification: |
                  The identity of the file must be taken together with its bytes, at the time of the read. An
                  identity taken only when the write starts could not reveal a link that was redirected
                  after the read.
                tests:
                  - LintMarkEngine_Process_FormatterEditsApplied_ChangeHasNewBytes
                  - LintMarkEngine_Run_FixRegularFile_PassesResolvedTargetToWriter

              - id: LintMark-Engine-LintMarkEngine-RefuseRedirectedLink
                title: >-
                  The LintMarkEngine class shall report a file whose link was redirected to another file after
                  it was read as a `file-write-error` problem and leave both files as they were, also when both
                  hold the same bytes.
                justification: |
                  Rewriting a file that the rewrite was not computed from would damage it. The test needs
                  symbolic links, so only Linux and macOS runs count as evidence.
                tests:
                  - ubuntu@LintMarkEngine_Run_FixLinkRedirectedAfterRead_ReportsWriteErrorAndLeavesBothFiles
                  - macos@LintMarkEngine_Run_FixLinkRedirectedAfterRead_ReportsWriteErrorAndLeavesBothFiles

              - id: LintMark-Engine-LintMarkEngine-FixRewrites
                title: >-
                  The LintMarkEngine class shall write, when the fix option is given, the proposed rewrite of
                  each file that passed every safety check, in the line ending that the file should have.
                justification: |
                  This is what the fix option is for. The rewrite is the file with the proposed changes and
                  the chosen line endings, and nothing else.
                tests:
                  - LintMarkEngine_Run_FixCrlfFile_RewritesToLfAndReportsNothing
                  - LintMarkEngine_Run_FixTextChange_WritesSafeRewrite
                  - LintMarkEngine_Run_FixMixedFile_WritesMajorityEnding
                  - LintMarkEngine_Process_FormatterEditsApplied_ChangeHasNewBytes

              - id: LintMark-Engine-LintMarkEngine-FixLeavesCompliantFiles
                title: >-
                  The LintMarkEngine class shall not write a file whose rewrite would be identical to the file
                  as it is.
                justification: |
                  Touching files that need no change disturbs timestamps, file watchers, and builds that
                  depend on them.
                tests:
                  - LintMarkEngine_Run_FixCompliantFile_DoesNotTouchFile
                  - LintMarkEngine_Run_FixTwice_SecondRunLeavesFileAndReportsNothing

              - id: LintMark-Engine-LintMarkEngine-FixReportsRemaining
                title: >-
                  The LintMarkEngine class shall omit from its report, when the fix option is given, the problems
                  of a file that was written that rewriting removes, and keep every other problem.
                justification: |
                  A repaired problem is gone, while a problem that rewriting cannot remove must still fail
                  the run.
                tests:
                  - LintMarkEngine_Run_FixSuccessfulWrite_DropsFixedDiagnostics
                  - LintMarkEngine_Run_FixCrlfFile_RewritesToLfAndReportsNothing

              - id: LintMark-Engine-LintMarkEngine-FixKeepsByteOrderMark
                title: >-
                  The LintMarkEngine class shall write a rewritten file with the byte order mark that it had.
                justification: |
                  The byte order mark is not text, so a rewrite of the text must not add or remove it.
                tests:
                  - LintMarkEngine_Run_FixBomCrlfFile_KeepsBomAndConvertsEndings

              - id: LintMark-Engine-LintMarkEngine-FixDeterministic
                title: >-
                  The LintMarkEngine class shall write the same files with the same content whether the files are
                  processed one at a time or concurrently.
                justification: |
                  A rewrite that depended on scheduling could not be reviewed or trusted.
                tests:
                  - LintMarkEngine_Run_FixParallelAndSequential_ProduceIdenticalOutputAndFiles

              - id: LintMark-Engine-LintMarkEngine-DiffOutput
                title: >-
                  The LintMarkEngine class shall write, when the diff option is given, the unified diff of the
                  rewrite of each file that passed every safety check, and nothing for a file that would not change.
                justification: |
                  The diff shows what the fix option would write, so it covers exactly the same files and
                  changes.
                tests:
                  - LintMarkEngine_Run_DiffCrlfFile_PrintsDiffAndWritesNothing
                  - LintMarkEngine_Run_DiffCompliantFile_PrintsNothing
                  - LintMarkEngine_Run_DiffTextChange_PrintsHunkAndWritesNothing

              - id: LintMark-Engine-LintMarkEngine-NoWriteWithoutFix
                title: >-
                  The LintMarkEngine class shall write no file when the fix option is not given, whatever the
                  problems found, while still reporting what the fix option would do.
                justification: |
                  Checking and previewing must be safe on any files, and the problems they report should
                  predict what the fix option does.
                tests:
                  - LintMarkEngine_Run_CheckCrlfFile_ReportsLineEndingAndWritesNothing
                  - LintMarkEngine_Run_CheckMixedFile_ReportsMixedLineEndings
                  - LintMarkEngine_Run_CheckBrokenFormatter_ReportsSafetyDiagnostic
                  - LintMarkEngine_Run_CheckFlag_BehavesLikeDefault

              - id: LintMark-Engine-LintMarkEngine-LineEndingFromConfiguration
                title: >-
                  The LintMarkEngine class shall give the formatting of a file the line ending of its
                  configuration, without consulting the editor settings.
                justification: |
                  The tool's own configuration is the more specific source and wins over shared editor
                  settings.
                tests:
                  - LintMarkEngine_Process_ConfigEndOfLine_WinsOverEditorConfig
                  - LintMarkEngine_Process_ConfigEndOfLine_EditorConfigNotConsulted
                  - LintMarkEngine_Run_FixConfigCrlf_WritesCrlf

              - id: LintMark-Engine-LintMarkEngine-LineEndingFromEditorSettings
                title: >-
                  The LintMarkEngine class shall give the formatting of a file the line ending of the editor
                  settings that apply to it when its configuration gives none, also when the configuration comes
                  from a file named on the command line.
                justification: |
                  Many projects state their line ending only in their editor settings, and a named
                  configuration file that says nothing about line endings must not hide them.
                tests:
                  - LintMarkEngine_Process_ConfigSilent_FallsBackToEditorConfig
                  - LintMarkEngine_Process_ExplicitConfig_StillConsultsEditorConfig
                  - LintMarkEngine_Run_ExplicitConfig_StillConsultsEditorConfig
                  - LintMarkEngine_Run_FixEditorConfigCrlf_WritesCrlf

              - id: LintMark-Engine-LintMarkEngine-LineEndingUnspecified
                title: >-
                  The LintMarkEngine class shall leave the line ending of a file unspecified when neither its
                  configuration nor the editor settings give one that the tool can use.
                justification: |
                  An unspecified line ending lets the file keep the one that most of its lines use, instead of
                  being converted to a default that nobody chose.
                tests:
                  - LintMarkEngine_Process_EditorConfigCr_EndOfLineStaysNull
                  - LintMarkEngine_Process_NeitherSpecifiesEndOfLine_StaysNull

              - id: LintMark-Engine-LintMarkEngine-EditorSettingsProblems
                title: >-
                  The LintMarkEngine class shall report editor settings that apply to a Markdown file but cannot
                  be read as one configuration problem at line 1 and column 1 of that Markdown file, and keep the
                  configuration of the file.
                justification: |
                  The only place that the tool can point to is the Markdown file, because the settings file
                  may be unreadable as a whole, and the rest of the configuration is still valid.
                tests:
                  - LintMarkEngine_Process_EditorConfigUnreadable_AddsConfigErrorAtMarkdownFileAndKeepsConfig
                  - LintMarkEngine_Run_EditorConfigUnreadable_ReportsConfigErrorAtMarkdownFile

              - id: LintMark-Engine-LintMarkEngine-NeverRewriteInvalidConfiguration
                title: >-
                  The LintMarkEngine class shall neither format nor rewrite a file whose configuration is
                  invalid or whose editor settings cannot be read, while still reading it and reporting its own
                  problems.
                justification: |
                  The style that the file should get is not known, and guessing it could rewrite the
                  document in a style that nobody chose.
                tests:
                  - LintMarkEngine_Process_InvalidConfig_NeverFormatted
                  - LintMarkEngine_Run_FixInvalidConfig_NeverRewritesFile
                  - LintMarkEngine_Process_EditorConfigUnreadable_NeverFormatted
                  - LintMarkEngine_Run_FixEditorConfigUnreadable_NeverRewritesFile
                  - LintMarkEngine_Process_InvalidConfigIgnoreUnknown_FileProcessedNotFormatted
                  - LintMarkEngine_Run_IgnoreInvalidConfig_ProcessedButNeverFormatted

              - id: LintMark-Engine-LintMarkEngine-RefuseHtmlChange
                title: >-
                  The LintMarkEngine class shall refuse to rewrite a file when the proposed rewrite would change
                  how the document renders as HTML, report it as a `safety-html-mismatch` problem at the first
                  line that differs, and leave the file as it is.
                justification: |
                  A rewrite that changes how a document renders has changed its meaning.
                tests:
                  - LintMarkEngine_Run_FixHardBreakDropped_RefusesWithHtmlMismatch
                  - LintMarkEngine_Process_HardBreakFormatter_SetsHtmlMismatchAndNoChange

              - id: LintMark-Engine-LintMarkEngine-RefuseLineEndingHtmlChange
                title: >-
                  The LintMarkEngine class shall refuse to rewrite a file when the proposed rewrite, also one that
                  only changes the line endings, would change how the document renders as HTML with the line
                  endings it has on disk, report it as a `safety-html-mismatch` problem, and leave the file as it
                  is.
                justification: |
                  The renderer shows some text, such as a code span that spans lines, differently for CRLF and LF,
                  so converting the line endings can change what a reader sees. The tool must never write a file
                  whose rendering changes, whatever the reason.
                tests:
                  - LintMarkEngine_Run_FixCodeSpanLineEndingChange_RefusesWithHtmlMismatchAndLeavesFile
                  - LintMarkEngine_Run_CheckCodeSpanLineEndingChange_ReportsHtmlMismatchAndWritesNothing
                  - LintMarkEngine_Process_CodeSpanLineEndingChange_SetsHtmlMismatchAndNoChange

              - id: LintMark-Engine-LintMarkEngine-AllowsHarmlessLineEndingChange
                title: >-
                  The LintMarkEngine class shall write a rewrite that only changes the line endings of a file
                  when the document renders as the same HTML with both line endings.
                justification: |
                  Most documents render the same with either line ending, and the fix option must still
                  convert them.
                tests:
                  - LintMarkEngine_Run_FixOrdinaryLineEndingChange_StillWritten

              - id: LintMark-Engine-LintMarkEngine-RefuseStructureChange
                title: >-
                  The LintMarkEngine class shall refuse to rewrite a file when the proposed rewrite would change
                  its Pandoc structure, report it as a `safety-structure-mismatch` problem at the first line that
                  differs, and leave the file as it is.
                justification: |
                  Constructs that the HTML rendering cannot show, such as fences with attributes or page
                  breaks, still matter to the documents that are built from the file.
                tests:
                  - LintMarkEngine_Run_FixFencesJoined_RefusesWithStructureMismatch
                  - LintMarkEngine_Process_JoiningFormatter_SetsStructureMismatchAndNoChange

              - id: LintMark-Engine-LintMarkEngine-RefuseUnstableFormatting
                title: >-
                  The LintMarkEngine class shall refuse to rewrite a file when formatting the rewritten text
                  again would change it, report it as a `safety-not-idempotent` problem at the first line that
                  differs, and leave the file as it is.
                justification: |
                  A rewrite that changes again each time it is applied would keep modifying the file and
                  could never pass a check.
                tests:
                  - LintMarkEngine_Run_FixFlipFlopFormatter_RefusesWithNotIdempotent
                  - LintMarkEngine_Run_FixGrowingFormatter_RefusesWithNotIdempotent
                  - LintMarkEngine_Process_FlipFlopFormatter_SetsNotIdempotentAndNoChange

              - id: LintMark-Engine-LintMarkEngine-RefuseUnreadableResult
                title: >-
                  The LintMarkEngine class shall refuse to rewrite a file when the proposed rewrite would create
                  a line that looks like the border of a grid table without being part of a valid grid table,
                  report it as a `safety-structure-mismatch` problem, and leave the file as it is.
                justification: |
                  Such a document is one that the tool refuses to rewrite, and the rendered output does
                  not show the damage.
                tests:
                  - LintMarkEngine_Run_FixGridBorderCreated_RefusesAndLeavesFile
                  - LintMarkEngine_Run_FixRewriteReadAsFallback_RefusesWithStructureMismatch

              - id: LintMark-Engine-LintMarkEngine-RefuseUndecidedCheck
                title: >-
                  The LintMarkEngine class shall refuse to rewrite a file when a safety check cannot be
                  completed, report it as a problem of that check that says the check failed, and leave the
                  file as it is.
                justification: |
                  A check that could not be completed gives no evidence that the rewrite is safe, so the
                  rewrite must be refused instead of allowed, and the file must stay as it is.
                tests:
                  - LintMarkEngine_Run_FixReparseThrows_RefusesWithCheckFailedAndLeavesFile
                  - LintMarkEngine_Process_ReparseThrows_SetsStructureMismatchAndNoChange
                  - LintMarkEngine_Run_FixIdempotencyParseThrows_RefusesWithNotIdempotentAndLeavesFile

              - id: LintMark-Engine-LintMarkEngine-ValidatesResultTypes
                title: >-
                  The FileResult and FileChange records shall refuse a missing or empty path, missing text,
                  a missing or blank resolved target, missing or default lists of findings or bytes, a missing
                  finding, and a line ending that is not defined, and shall expose the values that they were
                  created with.
                justification: |
                  Results travel from the workers to the writer and the reporters, and a rewrite is written
                  from a change. An incomplete value would fail far from where it was made, or damage a file,
                  so it must never exist.
                tests:
                  - FileResult_Constructor_ValidArguments_KeepsValues
                  - FileResult_Constructor_MissingPath_Throws
                  - FileResult_Constructor_InvalidDiagnostics_Throws
                  - FileChange_Constructor_ValidArguments_KeepsValues
                  - FileChange_Constructor_NullText_Throws
                  - FileChange_Constructor_DefaultBytes_Throws
                  - FileChange_Constructor_UndefinedLineEnding_Throws
                  - FileChange_Constructor_MissingResolvedTarget_Throws

              - id: LintMark-Engine-LintMarkEngine-IsolatedRefusals
                title: >-
                  The LintMarkEngine class shall still write the files that are safe to rewrite when other files
                  are refused or cannot be written.
                justification: |
                  A problem in one file must not stop the repair of the others, and must not be
                  hidden by their repair.
                tests:
                  - LintMarkEngine_Run_FixSafeFileNextToRefusedFile_StillWritten
                  - LintMarkEngine_Run_FixOneWriteFails_OtherFilesStillWritten

              - id: LintMark-Engine-LintMarkEngine-GridFallbackReported
                title: >-
                  The LintMarkEngine class shall report a document that the parser flagged as unsafe to rewrite
                  because of an invalid grid table as a `grid-table-invalid` problem at the line that the parser
                  located, unless that rule is switched off or suppressed at that line, and shall report nothing
                  for a document whose grid tables are valid.
                justification: |
                  The author must be told which line to repair, may switch the report off or suppress it,
                  and must not be bothered about valid tables.
                tests:
                  - LintMarkEngine_Run_CheckGridFallbackDocument_ReportsOffendingLineAndExitsOne
                  - LintMarkEngine_Run_FixGridFallbackRuleDisabled_NoDiagnosticStillUntouched
                  - LintMarkEngine_Run_FixGridFallbackSuppressed_NoDiagnosticStillUntouched
                  - LintMarkEngine_Run_FixValidGridTable_FormattedNormallyNoDiagnostic

              - id: LintMark-Engine-LintMarkEngine-GridFallbackNeverRewritten
                title: >-
                  The LintMarkEngine class shall neither format nor rewrite a document that the parser flagged
                  as unsafe to rewrite because of an invalid grid table, whether or not the problem is reported.
                justification: |
                  Switching the report off must not switch off the protection.
                tests:
                  - LintMarkEngine_Run_FixGridFallbackDocument_ByteIdenticalAndGridDiagnostic
                  - LintMarkEngine_Process_GridFallbackDocument_HasNoChangeAndGridDiagnostic
                  - LintMarkEngine_Run_FixGridFallbackRuleDisabled_NoDiagnosticStillUntouched
                  - LintMarkEngine_Run_FixGridFallbackSuppressed_NoDiagnosticStillUntouched

              - id: LintMark-Engine-LintMarkEngine-IgnoredFilesSkipped
                title: >-
                  The LintMarkEngine class shall skip a file that was selected by a directory, a glob, or the
                  default selection and that matches an `ignore` pattern of its configuration, without reading
                  it, reporting anything for it, or rewriting it.
                justification: |
                  A file that the project does not format must not cost time or produce reports, and a
                  missing or damaged file that is skipped is not a problem.
                tests:
                  - LintMarkEngine_Process_IgnoredFile_NotReadAndMarkedIgnored
                  - LintMarkEngine_Process_IgnoredFileWithMissingContent_NoReadError
                  - LintMarkEngine_Run_IgnoreGlobSelected_SkipsMatches
                  - LintMarkEngine_Run_IgnoreDirectorySelected_SkipsMatches
                  - LintMarkEngine_Run_IgnoreDefaultSelection_SkipsDefaultPatterns
                  - LintMarkEngine_Run_IgnoreNoConfig_DefaultStillApplies
                  - LintMarkEngine_Run_IgnoreExcludeOnCommandLine_BothApply

              - id: LintMark-Engine-LintMarkEngine-IgnorePerConfiguration
                title: >-
                  The LintMarkEngine class shall apply the `ignore` patterns of the configuration that applies to
                  each file, relative to the directory of that configuration file, and never ignore a file that
                  lies outside that directory.
                justification: |
                  Different folders can have different configurations, and a pattern written in a
                  configuration file refers to the folder of that file.
                tests:
                  - LintMarkEngine_Run_IgnoreNearestConfig_EachDirectoryUsesItsOwn
                  - LintMarkEngine_Run_IgnoreWithExplicitConfig_RelativeToConfigDirectory
                  - LintMarkEngine_Run_IgnoreOutsideDirectory_NeverIgnored

              - id: LintMark-Engine-LintMarkEngine-IgnoreExplicitFile
                title: >-
                  The LintMarkEngine class shall process a file that is named on the command line even when an
                  `ignore` pattern of its configuration matches it.
                justification: |
                  Naming a file is a deliberate choice, as it already is for files in third-party folders.
                tests:
                  - LintMarkEngine_Process_ExplicitFileMatchingIgnore_IsProcessed
                  - LintMarkEngine_Run_IgnoreExplicitFile_IsProcessed

              - id: LintMark-Engine-LintMarkEngine-DefaultFormattingRulesChecked
                title: >-
                  The LintMarkEngine class shall report as problems, for every file that it processes, the changes
                  of all the formatting rules of the tool, and write nothing.
                justification: |
                  The tool exists to check the formatting of Markdown files, and what the shipped tool reports
                  must not depend on how an engine is created.
                tests:
                  - LintMarkEngine_Run_CheckDefaultFormatters_ReportsEachViolationAndWritesNothing

              - id: LintMark-Engine-LintMarkEngine-DefaultFormattingRulesPreviewed
                title: >-
                  The LintMarkEngine class shall print as a diff, for every file that it processes, the changes of
                  all the formatting rules of the tool, and write nothing.
                justification: |
                  The tool lets users preview a rewrite, and what the shipped tool previews must not depend on how
                  an engine is created.
                tests:
                  - LintMarkEngine_Run_DiffDefaultFormatters_PrintsTheChangeAndWritesNothing

              - id: LintMark-Engine-LintMarkEngine-DefaultFormattingRulesFixed
                title: >-
                  The LintMarkEngine class shall write, for every file that it processes with the fix option, the
                  changes of all the formatting rules of the tool.
                justification: |
                  The tool exists to repair the formatting of Markdown files, and what the shipped tool applies
                  must not depend on how an engine is created.
                tests:
                  - LintMarkEngine_Run_FixDefaultFormatters_RewritesFileAndReportsNothing
                  - LintMarkEngine_Run_FixDefaultFormattersTwice_SecondRunLeavesTheFileAlone
                  - LintMarkEngine_Run_FixConfiguredSettings_WritesTheConfiguredForm
                  - LintMarkEngine_Run_FixRuleSuppressedByAlias_LeavesTheViolation
                  - LintMarkEngine_Run_FixInvalidGridTableDocument_IsNeverRewrittenByTheDefaultFormatters
                  - LintMarkEngine_Process_DefaultFormatters_ChangeHasFormattedBytesAndFindings
