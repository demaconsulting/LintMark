---
# Software Unit Requirements for the LintMarkEngine Class
#
# The LintMarkEngine class processes the selected files and reports failures deterministically through
# the Context.

sections:
  - title: LintMark Requirements
    sections:
      - title: Engine Requirements
        sections:
          - title: LintMarkEngine Requirements
            requirements:
              - id: LintMark-Engine-LintMarkEngine-ProcessEach
                title: The LintMarkEngine class shall read and parse every selected file.
                justification: |
                  Reading and parsing every selected file is the work of the tool.
                tests:
                  - LintMarkEngine_Process_ValidFiles_ReturnsNoFailures
                  - LintMarkEngine_Run_CheckFlag_BehavesLikeDefault

              - id: LintMark-Engine-LintMarkEngine-IsolatedFailures
                title: The LintMarkEngine class shall continue with the remaining files when one file fails.
                justification: |
                  A defect or damaged content in one file must not hide the state of the rest of a
                  documentation set.
                tests:
                  - LintMarkEngine_Process_ParserThrows_ReportsParseErrorForThatFileOnly
                  - LintMarkEngine_Process_MissingFile_ReportsReadError

              - id: LintMark-Engine-LintMarkEngine-SilentOnSuccess
                title: >-
                  The LintMarkEngine class shall report nothing for files that succeed, including when no file is
                  selected.
                justification: |
                  Silence on success keeps the output of large runs readable, and an empty selection is a
                  valid outcome.
                tests:
                  - LintMarkEngine_Process_NoFiles_ReturnsEmpty
                  - LintMarkEngine_Run_ValidFiles_WritesNothingAndExitsZero
                  - LintMarkEngine_Run_GlobWithoutMatches_WritesNothingAndExitsZero

              - id: LintMark-Engine-LintMarkEngine-ReadFailure
                title: >-
                  The LintMarkEngine class shall report a file that does not exist, is denied, or cannot be read
                  as a read failure at line 1 and column 1 with a message that says what went wrong.
                justification: |
                  Users must be able to distinguish a mistyped or inaccessible path from a problem in a
                  file's content, and the report must not stop the processing of other files.
                tests:
                  - LintMarkEngine_Process_MissingFile_ReportsReadError
                  - LintMarkEngine_Process_DirectoryAsFile_ReportsReadError
                  - LintMarkEngine_Run_MissingExplicitFile_ReportsReadError

              - id: LintMark-Engine-LintMarkEngine-EncodingFailure
                title: >-
                  The LintMarkEngine class shall report a file whose bytes are not valid UTF-8, or that begins
                  with a UTF-16 or UTF-32 byte order mark, as an encoding failure at the position of the
                  problem.
                justification: |
                  Damaged or unsupported files must be named with enough precision to repair them, rather
                  than being read incorrectly.
                tests:
                  - LintMarkEngine_Process_InvalidUtf8_ReportsEncodingError
                  - LintMarkEngine_Process_Utf16File_ReportsEncodingError

              - id: LintMark-Engine-LintMarkEngine-LineEndingFailure
                title: >-
                  The LintMarkEngine class shall report a file with a carriage return that is not part of a CRLF
                  line ending as a line-ending failure at the position of the carriage return.
                justification: |
                  Only LF and CRLF line endings can be restored faithfully, so a bare carriage return must be
                  named with enough precision to repair it.
                tests:
                  - LintMarkEngine_Process_LoneCr_ReportsLineEndingError

              - id: LintMark-Engine-LintMarkEngine-ProcessingFailure
                title: >-
                  The LintMarkEngine class shall report a file whose processing fails unexpectedly as a failure of
                  that file at line 1 and column 1, naming the kind of failure.
                justification: |
                  A defect triggered by one file's content must be reported against that file and must
                  not abort a run over a whole documentation set.
                tests:
                  - LintMarkEngine_Process_ParserThrows_ReportsParseErrorForThatFileOnly
                  - LintMarkEngine_Run_ParserFailure_ReportsParseError

              - id: LintMark-Engine-LintMarkEngine-FailureFormat
                title: >-
                  The LintMarkEngine class shall write each failure on its own line as `path:line:col: rule-id
                  message` through the error output of the Context, with the path relative to the current
                  directory using forward slashes.
                justification: |
                  A single, regular format is machine readable and recognized by editors and build
                  systems. Relative paths with one separator style make output the same on every platform.
                tests:
                  - LintMarkEngine_Run_Failures_WritesFormattedLinesInPathOrder

              - id: LintMark-Engine-LintMarkEngine-FailureOrderWithinFile
                title: The LintMarkEngine class shall list the failures of one file in order of position.
                justification: |
                  A reader fixing a file works from top to bottom, and a fixed order keeps output
                  reproducible.
                tests:
                  - LintMarkEngine_Run_MultipleFailuresInFile_AreOrderedByPosition

              - id: LintMark-Engine-LintMarkEngine-ExitStatus
                title: >-
                  The LintMarkEngine class shall leave the exit status at zero when no failure was reported and
                  make it non-zero when at least one failure was reported.
                justification: |
                  Scripts and build pipelines act on the exit status alone.
                tests:
                  - LintMarkEngine_Run_ValidFiles_WritesNothingAndExitsZero
                  - LintMarkEngine_Run_Failures_WritesFormattedLinesInPathOrder
                  - LintMarkEngine_Run_GlobWithoutMatches_WritesNothingAndExitsZero

              - id: LintMark-Engine-LintMarkEngine-OrderedResults
                title: >-
                  The LintMarkEngine class shall return and report results ordered by path regardless of the
                  order of its inputs, the number of files processed at once, and the order in which processing
                  finishes.
                justification: |
                  Output that depends on scheduling cannot be compared between runs or machines, and a
                  flaky order makes failures hard to reproduce.
                tests:
                  - LintMarkEngine_Process_InputOrder_DoesNotAffectResultOrder
                  - LintMarkEngine_Process_CompletionOrderInverted_ResultsStillPathSorted
                  - LintMarkEngine_Process_ParallelVersusSequential_ProduceIdenticalResults

              - id: LintMark-Engine-LintMarkEngine-ImmutableResults
                title: >-
                  The LintMarkEngine class shall return file results whose failure lists cannot be changed by
                  their holders.
                justification: |
                  Results are produced by parallel workers and consumed later by the reporter. A list that
                  anyone could modify would make the report depend on who touched it.
                tests:
                  - FileResult_Failures_CastToMutableTypes_CannotBeModified

              - id: LintMark-Engine-LintMarkEngine-ConfigPerFile
                title: >-
                  The LintMarkEngine class shall give each file the settings of the configuration that applies to
                  it, with the built-in defaults when none applies, regardless of the other files, the order of
                  processing, and the number of files processed at once.
                justification: |
                  Files in different folders can have different configurations, and the settings of one file
                  must never leak into another.
                tests:
                  - LintMarkEngine_Process_Files_AttachDefaultConfig
                  - LintMarkEngine_Process_DiscoveredConfigs_EachFileGetsItsNearestConfig
                  - LintMarkEngine_Process_ParallelWithConfigs_EqualsSequential
                  - LintMarkEngine_Process_NullLoader_Throws

              - id: LintMark-Engine-LintMarkEngine-ImmutableConfigResults
                title: >-
                  The LintMarkEngine class shall return file results whose configuration problem lists cannot be
                  changed by their holders.
                justification: |
                  The same problems are shared by every file that uses a configuration, and a list that
                  anyone could modify would make the report depend on who touched it.
                tests:
                  - LintMarkEngine_Process_ConfigErrors_CastToMutableTypes_CannotBeModified

              - id: LintMark-Engine-LintMarkEngine-ExplicitConfig
                title: >-
                  The LintMarkEngine class shall give every file the settings of the configuration file named on
                  the command line instead of a discovered configuration, and shall show that file's path
                  relative to the current directory in reports.
                justification: |
                  Naming a configuration file is a deliberate choice that overrides discovery, and the user
                  recognizes the file by the path they typed.
                tests:
                  - LintMarkEngine_Process_ExplicitConfig_UsedInsteadOfDiscoveredConfig
                  - LintMarkEngine_Run_ExplicitConfigRelative_ReportedWithRelativeDisplayPath

              - id: LintMark-Engine-LintMarkEngine-ExplicitConfigProblems
                title: >-
                  The LintMarkEngine class shall report the problems of the configuration file named on the
                  command line even when no Markdown file is selected.
                justification: |
                  A configuration that cannot be used is a problem whether or not the selection happens to
                  contain files.
                tests:
                  - LintMarkEngine_Run_ExplicitConfigMissing_ReportsErrorEvenWithNoFiles

              - id: LintMark-Engine-LintMarkEngine-NoConfig
                title: >-
                  The LintMarkEngine class shall give every file the default configuration, without reading any
                  configuration file or editor settings, when the no-config option is given.
                justification: |
                  The option exists to run the tool exactly as shipped. Any configuration source that is read
                  could change the result, or fail.
                tests:
                  - LintMarkEngine_Run_NoConfig_InvalidConfigAndUnreadableEditorConfig_ReportsNothing
                  - LintMarkEngine_Process_NoEditorConfigResolver_EndOfLineStaysNull

              - id: LintMark-Engine-LintMarkEngine-EndOfLinePrecedence
                title: >-
                  The LintMarkEngine class shall use the line ending of the configuration for a file when the
                  configuration gives one, and not consult the editor settings in that case.
                justification: |
                  An explicit setting in the tool's own configuration takes precedence over a setting that is
                  shared with other tools.
                tests:
                  - LintMarkEngine_Process_ConfigEndOfLine_WinsOverEditorConfig
                  - LintMarkEngine_Process_ConfigEndOfLine_EditorConfigNotConsulted

              - id: LintMark-Engine-LintMarkEngine-EndOfLineFallback
                title: >-
                  The LintMarkEngine class shall take the line ending of a file from the editor settings when
                  the configuration gives none, and leave it unspecified when neither gives one, including when
                  an explicit configuration file is used.
                justification: |
                  Users should not have to state the line ending twice, and an unsupported value in the editor
                  settings must leave the choice open instead of forcing one.
                tests:
                  - LintMarkEngine_Process_ConfigSilent_FallsBackToEditorConfig
                  - LintMarkEngine_Process_NeitherSpecifiesEndOfLine_StaysNull
                  - LintMarkEngine_Process_EditorConfigCr_EndOfLineStaysNull
                  - LintMarkEngine_Process_ExplicitConfig_StillConsultsEditorConfig
                  - LintMarkEngine_Run_ExplicitConfig_StillConsultsEditorConfig

              - id: LintMark-Engine-LintMarkEngine-ConfigErrorFormat
                title: >-
                  The LintMarkEngine class shall write each configuration problem on its own line as
                  `path:line:col: config-error message` through the error output of the Context, with the path
                  of the configuration file relative to the current directory using forward slashes, including
                  paths that lead out of the current directory.
                justification: |
                  Configuration problems share the regular line format of all other problems, so that editors
                  and build systems can read them, and the user can open the named file.
                tests:
                  - LintMarkEngine_Run_InvalidConfig_ReportsErrorLineAndExitsOne
                  - LintMarkEngine_Run_ExplicitConfigRelative_ReportedWithRelativeDisplayPath
                  - LintMarkEngine_Run_ConfigOutsideCurrentDirectory_ReportedWithParentRelativePath

              - id: LintMark-Engine-LintMarkEngine-ConfigErrorOnce
                title: >-
                  The LintMarkEngine class shall report a configuration problem once, however many files use the
                  configuration that has it.
                justification: |
                  One broken configuration used by hundreds of files would otherwise bury the report.
                tests:
                  - LintMarkEngine_Run_ConfigErrorSharedByManyFiles_ReportedOnce

              - id: LintMark-Engine-LintMarkEngine-ConfigErrorOrder
                title: >-
                  The LintMarkEngine class shall order configuration problems together with file failures by
                  path and then by position, with the same output for any degree of parallelism.
                justification: |
                  Reproducible output is required for comparing runs and for stable build logs, and
                  scheduling must never be visible.
                tests:
                  - LintMarkEngine_Run_ConfigErrorsAndFileFailures_MergedInPathThenPositionOrder
                  - LintMarkEngine_Run_ConfigErrors_ParallelAndSequentialProduceIdenticalOutput

              - id: LintMark-Engine-LintMarkEngine-ConfigErrorIsolation
                title: >-
                  The LintMarkEngine class shall read and check a file whose configuration is invalid, so that its
                  own read and decoding failures are still reported.
                justification: |
                  A configuration problem must not hide the state of the files themselves.
                tests:
                  - LintMarkEngine_Process_InvalidConfig_FileStillParsedAndConfigNull
                  - LintMarkEngine_Run_InvalidConfig_StillReportsFileReadFailures

              - id: LintMark-Engine-LintMarkEngine-EditorConfigFailure
                title: >-
                  The LintMarkEngine class shall report editor settings that cannot be read as a configuration
                  problem at line 1 and column 1 of the Markdown file they were read for, and leave the line
                  ending of that file unspecified.
                justification: |
                  Settings that cannot be read may contain the line ending that matters, so the user must be
                  told, and the problem belongs to the file that was affected.
                tests:
                  - LintMarkEngine_Process_EditorConfigUnreadable_AddsConfigErrorAtMarkdownFileAndKeepsConfig
                  - LintMarkEngine_Run_EditorConfigUnreadable_ReportsConfigErrorAtMarkdownFile

              - id: LintMark-Engine-LintMarkEngine-ConfigErrorExitStatus
                title: >-
                  The LintMarkEngine class shall make the exit status non-zero when at least one configuration
                  problem was reported.
                justification: |
                  Scripts and build pipelines act on the exit status alone.
                tests:
                  - LintMarkEngine_Run_InvalidConfig_ReportsErrorLineAndExitsOne
                  - LintMarkEngine_Run_ExplicitConfigMissing_ReportsErrorEvenWithNoFiles
