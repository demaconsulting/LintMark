---
# Software Unit Requirements for the LintMarkEngine Unit
#
# LintMarkEngine runs one invocation: it processes every selected file independently, optionally rewrites files, and
# reports every finding in a deterministic order.

sections:
  - title: LintMark Requirements
    sections:
      - title: Engine Requirements
        sections:
          - title: LintMarkEngine Requirements
            requirements:
              - id: LintMark-Engine-LintMarkEngine-Pipeline
                title: >-
                  The LintMarkEngine unit shall process each selected file independently, in parallel, and shall
                  report the findings in path order whatever the degree of parallelism.
                justification: |
                  Large repositories need the speed of parallel processing, while build logs and tests need output
                  that is identical from run to run. The files are parsed and their editor settings are resolved
                  on many threads at once, which depends on the libraries tolerating that.
                children:
                  - LintMark-OTS-Markdig-Concurrency
                  - LintMark-OTS-EditorConfig-Concurrency
                tests:
                  - LintMarkEngine_Run_ValidFiles_WritesNothingAndExitsZero
                  - LintMarkEngine_Run_Failures_WritesFormattedLinesInPathOrder
                  - LintMarkEngine_Process_ParallelVersusSequential_ProduceIdenticalResults
                  - LintMarkEngine_Run_ManyFilesWithFindings_SameReportForAnyParallelism
                  - LintMarkEngine_Run_FixParallelAndSequential_ProduceIdenticalOutputAndFiles

              - id: LintMark-Engine-LintMarkEngine-ConfigErrors
                title: >-
                  The LintMarkEngine unit shall report each configuration problem once, even when many files share
                  the configuration, and shall still check files with an invalid configuration without rewriting them.
                justification: |
                  A broken configuration must be visible without flooding the report, and the tool must not rewrite
                  documents with settings that it could not read.
                tests:
                  - LintMarkEngine_Run_InvalidConfig_ReportsErrorLineAndExitsOne
                  - LintMarkEngine_Run_ConfigErrorSharedByManyFiles_ReportedOnce
                  - LintMarkEngine_Run_ConfigErrorsAndFileFailures_MergedInPathThenPositionOrder
                  - LintMarkEngine_Process_InvalidConfig_FileStillParsedAndConfigNull
                  - LintMarkEngine_Run_ExplicitConfigMissing_ReportsErrorEvenWithNoFiles
                  - LintMarkEngine_Run_NoConfig_InvalidConfig_ReportsNothing

              - id: LintMark-Engine-LintMarkEngine-FileProblems
                title: >-
                  The LintMarkEngine unit shall report an unreadable file, a file that is not valid UTF-8 or that
                  contains a bare carriage return, a document with an invalid grid table, and a document whose inline
                  elements are nested too deeply to process as findings without stopping the run.
                justification: |
                  One bad file must not hide the results for the rest of the repository, and a document that cannot
                  be rewritten safely must be named instead of silently skipped.
                tests:
                  - LintMarkEngine_Process_MissingFile_ReportsReadError
                  - LintMarkEngine_Process_DirectoryAsFile_ReportsReadError
                  - LintMarkEngine_Process_InvalidUtf8_ReportsEncodingError
                  - LintMarkEngine_Process_LoneCr_ReportsLineEndingError
                  - LintMarkEngine_Process_DeeplyNestedEmphasis_ReportsParseErrorAndKeepsGoing
                  - LintMarkEngine_Run_CheckGridFallbackDocument_ReportsOffendingLineAndExitsOne
                  - LintMarkEngine_Run_FixGridFallbackDocument_ByteIdenticalAndGridDiagnostic

              - id: LintMark-Engine-LintMarkEngine-SafeFix
                title: >-
                  The LintMarkEngine unit shall write only formatting changes under fix, keep lint-only findings, and
                  report the remaining findings at their positions in the written file; check and diff write nothing.
                justification: |
                  Users rely on a fix run to change layout only and to leave an accurate list of what still needs
                  attention, and on a check or diff run to leave their files alone.
                tests:
                  - LintMarkEngine_Run_FixMixedFindings_FixesFormattingAndKeepsLintOnlyFindings
                  - LintMarkEngine_Run_FixMovesLines_ReportsRemainingFindingsAtWrittenPositions
                  - LintMarkEngine_Run_FixTwice_SecondRunLeavesFileAndReportsNothing
                  - LintMarkEngine_Run_FixOneWriteFails_OtherFilesStillWritten
                  - LintMarkEngine_Run_CheckDefaultFormatters_ReportsEachViolationAndWritesNothing
                  - LintMarkEngine_Run_DiffDefaultFormatters_PrintsTheChangeAndWritesNothing

              - id: LintMark-Engine-LintMarkEngine-IgnoreAndOverrides
                title: >-
                  The LintMarkEngine unit shall skip files matched by the ignore patterns of their configuration
                  unless they are named explicitly, and shall let command-line rule switches win over the configuration.
                justification: |
                  Users exclude generated documents through configuration, yet a file named on the command line is
                  requested on purpose. A switch given for one run must beat the settings stored in the repository.
                tests:
                  - LintMarkEngine_Process_IgnoredFile_NotReadAndMarkedIgnored
                  - LintMarkEngine_Process_ExplicitFileMatchingIgnore_IsProcessed
                  - LintMarkEngine_Run_IgnoreNearestConfig_EachDirectoryUsesItsOwn
                  - LintMarkEngine_Run_EnableAndDisableOptions_SwitchRules
                  - LintMarkEngine_Run_OptionsAndConfiguration_OptionsWin
