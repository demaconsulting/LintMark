---
# Software Unit Requirements for the AtomicFileWriter Unit
#
# AtomicFileWriter is the only code that writes a Markdown file: it replaces the content in one step and refuses to
# replace a file that is no longer the one the rewrite was computed from.

sections:
  - title: LintMark Requirements
    sections:
      - title: Engine Requirements
        sections:
          - title: AtomicFileWriter Requirements
            requirements:
              - id: LintMark-Engine-AtomicFileWriter-Replacement
                title: >-
                  The AtomicFileWriter unit shall replace the content of a file in one step so that the file holds
                  either its old or its complete new content, and shall remove its temporary file in every case.
                justification: |
                  A crash or a concurrent reader must never see a partly written document, and a failed write must not
                  leave stray files next to the user's documents.
                tests:
                  - AtomicFileWriter_Write_NewContent_ReplacesFile
                  - AtomicFileWriter_Write_BeforeReplaceThrows_OriginalIntactAndTempRemoved
                  - AtomicFileWriter_Write_ReadOnlyFile_ThrowsAndLeavesFile
                  - AtomicFileWriter_Write_MissingFile_Throws

              - id: LintMark-Engine-AtomicFileWriter-RefusesChange
                title: >-
                  The AtomicFileWriter unit shall refuse to write when the file no longer holds the bytes the rewrite
                  was computed from, or when the path now reaches a different file than the one that was read.
                justification: |
                  Overwriting an edit that the user made after the file was read, or a different file reached through
                  a redirected link, would silently destroy work.
                tests:
                  - AtomicFileWriter_Write_FileChangedSinceRead_ThrowsAndLeavesFile
                  - AtomicFileWriter_Write_OriginalBytesEqualButDifferentLength_Throws
                  - AtomicFileWriter_Write_TargetDiffersFromExpected_ThrowsAndLeavesBothFiles
                  - AtomicFileWriter_EnsureSameTarget_DifferentTarget_Throws
