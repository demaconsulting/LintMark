---
# Software Unit Requirements for the Context Class
#
# The Context class handles command-line argument parsing and program output.
# It is the primary interface between the user's command-line invocation and
# the tool's internal logic.

sections:
  - title: LintMark Requirements
    sections:
      - title: Cli Requirements
        sections:
          - title: Context Requirements
            requirements:
              - id: LintMark-Cli-Context-ArgumentParsing
                title: The Context class shall parse command-line arguments into structured properties.
                justification: |
                  Provides a standardized approach to command-line argument parsing and output
                  handling across all DEMA Consulting DotNet Tools.
                tests:
                  - Context_Create_NoArguments_ReturnsDefaultContext
                  - Context_Create_VersionFlag_SetsVersionTrue
                  - Context_Create_ShortVersionFlag_SetsVersionTrue
                  - Context_Create_HelpFlag_SetsHelpTrue
                  - Context_Create_ShortHelpFlag_H_SetsHelpTrue
                  - Context_Create_ShortHelpFlag_Question_SetsHelpTrue
                  - Context_Create_SilentFlag_SetsSilentTrue
                  - Context_Create_ValidateFlag_SetsValidateTrue
                  - Context_Create_ResultsFlag_SetsResultsFile
                  - Context_Create_LogFlag_OpensLogFile
                  - Context_Create_ResultAliasFlag_SetsResultsFile
                  - Context_Create_DepthFlag_SetsHeadingDepth
                  - Context_Create_NoDepthFlag_ReturnsDefaultHeadingDepth

              - id: LintMark-Cli-Context-InvalidArgs
                title: >-
                  The Context class shall reject unknown or malformed command-line arguments with a descriptive
                  error.
                justification: |
                  Providing clear feedback for invalid arguments helps users quickly correct
                  mistakes and prevents silent misconfiguration. Mistyped options must be reported
                  instead of being taken for file names.
                tests:
                  - Context_Create_UnknownArgument_ThrowsArgumentException
                  - Context_Create_LogFlag_WithoutValue_ThrowsArgumentException
                  - Context_Create_ResultsFlag_WithoutValue_ThrowsArgumentException
                  - Context_Create_ResultAliasFlag_WithoutValue_ThrowsArgumentException
                  - Context_Create_DepthFlag_WithoutValue_ThrowsArgumentException
                  - Context_Create_DepthFlag_NonIntegerValue_ThrowsArgumentException
                  - Context_Create_DepthFlag_ZeroValue_ThrowsArgumentException
                  - Context_Create_DepthFlag_ExceedsMaxValue_ThrowsArgumentException
                  - Context_Create_DashedUnknownToken_ThrowsArgumentException
                  - Context_Create_EmptyArgument_ThrowsArgumentException

              - id: LintMark-Cli-Context-ConsoleOutput
                title: The Context class shall write output to the console unless the silent flag is set.
                justification: |
                  Provides visible output to users running the tool interactively, while allowing
                  automated environments to suppress console output via the silent flag.
                tests:
                  - Context_WriteLine_NotSilent_WritesToConsole
                  - Context_WriteError_NotSilent_WritesToConsole

              - id: LintMark-Cli-Context-LogOutput
                title: >-
                  The Context class shall open the file named by the log flag when the context is created, write
                  output to it, and close it when disposed.
                justification: |
                  Provides persistent logging for debugging and audit trails, enabling post-run
                  inspection of tool output without requiring console capture. The file is opened for
                  writing when the context is created and replaces any previous content, as in the other
                  DEMA Consulting tools.
                tests:
                  - Context_Create_LogFlag_OpensLogFile
                  - Context_Create_LogFlag_ExistingFile_TruncatesFile
                  - Context_WriteError_WritesToLogFile
                  - Context_Dispose_ClosesLogFile

              - id: LintMark-Cli-Context-Silent
                title: The Context class shall suppress console output when the silent flag is set.
                justification: |
                  Enables automated scripts and CI/CD pipelines to run the tool without
                  cluttering output logs.
                tests:
                  - Context_Create_SilentFlag_SetsSilentTrue
                  - Context_WriteLine_Silent_DoesNotWriteToConsole
                  - Context_WriteError_Silent_DoesNotWriteToConsole

              - id: LintMark-Cli-Context-ErrorOutput
                title: The Context class shall write error messages to stderr.
                justification: |
                  Error messages must be written to stderr so they remain visible to the user
                  without polluting stdout, which consumers may pipe or redirect for data capture.
                tests:
                  - Context_WriteError_NotSilent_WritesToConsole

              - id: LintMark-Cli-Context-ExitCode
                title: The Context class shall track errors and expose a non-zero exit code when errors have occurred.
                justification: |
                  Callers (scripts, CI/CD pipelines) must be able to detect failure conditions
                  programmatically via the process exit code.
                tests:
                  - Context_WriteError_SetsErrorExitCode

              - id: LintMark-Cli-Context-LogFailure
                title: The Context class shall report an error when the specified log file cannot be opened.
                justification: |
                  Failure to open a log file must be surfaced as early as possible so that users know their
                  log output will not be captured, preventing silent data loss in audit or
                  compliance workflows. The failure is reported when the context is created, as an
                  exception that names the path and keeps the underlying file-system exception.
                tests:
                  - Context_Create_LogFlag_InvalidPath_ThrowsInvalidOperationException
                  - Context_Create_LogFlag_MissingDirectory_ThrowsInvalidOperationException

              - id: LintMark-Cli-Context-Paths
                title: >-
                  The Context class shall expose every argument that does not start with a dash as a positional
                  path, in the order given.
                justification: |
                  Positional arguments select the files to process. Treating only dash-leading tokens as
                  options keeps file names, directories, globs, and `!` exclusions usable as given.
                tests:
                  - Context_Create_PositionalPaths_SetsPathsInOrder
                  - Context_Create_NoPaths_PathsEmpty
                  - Context_Create_PathsMixedWithFlags_ParsesBoth
                  - Context_Create_HelpOrVersionWithPaths_DoesNotThrow
                  - Context_Paths_CastToMutableTypes_CannotBeModified

              - id: LintMark-Cli-Context-Check
                title: The Context class shall expose whether the `--check` flag was specified.
                justification: |
                  The flag states that files must only be checked. Exposing it lets the rest of the tool
                  honor the request, now and when file-modifying modes exist.
                tests:
                  - Context_Create_CheckFlag_SetsCheckTrue

              - id: LintMark-Cli-Context-ValidateExclusive
                title: >-
                  The Context class shall reject `--validate` combined with positional paths, `--check`,
                  `--config`, or `--no-config`.
                justification: |
                  Self-validation does not process files or configuration, so such a combination is a usage
                  error that must be reported instead of silently discarding part of the command line.
                tests:
                  - Context_Create_ValidateWithPaths_ThrowsArgumentException
                  - Context_Create_ValidateWithCheck_ThrowsArgumentException
                  - Context_Create_ValidateWithConfig_ThrowsArgumentException
                  - Context_Create_ValidateWithNoConfig_ThrowsArgumentException
                  - Context_Create_ValidateWithItsOwnOptions_DoesNotThrow

              - id: LintMark-Cli-Context-ConfigFile
                title: >-
                  The Context class shall expose the file named with `--config` as written on the command line.
                justification: |
                  The configuration file is chosen by the user, and the rest of the tool needs the name exactly
                  as given.
                tests:
                  - Context_Create_ConfigFlag_SetsConfigFile
                  - Context_Create_ConfigAndPaths_ParsesBoth
                  - Context_Create_NoArguments_ConfigFileNullAndNoConfigFalse
                  - Context_Create_ConfigWithHelpOrVersion_DoesNotThrow

              - id: LintMark-Cli-Context-ConfigFileRepeated
                title: >-
                  The Context class shall keep the last file named when the `--config` option is repeated.
                justification: |
                  A later option overriding an earlier one is the usual command-line rule, and it lets a script
                  override an option it was given.
                tests:
                  - Context_Create_ConfigFlag_Repeated_LastWins

              - id: LintMark-Cli-Context-ConfigFileValueRequired
                title: >-
                  The Context class shall reject the `--config` option when its value is missing, blank, or another
                  option.
                justification: |
                  A missing name must be reported instead of consuming the next argument or being silently
                  ignored, and an option that follows must not be mistaken for the name.
                tests:
                  - Context_Create_ConfigFlag_WithoutValue_ThrowsArgumentException
                  - Context_Create_ConfigFlag_BlankValue_ThrowsArgumentException
                  - Context_Create_ConfigFlag_FollowedByOption_ThrowsArgumentException

              - id: LintMark-Cli-Context-NoConfig
                title: The Context class shall expose whether the `--no-config` flag was specified.
                justification: |
                  The flag states that no configuration source may be used. Exposing it lets the rest of the
                  tool honor the request.
                tests:
                  - Context_Create_NoConfigFlag_SetsNoConfig

              - id: LintMark-Cli-Context-ConfigExclusive
                title: The Context class shall reject `--config` combined with `--no-config`.
                justification: |
                  Naming a configuration file and asking for none contradict each other, so the combination is
                  a usage error that must be reported.
                tests:
                  - Context_Create_ConfigWithNoConfig_ThrowsArgumentException

              - id: LintMark-Cli-Context-ThreadSafeOutput
                title: >-
                  The Context class shall serialize concurrent calls that write output or record errors so that
                  lines stay intact on the console and in the log file and no error is lost.
                justification: |
                  The shared output channels may be written from several threads. Serializing the writes
                  protects against interleaved lines, torn console color changes, and a lost error flag.
                tests:
                  - Context_WriteError_ConcurrentWriters_AllLinesWrittenIntact
                  - Context_WriteLine_ConcurrentWriters_AllLinesWrittenIntact
