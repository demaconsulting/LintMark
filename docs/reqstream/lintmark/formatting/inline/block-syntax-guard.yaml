---
# Software Unit Requirements for the BlockSyntaxGuard Class
#
# The BlockSyntaxGuard class tells which words would start another block if a wrap put them at the start of a line, and
# which lines of a paragraph are structural lines of Pandoc. It is stateless and answers the same way on every thread.

sections:
  - title: LintMark Requirements
    sections:
      - title: Formatting Requirements
        sections:
          - title: Inline Requirements
            sections:
              - title: BlockSyntaxGuard Requirements
                requirements:
                  - id: LintMark-Formatting-Inline-BlockSyntaxGuard-RejectsMissingArguments
                    title: >-
                      The BlockSyntaxGuard class shall throw an exception that names the parameter when a word is
                      null or empty, or when a line is null.
                    justification: |
                      Missing arguments are programming errors that must be reported as such.
                    tests:
                      - BlockSyntaxGuard_IsGuardedLineStart_NullOrEmptyAtom_Throws
                      - BlockSyntaxGuard_IsPandocStructuralLine_NullLine_Throws

                  - id: LintMark-Formatting-Inline-BlockSyntaxGuard-BulletMarkersGuarded
                    title: >-
                      The BlockSyntaxGuard class shall guard the words `-`, `+`, and `*` against the start of a line.
                    justification: |
                      A line that starts with one of these words followed by a blank is a list item, so the wrap
                      would turn a part of the paragraph into a list.
                    tests:
                      - BlockSyntaxGuard_IsGuardedLineStart_BulletMarkers_AreGuarded

                  - id: LintMark-Formatting-Inline-BlockSyntaxGuard-NumberMarkersGuarded
                    title: >-
                      The BlockSyntaxGuard class shall guard a word that is one to nine digits followed by a period or
                      a closing parenthesis against the start of a line, also when the number looks like a year.
                    justification: |
                      A line that starts with such a word is an ordered list item, so the wrap would turn a part of
                      the paragraph into a list.
                    tests:
                      - BlockSyntaxGuard_IsGuardedLineStart_NumberMarkers_AreGuarded

                  - id: LintMark-Formatting-Inline-BlockSyntaxGuard-NumbersThatAreNotMarkersNotGuarded
                    title: >-
                      The BlockSyntaxGuard class shall not guard a word that only looks like an ordered list marker,
                      such as a decimal number, a number of ten or more digits, or a number followed by other text.
                    justification: |
                      Guarding every word that contains a digit would leave lines too wide when a good break exists.
                    tests:
                      - BlockSyntaxGuard_IsGuardedLineStart_NumbersThatAreNotMarkers_AreNotGuarded

                  - id: LintMark-Formatting-Inline-BlockSyntaxGuard-HeadingMarkersGuarded
                    title: >-
                      The BlockSyntaxGuard class shall guard a word of one to six number signs against the start of a
                      line.
                    justification: |
                      A line that starts with such a word is a heading, so the wrap would turn a part of the
                      paragraph into a heading.
                    tests:
                      - BlockSyntaxGuard_IsGuardedLineStart_HeadingMarkers_AreGuarded

                  - id: LintMark-Formatting-Inline-BlockSyntaxGuard-HeadingLookalikesNotGuarded
                    title: >-
                      The BlockSyntaxGuard class shall not guard a word of more than six number signs, or a word that
                      starts with number signs and has other characters.
                    justification: |
                      Guarding words that do not start a heading would leave lines too wide when a good break exists.
                    tests:
                      - BlockSyntaxGuard_IsGuardedLineStart_HeadingLookalikes_AreNotGuarded

                  - id: LintMark-Formatting-Inline-BlockSyntaxGuard-QuoteGuarded
                    title: >-
                      The BlockSyntaxGuard class shall guard every word that starts with a quote marker against the
                      start of a line.
                    justification: |
                      A line that starts with a quote marker is a block quote, so the wrap would turn a part of the
                      paragraph into a quote.
                    tests:
                      - BlockSyntaxGuard_IsGuardedLineStart_QuoteMarkers_AreGuarded

                  - id: LintMark-Formatting-Inline-BlockSyntaxGuard-FencesGuarded
                    title: >-
                      The BlockSyntaxGuard class shall guard a word that starts with three or more backticks or tildes
                      against the start of a line.
                    justification: |
                      A line that starts with a fence opens a code block, so the wrap would turn the rest of the
                      document into code.
                    tests:
                      - BlockSyntaxGuard_IsGuardedLineStart_Fences_AreGuarded

                  - id: LintMark-Formatting-Inline-BlockSyntaxGuard-CodeSpansAndStrikethroughNotGuarded
                    title: >-
                      The BlockSyntaxGuard class shall not guard a code span or a strikethrough word.
                    justification: |
                      Guarding words that do not start a block would leave lines too wide when a good break exists.
                    tests:
                      - BlockSyntaxGuard_IsGuardedLineStart_CodeSpansAndStrikethrough_AreNotGuarded

                  - id: LintMark-Formatting-Inline-BlockSyntaxGuard-DefinitionsGuarded
                    title: >-
                      The BlockSyntaxGuard class shall guard a word that starts a link reference definition or a
                      footnote definition against the start of a line.
                    justification: |
                      A line that starts with a definition would turn a part of the paragraph into a definition that
                      is no longer rendered.
                    tests:
                      - BlockSyntaxGuard_IsGuardedLineStart_Definitions_AreGuarded

                  - id: LintMark-Formatting-Inline-BlockSyntaxGuard-LinksAndTaskMarkersNotGuarded
                    title: >-
                      The BlockSyntaxGuard class shall not guard a link, a reference, or a task marker.
                    justification: |
                      Guarding words that do not start a block would leave lines too wide when a good break exists.
                    tests:
                      - BlockSyntaxGuard_IsGuardedLineStart_LinksAndTaskMarkers_AreNotGuarded

                  - id: LintMark-Formatting-Inline-BlockSyntaxGuard-HtmlBlocksGuarded
                    title: >-
                      The BlockSyntaxGuard class shall guard a word that starts a block level HTML element, a comment,
                      a processing instruction, a declaration, or a CDATA section against the start of a line.
                    justification: |
                      A line that starts an HTML block turns the rest of the paragraph into raw HTML, so the wrap would
                      change how the paragraph renders.
                    tests:
                      - BlockSyntaxGuard_IsGuardedLineStart_HtmlBlockStarts_AreGuarded

                  - id: LintMark-Formatting-Inline-BlockSyntaxGuard-InlineHtmlNotGuarded
                    title: >-
                      The BlockSyntaxGuard class shall not guard a word that starts an inline HTML tag or an autolink.
                    justification: |
                      Inline HTML does not start a block, and guarding it would leave lines too wide when a good break
                      exists.
                    tests:
                      - BlockSyntaxGuard_IsGuardedLineStart_InlineHtml_IsNotGuarded

                  - id: LintMark-Formatting-Inline-BlockSyntaxGuard-ThematicAndSetextGuarded
                    title: >-
                      The BlockSyntaxGuard class shall guard a word that is made only of one of the characters `-`,
                      `*`, `_`, and `=` against the start of a line.
                    justification: |
                      A line of such a word is a thematic break or a setext underline, so the wrap would turn a part of
                      the paragraph into a rule or a heading.
                    tests:
                      - BlockSyntaxGuard_IsGuardedLineStart_ThematicAndSetextRuns_AreGuarded

                  - id: LintMark-Formatting-Inline-BlockSyntaxGuard-TableRowsGuarded
                    title: >-
                      The BlockSyntaxGuard class shall guard a word that starts with a pipe, and a word that is a table
                      delimiter, against the start of a line.
                    justification: |
                      A line that starts a table row would turn a part of the paragraph into a table.
                    tests:
                      - BlockSyntaxGuard_IsGuardedLineStart_TableRows_AreGuarded

                  - id: LintMark-Formatting-Inline-BlockSyntaxGuard-PandocConstructsGuarded
                    title: >-
                      The BlockSyntaxGuard class shall guard a word that starts a Pandoc fenced div, definition list,
                      math block, raw attribute, title block, LaTeX command, or grid table border against the start
                      of a line.
                    justification: |
                      Pandoc reads a line that starts with such a word as another construct, so the wrap would change
                      the output of the document.
                    tests:
                      - BlockSyntaxGuard_IsGuardedLineStart_PandocConstructs_AreGuarded

                  - id: LintMark-Formatting-Inline-BlockSyntaxGuard-OrdinaryTextNotGuarded
                    title: >-
                      The BlockSyntaxGuard class shall not guard ordinary words, emphasis, signed numbers, dollar
                      amounts, escapes, or character references.
                    justification: |
                      Guarding words that do not start a block would leave lines too wide when a good break exists.
                    tests:
                      - BlockSyntaxGuard_IsGuardedLineStart_OrdinaryText_IsNotGuarded

                  - id: LintMark-Formatting-Inline-BlockSyntaxGuard-PandocStructuralLinesDetected
                    title: >-
                      The BlockSyntaxGuard class shall recognize a line of a paragraph that starts a Pandoc construct,
                      also when it is indented, and no line of ordinary text.
                    justification: |
                      A paragraph with such a line is left as written, because Pandoc reads the line as structure.
                    tests:
                      - BlockSyntaxGuard_IsPandocStructuralLine_Lines_AreClassified

                  - id: LintMark-Formatting-Inline-BlockSyntaxGuard-DeterministicAnswers
                    title: >-
                      The BlockSyntaxGuard class shall give the same answer for the same word when it is called from
                      several threads at once as when it is called one after another.
                    justification: |
                      Files are formatted in parallel, and an answer that depended on timing could not be trusted.
                    tests:
                      - BlockSyntaxGuard_IsGuardedLineStart_ConcurrentCalls_GiveTheSameAnswers
