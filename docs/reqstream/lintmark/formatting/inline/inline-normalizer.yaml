---
# Software Unit Requirements for the InlineNormalizer Class
#
# The InlineNormalizer class proposes the changes that bring the text of a paragraph into canonical form: emphasis and
# strong emphasis written with the configured delimiter characters, and bare URLs wrapped in angle brackets. A
# paragraph that it cannot rewrite without possibly changing how it renders is left as written.

sections:
  - title: LintMark Requirements
    sections:
      - title: Formatting Requirements
        sections:
          - title: Inline Requirements
            sections:
              - title: InlineNormalizer Requirements
                requirements:
                  - id: LintMark-Formatting-Inline-InlineNormalizer-RejectsMissingArguments
                    title: >-
                      The InlineNormalizer class shall throw an ArgumentNullException that names the parameter when an
                      argument is null.
                    justification: |
                      Missing arguments are programming errors that must be reported as such.
                    tests:
                      - InlineNormalizer_AddBlockEdits_NullArguments_Throw
                      - InlineCandidates_Find_NullArguments_Throw
                      - ParagraphProof_Holds_NullArguments_Throw

                  - id: LintMark-Formatting-Inline-InlineNormalizer-RejectsOtherBlocks
                    title: The InlineNormalizer class shall refuse to normalize a block that is not a paragraph.
                    justification: |
                      Headings and tables have a different shape, and their text is not the subject of the rules, so
                      edits computed for them could damage them.
                    tests:
                      - InlineNormalizer_AddBlockEdits_HeadingBlock_ThrowsArgumentException

                  - id: LintMark-Formatting-Inline-InlineNormalizer-HeadingsAndTablesNotNormalized
                    title: >-
                      The InlineNormalizer class shall leave the emphasis and the URLs of a heading and of a table
                      cell as written.
                    justification: |
                      The text of a heading or a table cell is not the subject of the inline rules, and rewriting it
                      could change how the heading or the table renders.
                    tests:
                      - InlineNormalizer_AddBlockEdits_HeadingsAndTables_AreNotNormalized

                  - id: LintMark-Formatting-Inline-InlineNormalizer-RuleIdsImmutable
                    title: >-
                      The InlineNormalizer class shall list the rules it enforces in a form that its holders cannot
                      change.
                    justification: |
                      The list decides which suppressions affect the normalizer, and one instance is shared by every
                      thread.
                    tests:
                      - InlineNormalizer_RuleIds_Read_ListsTheThreeRulesAndIsImmutable

                  - id: LintMark-Formatting-Inline-InlineNormalizer-EmphasisDelimiterConverted
                    title: >-
                      The InlineNormalizer class shall write each emphasis of a paragraph with the delimiter that the
                      `emphasis` setting names, an asterisk by default.
                    justification: |
                      Underscores and asterisks mean the same emphasis, and one of them makes the documents of a
                      project consistent.
                    tests:
                      - InlineNormalizer_AddBlockEdits_UnderscoreDelimiters_BecomeAsterisks
                      - InlineNormalizer_AddBlockEdits_AsteriskDelimiters_BecomeUnderscoresWhenConfigured

                  - id: LintMark-Formatting-Inline-InlineNormalizer-StrongDelimiterConverted
                    title: >-
                      The InlineNormalizer class shall write each strong emphasis of a paragraph with the delimiter
                      that the `strong` setting names, an asterisk by default.
                    justification: |
                      Double underscores and double asterisks mean the same strong emphasis, and one of them makes
                      the documents of a project consistent.
                    tests:
                      - InlineNormalizer_AddBlockEdits_UnderscoreDelimiters_BecomeAsterisks
                      - InlineNormalizer_AddBlockEdits_AsteriskDelimiters_BecomeUnderscoresWhenConfigured

                  - id: LintMark-Formatting-Inline-InlineNormalizer-WithinWordEmphasisKept
                    title: >-
                      The InlineNormalizer class shall keep the asterisks of an emphasis that starts or ends inside a
                      word when underscores are configured.
                    justification: |
                      An underscore inside a word does not emphasize anything, so writing it there would change how
                      the paragraph renders.
                    tests:
                      - InlineNormalizer_AddBlockEdits_WithinWordEmphasis_KeepsAsterisks

                  - id: LintMark-Formatting-Inline-InlineNormalizer-NestedEmphasisKept
                    title: >-
                      The InlineNormalizer class shall keep the delimiters of an emphasis as written when another
                      emphasis is next to it or inside it.
                    justification: |
                      Runs of delimiters are paired by rules that depend on the characters around them, so changing
                      one of them could change which text is emphasized.
                    tests:
                      - InlineNormalizer_AddBlockEdits_UnsafeEmphasis_KeepsTheParagraph

                  - id: LintMark-Formatting-Inline-InlineNormalizer-UnpairedDelimiterParagraphKept
                    title: >-
                      The InlineNormalizer class shall keep the emphasis of a paragraph as written when the paragraph
                      holds an asterisk or underscore that is not part of an emphasis.
                    justification: |
                      A delimiter character that is literal text, escaped, or unpaired can pair with a changed
                      delimiter, so the paragraph could then render differently.
                    tests:
                      - InlineNormalizer_AddBlockEdits_UnsafeEmphasis_KeepsTheParagraph

                  - id: LintMark-Formatting-Inline-InlineNormalizer-DelimitersInCodeSpansKept
                    title: >-
                      The InlineNormalizer class shall keep the delimiter characters inside a code span as written.
                    justification: |
                      Those characters are content, not emphasis, and changing them changes what the text says.
                    tests:
                      - InlineNormalizer_AddBlockEdits_DelimitersInCodeSpan_AreKept

                  - id: LintMark-Formatting-Inline-InlineNormalizer-DelimitersInHtmlKept
                    title: >-
                      The InlineNormalizer class shall keep the delimiter characters inside inline HTML as written.
                    justification: |
                      Those characters are markup, not emphasis, and changing them changes the HTML.
                    tests:
                      - InlineNormalizer_AddBlockEdits_DelimitersInHtml_AreKept

                  - id: LintMark-Formatting-Inline-InlineNormalizer-DelimitersInMathKept
                    title: >-
                      The InlineNormalizer class shall keep the delimiter characters inside inline math as written.
                    justification: |
                      Those characters are part of the formula, not emphasis, and changing them changes the formula.
                    tests:
                      - InlineNormalizer_AddBlockEdits_DelimitersInMath_AreKept

                  - id: LintMark-Formatting-Inline-InlineNormalizer-DelimitersInLinkDestinationsKept
                    title: >-
                      The InlineNormalizer class shall keep the delimiter characters inside the destination of a link
                      or image as written.
                    justification: |
                      Those characters are part of the address, not emphasis, and changing them changes where the link
                      leads.
                    tests:
                      - InlineNormalizer_AddBlockEdits_DelimitersInLinkDestination_AreKept

                  - id: LintMark-Formatting-Inline-InlineNormalizer-ParagraphsInContainersNormalized
                    title: >-
                      The InlineNormalizer class shall normalize a paragraph inside a list item or a block quote the
                      same way as a paragraph at the top level.
                    justification: |
                      Much of the text of a document is in lists and quotes, and the style of its emphasis and URLs
                      must not depend on where the text is.
                    tests:
                      - InlineNormalizer_AddBlockEdits_ParagraphInContainer_IsNormalized

                  - id: LintMark-Formatting-Inline-InlineNormalizer-ParagraphsInFootnotesNormalized
                    title: >-
                      The InlineNormalizer class shall normalize a paragraph inside a footnote the same way as a
                      paragraph at the top level.
                    justification: |
                      Footnotes hold ordinary text, and the style of their emphasis and URLs must not depend on where
                      the text is.
                    tests:
                      - InlineNormalizer_AddBlockEdits_ParagraphInFootnote_IsNormalized

                  - id: LintMark-Formatting-Inline-InlineNormalizer-EmphasisEndingFootnoteKept
                    title: >-
                      The InlineNormalizer class shall keep an emphasis or strong emphasis that ends the last paragraph
                      of a footnote as written.
                    justification: |
                      The parser appends a link back to the reference after the last inline of that paragraph, which
                      makes the effect of a rewrite there uncertain. Keeping the delimiters as written is always
                      safe, and nothing is reported for them.
                    tests:
                      - InlineNormalizer_AddBlockEdits_EmphasisEndingLastFootnoteParagraph_IsKept

                  - id: LintMark-Formatting-Inline-InlineNormalizer-UrlWrapped
                    title: >-
                      The InlineNormalizer class shall wrap each bare http, https, or ftp URL of a paragraph in angle
                      brackets when the `bare-urls` setting is `autolink`, which is the default.
                    justification: |
                      A URL in angle brackets is explicitly a link, in every Markdown processor, while a bare one is
                      a link in some processors only.
                    tests:
                      - InlineNormalizer_AddBlockEdits_BareUrls_AreWrappedInAngleBrackets
                      - InlineNormalizer_AddBlockEdits_UrlAtStartOfBlockAfterHeading_IsWrappedAndSeparated

                  - id: LintMark-Formatting-Inline-InlineNormalizer-TrailingPunctuationOutside
                    title: >-
                      The InlineNormalizer class shall leave the punctuation that follows a bare URL outside of the
                      angle brackets.
                    justification: |
                      A period, comma, or closing parenthesis after a URL belongs to the sentence, not to the
                      address.
                    tests:
                      - InlineNormalizer_AddBlockEdits_BareUrls_AreWrappedInAngleBrackets

                  - id: LintMark-Formatting-Inline-InlineNormalizer-UrlsAlreadyLinkedKept
                    title: >-
                      The InlineNormalizer class shall keep a URL that is already a link, in angle brackets, as the
                      text of a link, or as the destination of a link, as written.
                    justification: |
                      Wrapping such a URL would change the link, also where the link stands in a list item and its
                      text looks like a task list marker.
                    tests:
                      - InlineNormalizer_AddBlockEdits_UrlAlreadyLinked_IsKept

                  - id: LintMark-Formatting-Inline-InlineNormalizer-UrlsInCodeSpansKept
                    title: >-
                      The InlineNormalizer class shall keep a URL inside a code span as written.
                    justification: |
                      A URL in a code span is literal text, and wrapping it would change what the text says.
                    tests:
                      - InlineNormalizer_AddBlockEdits_UrlInCodeSpan_IsKept

                  - id: LintMark-Formatting-Inline-InlineNormalizer-UrlsInHtmlKept
                    title: >-
                      The InlineNormalizer class shall keep a URL inside inline HTML as written.
                    justification: |
                      A URL in an HTML tag is an attribute value, and wrapping it would change the HTML.
                    tests:
                      - InlineNormalizer_AddBlockEdits_UrlInHtml_IsKept

                  - id: LintMark-Formatting-Inline-InlineNormalizer-UrlAttachedToTextKept
                    title: >-
                      The InlineNormalizer class shall keep a URL as written when it directly follows or precedes a
                      character other than a blank or punctuation that ends a sentence, such as a quotation mark, an
                      emphasis delimiter, or a pipe.
                    justification: |
                      A URL that is attached to other text is not set off the way a bare URL is in prose, so it is
                      uncertain where it ends and wrapping it could change the text.
                    tests:
                      - InlineNormalizer_AddBlockEdits_UrlAttachedToOtherText_IsKept

                  - id: LintMark-Formatting-Inline-InlineNormalizer-UpperCaseSchemeKept
                    title: >-
                      The InlineNormalizer class shall keep an address as written when its scheme is not written in
                      lower case.
                    justification: |
                      The parser does not read such an address as a bare URL, so the rule has no URL to wrap and the
                      text stays as the author wrote it.
                    tests:
                      - InlineNormalizer_AddBlockEdits_UpperCaseScheme_IsKept

                  - id: LintMark-Formatting-Inline-InlineNormalizer-WwwAddressKept
                    title: >-
                      The InlineNormalizer class shall keep a www address as written.
                    justification: |
                      A www address renders differently when it is wrapped in angle brackets, so the rule would change
                      the document instead of its form.
                    tests:
                      - InlineNormalizer_AddBlockEdits_WwwAddress_IsKept

                  - id: LintMark-Formatting-Inline-InlineNormalizer-MailAddressKept
                    title: >-
                      The InlineNormalizer class shall keep an e-mail address and a mailto link as written.
                    justification: |
                      A mail address renders differently when it is wrapped in angle brackets, so the rule would
                      change the document instead of its form.
                    tests:
                      - InlineNormalizer_AddBlockEdits_MailAddress_IsKept

                  - id: LintMark-Formatting-Inline-InlineNormalizer-UrlsLeftWhenConfigured
                    title: >-
                      The InlineNormalizer class shall keep every bare URL as written when the `bare-urls` setting is
                      `leave`.
                    justification: |
                      Projects that want bare URLs choose to keep them, and the other inline rules still apply.
                    tests:
                      - InlineNormalizer_AddBlockEdits_LeaveUrlsConfigured_KeepsUrlsAndNormalizesEmphasis

                  - id: LintMark-Formatting-Inline-InlineNormalizer-BracketParagraphKeptWithReferences
                    title: >-
                      The InlineNormalizer class shall keep a paragraph that holds a square bracket as written when
                      the document defines link references.
                    justification: |
                      A bracket can be the label of a reference, and a rewritten label could stop matching its
                      definition, which cannot be told from the paragraph alone.
                    tests:
                      - InlineNormalizer_AddBlockEdits_BracketAndReferenceDefinitions_KeepsTheParagraph

                  - id: LintMark-Formatting-Inline-InlineNormalizer-ParagraphLeftWhenRenderingWouldChange
                    title: >-
                      The InlineNormalizer class shall keep a paragraph as written when the content of the paragraph,
                      rendered on its own with and without the changes, does not give the same HTML.
                    justification: |
                      A paragraph that renders differently after the rewrite is damaged, so only a rewrite that is
                      shown to keep the rendering is made, and the other paragraphs of the document are still
                      normalized. A paragraph whose content cannot be rendered on its own as exactly one paragraph, or
                      whose changes lie outside the content, cannot be shown and is kept as well.
                    tests:
                      - InlineNormalizer_AddBlockEdits_ParagraphThatMayRenderDifferently_IsLeftAndTheRestIsNormalized
                      - ParagraphProof_Holds_EditsThatChangeTheRendering_ReturnsFalse
                      - ParagraphProof_Holds_LineRangeInvalid_ReturnsFalse
                      - ParagraphProof_Holds_EditOutsideLineContent_ReturnsFalse
                      - ParagraphProof_Holds_ContentNotOneParagraph_ReturnsFalse

                  - id: LintMark-Formatting-Inline-InlineNormalizer-SuppressedRuleSkipped
                    title: >-
                      The InlineNormalizer class shall not apply a rule to a paragraph in which a suppression comment
                      disables that rule, whether the comment names the rule by its identifier or by its alias.
                    justification: |
                      An author who switched a rule off for a passage expects the passage to stay as written.
                    tests:
                      - InlineNormalizer_AddBlockEdits_RuleSuppressed_LeavesThatRule

                  - id: LintMark-Formatting-Inline-InlineNormalizer-OtherRulesStillApplied
                    title: >-
                      The InlineNormalizer class shall apply a rule to a paragraph in which a suppression comment
                      disables only a different rule.
                    justification: |
                      A rule that was not switched off keeps its effect, so a suppression protects only the rule that
                      it names.
                    tests:
                      - InlineNormalizer_AddBlockEdits_OtherRuleSuppressed_StillAppliesTheRule

                  - id: LintMark-Formatting-Inline-InlineNormalizer-EditsAttributedToRules
                    title: >-
                      The InlineNormalizer class shall attribute each change to the rule whose violation it removes:
                      `emphasis` for a single delimiter, `strong` for a double delimiter, and `bare-urls` for a URL.
                    justification: |
                      Violations are reported and suppressed by rule, so a change under the wrong rule would be
                      reported and suppressed wrongly.
                    tests:
                      - InlineNormalizer_AddBlockEdits_NonCanonicalParagraph_ReportsEachEditUnderItsRule
                      - InlineCandidates_Find_EmphasisStrongAndUrl_ReturnsTheEditsInStartOrder

                  - id: LintMark-Formatting-Inline-InlineNormalizer-EditsReplaceCharacters
                    title: >-
                      The InlineNormalizer class shall propose only changes that replace existing characters, never
                      changes that insert text at a position.
                    justification: |
                      An insertion at a position can collide with the blank lines that the block spacing inserts,
                      while a replacement of characters inside the text cannot.
                    tests:
                      - InlineNormalizer_AddBlockEdits_Edits_ReplaceExistingCharacters

                  - id: LintMark-Formatting-Inline-InlineNormalizer-EditsOrderedAndDistinct
                    title: >-
                      The InlineNormalizer class shall propose the changes of a paragraph in the order of their
                      position, each change once.
                    justification: |
                      The changes are applied in one pass from the start of the text, so they must be in order, and
                      a node that the tree holds twice must not be rewritten twice.
                    tests:
                      - InlineCandidates_Find_EmphasisStrongAndUrl_ReturnsTheEditsInStartOrder
                      - InlineCandidates_Find_SameEmphasisInTwoPlaces_ReturnsEachEditOnce

                  - id: LintMark-Formatting-Inline-InlineNormalizer-EditsIndependentOfStorage
                    title: >-
                      The InlineNormalizer class shall propose the same changes for a text whatever its line endings
                      are, LF, CRLF, or mixed, and whether the file starts with a byte order mark.
                    justification: |
                      How a file is stored says nothing about its text, so the changes must not depend on it.
                    tests:
                      - InlineNormalizer_AddBlockEdits_LineEndingsAndByteOrderMark_ProposeTheSameEdits

                  - id: LintMark-Formatting-Inline-InlineNormalizer-DeterministicResult
                    title: >-
                      The InlineNormalizer class shall propose the same changes for the same parsed document when one
                      instance is called from several threads at once as when it is called one after another.
                    justification: |
                      Files are formatted in parallel by one shared instance, and a result that depended on timing
                      could not be trusted.
                    tests:
                      - InlineNormalizer_AddBlockEdits_SharedInstanceOnManyThreads_GivesTheSameResult
