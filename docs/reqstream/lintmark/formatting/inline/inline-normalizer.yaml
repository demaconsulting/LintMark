---
# Software Unit Requirements for the InlineNormalizer Unit
#
# The InlineNormalizer unit writes emphasis, strong emphasis, bare URLs, and code spans of a paragraph in canonical form
# where that is safe.

sections:
  - title: LintMark Requirements
    sections:
      - title: Formatting Requirements
        sections:
          - title: Inline Requirements
            sections:
              - title: InlineNormalizer Requirements
                requirements:
                  - id: LintMark-Formatting-Inline-InlineNormalizer-Emphasis
                    title: >-
                      The InlineNormalizer unit shall write emphasis and strong emphasis with the configured
                      delimiter, and leave delimiters in code, HTML, math, or an unsafe context unchanged.
                    justification: |
                      One emphasis style keeps documents uniform, but a delimiter that is not clearly emphasis, or
                      that appears inside code, would change the text if it were rewritten.
                    tests:
                      - InlineNormalizer_AddBlockEdits_AsteriskDelimiters_BecomeUnderscoresWhenConfigured
                      - InlineNormalizer_AddBlockEdits_WithinWordEmphasis_KeepsAsterisks
                      - InlineNormalizer_AddBlockEdits_UnsafeEmphasis_KeepsTheParagraph
                      - InlineNormalizer_AddBlockEdits_DelimitersInCodeSpan_AreKept
                      - InlineNormalizer_AddBlockEdits_DelimitersInHtml_AreKept
                      - InlineNormalizer_AddBlockEdits_NonCanonicalParagraph_ReportsEachEditUnderItsRule

                  - id: LintMark-Formatting-Inline-InlineNormalizer-BareUrls
                    title: >-
                      The InlineNormalizer unit shall write a bare http, https, or ftp URL as an autolink in angle
                      brackets unless configured to leave URLs, and keep addresses that are not plain URLs.
                    justification: |
                      Bracketed URLs are unambiguous in every Markdown dialect, while links, HTML, and e-mail or
                      www addresses already have their own form.
                    tests:
                      - InlineNormalizer_AddBlockEdits_UrlAtStartOfBlockAfterHeading_IsWrappedAndSeparated
                      - InlineNormalizer_AddBlockEdits_LeaveUrlsConfigured_KeepsUrlsAndNormalizesEmphasis
                      - InlineNormalizer_AddBlockEdits_WwwAddress_IsKept
                      - InlineNormalizer_AddBlockEdits_MailAddress_IsKept
                      - InlineNormalizer_AddBlockEdits_UrlInHtml_IsKept
                      - InlineNormalizer_AddBlockEdits_UrlAttachedToOtherText_IsKept

                  - id: LintMark-Formatting-Inline-InlineNormalizer-CodeSpanPadding
                    title: >-
                      The InlineNormalizer unit shall remove the single space of padding on both sides of a code
                      span, and keep any other padding, multi-line spans, and spans in headings or tables.
                    justification: |
                      Padding of exactly one space is only decoration, but other padding carries meaning and spans
                      outside paragraphs are not safe to rewrite.
                    tests:
                      - InlineNormalizer_AddBlockEdits_PaddedCodeSpan_IsStable
                      - InlineNormalizer_AddBlockEdits_CodeSpanWithBacktickAtAnEdge_KeepsItsPadding
                      - InlineNormalizer_AddBlockEdits_AsymmetricOrMultiplePadding_IsKept
                      - InlineNormalizer_AddBlockEdits_CodeSpanAcrossLinesOrWithTab_IsKept
                      - InlineNormalizer_AddBlockEdits_CodeSpansInHeadingsAndTables_AreKept
                      - InlineNormalizer_AddBlockEdits_CodeSpanRuleSuppressed_KeepsTheCodeSpanAndAppliesTheOthers
