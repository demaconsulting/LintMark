---
# Software Unit Requirements for the DocumentFormatter Unit
#
# DocumentFormatter turns a parsed document into the edits and the line ending that bring it into canonical form,
# without writing anything.

sections:
  - title: LintMark Requirements
    sections:
      - title: Formatting Requirements
        sections:
          - title: DocumentFormatter Requirements
            requirements:
              - id: LintMark-Formatting-DocumentFormatter-BlockClaiming
                title: >-
                  The DocumentFormatter unit shall let exactly one block formatter format each block, and shall leave a
                  block as written when no formatter accepts it or one of its rules is suppressed in the block.
                justification: |
                  Each construct needs one owner so that formatters never fight over the same text, and a suppression
                  comment must keep the author's text exactly as written.
                tests:
                  - DocumentFormatter_Format_MatchingFormatter_CollectsItsEdits
                  - DocumentFormatter_Format_TwoMatchingFormatters_FirstWins
                  - DocumentFormatter_Format_BlockNoFormatterAccepts_LeftVerbatim
                  - DocumentFormatter_Format_FormatterRuleSuppressed_LeavesBlockVerbatim
                  - DocumentFormatter_Format_DisableAllRegion_LeavesBlockVerbatim
                  - DocumentFormatter_Format_SuppressedBlock_OtherBlockStillFormatted

              - id: LintMark-Formatting-DocumentFormatter-ProtectedRegions
                title: >-
                  The DocumentFormatter unit shall protect code, HTML, math, front matter, grid tables, and the content
                  of open raw-text HTML elements from every formatting edit.
                justification: |
                  Whitespace in these regions is content, so changing it would change what the document means or how it
                  renders.
                tests:
                  - LineOwnership_Build_MixedDocument_ClassifiesTheLines
                  - LineOwnership_LinesOf_IndentedCodeInList_EndsAtTheLastContentLine
                  - LineOwnership_Build_UnclosedFenceInList_ClaimsTheLinesUpToTheNextTopLevelBlock
                  - RawTextElements_FindProtectedBlocks_OpenElement_LeavesTheParagraphAsWritten
                  - FrontMatterGuard_CouldOpenFrontMatter_Document_AnswersForTheFirstLine

              - id: LintMark-Formatting-DocumentFormatter-FormatUnsafe
                title: >-
                  The DocumentFormatter unit shall propose no edit and report no finding for a document that cannot be
                  rewritten safely.
                justification: |
                  A document that the parser could not read reliably must never be rewritten, because the edit could
                  destroy content.
                tests:
                  - DocumentFormatter_Format_FormatUnsafeDocument_ProposesNoEditEvenWithCrlf

              - id: LintMark-Formatting-DocumentFormatter-LineEnding
                title: >-
                  The DocumentFormatter unit shall choose the configured line ending, else the majority line ending
                  of the file, else LF, and shall report one finding at 1:1 when any line terminator differs.
                justification: |
                  Files must end up with one consistent line ending, and the choice must follow the user's setting
                  before anything else.
                tests:
                  - DocumentFormatter_Format_ConfigLineEnding_WinsOverMajority
                  - DocumentFormatter_Format_MixedFileNoConfig_TargetsMajority
                  - DocumentFormatter_Format_TieNoConfig_TargetsLf
                  - DocumentFormatter_Format_NoTerminatorsNoConfig_TargetsLf
                  - DocumentFormatter_Format_CrlfFileLfConfig_ReportsLineEndingAt1x1
                  - DocumentFormatter_Format_MixedFile_ReportsMixed
