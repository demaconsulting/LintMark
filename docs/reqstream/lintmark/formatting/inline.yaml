---
# Inline Subsystem Requirements
#
# PURPOSE:
# - Define requirements for the LintMark Inline subsystem, which is part of the Formatting subsystem
# - The Inline subsystem holds the normalizer for the text inside paragraphs: the delimiter characters of emphasis
#   and strong emphasis, and bare URLs
# - Subsystem requirements describe what the inline rules guarantee together, with the real parser and the document
#   formatter that drives them

sections:
  - title: LintMark Requirements
    sections:
      - title: Formatting Requirements
        sections:
          - title: Inline Requirements
            requirements:
              - id: LintMark-Formatting-Inline-InlineNormalizerProvided
                title: >-
                  The Inline subsystem shall provide a normalizer that proposes the changes that write the emphasis and
                  strong emphasis of each paragraph with the configured delimiter characters and each bare URL in angle
                  brackets.
                justification: |
                  Emphasis and URLs have more than one way of being written in Markdown. One way makes the documents
                  of a project consistent.
                children:
                  - LintMark-Formatting-Inline-InlineNormalizer-RejectsMissingArguments
                  - LintMark-Formatting-Inline-InlineNormalizer-RejectsOtherBlocks
                  - LintMark-Formatting-Inline-InlineNormalizer-RuleIdsImmutable
                  - LintMark-Formatting-Inline-InlineNormalizer-EditsAttributedToRules
                  - LintMark-Formatting-Inline-InlineNormalizer-EditsReplaceCharacters
                  - LintMark-Formatting-Inline-InlineNormalizer-EditsOrderedAndDistinct
                  - LintMark-Formatting-Inline-InlineNormalizer-EditsIndependentOfStorage
                tests:
                  - InlineSubsystem_Format_UnderscoreDelimiters_BecomeAsterisksByDefault
                  - InlineSubsystem_Format_BareUrls_AreWrappedUnlessConfiguredOtherwise

              - id: LintMark-Formatting-Inline-EmphasisStyle
                title: >-
                  The Inline subsystem shall write each emphasis of a paragraph with the delimiter character that the
                  `emphasis` setting names, an asterisk by default.
                justification: |
                  Underscores and asterisks mean the same emphasis, and one of them makes the documents of a project
                  consistent.
                children:
                  - LintMark-Formatting-Inline-InlineNormalizer-EmphasisDelimiterConverted
                tests:
                  - InlineSubsystem_Format_UnderscoreDelimiters_BecomeAsterisksByDefault
                  - InlineSubsystem_Format_UnderscoreConfigured_AsteriskDelimitersBecomeUnderscores

              - id: LintMark-Formatting-Inline-WithinWordEmphasisKept
                title: >-
                  The Inline subsystem shall keep the asterisks of an emphasis that starts or ends inside a word when
                  the configuration names the underscore.
                justification: |
                  An underscore does not emphasize inside a word, so writing it there would change how the paragraph
                  renders.
                children:
                  - LintMark-Formatting-Inline-InlineNormalizer-WithinWordEmphasisKept
                tests:
                  - InlineSubsystem_Format_UnderscoreConfigured_WithinWordEmphasis_KeepsAsterisks

              - id: LintMark-Formatting-Inline-StrongStyle
                title: >-
                  The Inline subsystem shall write each strong emphasis of a paragraph with the configured delimiter
                  character.
                justification: |
                  Double underscores and double asterisks mean the same strong emphasis, and one of them makes the
                  documents of a project consistent.
                children:
                  - LintMark-Formatting-Inline-InlineNormalizer-StrongDelimiterConverted
                tests:
                  - InlineSubsystem_Format_UnderscoreDelimiters_BecomeAsterisksByDefault
                  - InlineSubsystem_Format_UnderscoreConfigured_AsteriskDelimitersBecomeUnderscores

              - id: LintMark-Formatting-Inline-BareUrlsAutolinked
                title: >-
                  The Inline subsystem shall wrap each bare http, https, or ftp URL of a paragraph in angle brackets
                  when the configuration asks for the autolink style, which is the default.
                justification: |
                  A URL in angle brackets is explicitly a link in every Markdown processor, while a bare one is a link
                  in some processors only. The punctuation that follows a URL in a sentence is not part of it.
                children:
                  - LintMark-Formatting-Inline-InlineNormalizer-UrlWrapped
                  - LintMark-Formatting-Inline-InlineNormalizer-TrailingPunctuationOutside
                tests:
                  - InlineSubsystem_Format_BareUrls_AreWrappedUnlessConfiguredOtherwise

              - id: LintMark-Formatting-Inline-BareUrlsLeft
                title: >-
                  The Inline subsystem shall keep every bare URL of a paragraph as written when the configuration
                  asks to leave them.
                justification: |
                  Projects that want bare URLs choose to keep them, and the other inline rules still apply.
                children:
                  - LintMark-Formatting-Inline-InlineNormalizer-UrlsLeftWhenConfigured
                tests:
                  - InlineSubsystem_Format_BareUrls_AreWrappedUnlessConfiguredOtherwise

              - id: LintMark-Formatting-Inline-ParagraphsInContainers
                title: >-
                  The Inline subsystem shall normalize a paragraph inside a list item or a block quote the same way
                  as a paragraph at the top level.
                justification: |
                  Much of the text of a document is in lists and quotes, and the style of its emphasis and URLs must
                  not depend on where the text is.
                children:
                  - LintMark-Formatting-Inline-InlineNormalizer-ParagraphsInContainersNormalized
                tests:
                  - InlineSubsystem_Format_ParagraphsInContainers_AreNormalized

              - id: LintMark-Formatting-Inline-ParagraphsInFootnotes
                title: >-
                  The Inline subsystem shall normalize a paragraph inside a footnote the same way as a paragraph at the
                  top level.
                justification: |
                  Footnotes hold ordinary text, and the style of their emphasis and URLs must not depend on where the
                  text is.
                children:
                  - LintMark-Formatting-Inline-InlineNormalizer-ParagraphsInFootnotesNormalized
                tests:
                  - InlineSubsystem_Format_ParagraphsInFootnotes_AreNormalized

              - id: LintMark-Formatting-Inline-FootnoteEndingEmphasisKept
                title: >-
                  The Inline subsystem shall keep an emphasis that ends the last paragraph of a footnote as written.
                justification: |
                  The parser appends a link back to the reference after the last inline of that paragraph, which
                  makes the effect of a rewrite there uncertain. Leaving the emphasis as written is always safe, and
                  nothing is reported for it.
                children:
                  - LintMark-Formatting-Inline-InlineNormalizer-EmphasisEndingFootnoteKept
                tests:
                  - InlineSubsystem_Format_EmphasisEndingFootnote_IsKept

              - id: LintMark-Formatting-Inline-ParagraphsOnly
                title: >-
                  The Inline subsystem shall keep the emphasis and the URLs of a heading and of a table cell as
                  written.
                justification: |
                  Only the text of paragraphs is the subject of the inline rules. The text of a heading or a table
                  cell is kept as the author wrote it.
                children:
                  - LintMark-Formatting-Inline-InlineNormalizer-HeadingsAndTablesNotNormalized
                tests:
                  - InlineSubsystem_Format_HeadingsAndTableCells_KeepTheirText

              - id: LintMark-Formatting-Inline-SuppressedRulesKept
                title: >-
                  The Inline subsystem shall not apply the `emphasis`, `strong`, or `bare-urls` rule to a paragraph
                  in which a suppression comment disables that rule.
                justification: |
                  An author who switched a rule off for a passage expects the passage to stay as written.
                children:
                  - LintMark-Formatting-Inline-InlineNormalizer-SuppressedRuleSkipped
                tests:
                  - InlineSubsystem_Format_RuleSuppressed_LeavesThatRule

              - id: LintMark-Formatting-Inline-OtherRulesStillApplied
                title: >-
                  The Inline subsystem shall apply the `emphasis`, `strong`, or `bare-urls` rule to a paragraph in
                  which a suppression comment disables only a different one of these rules.
                justification: |
                  A rule that was not switched off keeps its effect, so a suppression protects only the rule that it
                  names.
                children:
                  - LintMark-Formatting-Inline-InlineNormalizer-OtherRulesStillApplied
                tests:
                  - InlineSubsystem_Format_OtherRuleSuppressed_StillAppliesTheRule

              - id: LintMark-Formatting-Inline-CodeSpansKept
                title: >-
                  The Inline subsystem shall keep the text of a code span as written.
                justification: |
                  A delimiter or URL inside a code span is content, and changing it changes the document instead of its
                  form.
                children:
                  - LintMark-Formatting-Inline-InlineNormalizer-DelimitersInCodeSpansKept
                  - LintMark-Formatting-Inline-InlineNormalizer-UrlsInCodeSpansKept
                tests:
                  - InlineSubsystem_Format_CodeSpans_KeepTheirText

              - id: LintMark-Formatting-Inline-LinkDestinationsKept
                title: >-
                  The Inline subsystem shall keep the destination of a link as written.
                justification: |
                  A delimiter inside a destination is part of the address, and changing it changes where the link
                  leads.
                children:
                  - LintMark-Formatting-Inline-InlineNormalizer-DelimitersInLinkDestinationsKept
                tests:
                  - InlineSubsystem_Format_LinkDestinations_KeepTheirText

              - id: LintMark-Formatting-Inline-HtmlKept
                title: >-
                  The Inline subsystem shall keep the text of inline HTML as written.
                justification: |
                  A delimiter or URL inside an HTML tag is markup, and changing it changes the document instead of its
                  form.
                children:
                  - LintMark-Formatting-Inline-InlineNormalizer-DelimitersInHtmlKept
                  - LintMark-Formatting-Inline-InlineNormalizer-UrlsInHtmlKept
                tests:
                  - InlineSubsystem_Format_Html_KeepsItsText

              - id: LintMark-Formatting-Inline-MathKept
                title: >-
                  The Inline subsystem shall keep the text of inline math as written.
                justification: |
                  A delimiter inside math is content, and changing it changes the formula.
                children:
                  - LintMark-Formatting-Inline-InlineNormalizer-DelimitersInMathKept
                tests:
                  - InlineSubsystem_Format_Math_KeepsItsText

              - id: LintMark-Formatting-Inline-WwwAddressesKept
                title: >-
                  The Inline subsystem shall keep a www address as written.
                justification: |
                  A www address renders differently when it is wrapped in angle brackets, so wrapping it would change
                  the document instead of its form.
                children:
                  - LintMark-Formatting-Inline-InlineNormalizer-WwwAddressKept
                tests:
                  - InlineSubsystem_Format_WwwAddress_IsKept

              - id: LintMark-Formatting-Inline-MailAddressesKept
                title: >-
                  The Inline subsystem shall keep an e-mail address and a mailto link as written.
                justification: |
                  A mail address renders differently when it is wrapped in angle brackets, so wrapping it would change
                  the document instead of its form.
                children:
                  - LintMark-Formatting-Inline-InlineNormalizer-MailAddressKept
                tests:
                  - InlineSubsystem_Format_MailAddress_IsKept

              - id: LintMark-Formatting-Inline-OnlyBareUrlsWrapped
                title: >-
                  The Inline subsystem shall wrap a URL in angle brackets only where it stands bare in the text of a
                  paragraph.
                justification: |
                  A URL that is already a link, or is attached to other text, or has a scheme that the parser does
                  not read as a bare URL, is not a bare URL, and wrapping it would change the link or the text.
                children:
                  - LintMark-Formatting-Inline-InlineNormalizer-UrlsAlreadyLinkedKept
                  - LintMark-Formatting-Inline-InlineNormalizer-UrlAttachedToTextKept
                  - LintMark-Formatting-Inline-InlineNormalizer-UpperCaseSchemeKept
                tests:
                  - InlineSubsystem_Format_UrlsThatAreNotBare_AreKept

              - id: LintMark-Formatting-Inline-MeaningKept
                title: >-
                  The Inline subsystem shall keep a paragraph as written when it cannot show that rewriting it keeps
                  how the paragraph renders.
                justification: |
                  A paragraph that renders differently after a rewrite is damaged. Emphasis next to other emphasis,
                  stray delimiter characters, link references, and unusual HTML make the effect of a change
                  uncertain, so the paragraph stays as it is while the rest of the file is still normalized.
                children:
                  - LintMark-Formatting-Inline-InlineNormalizer-NestedEmphasisKept
                  - LintMark-Formatting-Inline-InlineNormalizer-UnpairedDelimiterParagraphKept
                  - LintMark-Formatting-Inline-InlineNormalizer-BracketParagraphKeptWithReferences
                  - LintMark-Formatting-Inline-InlineNormalizer-ParagraphLeftWhenRenderingWouldChange
                tests:
                  - InlineSubsystem_Format_ParagraphThatMayRenderDifferently_IsLeftAlone
                  - InlineSubsystem_Format_ParagraphsThatCannotBeShownSafe_AreKept

              - id: LintMark-Formatting-Inline-DeterministicResult
                title: >-
                  The Inline subsystem shall propose the same changes for the same parsed document and configuration
                  when it is called from several threads at once as when it is called one after another.
                justification: |
                  Files are formatted in parallel, and a result that depended on timing could not be trusted.
                children:
                  - LintMark-Formatting-Inline-InlineNormalizer-DeterministicResult
                tests:
                  - InlineSubsystem_Format_ManyThreads_GiveTheSameResult
