---
# Inline Subsystem Requirements
#
# The Inline subsystem is part of the Formatting subsystem. It normalizes inline syntax, breaks text into lines
# without damaging constructs, and converts long inline links to reference links.

sections:
  - title: LintMark Requirements
    sections:
      - title: Formatting Requirements
        sections:
          - title: Inline Requirements
            requirements:
              - id: LintMark-Formatting-Inline-Normalization
                title: >-
                  The Inline subsystem shall write emphasis, strong text, bare URLs, and code-span padding in the
                  configured canonical form outside code, HTML, and links.
                justification: |
                  Inline syntax has many equivalent spellings, and one house style keeps differences small.
                children:
                  - LintMark-Formatting-Inline-InlineNormalizer-Emphasis
                  - LintMark-Formatting-Inline-InlineNormalizer-BareUrls
                  - LintMark-Formatting-Inline-InlineNormalizer-CodeSpanPadding
                tests:
                  - InlineSubsystem_Normalization_EmphasisStrongBareUrlAndCodeSpan_AreNormalizedOutsideCode

              - id: LintMark-Formatting-Inline-Wrapping
                title: >-
                  The Inline subsystem shall lay out the text of a paragraph into lines by display width, keeping
                  links, code spans, HTML, and hard breaks whole and never starting a line with block syntax.
                justification: |
                  A line break inside a construct, or one that makes a line read as a heading or list item, would
                  change the rendered document.
                children:
                  - LintMark-Formatting-Inline-AtomTokenizer-AtomsWhole
                  - LintMark-Formatting-Inline-AtomTokenizer-HardBreaks
                  - LintMark-Formatting-Inline-AtomTokenizer-Refusal
                  - LintMark-Formatting-Inline-LineWrapper-Fill
                  - LintMark-Formatting-Inline-LineWrapper-Sentences
                  - LintMark-Formatting-Inline-LineWrapper-Semantic
                  - LintMark-Formatting-Inline-LineWrapper-BlockSyntaxGuard
                tests:
                  - InlineSubsystem_Wrapping_AtomsLayoutAndGuard_KeepConstructsWholeAndAvoidBlockSyntax

              - id: LintMark-Formatting-Inline-LinkRefactor
                title: >-
                  The Inline subsystem shall, when enabled, convert long inline links to reference links with
                  unique labels and one definitions block.
                justification: |
                  Long link destinations make lines hard to read and wrap, and some teams prefer reference links.
                children:
                  - LintMark-Formatting-Inline-LinkRefactorer-Eligibility
                  - LintMark-Formatting-Inline-LinkRefactorer-Labels
                  - LintMark-Formatting-Inline-LinkRefactorer-Tables
                tests:
                  - InlineSubsystem_LinkRefactor_LongInlineLinks_BecomeReferenceLinksWithOneDefinitionsBlock
