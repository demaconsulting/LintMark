---
# Software Unit Requirements for the EditSet Unit
#
# EditSet collects the edits that rules propose for a document, rejects conflicts, applies the edits to the text, and
# composes the edits of successive stages.

sections:
  - title: LintMark Requirements
    sections:
      - title: Formatting Requirements
        sections:
          - title: EditSet Requirements
            requirements:
              - id: LintMark-Formatting-EditSet-Composition
                title: >-
                  The EditSet unit shall collect edits in a deterministic order that does not depend on the order they
                  were added, and shall reject edits that overlap or insert at the same position.
                justification: |
                  Formatting rules run independently, so a conflict is a defect that must be caught instead of
                  resolved silently, and the result must not depend on which rule ran first.
                tests:
                  - EditSet_Add_OverlappingEdit_Throws
                  - EditSet_Add_ContainedEdit_Throws
                  - EditSet_Add_TwoInsertionsAtSameOffset_Throws
                  - EditSet_Add_AdjacentEdits_Accepted
                  - EditSet_ToImmutable_AnyAddOrder_SameOrderedResult

              - id: LintMark-Formatting-EditSet-Patching
                title: >-
                  The EditSet unit shall apply a conflict-free set of edits to the text in one pass, and shall reject
                  an edit outside the text.
                justification: |
                  The written file is produced from the edits, so applying them must be exact and must never run
                  past the text.
                tests:
                  - SourcePatcher_Apply_ReplaceDeleteInsert_ProducesExpectedText
                  - SourcePatcher_Apply_EditAtEndOfText_Applies
                  - SourcePatcher_Apply_EditBeyondText_Throws
                  - SourcePatcher_Apply_OverlappingEdits_Throws
                  - SourcePatcher_Apply_UnicodeText_PatchesByUtf16Offsets

              - id: LintMark-Formatting-EditSet-Rebase
                title: >-
                  The EditSet unit shall compose the edits of a later stage with those of an earlier stage into edits
                  against the original text, in time proportional to the number of edits.
                justification: |
                  Some rules must run on text that earlier rules already changed, yet the result must be one patch of
                  the original, and large documents with thousands of edits must format quickly.
                tests:
                  - EditRebaser_Rebase_EditsOutsideEachOther_AreTranslated
                  - EditRebaser_Rebase_FirstEditInsideReplacedRange_IsAbsorbed
                  - EditRebaser_Rebase_RandomEdits_EqualApplyingTheListsInSequence
                  - EditRebaser_CreateOffsetMapper_OffsetsOfTheOutput_MapBackToTheOriginal
                  - EditRebaser_Rebase_VeryManyEdits_TakesTimeInProportionToTheirNumber
