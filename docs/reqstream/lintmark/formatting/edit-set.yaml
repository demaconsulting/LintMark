---
# Software Unit Requirements for the EditSet Class
#
# The EditSet class (with the TextEdit record) collects the changes that rules propose for one document and
# hands them out as an ordered, conflict-free list.

sections:
  - title: LintMark Requirements
    sections:
      - title: Formatting Requirements
        sections:
          - title: EditSet Requirements
            requirements:
              - id: LintMark-Formatting-EditSet-RejectsOverlap
                title: >-
                  The EditSet class shall refuse a change that covers a character that another change already
                  covers, and a second insertion at the same position.
                justification: |
                  Two changes to the same characters have no single correct result. Accepting them would let
                  the text depend on which rule ran first.
                tests:
                  - EditSet_Add_OverlappingEdit_Throws
                  - EditSet_Add_ContainedEdit_Throws
                  - EditSet_Add_EditContainingExistingEdit_Throws
                  - EditSet_Add_TwoInsertionsAtSameOffset_Throws
                  - EditSet_Add_InsertionStrictlyInsideReplacement_Throws
                  - EditSet_Add_ReplacementAroundExistingInsertion_Throws
                  - EditSet_Add_IdenticalRange_Throws
                  - EditSet_Add_DefaultEdit_Throws

              - id: LintMark-Formatting-EditSet-AllowsAdjacent
                title: >-
                  The EditSet class shall accept changes that touch without sharing a character, including an
                  insertion at the end of another change.
                justification: |
                  Rules that change neighboring text, for example a line and the blank line after it, must
                  not be mistaken for conflicting.
                tests:
                  - EditSet_Add_AdjacentEdits_Accepted
                  - EditSet_Add_InsertionAtEndOfReplacement_Accepted

              - id: LintMark-Formatting-EditSet-OrderedSnapshot
                title: >-
                  The EditSet class shall hand out its changes in ascending order of position, an insertion
                  before a replacement that starts at the same position, whatever the order in which the changes
                  were added, and shall not let later additions alter a list that was handed out.
                justification: |
                  The rewritten text must not depend on the order in which rules ran, and a list that is being
                  applied must not change under the applier.
                tests:
                  - EditSet_ToImmutable_AnyAddOrder_SameOrderedResult
                  - EditSet_Add_InsertionBeforeReplacementAtSameStart_OrdersInsertionFirst
                  - EditSet_ToImmutable_NoEdits_ReturnsEmpty
                  - EditSet_ToImmutable_LaterAdds_DoNotChangeEarlierSnapshot

              - id: LintMark-Formatting-EditSet-ImmutableResults
                title: The EditSet class shall hand out its changes in a form that their holders cannot change.
                justification: |
                  The list is passed between the formatting and the safety logic. A list that anyone could
                  modify, even through a cast, would make the result depend on who touched it.
                tests:
                  - EditSet_ToImmutable_CastToMutableTypes_CannotBeModified

              - id: LintMark-Formatting-EditSet-ValidatesEdits
                title: >-
                  The TextEdit record shall refuse a negative position or length, a range that extends beyond the
                  largest position, a missing replacement, and a missing or empty rule identifier, and shall expose
                  the values that it was created with and the position where its range ends.
                justification: |
                  A change that cannot describe a range of the text must never exist, and every change must
                  name the rule that proposed it so that a refusal can be traced.
                tests:
                  - TextEdit_Constructor_AllArguments_ExposesValues
                  - TextEdit_Constructor_NegativeStart_Throws
                  - TextEdit_Constructor_NegativeLength_Throws
                  - TextEdit_Constructor_NullReplacement_Throws
                  - TextEdit_Constructor_NullRuleId_Throws
                  - TextEdit_Constructor_EmptyRuleId_Throws
                  - TextEdit_Constructor_StartPlusLengthOverflow_Throws
                  - TextEdit_Constructor_RangeEndingAtMaxValue_Accepted
                  - TextEdit_End_AnyEdit_ReturnsStartPlusLength
                  - TextEdit_Equals_SameValues_AreEqual

              - id: LintMark-Formatting-EditSet-ReportsContents
                title: The EditSet class shall report how many changes it holds and whether it holds none.
                justification: |
                  Callers skip the rewrite of a document for which no change was proposed.
                tests:
                  - EditSet_Count_AfterAdds_CountsEdits
                  - EditSet_IsEmpty_NewSet_IsTrue
