---
# Blocks Subsystem Requirements
#
# The Blocks subsystem is part of the Formatting subsystem. It holds the formatters that write each kind of block
# in canonical form: headings, code blocks, thematic breaks, lists, block quotes, tables, and paragraphs.

sections:
  - title: LintMark Requirements
    sections:
      - title: Formatting Requirements
        sections:
          - title: Blocks Requirements
            requirements:
              - id: LintMark-Formatting-Blocks-LeafBlocks
                title: >-
                  The Blocks subsystem shall write headings, code blocks, and thematic breaks in the configured
                  canonical form.
                justification: |
                  Users want one house style for these blocks, and a document that already follows it must not
                  change.
                children:
                  - LintMark-Formatting-Blocks-HeadingFormatter-Style
                  - LintMark-Formatting-Blocks-HeadingFormatter-Spacing
                  - LintMark-Formatting-Blocks-CodeBlockFormatter-Style
                  - LintMark-Formatting-Blocks-CodeBlockFormatter-ContentKept
                  - LintMark-Formatting-Blocks-ThematicBreakFormatter-Style
                  - LintMark-Formatting-Blocks-ThematicBreakFormatter-NeverConfused
                tests:
                  - BlocksSubsystem_LeafBlocks_HeadingCodeAndThematicBreak_AreWrittenCanonically

              - id: LintMark-Formatting-Blocks-Containers
                title: >-
                  The Blocks subsystem shall write lists and block quotes in the configured canonical form
                  without merging, splitting, or changing the meaning of what they contain.
                justification: |
                  Lists and quotes hold other blocks, so rewriting them must not change the structure of the
                  document.
                children:
                  - LintMark-Formatting-Blocks-ListFormatter-BulletMarker
                  - LintMark-Formatting-Blocks-ListFormatter-Numbering
                  - LintMark-Formatting-Blocks-ListFormatter-Indentation
                  - LintMark-Formatting-Blocks-ListFormatter-StructureKept
                  - LintMark-Formatting-Blocks-BlockQuoteFormatter-MarkerSpacing
                  - LintMark-Formatting-Blocks-BlockQuoteFormatter-ContentKept
                tests:
                  - BlocksSubsystem_Containers_ListAndBlockQuote_AreWrittenCanonically

              - id: LintMark-Formatting-Blocks-Tables
                title: >-
                  The Blocks subsystem shall write pipe tables in the compact or the aligned layout and leave
                  tables it cannot read with certainty as written.
                justification: |
                  Tables are edited often, and a consistent layout keeps differences small, but a damaged table
                  must never be rewritten into something else.
                children:
                  - LintMark-Formatting-Blocks-TableFormatter-PipeStyle
                  - LintMark-Formatting-Blocks-TableFormatter-Aligned
                  - LintMark-Formatting-Blocks-TableFormatter-InvalidLeftAlone
                tests:
                  - BlocksSubsystem_Tables_PipeTable_IsWrittenCompactOrAligned

              - id: LintMark-Formatting-Blocks-Paragraphs
                title: >-
                  The Blocks subsystem shall rewrap a paragraph only when a line is wider than the line length
                  and can be broken, and in the sentence and semantic layouts place line breaks at sentences or
                  clauses.
                justification: |
                  Rewrapping everything would produce huge differences, so only paragraphs that really overflow
                  may change, while teams that put one sentence per line need a layout that keeps it.
                children:
                  - LintMark-Formatting-Blocks-ParagraphFormatter-OverflowFill
                  - LintMark-Formatting-Blocks-ParagraphFormatter-SentenceLayout
                  - LintMark-Formatting-Blocks-ParagraphFormatter-SemanticLayout
                  - LintMark-Formatting-Blocks-ParagraphFormatter-KeptAsWritten
                tests:
                  - BlocksSubsystem_Paragraphs_OverflowOnlyFill_RewrapsOnlyTheParagraphThatOverflows
