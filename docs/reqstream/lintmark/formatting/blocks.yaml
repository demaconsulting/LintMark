---
# Blocks Subsystem Requirements
#
# PURPOSE:
# - Define requirements for the LintMark Blocks subsystem, which is part of the Formatting subsystem
# - The Blocks subsystem holds the block formatters of the tool: one for headings, one for code blocks, one for
#   thematic breaks, one for lists, and one for block quotes. Each proposes the changes that bring one kind of block
#   into canonical form
# - Subsystem requirements describe what the block formatters guarantee together, with the real parser and the
#   document formatter that drives them

sections:
  - title: LintMark Requirements
    sections:
      - title: Formatting Requirements
        sections:
          - title: Blocks Requirements
            requirements:
              - id: LintMark-Formatting-Blocks-HeadingFormatterProvided
                title: >-
                  The Blocks subsystem shall provide a block formatter that proposes the changes that write each
                  heading of a document in the ATX form, with one space after its number signs, no closing number
                  signs, no indentation, and no trailing whitespace.
                justification: |
                  Headings have more than one way of being written in Markdown. One way makes the documents of a
                  project consistent.
                children:
                  - LintMark-Formatting-Blocks-HeadingFormatter-AcceptsHeadings
                  - LintMark-Formatting-Blocks-HeadingFormatter-RejectsMissingArguments
                  - LintMark-Formatting-Blocks-HeadingFormatter-RejectsOtherBlocks
                  - LintMark-Formatting-Blocks-HeadingFormatter-RuleIdsImmutable
                tests:
                  - BlocksSubsystem_Format_DocumentBreakingEveryRule_ProducesTheCanonicalDocument
                  - BlocksSubsystem_Format_SetextVariants_AreConvertedOnlyWhereSafe

              - id: LintMark-Formatting-Blocks-CodeBlockFormatterProvided
                title: >-
                  The Blocks subsystem shall provide a block formatter that proposes the changes that write each
                  code block of a document as a fenced code block with the configured fence character and no
                  trailing whitespace on its fence lines.
                justification: |
                  Code blocks have more than one way of being written in Markdown. One way makes the documents of a
                  project consistent.
                children:
                  - LintMark-Formatting-Blocks-CodeBlockFormatter-AcceptsClosedCodeBlocks
                  - LintMark-Formatting-Blocks-CodeBlockFormatter-RejectsMissingArguments
                  - LintMark-Formatting-Blocks-CodeBlockFormatter-RejectsOtherBlocks
                  - LintMark-Formatting-Blocks-CodeBlockFormatter-RuleIdsImmutable
                tests:
                  - BlocksSubsystem_Format_DocumentBreakingEveryRule_ProducesTheCanonicalDocument
                  - BlocksSubsystem_Format_IndentedCodeVariants_BecomeFencedCode

              - id: LintMark-Formatting-Blocks-ThematicBreakFormatterProvided
                title: >-
                  The Blocks subsystem shall provide a block formatter that proposes the changes that write each
                  thematic break of a document as three characters of the configured style, with no trailing
                  whitespace.
                justification: |
                  Thematic breaks have more than one way of being written in Markdown. One way makes the documents
                  of a project consistent.
                children:
                  - LintMark-Formatting-Blocks-ThematicBreakFormatter-AcceptsThematicBreaks
                  - LintMark-Formatting-Blocks-ThematicBreakFormatter-RejectsMissingArguments
                  - LintMark-Formatting-Blocks-ThematicBreakFormatter-RejectsOtherBlocks
                  - LintMark-Formatting-Blocks-ThematicBreakFormatter-RuleIdsImmutable
                tests:
                  - BlocksSubsystem_Format_DocumentBreakingEveryRule_ProducesTheCanonicalDocument
                  - BlocksSubsystem_Format_ThematicBreakVariants_KeepTheMeaning

              - id: LintMark-Formatting-Blocks-HeadingStyle
                title: >-
                  The Blocks subsystem shall write each setext heading in the ATX form, except where the
                  conversion could change the meaning of the text.
                justification: |
                  One heading style makes a document consistent. A setext heading that is nested, spans several
                  lines, or has text that would read differently as an ATX heading stays as it is, because the
                  conversion could change what the document means.
                children:
                  - LintMark-Formatting-Blocks-HeadingFormatter-SetextToAtx
                  - LintMark-Formatting-Blocks-HeadingFormatter-SetextMultiLineKept
                  - LintMark-Formatting-Blocks-HeadingFormatter-SetextNestedKept
                  - LintMark-Formatting-Blocks-HeadingFormatter-SetextLookalikeKept
                tests:
                  - BlocksSubsystem_Format_SetextVariants_AreConvertedOnlyWhereSafe
                  - BlocksSubsystem_Format_DocumentBreakingEveryRule_ProducesTheCanonicalDocument

              - id: LintMark-Formatting-Blocks-HeadingClosingSigns
                title: >-
                  The Blocks subsystem shall remove the closing number signs of each ATX heading, but keep
                  number signs that belong to its text.
                justification: |
                  Closing number signs add nothing to a heading. Number signs that end the text, such as in
                  `# C#`, are part of the text, and removing them would change what the heading says.
                children:
                  - LintMark-Formatting-Blocks-HeadingFormatter-ClosedToOpen
                  - LintMark-Formatting-Blocks-HeadingFormatter-TextNumberSignsKept
                  - LintMark-Formatting-Blocks-HeadingFormatter-EmptyHeadingKept
                tests:
                  - BlocksSubsystem_Format_ClosedHeadingVariants_LoseOnlyTheClosingSequence
                  - BlocksSubsystem_Format_DocumentBreakingEveryRule_ProducesTheCanonicalDocument

              - id: LintMark-Formatting-Blocks-HeadingSpace
                title: >-
                  The Blocks subsystem shall put exactly one space between the number signs of each heading and
                  its text.
                justification: |
                  Extra spaces have no meaning. Text such as `#Title` is a paragraph, and adding the space would
                  change how the document renders.
                children:
                  - LintMark-Formatting-Blocks-HeadingFormatter-SingleSpaceAfterMarker
                  - LintMark-Formatting-Blocks-HeadingFormatter-MissingSpaceKept
                tests:
                  - BlocksSubsystem_Format_BlanksAfterNumberSigns_BecomeOneSpaceAndMissingSpaceIsKept
                  - BlocksSubsystem_Format_DocumentBreakingEveryRule_ProducesTheCanonicalDocument

              - id: LintMark-Formatting-Blocks-HeadingStartLeft
                title: >-
                  The Blocks subsystem shall remove the indentation of each heading that is not inside a quote
                  or list.
                justification: |
                  An indented heading looks like a mistake, and the indentation of a heading inside a quote or
                  list belongs to the container.
                children:
                  - LintMark-Formatting-Blocks-HeadingFormatter-IndentationRemoved
                tests:
                  - BlocksSubsystem_Format_HeadingIndentation_IsRemovedOnlyOutsideContainers
                  - BlocksSubsystem_Format_DocumentBreakingEveryRule_ProducesTheCanonicalDocument

              - id: LintMark-Formatting-Blocks-ThematicBreakStyle
                title: >-
                  The Blocks subsystem shall write each thematic break as three characters of the configured
                  style, except where the conversion could change the meaning of the document.
                justification: |
                  One way to write a break makes a document consistent. A line of dashes under text would turn
                  the text into a heading, and one at the top of a file could start front matter, so such a
                  break stays as written.
                children:
                  - LintMark-Formatting-Blocks-ThematicBreakFormatter-ConvertedToConfiguredStyle
                  - LintMark-Formatting-Blocks-ThematicBreakFormatter-IndentationKept
                  - LintMark-Formatting-Blocks-ThematicBreakFormatter-SetextGuard
                  - LintMark-Formatting-Blocks-ThematicBreakFormatter-FrontMatterGuard
                  - LintMark-Formatting-Blocks-ThematicBreakFormatter-ListMarkerGuard
                  - LintMark-Formatting-Blocks-ThematicBreakFormatter-GridBorderGuard
                tests:
                  - BlocksSubsystem_Format_ThematicBreakVariants_KeepTheMeaning
                  - BlocksSubsystem_Format_BreakAfterPlusListMarker_StaysAsWritten
                  - BlocksSubsystem_Format_ConfiguredSettings_SelectTheCanonicalForm

              - id: LintMark-Formatting-Blocks-CodeFenceStyle
                title: >-
                  The Blocks subsystem shall write the fence of each fenced code block with the configured fence
                  character, except where the conversion could change the meaning of the block.
                justification: |
                  One fence character makes a document consistent. A fence whose content or info string would
                  no longer be valid, and a fence that is part of Pandoc syntax, keeps its character.
                children:
                  - LintMark-Formatting-Blocks-CodeBlockFormatter-FenceCharacterConverted
                  - LintMark-Formatting-Blocks-CodeBlockFormatter-FenceLengthStaysValid
                  - LintMark-Formatting-Blocks-CodeBlockFormatter-BacktickInfoKept
                  - LintMark-Formatting-Blocks-CodeBlockFormatter-BracedFenceKept
                  - LintMark-Formatting-Blocks-CodeBlockFormatter-NestedFenceConverted
                tests:
                  - BlocksSubsystem_Format_TildeFenceEdgeCases_AreSafe
                  - BlocksSubsystem_Format_BracedFence_KeepsItsFenceCharacter
                  - BlocksSubsystem_Format_ConfiguredSettings_SelectTheCanonicalForm

              - id: LintMark-Formatting-Blocks-CodeBlockStyle
                title: >-
                  The Blocks subsystem shall write each indented code block that is not inside a quote or list
                  as a fenced code block with the same content.
                justification: |
                  Fenced code is explicit and can carry a language. An indented block inside a list or quote is
                  also indented by its container, so it stays as it is.
                children:
                  - LintMark-Formatting-Blocks-CodeBlockFormatter-IndentedBecomesFenced
                  - LintMark-Formatting-Blocks-CodeBlockFormatter-IndentedWideBlankLineKept
                  - LintMark-Formatting-Blocks-CodeBlockFormatter-IndentedNestedKept
                  - LintMark-Formatting-Blocks-CodeBlockFormatter-IndentedFrontMatterGuard
                tests:
                  - BlocksSubsystem_Format_IndentedCodeVariants_BecomeFencedCode
                  - BlocksSubsystem_Format_IndentedCodeEndingWithWideWhitespaceLine_KeepsItsContent

              - id: LintMark-Formatting-Blocks-HeadingTrailingWhitespaceRemoved
                title: >-
                  The Blocks subsystem shall remove the trailing whitespace from the lines of the headings that it
                  formats, but not behind the final backslash of a line of a setext heading that stays setext.
                justification: |
                  Trailing whitespace carries no meaning on a heading line. Behind a backslash that ends a line of
                  a setext heading it would turn into a hard break if removed.
                children:
                  - LintMark-Formatting-Blocks-HeadingFormatter-TrailingWhitespaceRemoved
                  - LintMark-Formatting-Blocks-HeadingFormatter-SetextBackslashSpacesKept
                tests:
                  - BlocksSubsystem_Format_HeadingTrailingWhitespace_IsRemoved

              - id: LintMark-Formatting-Blocks-FenceTrailingWhitespaceRemoved
                title: >-
                  The Blocks subsystem shall remove the trailing whitespace from the opening and closing fence
                  lines of the code blocks that it formats.
                justification: |
                  Trailing whitespace carries no meaning on a fence line. Inside the code that a fence encloses it
                  is content, so only the lines of the fences are cleaned.
                children:
                  - LintMark-Formatting-Blocks-CodeBlockFormatter-FenceLineTrailingWhitespace
                tests:
                  - BlocksSubsystem_Format_FenceLineTrailingWhitespace_IsRemovedAndContentKept

              - id: LintMark-Formatting-Blocks-BreakTrailingWhitespaceRemoved
                title: >-
                  The Blocks subsystem shall remove the trailing whitespace from the lines of the thematic breaks
                  that it formats, also when the characters of the break stay as written.
                justification: |
                  Trailing whitespace carries no meaning on a break line.
                children:
                  - LintMark-Formatting-Blocks-ThematicBreakFormatter-TrailingWhitespaceRemoved
                tests:
                  - BlocksSubsystem_Format_BreakTrailingWhitespace_IsRemoved

              - id: LintMark-Formatting-Blocks-TabsExpanded
                title: >-
                  The Blocks subsystem shall replace the tabs in the text of a heading by spaces, but not those
                  that are part of a code span or other literal text.
                justification: |
                  A tab in the text of a heading is shown at different widths in different tools. A tab inside a
                  code span is content.
                children:
                  - LintMark-Formatting-Blocks-HeadingFormatter-TabsExpanded
                  - LintMark-Formatting-Blocks-HeadingFormatter-ProtectedSpansKept
                tests:
                  - BlocksSubsystem_Format_Tabs_AreExpandedOnlyInPlainText
                  - BlocksSubsystem_Format_TabAfterNumberSigns_IsHandledSafely

              - id: LintMark-Formatting-Blocks-CodeContentKept
                title: >-
                  The Blocks subsystem shall never change the content of a code block.
                justification: |
                  The content of code is the author's, whitespace included. Only the fence lines, or the
                  indentation of an indented block, change.
                children:
                  - LintMark-Formatting-Blocks-CodeBlockFormatter-ContentUnchanged
                tests:
                  - BlocksSubsystem_Format_TildeFenceEdgeCases_AreSafe
                  - BlocksSubsystem_Format_IndentedCodeVariants_BecomeFencedCode

              - id: LintMark-Formatting-Blocks-NestedBlocksKept
                title: >-
                  The Blocks subsystem shall keep the quote and list structure around each block that it changes.
                justification: |
                  A change to a block inside a quote or list must not move the block out of its container or
                  change which text belongs to it.
                children:
                  - LintMark-Formatting-Blocks-HeadingFormatter-NestedHeadingKept
                  - LintMark-Formatting-Blocks-HeadingFormatter-SetextNestedKept
                  - LintMark-Formatting-Blocks-CodeBlockFormatter-NestedFenceConverted
                  - LintMark-Formatting-Blocks-ThematicBreakFormatter-ConvertedInContainer
                tests:
                  - BlocksSubsystem_Format_NestedContainers_KeepTheStructure

              - id: LintMark-Formatting-Blocks-UnclosedFencesKept
                title: >-
                  The Blocks subsystem shall leave a fenced code block that is never closed exactly as it is.
                justification: |
                  The parser cannot say where such a block ends, so no change to it can be shown to keep its
                  meaning.
                children:
                  - LintMark-Formatting-Blocks-CodeBlockFormatter-UnclosedFenceKept
                tests:
                  - BlocksSubsystem_Format_UnclosedFence_StaysAsWritten

              - id: LintMark-Formatting-Blocks-SuppressedBlocksKept
                title: >-
                  The Blocks subsystem shall leave a block exactly as it is when a suppression comment of the
                  document disables a rule of its block formatter there.
                justification: |
                  An author who switched a rule off for a passage expects the passage to stay as written. A next-line
                  directive keeps its place directly above the line it covers.
                children:
                  - LintMark-Formatting-Blocks-HeadingFormatter-SuppressedRuleKept
                  - LintMark-Formatting-Blocks-CodeBlockFormatter-SuppressedRuleKept
                  - LintMark-Formatting-Blocks-ThematicBreakFormatter-SuppressedRuleKept
                  - LintMark-Formatting-Blocks-ListFormatter-SuppressedRuleKeptByIdentifier
                  - LintMark-Formatting-Blocks-ListFormatter-SuppressedRuleKeptByAlias
                  - LintMark-Formatting-Blocks-BlockQuoteFormatter-SuppressedRuleKeptByIdentifier
                  - LintMark-Formatting-Blocks-BlockQuoteFormatter-SuppressedRuleKeptByAlias
                tests:
                  - BlocksSubsystem_Format_SuppressedBlocks_AreKeptAndTheOthersAreFormatted
                  - BlocksSubsystem_Format_SuppressedWithNextLineDirective_KeepsOnlyThatBlock
                  - BlocksSubsystem_Format_NextLineDirectiveBeforeBlock_KeepsTheDirectiveWithItsLine
                  - BlocksSubsystem_Format_ListOrQuoteRuleSuppressed_LeavesThem

              - id: LintMark-Formatting-Blocks-BlocksFormattedWhereEnabled
                title: >-
                  The Blocks subsystem shall format the blocks that follow a suppression comment that enables the
                  rule of their block formatter again.
                justification: |
                  A rule that is switched on again formats the passages after it, so a switched-off passage does not
                  keep the rest of the document from being formatted.
                children:
                  - LintMark-Formatting-Blocks-ListFormatter-ListAfterEnabledAgainFormatted
                tests:
                  - BlocksSubsystem_Format_SuppressedBlocks_AreKeptAndTheOthersAreFormatted
                  - BlocksSubsystem_Format_SuppressedWithNextLineDirective_KeepsOnlyThatBlock

              - id: LintMark-Formatting-Blocks-EditsAttributedToRules
                title: >-
                  The Blocks subsystem shall attribute each change that it proposes to the rule that the change
                  enforces.
                justification: |
                  The rule of a change decides how it is reported and which suppression comment switches it off.
                children:
                  - LintMark-Formatting-Blocks-HeadingFormatter-EditsUnderOwnRule
                  - LintMark-Formatting-Blocks-CodeBlockFormatter-EditsUnderOwnRule
                  - LintMark-Formatting-Blocks-ThematicBreakFormatter-EditsUnderOwnRule
                  - LintMark-Formatting-Blocks-ListFormatter-EditsUnderOwnRule
                  - LintMark-Formatting-Blocks-BlockQuoteFormatter-EditsUnderOwnRule
                tests:
                  - BlocksSubsystem_Format_DocumentBreakingEveryRule_ReportsEveryRuleOnce
                  - BlocksSubsystem_Format_DirtyListsAndQuotes_ReportsEachListAndQuoteRuleOnItsLine

              - id: LintMark-Formatting-Blocks-CanonicalBlocksUnchanged
                title: >-
                  The Blocks subsystem shall propose no change for a heading, code block, thematic break, list, or
                  block quote that is already in canonical form.
                justification: |
                  A canonical file must not be reported or rewritten, and the result of a rewrite must not need
                  another one.
                children:
                  - LintMark-Formatting-Blocks-HeadingFormatter-CanonicalUnchanged
                  - LintMark-Formatting-Blocks-CodeBlockFormatter-CanonicalUnchanged
                  - LintMark-Formatting-Blocks-ThematicBreakFormatter-CanonicalUnchanged
                  - LintMark-Formatting-Blocks-ListFormatter-CanonicalUnchanged
                  - LintMark-Formatting-Blocks-BlockQuoteFormatter-CanonicalUnchanged
                tests:
                  - BlocksSubsystem_Format_CanonicalDocument_ProposesNothing
                  - BlocksSubsystem_Format_FormattedTwice_ChangesNothingTheSecondTime
                  - BlocksSubsystem_Format_ListsAndQuotes_ChangeNothingTheSecondTime

              - id: LintMark-Formatting-Blocks-LineEndingsKept
                title: >-
                  The Blocks subsystem shall propose the same changes for a document with CRLF or mixed line
                  endings as for the same document with LF line endings.
                justification: |
                  The line ending is not part of the text that the rules judge, so it must not change what the
                  rules propose, and the rewritten file keeps the line endings it is given.
                children:
                  - LintMark-Formatting-Blocks-HeadingFormatter-LineEndingsKept
                  - LintMark-Formatting-Blocks-CodeBlockFormatter-LineEndingsKept
                  - LintMark-Formatting-Blocks-ThematicBreakFormatter-LineEndingsKept
                  - LintMark-Formatting-Blocks-ListFormatter-LineEndingsKept
                  - LintMark-Formatting-Blocks-BlockQuoteFormatter-LineEndingsKept
                tests:
                  - BlocksSubsystem_Format_DirtyDocumentWithCrlf_ProposesTheSameEdits
                  - BlocksSubsystem_Format_DirtyDocumentWithCrlfAndBom_KeepsLineEndingsAndMark
                  - BlocksSubsystem_Format_MixedLineEndings_AreWrittenWithTheMajorityEnding
                  - BlocksSubsystem_Format_ListsAndQuotes_ChangeNothingTheSecondTime

              - id: LintMark-Formatting-Blocks-ByteOrderMarkKept
                title: >-
                  The Blocks subsystem shall propose the same changes for a document with a byte order mark as for
                  the same document without one.
                justification: |
                  The byte order mark is not part of the text that the rules judge, so it must not change what
                  the rules propose, and the rewritten file keeps its mark.
                children:
                  - LintMark-Formatting-Blocks-HeadingFormatter-ByteOrderMarkKept
                  - LintMark-Formatting-Blocks-CodeBlockFormatter-ByteOrderMarkKept
                  - LintMark-Formatting-Blocks-ThematicBreakFormatter-ByteOrderMarkKept
                  - LintMark-Formatting-Blocks-ListFormatter-ByteOrderMarkKept
                  - LintMark-Formatting-Blocks-BlockQuoteFormatter-ByteOrderMarkKept
                tests:
                  - BlocksSubsystem_Format_DirtyDocumentWithByteOrderMark_ProposesTheSameEdits
                  - BlocksSubsystem_Format_DirtyDocumentWithCrlfAndBom_KeepsLineEndingsAndMark
                  - BlocksSubsystem_Format_ListsAndQuotes_ChangeNothingTheSecondTime

              - id: LintMark-Formatting-Blocks-DeterministicResult
                title: >-
                  The Blocks subsystem shall propose the same changes for the same parsed document and
                  configuration when its block formatters are called from several threads at once as when they
                  are called one after another.
                justification: |
                  Files are formatted in parallel, and a result that depended on timing could not be trusted.
                children:
                  - LintMark-Formatting-Blocks-HeadingFormatter-DeterministicResult
                  - LintMark-Formatting-Blocks-CodeBlockFormatter-DeterministicResult
                  - LintMark-Formatting-Blocks-ThematicBreakFormatter-DeterministicResult
                  - LintMark-Formatting-Blocks-ListFormatter-DeterministicResult
                  - LintMark-Formatting-Blocks-BlockQuoteFormatter-DeterministicResult
                tests:
                  - BlocksSubsystem_Format_SameDocumentOnManyThreads_GivesTheSameResult
                  - BlocksSubsystem_Format_DirtyListsAndQuotesOnManyThreads_GiveTheSameResult

              - id: LintMark-Formatting-Blocks-ListFormatterProvided
                title: >-
                  The Blocks subsystem shall provide a block formatter that proposes the changes that write each list
                  of a document with the configured marker character, numbers in the configured style, items in one
                  column, nested bullet lists indented as configured, and one space after each marker.
                justification: |
                  Lists have more than one way of being written in Markdown. One way makes the documents of a project
                  consistent.
                children:
                  - LintMark-Formatting-Blocks-ListFormatter-AcceptsOutermostLists
                  - LintMark-Formatting-Blocks-ListFormatter-RejectsMissingArguments
                  - LintMark-Formatting-Blocks-ListFormatter-RejectsOtherBlocks
                  - LintMark-Formatting-Blocks-ListFormatter-RuleIdsImmutable
                tests:
                  - BlocksSubsystem_Format_ListForms_AreCanonical

              - id: LintMark-Formatting-Blocks-BlockQuoteFormatterProvided
                title: >-
                  The Blocks subsystem shall provide a block formatter that proposes the changes that write each
                  block quote of a document with one space after each quote marker.
                justification: |
                  Block quotes have more than one way of being written in Markdown. One way makes the documents of a
                  project consistent.
                children:
                  - LintMark-Formatting-Blocks-BlockQuoteFormatter-AcceptsOutermostQuotes
                  - LintMark-Formatting-Blocks-BlockQuoteFormatter-RejectsMissingArguments
                  - LintMark-Formatting-Blocks-BlockQuoteFormatter-RejectsOtherBlocks
                  - LintMark-Formatting-Blocks-BlockQuoteFormatter-RuleIdsImmutable
                tests:
                  - BlocksSubsystem_Format_QuoteForms_AreCanonical

              - id: LintMark-Formatting-Blocks-BulletMarkerStyle
                title: >-
                  The Blocks subsystem shall write the marker of each item of a bullet list as the configured marker
                  character, except where that could change the meaning of the document.
                justification: |
                  One marker character makes the lists of a project consistent. A marker that would turn an item into
                  a thematic break or a grid table border, or that belongs to an empty item, stays as it is, because
                  the conversion could change what the document means. A marker that moves no text is written even
                  where the columns of the list stay as written.
                children:
                  - LintMark-Formatting-Blocks-ListFormatter-MarkerCharacterConverted
                  - LintMark-Formatting-Blocks-ListFormatter-MarkersChangedInContainers
                  - LintMark-Formatting-Blocks-ListFormatter-MarkersWrittenWhenColumnsKept
                  - LintMark-Formatting-Blocks-ListFormatter-ThematicBreakLookalikeKept
                  - LintMark-Formatting-Blocks-ListFormatter-ItemBreakTextKept
                  - LintMark-Formatting-Blocks-ListFormatter-EmptyItemKeepsMarkers
                  - LintMark-Formatting-Blocks-ListFormatter-GridBorderLookalikeKept
                tests:
                  - BlocksSubsystem_Format_ListForms_AreCanonical
                  - BlocksSubsystem_Format_BulletLists_AreNeverMergedOrSplit

              - id: LintMark-Formatting-Blocks-ListsNeverMergedOrSplit
                title: >-
                  The Blocks subsystem shall never merge two lists into one or split a list into two when it writes
                  the markers of lists.
                justification: |
                  Two lists that differ only by their markers are two lists, and the items of one list must stay one
                  list. Merging or splitting lists changes how the document renders.
                children:
                  - LintMark-Formatting-Blocks-ListFormatter-AllItemsConvertedTogether
                  - LintMark-Formatting-Blocks-ListFormatter-AdjacentListsKept
                  - LintMark-Formatting-Blocks-ListFormatter-SeparatedListsConverted
                tests:
                  - BlocksSubsystem_Format_BulletLists_AreNeverMergedOrSplit

              - id: LintMark-Formatting-Blocks-OrderedNumbering
                title: >-
                  The Blocks subsystem shall number the items of each ordered list in the configured style, starting
                  from the number that its first item has: one higher for each item in the incrementing style, and
                  the same number for every item in the one style.
                justification: |
                  Counting numbers show the position of each item, and numbers that are all the same let items be
                  inserted without renumbering. The first number and the delimiter decide how the list renders, so
                  they stay as written, and a list whose numbers cannot be written safely keeps the numbers it has.
                children:
                  - LintMark-Formatting-Blocks-ListFormatter-NumbersIncrementFromFirst
                  - LintMark-Formatting-Blocks-ListFormatter-NumbersRepeatFirst
                  - LintMark-Formatting-Blocks-ListFormatter-FirstNumberKept
                  - LintMark-Formatting-Blocks-ListFormatter-DelimiterKept
                  - LintMark-Formatting-Blocks-ListFormatter-NumbersKeptWhenItemsCannotMove
                  - LintMark-Formatting-Blocks-ListFormatter-LeadingZerosKept
                  - LintMark-Formatting-Blocks-ListFormatter-NumbersBeyondNineDigitsKept
                tests:
                  - BlocksSubsystem_Format_ListForms_AreCanonical

              - id: LintMark-Formatting-Blocks-ListItemsAligned
                title: >-
                  The Blocks subsystem shall start the items of each list in the same column, except where the
                  structure of the list depends on its columns.
                justification: |
                  Items in different columns look like a mistake and can change which item a line belongs to. Where a
                  line, a tab, a quote, a footnote, or a table depends on the exact columns, moving the items could
                  change the meaning, so the columns stay as written.
                children:
                  - LintMark-Formatting-Blocks-ListFormatter-ItemsAlignedToFirst
                tests:
                  - BlocksSubsystem_Format_ListForms_AreCanonical
                  - BlocksSubsystem_Format_ListStructure_IsKept

              - id: LintMark-Formatting-Blocks-ListStartsAtMargin
                title: >-
                  The Blocks subsystem shall start each bullet list at the top level of a document at the left
                  margin, except where the structure of the list depends on its columns.
                justification: |
                  An indented list at the top level looks like a mistake and can be read as code. Where a line, a
                  tab, or a table depends on the exact columns, moving the list could change the meaning, so the
                  columns stay as written.
                children:
                  - LintMark-Formatting-Blocks-ListFormatter-TopLevelBulletsStartAtMargin
                tests:
                  - BlocksSubsystem_Format_ListForms_AreCanonical
                  - BlocksSubsystem_Format_ListStructure_IsKept

              - id: LintMark-Formatting-Blocks-NestedBulletIndent
                title: >-
                  The Blocks subsystem shall indent a bullet list inside the item of a bullet list by the configured
                  number of spaces, except where the structure of the list depends on its columns.
                justification: |
                  One indentation for nested bullet lists makes the lists of a project consistent. Where the columns
                  carry the meaning of the list, they stay as written.
                children:
                  - LintMark-Formatting-Blocks-ListFormatter-BulletInBulletIndented
                tests:
                  - BlocksSubsystem_Format_ListForms_AreCanonical
                  - BlocksSubsystem_Format_ListStructure_IsKept

              - id: LintMark-Formatting-Blocks-ListMarkerSpace
                title: >-
                  The Blocks subsystem shall write exactly one space between the marker of a list item and its
                  text, except where the spaces make the text indented code or the structure of the list depends on
                  its columns.
                justification: |
                  Extra spaces after a marker have no meaning and make the lists of a project inconsistent. With
                  five spaces the text is a code block, and removing spaces would change the block. Where a lazy line,
                  a tab, or a table depends on the exact columns, the spaces stay as written.
                children:
                  - LintMark-Formatting-Blocks-ListFormatter-SpacesAfterMarkerNormalized
                  - LintMark-Formatting-Blocks-ListFormatter-IndentedCodeAfterMarkerKept
                tests:
                  - BlocksSubsystem_Format_ListForms_AreCanonical
                  - BlocksSubsystem_Format_ListStructure_IsKept

              - id: LintMark-Formatting-Blocks-ListStructureKept
                title: >-
                  The Blocks subsystem shall keep the structure of each list that it changes, so that every line and
                  block stays in the item it belongs to.
                justification: |
                  The text of an item, code and tables included, must move with its marker, while a list whose lines
                  belong to it by their position, that lies in a quote, or that is next to a line that could join it
                  keeps its columns, a list in a footnote is left as written, and a list that is nested in another
                  kind of list keeps its offset to the item. A loose list stays loose and a tight list stays tight.
                children:
                  - LintMark-Formatting-Blocks-ListFormatter-WidthChangeMovesContent
                  - LintMark-Formatting-Blocks-ListFormatter-ItemContentKept
                  - LintMark-Formatting-Blocks-ListFormatter-LazyLinesKept
                  - LintMark-Formatting-Blocks-ListFormatter-TabAfterMarkerKept
                  - LintMark-Formatting-Blocks-ListFormatter-TabIndentKept
                  - LintMark-Formatting-Blocks-ListFormatter-QuoteListsKeepColumns
                  - LintMark-Formatting-Blocks-ListFormatter-FootnoteListsKept
                  - LintMark-Formatting-Blocks-ListFormatter-OtherNestingOffsetKept
                  - LintMark-Formatting-Blocks-ListFormatter-ColumnsKeptWhenALineWouldJoin
                  - LintMark-Formatting-Blocks-ListFormatter-NestKeptWhenRenderingWouldChange
                  - LintMark-Formatting-Blocks-ListFormatter-GridTableInItemKept
                  - LintMark-Formatting-Blocks-ListFormatter-LooseAndTightKept
                tests:
                  - BlocksSubsystem_Format_ListStructure_IsKept
                  - ListQuoteInlineCorpus_Format_RandomLists_AreSafeAndStable

              - id: LintMark-Formatting-Blocks-QuoteMarkerSpace
                title: >-
                  The Blocks subsystem shall write exactly one space after each block quote marker on the paragraph
                  and heading lines of a quote.
                justification: |
                  Extra spaces after a quote marker have no meaning and make the quotes of a project inconsistent.
                children:
                  - LintMark-Formatting-Blocks-BlockQuoteFormatter-ExtraSpacesRemoved
                  - LintMark-Formatting-Blocks-BlockQuoteFormatter-HeadingLinesNormalized
                  - LintMark-Formatting-Blocks-BlockQuoteFormatter-NestedQuoteMarkersNormalized
                tests:
                  - BlocksSubsystem_Format_QuoteForms_AreCanonical

              - id: LintMark-Formatting-Blocks-QuoteContentKept
                title: >-
                  The Blocks subsystem shall keep the spaces after a block quote marker as written where they are
                  part of the content or the structure of the quote.
                justification: |
                  The spaces are content in code, HTML, and math, part of the structure of setext headings, tables,
                  lists, and footnotes, and part of what makes a line a lazy continuation, so removing them would
                  change how the quote renders.
                children:
                  - LintMark-Formatting-Blocks-BlockQuoteFormatter-FiveSpacesKept
                  - LintMark-Formatting-Blocks-BlockQuoteFormatter-TabsKept
                  - LintMark-Formatting-Blocks-BlockQuoteFormatter-LazyLinesKept
                  - LintMark-Formatting-Blocks-BlockQuoteFormatter-CodeInQuoteKept
                  - LintMark-Formatting-Blocks-BlockQuoteFormatter-HtmlInQuoteKept
                  - LintMark-Formatting-Blocks-BlockQuoteFormatter-MathInQuoteKept
                  - LintMark-Formatting-Blocks-BlockQuoteFormatter-SetextHeadingInQuoteKept
                  - LintMark-Formatting-Blocks-BlockQuoteFormatter-TableInQuoteKept
                  - LintMark-Formatting-Blocks-BlockQuoteFormatter-ListInQuoteKept
                  - LintMark-Formatting-Blocks-BlockQuoteFormatter-FootnoteInQuoteKept
                  - LintMark-Formatting-Blocks-BlockQuoteFormatter-QuoteInListItemKept
                  - LintMark-Formatting-Blocks-BlockQuoteFormatter-MarkerOnlyLinesKept
                tests:
                  - BlocksSubsystem_Format_QuoteContent_IsKept
                  - ListQuoteInlineCorpus_Format_RandomQuotes_AreSafeAndStable
