---
# Software Unit Requirements for the HeadingFormatter Unit
#
# The HeadingFormatter unit writes each heading in canonical ATX form: one space after the number signs, no closing
# number signs, no indentation, no trailing whitespace, and no tabs in the text.

sections:
  - title: LintMark Requirements
    sections:
      - title: Formatting Requirements
        sections:
          - title: Blocks Requirements
            sections:
              - title: HeadingFormatter Requirements
                requirements:
                  - id: LintMark-Formatting-Blocks-HeadingFormatter-Style
                    title: >-
                      The HeadingFormatter unit shall write a setext heading with one text line and an ATX heading
                      with a closing sequence as an ATX heading of the same level without closing number signs.
                    justification: |
                      One heading style keeps documents uniform and diffs small. A multi-line setext heading, a
                      heading in a container, and text that only looks like a heading must keep their meaning.
                    tests:
                      - HeadingFormatter_Format_SetextHeading_ConvertsToAtx
                      - HeadingFormatter_Format_ClosedAtxHeading_RemovesTheClosingSequence
                      - HeadingFormatter_Format_NumberSignsInText_AreNotAClosingSequence
                      - HeadingFormatter_Format_MultiLineSetextHeading_StaysSetextAndKeepsHardBreak
                      - HeadingFormatter_Format_HeadingInContainer_KeepsThePrefix
                      - HeadingFormatter_Format_NonCanonicalHeading_ReportsEachEditUnderItsRule

                  - id: LintMark-Formatting-Blocks-HeadingFormatter-Spacing
                    title: >-
                      The HeadingFormatter unit shall write exactly one space after the number signs and remove the
                      indentation, the trailing whitespace, and the tabs of a heading, and leave a canonical heading
                      unchanged.
                    justification: |
                      Uniform spacing and a left-aligned start make headings recognizable, and a heading that is
                      already canonical must not produce edits so that a second run finds nothing to change.
                    tests:
                      - HeadingFormatter_Format_BlanksAfterMarker_BecomeOneSpace
                      - HeadingFormatter_Format_IndentedHeading_RemovesTheIndentation
                      - HeadingFormatter_Format_TrailingWhitespace_IsRemoved
                      - HeadingFormatter_Format_TabInText_ExpandsToTheTabStop
                      - HeadingFormatter_Format_NoSpaceAfterMarker_LeavesTheParagraph
                      - HeadingFormatter_Format_CanonicalHeading_ProposesNothing
