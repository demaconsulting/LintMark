---
# Software Unit Requirements for the ListFormatter Unit
#
# The ListFormatter unit writes each list in canonical form (bullet marker, numbering, item columns, and marker
# space) and never merges, splits, or changes the meaning of a list.

sections:
  - title: LintMark Requirements
    sections:
      - title: Formatting Requirements
        sections:
          - title: Blocks Requirements
            sections:
              - title: ListFormatter Requirements
                requirements:
                  - id: LintMark-Formatting-Blocks-ListFormatter-BulletMarker
                    title: >-
                      The ListFormatter unit shall write the markers of a bullet list with the configured bullet
                      character, and keep them where the new character would read as a thematic break or table border.
                    justification: |
                      One bullet character keeps lists uniform, but a marker line that turns into a break or a grid
                      table border would change the structure of the document.
                    tests:
                      - ListFormatter_Format_BulletMarkers_BecomeTheDefaultCharacter
                      - ListFormatter_Format_ConfiguredBullet_IsUsed
                      - ListFormatter_Format_ConvertedMarkerLineWouldBeThematicBreak_LeavesTheMarkers
                      - ListFormatter_Format_ItemTextIsThematicBreak_LeavesTheMarkers
                      - ListFormatter_Format_PlusMarkerAndGridBorderLookalike_LeavesTheMarkers

                  - id: LintMark-Formatting-Blocks-ListFormatter-Numbering
                    title: >-
                      The ListFormatter unit shall number the items of an ordered list by counting up from the first
                      number or repeating it, as configured, and never change the first number or the delimiter.
                    justification: |
                      The first number and the delimiter decide how a list reads and starts, while the numbers of
                      the other items are only a style choice.
                    tests:
                      - ListFormatter_Format_OrderedNumbers_CountUpFromTheFirst
                      - ListFormatter_Format_OneStyle_RepeatsTheFirstNumber
                      - ListFormatter_Format_FirstNumberWithLeadingZeros_LeavesTheNumbers
                      - ListFormatter_Format_NumberWouldHaveTenDigits_LeavesTheNumbers
                      - ListFormatter_Format_NumberGainsADigit_MovesTheContentOfTheItem

                  - id: LintMark-Formatting-Blocks-ListFormatter-Indentation
                    title: >-
                      The ListFormatter unit shall start the items of a list in one column, indent nested bullet lists
                      by the configured amount, write one space after each marker, and move item content with its
                      marker.
                    justification: |
                      Consistent columns and marker spacing make list structure visible, and content that stays
                      relative to its marker keeps paragraphs, code, and quotes inside their items.
                    tests:
                      - ListFormatter_Format_SpacesAfterMarker_BecomeOne
                      - ListFormatter_Format_ItemColumns_AreAlignedAndTopLevelBulletsStartAtTheMargin
                      - ListFormatter_Format_NestedBullets_AreIndentedAsConfigured
                      - ListFormatter_Format_ItemHoldsCodeHtmlQuoteAndTable_MovesEverythingTogether
                      - ListFormatter_Format_NumberLosesADigit_MovesTheContentOfTheItem

                  - id: LintMark-Formatting-Blocks-ListFormatter-StructureKept
                    title: >-
                      The ListFormatter unit shall never merge or split lists, change loose or tight spacing, or move
                      a list whose rendering the change could alter, and shall leave such a list as written.
                    justification: |
                      The structure of a list is its meaning, so a layout change that joins two lists or changes
                      where a line belongs must be refused instead of risked.
                    tests:
                      - ListFormatter_Format_AdjacentBulletLists_KeepTheirMarkers
                      - ListFormatter_Format_AdjacentNestedBulletLists_KeepTheirMarkers
                      - ListFormatter_Format_LooseAndTightLists_StayLooseAndTight
                      - ListFormatter_Format_LazyLine_LeavesTheColumns
                      - ListFormatter_Format_FollowingLineWouldJoinTheItem_LeavesTheColumns
                      - ListFormatter_Format_UnusualLayout_IsSafeAndStable
