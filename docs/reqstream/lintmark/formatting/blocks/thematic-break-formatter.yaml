---
# Software Unit Requirements for the ThematicBreakFormatter Unit
#
# The ThematicBreakFormatter unit writes each thematic break in the configured style and keeps a break as written
# where the new form would be read as something else.

sections:
  - title: LintMark Requirements
    sections:
      - title: Formatting Requirements
        sections:
          - title: Blocks Requirements
            sections:
              - title: ThematicBreakFormatter Requirements
                requirements:
                  - id: LintMark-Formatting-Blocks-ThematicBreakFormatter-Style
                    title: >-
                      The ThematicBreakFormatter unit shall write every thematic break as three characters of the
                      configured style without inner spaces or trailing whitespace, keeping its indentation and
                      container prefix.
                    justification: |
                      One break style keeps documents uniform. Indentation and container markers belong to the
                      structure around the break and must not move.
                    tests:
                      - ThematicBreakFormatter_Format_AnyBreak_BecomesThreeDashes
                      - ThematicBreakFormatter_Format_AsterisksConfiguration_WritesAsterisks
                      - ThematicBreakFormatter_Format_UnderscoresConfiguration_WritesUnderscores
                      - ThematicBreakFormatter_Format_IndentedBreak_KeepsTheIndentation
                      - ThematicBreakFormatter_Format_TrailingWhitespace_IsRemoved
                      - ThematicBreakFormatter_Format_BreakInContainer_ConvertsInPlace

                  - id: LintMark-Formatting-Blocks-ThematicBreakFormatter-NeverConfused
                    title: >-
                      The ThematicBreakFormatter unit shall keep a break as written, apart from trailing
                      whitespace, when the configured form could be read as a setext underline, front matter, a
                      list marker, or a grid table border.
                    justification: |
                      A dash line below text underlines it and a dash line at the start of a document can open
                      front matter, so converting such a break would change what the document means.
                    tests:
                      - ThematicBreakFormatter_Format_FirstLineBreak_StaysAsWritten
                      - ThematicBreakFormatter_Format_DashesLineAfterFirstLineDashes_StaysAsWritten
                      - ThematicBreakFormatter_Format_BreakAfterBorderShapedLine_StaysAsWritten
                      - ThematicBreakFormatter_Format_BreakAfterDashListMarker_StaysAsWritten
                      - ThematicBreakFormatter_Format_BreakUnderTextWithTrailingWhitespace_OnlyLosesTheWhitespace
