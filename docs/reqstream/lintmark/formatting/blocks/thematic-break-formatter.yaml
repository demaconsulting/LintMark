---
# Software Unit Requirements for the ThematicBreakFormatter Class
#
# The ThematicBreakFormatter class proposes the changes that bring a thematic break into canonical form: three
# characters of the configured style, with no spaces between them and no trailing whitespace.

sections:
  - title: LintMark Requirements
    sections:
      - title: Formatting Requirements
        sections:
          - title: Blocks Requirements
            sections:
              - title: ThematicBreakFormatter Requirements
                requirements:
                  - id: LintMark-Formatting-Blocks-ThematicBreakFormatter-AcceptsThematicBreaks
                    title: The ThematicBreakFormatter class shall accept a thematic break, and no other kind of block.
                    justification: |
                      The document formatter gives each block to the first formatter that accepts it, so a
                      formatter that accepted another kind of block would take it away from the rule that owns it.
                    tests:
                      - ThematicBreakFormatter_CanFormat_Blocks_AcceptsOnlyThematicBreaks

                  - id: LintMark-Formatting-Blocks-ThematicBreakFormatter-RejectsMissingArguments
                    title: >-
                      The ThematicBreakFormatter class shall throw an ArgumentNullException that names the parameter
                      when an argument is null.
                    justification: |
                      Missing arguments are programming errors that must be reported as such.
                    tests:
                      - ThematicBreakFormatter_CanFormat_NullBlock_Throws
                      - ThematicBreakFormatter_Format_NullArguments_Throw

                  - id: LintMark-Formatting-Blocks-ThematicBreakFormatter-RejectsOtherBlocks
                    title: The ThematicBreakFormatter class shall refuse to format a block that is not a thematic break.
                    justification: |
                      A block of another kind has a different shape, and edits computed for it would damage it.
                    tests:
                      - ThematicBreakFormatter_Format_NonBreakBlock_ThrowsArgumentException

                  - id: LintMark-Formatting-Blocks-ThematicBreakFormatter-RuleIdsImmutable
                    title: >-
                      The ThematicBreakFormatter class shall list the rules it enforces in a form that its holders
                      cannot change.
                    justification: |
                      The list decides which suppressions affect the formatter, and one instance is shared by every
                      thread.
                    tests:
                      - ThematicBreakFormatter_RuleIds_Read_ListsTheBreakRuleAndIsImmutable

                  - id: LintMark-Formatting-Blocks-ThematicBreakFormatter-ConvertedToConfiguredStyle
                    title: >-
                      The ThematicBreakFormatter class shall write a thematic break as three dashes, asterisks, or
                      underscores, as the configuration says, three dashes by default.
                    justification: |
                      One way to write a break makes a document consistent, and spaces between the characters
                      have no meaning.
                    tests:
                      - ThematicBreakFormatter_Format_AnyBreak_BecomesThreeDashes
                      - ThematicBreakFormatter_Format_AsterisksConfiguration_WritesAsterisks
                      - ThematicBreakFormatter_Format_UnderscoresConfiguration_WritesUnderscores
                      - ThematicBreakFormatter_Format_FirstLineWithAsterisksConfiguration_IsConverted
                      - ThematicBreakFormatter_Format_BreakAfterCompleteBlock_IsConverted
                      - ThematicBreakFormatter_Format_BreakAfterOrderedListMarker_IsConverted
                      - ThematicBreakFormatter_Format_BreakAfterTable_IsConverted

                  - id: LintMark-Formatting-Blocks-ThematicBreakFormatter-IndentationKept
                    title: The ThematicBreakFormatter class shall keep the indentation of a thematic break.
                    justification: |
                      Only the characters of the break are the subject of the rule, and the indentation is not.
                    tests:
                      - ThematicBreakFormatter_Format_IndentedBreak_KeepsTheIndentation

                  - id: LintMark-Formatting-Blocks-ThematicBreakFormatter-SetextGuard
                    title: >-
                      The ThematicBreakFormatter class shall not write a break as dashes directly under a line of
                      text.
                    justification: |
                      A line of dashes under text is a heading underline, so the conversion would turn the text
                      into a heading. Every block above the break other than a complete block (heading, code,
                      break, list, quote, table) counts as text, which keeps the guard independent of anything that
                      another rule changes in the same run.
                    tests:
                      - ThematicBreakFormatter_Format_BreakUnderText_StaysAsWritten
                      - ThematicBreakFormatter_Format_BreakUnderTextWithTrailingWhitespace_OnlyLosesTheWhitespace
                      - ThematicBreakFormatter_Format_BreakUnderNonTextBlocksThatCountAsText_StaysAsWritten

                  - id: LintMark-Formatting-Blocks-ThematicBreakFormatter-FrontMatterGuard
                    title: >-
                      The ThematicBreakFormatter class shall not write a break as dashes where the dashes could
                      start or close front matter.
                    justification: |
                      A dashes line on the first line of a document, or one that closes a dashes line there,
                      would turn the text in between into front matter.
                    tests:
                      - ThematicBreakFormatter_Format_FirstLineBreak_StaysAsWritten
                      - ThematicBreakFormatter_Format_DashesLineAfterFirstLineDashes_StaysAsWritten
                      - ThematicBreakFormatter_Format_BreakAfterFrontMatter_IsConverted

                  - id: LintMark-Formatting-Blocks-ThematicBreakFormatter-ListMarkerGuard
                    title: >-
                      The ThematicBreakFormatter class shall not change the characters of a break that follows a
                      list marker of the character that the conversion would write.
                    justification: |
                      A list marker followed by a break of its own character, such as a dash and dashes, is
                      itself a thematic break, so the conversion would change the structure. The trailing
                      whitespace of such a break is still removed (see TrailingWhitespaceRemoved).
                    tests:
                      - ThematicBreakFormatter_Format_BreakAfterDashListMarker_StaysAsWritten
                      - ThematicBreakFormatter_Format_BreakAfterAsteriskListMarker_StaysAsWritten
                      - ThematicBreakFormatter_Format_FirstLineAndListMarkerWithOtherConfigurations_FollowTheGuards

                  - id: LintMark-Formatting-Blocks-ThematicBreakFormatter-GridBorderGuard
                    title: >-
                      The ThematicBreakFormatter class shall not write a break as dashes on a line that starts with
                      a plus sign.
                    justification: |
                      A plus sign, here a list marker, followed by dashes looks like the border of a grid table, and
                      Pandoc may read the line as part of a table instead of a list item with a break.
                    tests:
                      - ThematicBreakFormatter_Format_BreakAfterPlusListMarker_StaysAsWrittenWhenDashesAreWanted
                      - ThematicBreakFormatter_Format_BreakAfterPlusListMarkerWithOtherCharacter_IsConverted

                  - id: LintMark-Formatting-Blocks-ThematicBreakFormatter-ConvertedInContainer
                    title: >-
                      The ThematicBreakFormatter class shall convert a thematic break inside a quote or list in
                      place, keeping its prefix.
                    justification: |
                      The prefix is what puts the break in its container.
                    tests:
                      - ThematicBreakFormatter_Format_BreakInContainer_ConvertsInPlace

                  - id: LintMark-Formatting-Blocks-ThematicBreakFormatter-TrailingWhitespaceRemoved
                    title: The ThematicBreakFormatter class shall remove the trailing whitespace of a thematic break.
                    justification: |
                      Trailing whitespace is invisible and carries no meaning, also on a break whose characters
                      stay as written because of a guard.
                    tests:
                      - ThematicBreakFormatter_Format_TrailingWhitespace_IsRemoved
                      - ThematicBreakFormatter_Format_GuardedBreakWithTrailingWhitespace_OnlyLosesTheWhitespace

                  - id: LintMark-Formatting-Blocks-ThematicBreakFormatter-SuppressedRuleKept
                    title: >-
                      The ThematicBreakFormatter class shall propose no change for a thematic break in which a
                      comment of the document disables the thematic-break rule or the trailing-whitespace rule.
                    justification: |
                      An author who switched either rule of the formatter off for a passage expects the break
                      there to stay as written, trailing whitespace included.
                    tests:
                      - ThematicBreakFormatter_Format_RuleSuppressed_LeavesTheBreak
                      - ThematicBreakFormatter_Format_BreakAfterEnabledAgain_IsFormatted

                  - id: LintMark-Formatting-Blocks-ThematicBreakFormatter-EditsUnderOwnRule
                    title: >-
                      The ThematicBreakFormatter class shall attribute each change that it proposes to the rule that
                      the change enforces.
                    justification: |
                      The rule of a change decides how it is reported and which suppression comment switches it off.
                    tests:
                      - ThematicBreakFormatter_Format_NonCanonicalBreak_ReportsEachEditUnderItsRule

                  - id: LintMark-Formatting-Blocks-ThematicBreakFormatter-CanonicalUnchanged
                    title: >-
                      The ThematicBreakFormatter class shall propose no change for a thematic break in canonical
                      form.
                    justification: |
                      A canonical break must not be reported or rewritten.
                    tests:
                      - ThematicBreakFormatter_Format_CanonicalBreak_ProposesNothing

                  - id: LintMark-Formatting-Blocks-ThematicBreakFormatter-LineEndingsKept
                    title: >-
                      The ThematicBreakFormatter class shall propose the same changes for a document with CRLF or
                      mixed line endings as for the same document with LF line endings.
                    justification: |
                      The line ending is not part of the text of a thematic break.
                    tests:
                      - ThematicBreakFormatter_Format_CrlfLineEndings_ProposesTheSameEdits
                      - ThematicBreakFormatter_Format_CrlfAndBom_KeepsLineEndingsAndMark

                  - id: LintMark-Formatting-Blocks-ThematicBreakFormatter-ByteOrderMarkKept
                    title: >-
                      The ThematicBreakFormatter class shall propose the same changes for a document with a byte
                      order mark as for the same document without one.
                    justification: |
                      The byte order mark is not part of the text of a thematic break.
                    tests:
                      - ThematicBreakFormatter_Format_ByteOrderMark_ProposesTheSameEdits
                      - ThematicBreakFormatter_Format_CrlfAndBom_KeepsLineEndingsAndMark

                  - id: LintMark-Formatting-Blocks-ThematicBreakFormatter-DeterministicResult
                    title: >-
                      The ThematicBreakFormatter class shall propose the same changes for the same parsed document
                      when one instance is called from several threads at once as when it is called one after
                      another.
                    justification: |
                      Files are formatted in parallel by one shared instance, and a result that depended on timing
                      could not be trusted.
                    tests:
                      - ThematicBreakFormatter_Format_SharedInstanceOnManyThreads_GivesTheSameResult
