---
# Software Unit Requirements for the BlockQuoteFormatter Unit
#
# The BlockQuoteFormatter unit writes one space after each quote marker of the paragraphs and headings in a quote.

sections:
  - title: LintMark Requirements
    sections:
      - title: Formatting Requirements
        sections:
          - title: Blocks Requirements
            sections:
              - title: BlockQuoteFormatter Requirements
                requirements:
                  - id: LintMark-Formatting-Blocks-BlockQuoteFormatter-MarkerSpacing
                    title: >-
                      The BlockQuoteFormatter unit shall write exactly one space after every quote marker of a
                      paragraph or ATX heading line, including the markers of nested quotes.
                    justification: |
                      Uniform marker spacing keeps quoted text consistent. Runs of five or more spaces, tabs, and
                      lazy continuation lines have a different meaning and must stay.
                    tests:
                      - BlockQuoteFormatter_Format_ExtraSpacesAfterMarker_BecomeOne
                      - BlockQuoteFormatter_Format_NestedMarkers_AreWrittenWithOneSpace
                      - BlockQuoteFormatter_Format_FiveSpaces_AreLeftAlone
                      - BlockQuoteFormatter_Format_TabInPrefix_IsLeftAlone
                      - BlockQuoteFormatter_Format_LazyLine_IsLeftAlone
                      - BlockQuoteFormatter_Format_ExtraSpaces_ReportsTheQuoteRule

                  - id: LintMark-Formatting-Blocks-BlockQuoteFormatter-ContentKept
                    title: >-
                      The BlockQuoteFormatter unit shall keep the spaces after the markers of quoted code, HTML,
                      math, tables, lists, setext headings, and footnotes, and of quotes inside list items.
                    justification: |
                      In those blocks the spaces after a marker are content or structure, so removing them would
                      change the rendered document.
                    tests:
                      - BlockQuoteFormatter_Format_CodeInQuote_KeepsTheSpaces
                      - BlockQuoteFormatter_Format_HtmlInQuote_KeepsTheSpaces
                      - BlockQuoteFormatter_Format_ListInQuote_KeepsTheSpaces
                      - BlockQuoteFormatter_Format_TableInQuote_KeepsTheSpaces
                      - BlockQuoteFormatter_Format_QuoteInListItem_KeepsTheSpaces
                      - BlockQuoteFormatter_Format_FootnoteInQuote_KeepsTheSpaces
