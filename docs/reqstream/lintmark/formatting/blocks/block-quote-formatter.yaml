---
# Software Unit Requirements for the BlockQuoteFormatter Class
#
# The BlockQuoteFormatter class proposes the changes that bring a block quote into canonical form: exactly one space
# after each quote marker on the paragraph and heading lines of the quote. Every line on which the spaces are content
# or structure is left as written.

sections:
  - title: LintMark Requirements
    sections:
      - title: Formatting Requirements
        sections:
          - title: Blocks Requirements
            sections:
              - title: BlockQuoteFormatter Requirements
                requirements:
                  - id: LintMark-Formatting-Blocks-BlockQuoteFormatter-AcceptsOutermostQuotes
                    title: >-
                      The BlockQuoteFormatter class shall accept the outermost block quote of a nest of quotes, and no
                      other kind of block.
                    justification: |
                      The document formatter gives each block to the first formatter that accepts it, so a formatter
                      that accepted another kind of block would take it away from the rule that owns it. A quote
                      inside a quote is formatted together with the quote that holds it.
                    tests:
                      - BlockQuoteFormatter_CanFormat_Blocks_AcceptsOnlyOutermostQuotes

                  - id: LintMark-Formatting-Blocks-BlockQuoteFormatter-RejectsMissingArguments
                    title: >-
                      The BlockQuoteFormatter class shall throw an ArgumentNullException that names the parameter when
                      an argument is null.
                    justification: |
                      Missing arguments are programming errors that must be reported as such.
                    tests:
                      - BlockQuoteFormatter_CanFormat_NullBlock_Throws
                      - BlockQuoteFormatter_Format_NullArguments_Throw

                  - id: LintMark-Formatting-Blocks-BlockQuoteFormatter-RejectsOtherBlocks
                    title: >-
                      The BlockQuoteFormatter class shall refuse to format a block that is not an outermost block
                      quote.
                    justification: |
                      A block of another kind has a different shape, and edits computed for it would damage it.
                    tests:
                      - BlockQuoteFormatter_Format_OtherBlock_ThrowsArgumentException

                  - id: LintMark-Formatting-Blocks-BlockQuoteFormatter-RuleIdsImmutable
                    title: >-
                      The BlockQuoteFormatter class shall list the rules it enforces in a form that its holders
                      cannot change.
                    justification: |
                      The list decides which suppressions affect the formatter, and one instance is shared by every
                      thread.
                    tests:
                      - BlockQuoteFormatter_RuleIds_Read_ListsTheQuoteRuleAndIsImmutable

                  - id: LintMark-Formatting-Blocks-BlockQuoteFormatter-ExtraSpacesRemoved
                    title: >-
                      The BlockQuoteFormatter class shall write exactly one space after the marker of a paragraph
                      line of a block quote that has two to four spaces after it.
                    justification: |
                      Extra spaces after a quote marker have no meaning and make the quotes of a project
                      inconsistent.
                    tests:
                      - BlockQuoteFormatter_Format_ExtraSpacesAfterMarker_BecomeOne

                  - id: LintMark-Formatting-Blocks-BlockQuoteFormatter-HeadingLinesNormalized
                    title: >-
                      The BlockQuoteFormatter class shall write exactly one space after the marker of an ATX heading
                      line of a block quote that has two to four spaces after it.
                    justification: |
                      A heading in a quote is written like a heading outside it, and extra spaces before its number
                      signs have no meaning.
                    tests:
                      - BlockQuoteFormatter_Format_HeadingAndAlertLines_AreNormalized

                  - id: LintMark-Formatting-Blocks-BlockQuoteFormatter-NestedQuoteMarkersNormalized
                    title: >-
                      The BlockQuoteFormatter class shall write exactly one space after each marker of a quote that is
                      nested in another quote.
                    justification: |
                      The markers of nested quotes are written one after the other, and each is followed by one
                      space, so that the nesting is easy to read.
                    tests:
                      - BlockQuoteFormatter_Format_NestedMarkers_AreWrittenWithOneSpace

                  - id: LintMark-Formatting-Blocks-BlockQuoteFormatter-FiveSpacesKept
                    title: >-
                      The BlockQuoteFormatter class shall keep the spaces after the marker of a line that has five or
                      more of them.
                    justification: |
                      With five spaces the text after the marker is indented code, and removing spaces would change
                      the block.
                    tests:
                      - BlockQuoteFormatter_Format_FiveSpaces_AreLeftAlone

                  - id: LintMark-Formatting-Blocks-BlockQuoteFormatter-TabsKept
                    title: >-
                      The BlockQuoteFormatter class shall keep the prefix of a line of a block quote as written when
                      it holds a tab.
                    justification: |
                      A tab reaches the next tab stop, so replacing it can change where the text of the line starts.
                    tests:
                      - BlockQuoteFormatter_Format_TabInPrefix_IsLeftAlone

                  - id: LintMark-Formatting-Blocks-BlockQuoteFormatter-LazyLinesKept
                    title: >-
                      The BlockQuoteFormatter class shall keep a line that continues the text of a quote without a
                      marker as written.
                    justification: |
                      A line without a marker belongs to the quote only because of the lines before it, so it is
                      not part of what the rule describes. The marked lines of the same paragraph are still written
                      canonically.
                    tests:
                      - BlockQuoteFormatter_Format_LazyLine_IsLeftAlone

                  - id: LintMark-Formatting-Blocks-BlockQuoteFormatter-CodeInQuoteKept
                    title: >-
                      The BlockQuoteFormatter class shall propose no change for the lines of a fenced or indented code
                      block inside a block quote.
                    justification: |
                      The spaces after the marker are content in code, so removing them would change the code.
                    tests:
                      - BlockQuoteFormatter_Format_CodeInQuote_KeepsTheSpaces

                  - id: LintMark-Formatting-Blocks-BlockQuoteFormatter-HtmlInQuoteKept
                    title: >-
                      The BlockQuoteFormatter class shall propose no change for the lines of an HTML block inside a
                      block quote.
                    justification: |
                      The spaces after the marker are content in an HTML block, so removing them would change the
                      block.
                    tests:
                      - BlockQuoteFormatter_Format_HtmlInQuote_KeepsTheSpaces

                  - id: LintMark-Formatting-Blocks-BlockQuoteFormatter-MathInQuoteKept
                    title: >-
                      The BlockQuoteFormatter class shall propose no change for the lines of a math block inside a
                      block quote.
                    justification: |
                      The spaces after the marker are content in a math block, so removing them would change the
                      formula.
                    tests:
                      - BlockQuoteFormatter_Format_MathInQuote_KeepsTheSpaces

                  - id: LintMark-Formatting-Blocks-BlockQuoteFormatter-SetextHeadingInQuoteKept
                    title: >-
                      The BlockQuoteFormatter class shall propose no change for the lines of a setext heading inside a
                      block quote.
                    justification: |
                      The spaces after the marker are part of the structure of a setext heading, so removing them
                      would change the heading.
                    tests:
                      - BlockQuoteFormatter_Format_SetextHeadingInQuote_KeepsTheSpaces

                  - id: LintMark-Formatting-Blocks-BlockQuoteFormatter-TableInQuoteKept
                    title: >-
                      The BlockQuoteFormatter class shall propose no change for the rows of a table inside a block
                      quote.
                    justification: |
                      The spaces after the marker are part of the structure of a table, so removing them would change
                      the table.
                    tests:
                      - BlockQuoteFormatter_Format_TableInQuote_KeepsTheSpaces

                  - id: LintMark-Formatting-Blocks-BlockQuoteFormatter-ListInQuoteKept
                    title: >-
                      The BlockQuoteFormatter class shall propose no change for the lines of a list inside a block
                      quote.
                    justification: |
                      The spaces after the marker are the indentation of the list there, so removing them would change
                      which text belongs to its items.
                    tests:
                      - BlockQuoteFormatter_Format_ListInQuote_KeepsTheSpaces

                  - id: LintMark-Formatting-Blocks-BlockQuoteFormatter-FootnoteInQuoteKept
                    title: >-
                      The BlockQuoteFormatter class shall propose no change for the lines of a footnote definition
                      inside a block quote.
                    justification: |
                      The spaces after the marker are the indentation of the footnote there, so removing them would
                      change which text belongs to it.
                    tests:
                      - BlockQuoteFormatter_Format_FootnoteInQuote_KeepsTheSpaces

                  - id: LintMark-Formatting-Blocks-BlockQuoteFormatter-QuoteInListItemKept
                    title: >-
                      The BlockQuoteFormatter class shall propose no change for a block quote inside a list item.
                    justification: |
                      The spaces after the marker of such a quote can be indentation of the item, so removing them
                      could change which text belongs to the item.
                    tests:
                      - BlockQuoteFormatter_Format_QuoteInListItem_KeepsTheSpaces

                  - id: LintMark-Formatting-Blocks-BlockQuoteFormatter-MarkerOnlyLinesKept
                    title: >-
                      The BlockQuoteFormatter class shall propose no change for a line of a block quote that holds
                      only the marker and spaces.
                    justification: |
                      Such a line has no content after the marker, and its trailing spaces are the subject of the
                      whitespace rule.
                    tests:
                      - BlockQuoteFormatter_Format_MarkerOnlyLine_IsLeftToTheWhitespaceRule

                  - id: LintMark-Formatting-Blocks-BlockQuoteFormatter-SuppressedRuleKeptByIdentifier
                    title: >-
                      The BlockQuoteFormatter class shall propose no change for a block quote in which a comment of
                      the document disables its rule by the identifier of the rule.
                    justification: |
                      An author who switched the rule off for a passage expects the quote there to stay as written.
                    tests:
                      - BlockQuoteFormatter_Format_RuleSuppressed_LeavesTheQuote

                  - id: LintMark-Formatting-Blocks-BlockQuoteFormatter-SuppressedRuleKeptByAlias
                    title: >-
                      The BlockQuoteFormatter class shall propose no change for a block quote in which a comment of
                      the document disables its rule by the legacy number of the rule.
                    justification: |
                      Authors who come from other Markdown tools know the rules by their numbers, and a comment that
                      did nothing would silently change their text.
                    tests:
                      - BlockQuoteFormatter_Format_RuleSuppressed_LeavesTheQuote

                  - id: LintMark-Formatting-Blocks-BlockQuoteFormatter-EditsUnderOwnRule
                    title: >-
                      The BlockQuoteFormatter class shall attribute each change that it proposes to the rule that the
                      change enforces.
                    justification: |
                      The rule of a change decides how it is reported and which suppression comment switches it off.
                    tests:
                      - BlockQuoteFormatter_Format_ExtraSpaces_ReportsTheQuoteRule

                  - id: LintMark-Formatting-Blocks-BlockQuoteFormatter-CanonicalUnchanged
                    title: The BlockQuoteFormatter class shall propose no change for a block quote in canonical form.
                    justification: |
                      A canonical quote must not be reported or rewritten.
                    tests:
                      - BlockQuoteFormatter_Format_CanonicalQuote_ProposesNoEdit

                  - id: LintMark-Formatting-Blocks-BlockQuoteFormatter-LineEndingsKept
                    title: >-
                      The BlockQuoteFormatter class shall propose the same changes for a document with CRLF or mixed
                      line endings as for the same document with LF line endings.
                    justification: |
                      The line ending is not part of the text of a quote.
                    tests:
                      - BlockQuoteFormatter_Format_LineEndingsAndByteOrderMark_ProposeTheSameEdits

                  - id: LintMark-Formatting-Blocks-BlockQuoteFormatter-ByteOrderMarkKept
                    title: >-
                      The BlockQuoteFormatter class shall propose the same changes for a document with a byte order
                      mark as for the same document without one.
                    justification: |
                      The byte order mark is not part of the text of a quote.
                    tests:
                      - BlockQuoteFormatter_Format_LineEndingsAndByteOrderMark_ProposeTheSameEdits

                  - id: LintMark-Formatting-Blocks-BlockQuoteFormatter-DeterministicResult
                    title: >-
                      The BlockQuoteFormatter class shall propose the same changes for the same parsed document when
                      one instance is called from several threads at once as when it is called one after another.
                    justification: |
                      Files are formatted in parallel by one shared instance, and a result that depended on timing
                      could not be trusted.
                    tests:
                      - BlockQuoteFormatter_Format_SharedInstanceOnManyThreads_GivesTheSameResult
