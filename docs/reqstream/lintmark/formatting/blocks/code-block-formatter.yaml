---
# Software Unit Requirements for the CodeBlockFormatter Unit
#
# The CodeBlockFormatter unit writes each code block as a fenced block with the configured fence character and never
# changes the code inside it.

sections:
  - title: LintMark Requirements
    sections:
      - title: Formatting Requirements
        sections:
          - title: Blocks Requirements
            sections:
              - title: CodeBlockFormatter Requirements
                requirements:
                  - id: LintMark-Formatting-Blocks-CodeBlockFormatter-Style
                    title: >-
                      The CodeBlockFormatter unit shall write a top-level indented code block as a fenced block and
                      write every closed fence with the configured fence character and no trailing whitespace.
                    justification: |
                      Fenced code blocks state their extent and language explicitly and are the style most
                      authors expect, so one style and one fence character keep documents uniform.
                    tests:
                      - CodeBlockFormatter_Format_IndentedCode_BecomesFencedCode
                      - CodeBlockFormatter_Format_TildeFence_BecomesBacktickFence
                      - CodeBlockFormatter_Format_TildeConfiguration_WritesTildeFences
                      - CodeBlockFormatter_Format_FenceLinesWithTrailingWhitespace_RemovesItOnlyThere
                      - CodeBlockFormatter_Format_FenceInContainer_ConvertsInPlace
                      - CodeBlockFormatter_Format_NonCanonicalFence_ReportsEachEditUnderItsRule

                  - id: LintMark-Formatting-Blocks-CodeBlockFormatter-ContentKept
                    title: >-
                      The CodeBlockFormatter unit shall never change the content of a code block, lengthen a
                      converted fence so that content cannot close it, and leave a block as written when it cannot
                      be converted safely.
                    justification: |
                      Code is data. Changing it, or writing a fence that ends the block early or that the parser
                      reads differently, would corrupt the document.
                    tests:
                      - CodeBlockFormatter_Format_ContentOfFence_IsNeverChanged
                      - CodeBlockFormatter_Format_ContentWithFenceLookalike_LengthensTheFence
                      - CodeBlockFormatter_Format_BracedInfoString_KeepsTheFenceCharacter
                      - CodeBlockFormatter_Format_InfoStringWithBacktick_KeepsTheTildeFence
                      - CodeBlockFormatter_Format_UnclosedFence_ProposesNothing
                      - CodeBlockFormatter_Format_IndentedCodeInListItem_StaysIndented
