---
# Configuration Subsystem Requirements
#
# The Configuration subsystem turns a file's configuration (.lintmark.yaml) and editor settings (.editorconfig)
# into the typed settings the rest of the tool uses, and reports every problem in them.

sections:
  - title: LintMark Requirements
    sections:
      - title: Configuration Requirements
        requirements:
          - id: LintMark-Configuration-Discovery
            title: >-
              The Configuration subsystem shall select the configuration file that applies to a Markdown file:
              the explicit file when one is given, otherwise the nearest .lintmark.yaml above the file, and the
              defaults when there is none.
            justification: |
              Different parts of a repository need different settings, and a user must be able to predict
              which file applies without merging rules.
            children:
              - LintMark-Configuration-ConfigLoader-Discovery
            tests:
              - ConfigurationSubsystem_Discovery_NearestExplicitAndNone_SelectTheConfiguration

          - id: LintMark-Configuration-Settings
            title: >-
              The Configuration subsystem shall provide every documented setting and rule switch as a typed
              value with its documented default, and accept rules by id or by markdownlint number.
            justification: |
              The tool's behavior is controlled through its settings, and users migrating from markdownlint
              must be able to keep the rule numbers they know.
            children:
              - LintMark-Configuration-ConfigLoader-Settings
              - LintMark-Configuration-ConfigLoader-RuleNames
              - LintMark-Configuration-LintMarkConfig-Defaults
              - LintMark-Configuration-LintMarkConfig-RuleDefaults
              - LintMark-Configuration-LintMarkConfig-LinkRefactor
            tests:
              - ConfigurationSubsystem_Settings_FullSample_ParsesTypedValuesAndRuleSwitches

          - id: LintMark-Configuration-Validation
            title: >-
              The Configuration subsystem shall report every problem in a configuration file once, with its
              position, and supply no configuration when there is a problem.
            justification: |
              A mistyped setting must be visible and fixable, and the tool must not rewrite documents with
              settings it could not read.
            children:
              - LintMark-Configuration-ConfigLoader-Errors
              - LintMark-Configuration-ConfigLoader-InputLimits
            tests:
              - ConfigurationSubsystem_Validation_InvalidSettings_ReportEveryProblemOnceWithPosition

          - id: LintMark-Configuration-LineEnding
            title: >-
              The Configuration subsystem shall determine the line ending setting of a file from the
              configuration file first and from the editor settings otherwise, leaving it unspecified when
              neither names one.
            justification: |
              Teams often state their line ending once in the editor settings, and the tool must honor that
              without a second setting while letting an explicit configuration win.
            children:
              - LintMark-Configuration-EditorConfigResolver-EndOfLine
              - LintMark-Configuration-EditorConfigResolver-Precedence
              - LintMark-Configuration-EditorConfigResolver-Unsupported
            tests:
              - ConfigurationSubsystem_LineEnding_ConfigAndEditorConfig_ResolveSeparatelyPerFile

          - id: LintMark-Configuration-Ignore
            title: The Configuration subsystem shall provide the ignore patterns of a configuration file.
            justification: |
              Generated or vendored files must be excluded per directory tree without changing the command line.
            children:
              - LintMark-Configuration-ConfigLoader-Settings
            tests:
              - ConfigurationSubsystem_Ignore_Patterns_AreReadAndDefaultsApplyOtherwise
