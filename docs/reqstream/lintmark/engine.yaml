---
# Engine Subsystem Requirements
#
# PURPOSE:
# - Define requirements for the LintMark Engine subsystem
# - The Engine subsystem selects the files to process, processes them and reports failures
# - Subsystem requirements describe the externally visible file-selection and reporting behavior
# - Using the line ending that the configuration or the editor settings give is not observable until files
#   are rewritten, so the formatting phase adds the matching requirements

sections:
  - title: LintMark Requirements
    sections:
      - title: Engine Requirements
        requirements:
          - id: LintMark-Engine-Discovery
            title: >-
              The Engine subsystem shall expand path, directory, glob, and exclusion arguments into the distinct
              set of Markdown files to process, using every Markdown file under the current directory when no
              selection is given.
            justification: |
              Users select files in the way that suits them: by name, by folder, or by pattern, with
              exceptions. A file named by several arguments must be processed once, and a selection that
              matches nothing must not be an error.
            children:
              - LintMark-Engine-FileDiscovery-NamedFile
              - LintMark-Engine-FileDiscovery-Directory
              - LintMark-Engine-FileDiscovery-Glob
              - LintMark-Engine-FileDiscovery-MissingPath
              - LintMark-Engine-FileDiscovery-NoMatch
              - LintMark-Engine-FileDiscovery-Default
              - LintMark-Engine-FileDiscovery-Exclude
              - LintMark-Engine-FileDiscovery-ExcludeDirectory
              - LintMark-Engine-FileDiscovery-DistinctFiles
              - LintMark-Engine-FileDiscovery-StableOrder
              - LintMark-Engine-FileDiscovery-CaseRules
              - LintMark-Engine-FileDiscovery-BlankArgument
              - LintMark-Engine-FileDiscovery-NullArgument
              - LintMark-Engine-FileDiscovery-SpellingChoice
              - LintMark-Engine-FileDiscovery-Separators
            tests:
              - EngineSubsystem_DiscoveryAndParse_DirectoryWithMarkdown_ReportsNothing
              - EngineSubsystem_DefaultPattern_UsesCurrentDirectory
              - EngineSubsystem_ExcludePattern_SkipsExcludedFiles
              - EngineSubsystem_OverlappingArguments_ReportEachFailureOnce

          - id: LintMark-Engine-ThirdPartyFolders
            title: >-
              The Engine subsystem shall not select files from `node_modules` or `.git` folders below the
              current directory unless the file itself is named on the command line.
            justification: |
              Package and version-control folders contain Markdown that the user does not own and that must
              not be changed or reported on, even when the user points the tool at the folder or at a pattern
              inside it. Naming a file explicitly is a deliberate choice that must still be honored.
            children:
              - LintMark-Engine-FileDiscovery-DefaultExcludes
              - LintMark-Engine-FileDiscovery-ExplicitFileOverride
            tests:
              - EngineSubsystem_DiscoveryAndParse_DirectoryWithMarkdown_ReportsNothing
              - EngineSubsystem_ThirdPartyFolderNamed_IsNotProcessed
              - EngineSubsystem_ExplicitFileInThirdPartyFolder_IsProcessed

          - id: LintMark-Engine-Processing
            title: >-
              The Engine subsystem shall read and parse every selected file without a problem in one file
              preventing the others from being processed.
            justification: |
              Independent files must stay independent, so that one broken file never hides the state of
              the rest of a documentation set.
            children:
              - LintMark-Engine-LintMarkEngine-ProcessEach
              - LintMark-Engine-LintMarkEngine-IsolatedFailures
              - LintMark-Engine-LintMarkEngine-ImmutableResults
            tests:
              - EngineSubsystem_DiscoveryAndParse_DirectoryWithMarkdown_ReportsNothing
              - EngineSubsystem_ParseFailure_ReportedWithPositionAndRule

          - id: LintMark-Engine-FailureReport
            title: >-
              The Engine subsystem shall report each file that cannot be read, decoded, or processed on its own
              line as `path:line:col: rule-id message`, with a path relative to the current directory using
              forward slashes.
            justification: |
              A single, regular line format can be read by people, editors, and build systems alike.
              Relative paths with one separator style make output reproducible across platforms and
              machines.
            children:
              - LintMark-Engine-LintMarkEngine-ReadFailure
              - LintMark-Engine-LintMarkEngine-EncodingFailure
              - LintMark-Engine-LintMarkEngine-LineEndingFailure
              - LintMark-Engine-LintMarkEngine-ProcessingFailure
              - LintMark-Engine-LintMarkEngine-FailureFormat
              - LintMark-Engine-LintMarkEngine-FailureOrderWithinFile
            tests:
              - EngineSubsystem_ParseFailure_ReportedWithPositionAndRule
              - EngineSubsystem_DefaultPattern_UsesCurrentDirectory

          - id: LintMark-Engine-FailureExitStatus
            title: >-
              The Engine subsystem shall exit with a non-zero status when any file failed and with zero
              otherwise.
            justification: |
              Scripts and build pipelines act on the exit status alone.
            children:
              - LintMark-Engine-LintMarkEngine-ExitStatus
            tests:
              - EngineSubsystem_ParseFailure_ReportedWithPositionAndRule
              - EngineSubsystem_DiscoveryAndParse_DirectoryWithMarkdown_ReportsNothing

          - id: LintMark-Engine-SilentOnSuccess
            title: >-
              The Engine subsystem shall write nothing for files that were processed successfully, including
              when no file is selected.
            justification: |
              Silence on success keeps the output of large runs readable, and an empty selection is a
              valid outcome rather than a failure.
            children:
              - LintMark-Engine-LintMarkEngine-SilentOnSuccess
            tests:
              - EngineSubsystem_DiscoveryAndParse_DirectoryWithMarkdown_ReportsNothing
              - EngineSubsystem_ExcludePattern_SkipsExcludedFiles

          - id: LintMark-Engine-DeterministicOrder
            title: >-
              The Engine subsystem shall report failures ordered by path and then by position, independent of
              the order of the arguments, the number of files processed at once, and the order in which files
              finish.
            justification: |
              Reproducible output is required for comparing runs, for stable build logs, and for tests.
              Scheduling must never be visible to the user.
            children:
              - LintMark-Engine-LintMarkEngine-OrderedResults
            tests:
              - EngineSubsystem_ParallelAndSequential_ProduceIdenticalOutput
              - EngineSubsystem_OverlappingArguments_ReportEachFailureOnce

          - id: LintMark-Engine-EffectiveConfiguration
            title: >-
              The Engine subsystem shall process each selected file with the configuration that applies to
              that file.
            justification: |
              Different folders of one run can have different configurations, and each file must be
              processed with its own.
            children:
              - LintMark-Engine-LintMarkEngine-ConfigPerFile
              - LintMark-Engine-LintMarkEngine-ImmutableConfigResults
            tests:
              - EngineSubsystem_Configuration_NearestConfigPerDirectory_ReportsEachBadConfigOnce

          - id: LintMark-Engine-ConfigurationIndependence
            title: >-
              The Engine subsystem shall process each selected file with the same configuration regardless of
              the other files, the order in which files are processed, and the number processed at once.
            justification: |
              The settings of one file must never leak into another or depend on scheduling.
            children:
              - LintMark-Engine-LintMarkEngine-ConfigIndependentOfScheduling
            tests:
              - EngineSubsystem_ConfigErrors_ParallelAndSequential_ProduceIdenticalOutput

          - id: LintMark-Engine-ExplicitConfiguration
            title: >-
              The Engine subsystem shall process every selected file with the configuration file named on the
              command line, when there is one, instead of a discovered configuration.
            justification: |
              Naming a configuration file is a deliberate choice that overrides discovery.
            children:
              - LintMark-Engine-LintMarkEngine-ExplicitConfig
            tests:
              - EngineSubsystem_ExplicitConfig_InvalidFile_ReportedOnceForAllFiles

          - id: LintMark-Engine-ExplicitConfigurationProblems
            title: >-
              The Engine subsystem shall report the problems of the configuration file named on the command line
              even when no file is selected.
            justification: |
              A problem with the named configuration matters whether or not the selection happens to
              contain files.
            children:
              - LintMark-Engine-LintMarkEngine-ExplicitConfigProblems
            tests:
              - EngineSubsystem_ExplicitConfig_NoFilesSelected_ReportsProblem

          - id: LintMark-Engine-NoConfig
            title: >-
              The Engine subsystem shall process every selected file with the default configuration, unaffected
              by any configuration file or editor settings however invalid or unreadable, when the no-config
              option is given.
            justification: |
              Users need a way to run the tool exactly as shipped, independent of whatever configuration
              happens to be around, for example to rule it out as the cause of a surprise.
            children:
              - LintMark-Engine-LintMarkEngine-NoConfig
            tests:
              - EngineSubsystem_NoConfig_InvalidConfigPresent_ReportsNothing

          - id: LintMark-Engine-ConfigErrorFormat
            title: >-
              The Engine subsystem shall report each configuration problem on its own line as
              `path:line:col: config-error message`.
            justification: |
              Configuration problems are as actionable as file problems and belong in the same regular
              report, so that editors and build systems can read them.
            children:
              - LintMark-Engine-LintMarkEngine-ConfigErrorFormat
            tests:
              - EngineSubsystem_Configuration_NearestConfigPerDirectory_ReportsEachBadConfigOnce

          - id: LintMark-Engine-ConfigErrorOnce
            title: >-
              The Engine subsystem shall report a configuration problem once, however many files use the
              configuration that has it.
            justification: |
              One broken configuration used by hundreds of files would otherwise bury the report.
            children:
              - LintMark-Engine-LintMarkEngine-ConfigErrorOnce
            tests:
              - EngineSubsystem_ExplicitConfig_InvalidFile_ReportedOnceForAllFiles

          - id: LintMark-Engine-ConfigErrorOrder
            title: >-
              The Engine subsystem shall order configuration problems together with the file failures by path
              and position.
            justification: |
              Reproducible output is required for comparing runs and for stable build logs.
            children:
              - LintMark-Engine-LintMarkEngine-ConfigErrorOrder
            tests:
              - EngineSubsystem_ConfigErrors_AndFileFailures_MergedInPathThenPositionOrder

          - id: LintMark-Engine-ConfigErrorIsolation
            title: >-
              The Engine subsystem shall read and check every selected file even when the configuration that
              applies to it is invalid.
            justification: |
              A configuration problem must not hide the state of the files themselves, so that one run shows
              every problem there is to fix.
            children:
              - LintMark-Engine-LintMarkEngine-ConfigErrorIsolation
            tests:
              - EngineSubsystem_Configuration_NearestConfigPerDirectory_ReportsEachBadConfigOnce

          - id: LintMark-Engine-ConfigErrorExitStatus
            title: The Engine subsystem shall exit with a non-zero status when a configuration problem was reported.
            justification: |
              Build pipelines act on the exit status alone, and an invalid configuration means the run did
              not do what the user asked.
            children:
              - LintMark-Engine-LintMarkEngine-ConfigErrorExitStatus
            tests:
              - EngineSubsystem_Configuration_NearestConfigPerDirectory_ReportsEachBadConfigOnce
              - EngineSubsystem_ExplicitConfig_InvalidFile_ReportedOnceForAllFiles
