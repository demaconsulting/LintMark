---
# Engine Subsystem Requirements
#
# The Engine subsystem runs one invocation over the selected files: it discovers the files, processes them in
# parallel, writes or shows the rewrites, and reports the findings.

sections:
  - title: LintMark Requirements
    sections:
      - title: Engine Requirements
        requirements:
          - id: LintMark-Engine-Discovery
            title: >-
              The Engine subsystem shall select the files to process from the given files, directories, glob
              patterns, and exclusions, process each file once, and skip files that the configuration ignores.
            justification: |
              Users must be able to point the tool at a repository, a folder, or a handful of files, and get
              exactly the files they meant, without duplicates and without third-party folders.
            children:
              - LintMark-Engine-FileDiscovery-Selection
              - LintMark-Engine-FileDiscovery-Exclusions
              - LintMark-Engine-FileDiscovery-SkippedFolders
              - LintMark-Engine-FileDiscovery-DistinctOrdered
              - LintMark-Engine-FileDiscovery-ScanRootPruning
              - LintMark-Engine-LintMarkEngine-ScanRootIgnore
            tests:
              - EngineSubsystem_Discovery_PatternsExclusionsAndExplicitFiles_SelectTheFilesToProcess

          - id: LintMark-Engine-Processing
            title: >-
              The Engine subsystem shall read, parse, lint, and format every selected file with the settings
              that apply to it, in parallel, and keep going when a file or a configuration is faulty.
            justification: |
              Large repositories need speed, results must not depend on the order of work, and one bad file
              must not hide the findings in the others.
            children:
              - LintMark-Engine-LintMarkEngine-Pipeline
              - LintMark-Engine-LintMarkEngine-ConfigErrors
              - LintMark-Engine-LintMarkEngine-FileProblems
              - LintMark-Engine-LintMarkEngine-IgnoreAndOverrides
            tests:
              - EngineSubsystem_Processing_ManyFilesInParallel_GiveTheSameResultsInPathOrder

          - id: LintMark-Engine-Writing
            title: >-
              The Engine subsystem shall rewrite a file only when asked to, only with formatting changes, in
              one atomic step, and never over a file that changed or was replaced in the meantime.
            justification: |
              A formatter that corrupts or loses a user's document is worse than no formatter, so writing
              must be explicit, all-or-nothing, and safe against concurrent edits.
            children:
              - LintMark-Engine-LintMarkEngine-SafeFix
              - LintMark-Engine-AtomicFileWriter-Replacement
              - LintMark-Engine-AtomicFileWriter-RefusesChange
            tests:
              - EngineSubsystem_Writing_FixOption_RewritesAtomicallyAndNeverOverChangedOrUnsafeFiles

          - id: LintMark-Engine-Reporting
            title: >-
              The Engine subsystem shall report findings as text lines in a stable order, and show the changes of
              the diff option as a unified diff, writing nothing when there is nothing to report.
            justification: |
              Findings are read by people and parsed by editors and build systems, so their format and order
              must be stable, and a clean run must be silent.
            children:
              - LintMark-Engine-Reporters-TextFormat
              - LintMark-Engine-Reporters-DiffFormat
              - LintMark-Engine-Reporters-NothingToReport
            tests:
              - EngineSubsystem_Reporting_CheckAndDiffOptions_WriteFindingsInOrderAndUnifiedDiff
