---
# Utilities Subsystem Requirements
#
# PURPOSE:
# - Define requirements for the LintMark Utilities subsystem
# - The Utilities subsystem spans PathHelpers.cs (safe path-combination utilities) and TextWidth.cs (display width
#   of text)
# - Subsystem requirements describe the shared utility behavior available to all other subsystems

sections:
  - title: LintMark Requirements
    sections:
      - title: Utilities Requirements
        requirements:
          - id: LintMark-Utilities-DisplayWidth
            title: >-
              The Utilities subsystem shall measure the width of a text in terminal display columns, counting wide
              East Asian characters and emoji as two columns, narrow characters as one, and combining marks,
              joiners, and control characters as none.
            justification: |
              Rules that limit the length of a line must count what a reader sees. A text in Japanese,
              Korean, or Chinese, or with emoji, is much wider on screen than it is in characters, and a
              combining accent does not take a column at all. The subsystem provides the one measurement
              that every such rule shares.
            children:
              - LintMark-Utilities-TextWidth-WideCharacters
              - LintMark-Utilities-TextWidth-NarrowCharacters
              - LintMark-Utilities-TextWidth-Emoji
              - LintMark-Utilities-TextWidth-ZeroWidthCharacters
              - LintMark-Utilities-TextWidth-GraphemeClusters
              - LintMark-Utilities-TextWidth-InvalidText
              - LintMark-Utilities-TextWidth-CultureIndependent
              - LintMark-Utilities-TextWidth-LinearTime
            tests:
              - UtilitiesSubsystem_TextWidth_MixedScriptLine_MeasuresDisplayColumns
          - id: LintMark-Utilities-SafePaths
            title: >-
              The Utilities subsystem shall provide safe file path manipulation that
              prevents path traversal and absolute path injection.
            justification: |
              The Utilities subsystem provides shared path utilities consumed by other subsystems.
              When constructing file paths from caller-supplied inputs, the subsystem must reject
              path traversal sequences (such as '..') and absolute paths to prevent unintended
              file system access. This requirement captures the subsystem-level safety guarantee
              that all consumers of the Utilities subsystem can rely upon.
            children:
              - LintMark-Utilities-PathHelpers-SafeCombine
            tests:
              - UtilitiesSubsystem_PathResolutionWorkflow_ValidPaths_ResolvesCorrectly
              - UtilitiesSubsystem_DirectoryCreationWorkflow_ValidPaths_CreatesDirectories
              - UtilitiesSubsystem_PathTraversalValidation_DangerousPaths_ThrowsException
              - UtilitiesSubsystem_AbsolutePathRejection_ThrowsException
