---
# Linting Subsystem Requirements
#
# The Linting subsystem holds the catalog of rules and the checks that report problems without changing text.

sections:
  - title: LintMark Requirements
    sections:
      - title: Linting Requirements
        requirements:
          - id: LintMark-Linting-Catalog
            title: >-
              The Linting subsystem shall provide one catalog of rules, with kind, default state, and
              markdownlint number, and resolve rule ids, numbers, and command-line switches consistently.
            justification: |
              Rules are named in configuration files, comments, and on the command line, and every place must
              mean the same rule.
            children:
              - LintMark-Linting-RuleCatalog-Registry
              - LintMark-Linting-RuleCatalog-Aliases
              - LintMark-Linting-RuleCatalog-Overrides
            tests:
              - LintingSubsystem_Catalog_RulesAliasesDefaultsAndOverrides_ResolveConsistently

          - id: LintMark-Linting-Findings
            title: >-
              The Linting subsystem shall represent every finding with its rule, kind, position, and one-line
              message, and deliver the findings of a document in source order.
            justification: |
              Findings are the product of the tool, so each must say what is wrong and where, and the same
              document must always give the same list.
            children:
              - LintMark-Linting-RuleCatalog-Findings
              - LintMark-Linting-LintRules-Enablement
            tests:
              - LintingSubsystem_Findings_Document_AreLintOnlyWithPositionAndInSourceOrder

          - id: LintMark-Linting-LintChecks
            title: >-
              The Linting subsystem shall check headings, links, code, quotes, footnotes, emphasis, and tables for
              the problems that rewriting cannot or should not fix, reporting only rules that are enabled and not
              suppressed.
            justification: |
              Some problems need an author's judgment, and users must be able to turn each check on or off and
              exempt a passage on purpose.
            children:
              - LintMark-Linting-LintRules-Headings
              - LintMark-Linting-LintRules-Links
              - LintMark-Linting-LintRules-Structure
              - LintMark-Linting-LintRules-Tables
              - LintMark-Linting-LintRules-Enablement
            tests:
              - LintingSubsystem_LintChecks_DisabledSuppressedAndOptionalRules_HonorEnablement
