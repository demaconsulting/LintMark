---
# Linting Subsystem Requirements
#
# PURPOSE:
# - Define requirements for the LintMark Linting subsystem
# - The Linting subsystem defines what a reported problem is (a diagnostic) and which rule identifiers exist
#   (the rule registry)
# - Subsystem requirements describe the vocabulary that the other subsystems share when they accept or report rules

sections:
  - title: LintMark Requirements
    sections:
      - title: Linting Requirements
        requirements:
          - id: LintMark-Linting-Diagnostics
            title: >-
              The Linting subsystem shall represent each problem as a diagnostic that carries a rule
              identifier, a path, a 1-based line and column, a message on one line, and whether rewriting the
              file removes the problem.
            justification: |
              Every report line is made from these parts, and the fix option must know which problems
              rewriting removes. A diagnostic that could be built from invalid parts would produce
              report lines that no editor or script can read.
            children:
              - LintMark-Linting-Diagnostic-Fields
              - LintMark-Linting-Diagnostic-Validation
              - LintMark-Linting-Diagnostic-FixableMatchesKind
              - LintMark-Linting-Diagnostic-ValueEquality
            tests:
              - LintingSubsystem_Diagnostics_FormattingKind_IsFixable

          - id: LintMark-Linting-RuleRegistry
            title: >-
              The Linting subsystem shall provide one registry of every rule identifier that the tool accepts
              in a configuration or reports, with its kind, its legacy rule numbers, and whether it is enabled
              by default.
            justification: |
              Rules are known by a name and, for users coming from other tools, by a legacy number. One
              registry that every other subsystem consults keeps the accepted names, the defaults, and
              the reported identifiers from drifting apart.
            children:
              - LintMark-Linting-RuleCatalog-ResolveNames
              - LintMark-Linting-RuleCatalog-ResolveConfigurableOnly
              - LintMark-Linting-RuleCatalog-DroppedAliases
              - LintMark-Linting-RuleCatalog-Defaults
              - LintMark-Linting-RuleCatalog-RegisteredIds
              - LintMark-Linting-RuleCatalog-RuleKinds
              - LintMark-Linting-RuleCatalog-ImmutableResults
              - LintMark-Linting-RuleCatalog-NullArguments
            tests:
              - LintingSubsystem_RuleRegistry_EveryEmittedRuleId_IsRegistered
              - LintingSubsystem_RuleRegistry_ConfigRules_AcceptAliasesAndRejectNonConfigurable
