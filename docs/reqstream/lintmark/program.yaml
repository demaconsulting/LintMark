---
# Software Unit Requirements for the Program Class
#
# The Program unit is the top-level command dispatcher for the tool.

sections:
  - title: Program Unit Requirements
    requirements:
      - id: LintMark-Program-Version
        title: The Program class shall support -v and --version flags to display version information.
        justification: |
          Users need to quickly identify the version of the tool they are using for
          troubleshooting and compatibility verification.
        tests:
          - Program_Run_WithVersionFlag_DisplaysVersionOnly
          - Program_Run_WithShortVersionFlag_DisplaysVersion
          - Program_Version_ReturnsNonEmptyString

      - id: LintMark-Program-Help
        title: The Program class shall support -?, -h, and --help flags to display usage information.
        justification: |
          Users need access to command-line usage documentation without requiring
          external resources.
        tests:
          - Program_Run_WithHelpFlag_DisplaysUsageInformation
          - Program_Run_WithShortHelpFlag_DisplaysUsage
          - Program_Run_WithQuestionMarkFlag_DisplaysUsage
          - Program_Run_WithHelpFlag_ListsCheckOptionAndPaths

      - id: LintMark-Program-Validate
        title: The Program class shall support --validate flag to invoke the self-validation framework.
        justification: |
          Provides a built-in mechanism to verify the tool is functioning correctly
          in the deployment environment.
        tests:
          - Program_Run_WithValidateFlag_RunsValidation

      - id: LintMark-Program-Lint
        title: >-
          The Program class shall process the selected Markdown files, and report their failures through the
          context, when no version, help, or validate flag is given.
        justification: |
          Processing Markdown files is the primary purpose of the tool, so the entry point must
          dispatch to it by default. Failures must reach the user through the same output channels and
          exit code as every other error.
        tests:
          - Program_Run_WithPathArgument_RunsEngine
          - Program_Run_NoArguments_DisplaysDefaultBehavior

      - id: LintMark-Program-ExitCode
        title: The Program class shall return a non-zero exit code on failure.
        justification: |
          Callers (scripts, CI/CD pipelines) must be able to detect failure conditions
          programmatically via the process exit code.
        tests:
          - Program_Main_WithInvalidArgs_ReturnsNonZeroExitCode
