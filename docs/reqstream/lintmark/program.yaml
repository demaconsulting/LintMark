---
# Software Unit Requirements for the Program Unit
#
# The Program unit is the entry point of the tool: it chooses the one action that the command line selects and
# turns invalid command lines into an error message and exit status 1.

sections:
  - title: LintMark Requirements
    sections:
      - title: Program Requirements
        requirements:
          - id: LintMark-Program-Dispatch
            title: >-
              The Program unit shall perform only the highest-priority action that the command line selects, in
              the order version, help, self-validation, and linting of the selected files.
            justification: |
              Users combine options freely, and the tool has to behave predictably when more than one action is
              requested, so that a version query never starts a lint run.
            tests:
              - Program_Run_WithVersionFlag_DisplaysVersionOnly
              - Program_Run_VersionAndHelpFlags_VersionTakesPriority
              - Program_Run_WithHelpFlag_DisplaysUsageInformation
              - Program_Run_WithValidateFlag_RunsValidation
              - Program_Run_WithPathArgument_RunsEngine

          - id: LintMark-Program-HelpCommand
            title: >-
              The Program unit shall answer the help command before the command-line options are parsed and return
              its exit code.
            justification: |
              The help command is not an option, and the option parser would take it for a path. Offering the
              arguments to the help command first lets 'lintmark help' work while every other run continues to the
              option parser unchanged.
            tests:
              - Program_Main_WithHelpVerb_PrintsHelpIndex

          - id: LintMark-Program-HelpFooter
            title: The Program unit shall end its usage information with a pointer to the help command.
            justification: |
              The short usage text stays short and still tells a reader where the help topics with worked examples
              are.
            tests:
              - Program_Run_WithHelpFlag_DisplaysUsageInformation

          - id: LintMark-Program-Banner
            title: >-
              The Program unit shall print the tool name with its version and the copyright line before every
              action except the version query, which prints the version alone.
            justification: |
              The banner identifies the tool and version in logs and console output, while the version query has
              to be usable in scripts that read only the version number.
            tests:
              - Program_Run_NoArguments_DisplaysDefaultBehavior
              - Program_Run_WithVersionFlag_DisplaysVersionOnly
              - Program_Run_VersionAndHelpFlags_VersionTakesPriority

          - id: LintMark-Program-ErrorHandling
            title: >-
              The Program unit shall report an invalid command line as a one-line error message on standard
              error, without a stack trace, and end with exit status 1.
            justification: |
              Users and scripts need a clear message and a failing status for usage problems, not a crash report.
            tests:
              - Program_Main_WithInvalidArgs_ReturnsNonZeroExitCode
              - Program_Main_WithInvalidArgs_WritesErrorMessageToStandardError
