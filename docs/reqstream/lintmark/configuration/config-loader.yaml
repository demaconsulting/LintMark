---
# Software Unit Requirements for the ConfigLoader Unit
#
# The ConfigLoader unit finds, reads, and validates the .lintmark.yaml configuration that applies to a Markdown
# file, and returns either a valid configuration or the complete list of positioned problems.

sections:
  - title: LintMark Requirements
    sections:
      - title: Configuration Requirements
        sections:
          - title: ConfigLoader Requirements
            requirements:
              - id: LintMark-Configuration-ConfigLoader-Discovery
                title: >-
                  The ConfigLoader unit shall use the nearest .lintmark.yaml from a file's directory upward without
                  merging it with another, stop the search at a repository root, use the explicit file when one is
                  given, and use the defaults when none applies.
                justification: |
                  Users place a configuration where it applies and expect a predictable result, a nearer file
                  fully replacing a farther one, with no surprises from outside the repository.
                tests:
                  - ConfigLoader_ForDiscovery_Load_NearestConfigWins_FartherNeverRead
                  - ConfigLoader_ForDiscovery_Load_NearerPartialConfig_DoesNotInheritFarther
                  - ConfigLoader_ForDiscovery_Load_GitDirectoryStopsSearch_ConfigAboveIgnored
                  - ConfigLoader_ForDiscovery_Load_NoConfigFile_ReturnsDefaults
                  - ConfigLoader_ForFile_DiscoverableFilePresent_IgnoresDiscoverableFile
                  - ConfigLoader_ForDefaults_Load_IgnoresConfigFilesAndNeverProbes

              - id: LintMark-Configuration-ConfigLoader-Settings
                title: >-
                  The ConfigLoader unit shall read every documented setting from the configuration file with its
                  documented type and range, keeping the default for each setting that the file does not state.
                justification: |
                  Users tailor the tool through the file, so each setting has to be read exactly as documented.
                tests:
                  - ConfigLoader_Parse_EmptyContent_ReturnsDefaults
                  - ConfigLoader_Parse_FullSampleFile_AppliesEverySetting
                  - ConfigLoader_Parse_EveryEnumValue_Accepted
                  - ConfigLoader_Parse_IntegerNotPlainDecimal_Reported
                  - ConfigLoader_Parse_IgnoreList_ReplacesDefaultsInGivenOrder
                  - ConfigLoader_Parse_Utf8Bom_IsIgnored

              - id: LintMark-Configuration-ConfigLoader-Errors
                title: >-
                  The ConfigLoader unit shall report every problem of a configuration file at its line and column,
                  all together and in position order, and shall then supply no configuration at all.
                justification: |
                  A configuration that is partly wrong must never be applied silently, and users want to fix all
                  of its problems in one pass.
                children:
                  - LintMark-OTS-YamlDotNet-Positions
                  - LintMark-OTS-YamlDotNet-Errors
                  - LintMark-OTS-YamlDotNet-Documents
                tests:
                  - ConfigLoader_Parse_InvalidEnumValue_ListsAllowedValues
                  - ConfigLoader_Parse_SeveralUnknownKeys_AllReportedInPositionOrder
                  - ConfigLoader_Parse_DuplicateKey_ReportsAtSecondOccurrence
                  - ConfigLoader_Parse_MalformedYamlTabIndentation_ReportsInvalidYaml
                  - ConfigLoader_Parse_MultipleDocuments_ReportedAtSecondDocument
                  - ConfigLoader_ForFile_MissingFile_ReportsNotFoundAt1x1
                  - ConfigLoader_ForDiscovery_Load_UnreadableNearestConfig_ReportedWithoutFallingBack

              - id: LintMark-Configuration-ConfigLoader-InputLimits
                title: >-
                  The ConfigLoader unit shall reject a configuration file larger than 1 MiB and one nested deeper
                  than 64 levels with a reported problem, and shall accept a file at either limit.
                justification: |
                  Configuration files are untrusted input, and an oversized or deeply nested file must not exhaust
                  memory or time of the run.
                tests:
                  - ConfigLoader_Parse_TooLarge_ReportsSizeError
                  - ConfigLoader_Parse_AtSizeLimit_Accepted
                  - ConfigLoader_Parse_NestingAtLimit_IsParsed
                  - ConfigLoader_Parse_DeeplyNestedUnknownValue_ReportsOneErrorWithoutCrash
                  - ConfigLoader_LoadFile_TooLarge_ReportsSizeError

              - id: LintMark-Configuration-ConfigLoader-RuleNames
                title: >-
                  The ConfigLoader unit shall accept a rule in the rules setting by its id or its legacy
                  rule-number alias in any letter case, accept the alias of a dropped rule without effect, and
                  report an unknown rule or a rule named twice.
                justification: |
                  Users migrating from other Markdown linters keep their rule numbers, while mistakes in rule
                  names must not turn a rule on or off unnoticed.
                tests:
                  - ConfigLoader_Parse_RulesKebabId_Accepted
                  - ConfigLoader_Parse_RulesAlias_StoredAsCanonicalId
                  - ConfigLoader_Parse_RulesAnyLetterCase_Accepted
                  - ConfigLoader_Parse_RulesDroppedAlias_AcceptedAndNotStored
                  - ConfigLoader_Parse_RulesUnknownRule_ReportedAtKey
                  - ConfigLoader_Parse_RulesAliasAndKebabConflict_ReportedAtLaterOccurrence
