---
# Software Unit Requirements for the LintMarkConfig Class
#
# The LintMarkConfig class (with its supporting rule-identifier table, link conversion options, and
# setting enumerations) holds the complete, validated set of settings for one Markdown file.

sections:
  - title: LintMark Requirements
    sections:
      - title: Configuration Requirements
        sections:
          - title: LintMarkConfig Requirements
            requirements:
              - id: LintMark-Configuration-LintMarkConfig-Defaults
                title: >-
                  The LintMarkConfig class shall provide the documented default for every setting, including the
                  enabled state of every rule, the ignore patterns, the link conversion options, and an
                  unspecified line ending.
                justification: |
                  Defaults that are provided in one place and written down can be relied on by every
                  consumer and reviewed against the documentation.
                tests:
                  - LintMarkConfig_Default_Values_MatchDocumentedDefaults
                  - LintMarkConfig_Default_Rules_MatchDocumentedRuleDefaults
                  - LintMarkConfig_Default_Ignore_ListsDocumentedPatterns
                  - LintMarkConfig_Default_EndOfLine_IsNotSpecified
                  - LintMarkConfig_Default_LinkRefactor_IsDisabledWithDocumentedValues
                  - RuleIdentifiers_Defaults_DisabledRules_AreTheDocumentedThree

              - id: LintMark-Configuration-LintMarkConfig-SettingValues
                title: >-
                  The LintMarkConfig class shall hold a value for each setting, accept the boundary values of
                  each range, and allow a copy to differ from the original in chosen settings only.
                justification: |
                  Deriving the settings of one file from a shared configuration, for example by filling in
                  the line ending, must not disturb the configuration that other files use.
                tests:
                  - LintMarkConfig_With_EndOfLine_LeavesOriginalUnchanged
                  - LintMarkConfig_Equals_SameContentDifferentCollections_AreEqual
                  - LintMarkConfig_LineLength_ZeroAndMax_Accepted
                  - LintMarkConfig_Ignore_EmptyList_Accepted
                  - LinkRefactorOptions_MarkerEmptyComment_Accepted

              - id: LintMark-Configuration-LintMarkConfig-RuleIdentifiers
                title: >-
                  The LintMarkConfig class shall identify each configurable rule by its name or by its legacy rule
                  number in any letter case, and recognize the legacy numbers of removed rules without treating
                  them as rules.
                justification: |
                  Rules have a descriptive name and, for users coming from other tools, a legacy number.
                  Removed rules must stay recognizable so that an old entry is neither an error nor a rule.
                tests:
                  - RuleIdentifiers_TryResolve_KebabId_ReturnsCanonical
                  - RuleIdentifiers_TryResolve_EveryAlias_ReturnsItsRule
                  - RuleIdentifiers_TryResolve_AnyLetterCase_ReturnsCanonical
                  - RuleIdentifiers_TryResolve_TurkishCulture_StillMatches
                  - RuleIdentifiers_TryResolve_UnknownName_ReturnsFalse
                  - RuleIdentifiers_TryResolve_DroppedAlias_ReturnsFalseAndIsDropped
                  - RuleIdentifiers_TryResolve_Null_Throws
                  - RuleIdentifiers_ConfigurableRules_AreSortedOrdinalAndCoveredByDefaults
                  - RuleIdentifiers_Aliases_AreUniqueAndMapToConfigurableRules

              - id: LintMark-Configuration-LintMarkConfig-ValueChecks
                title: >-
                  The LintMarkConfig class shall refuse a setting value that is outside its range, is not a defined
                  choice, or is not well formed, by throwing an exception that names the kind of problem.
                justification: |
                  A configuration object must never hold a value that a formatter could not honor, however
                  the value arrived. Refusing it at the point of assignment keeps every later consumer
                  simple.
                tests:
                  - LintMarkConfig_LineLength_OutOfRange_ThrowsArgumentOutOfRangeException
                  - LintMarkConfig_ListIndent_NotTwoOrFour_Throws
                  - LintMarkConfig_MaxBlankLines_OutOfRange_Throws
                  - LintMarkConfig_EnumSetting_UndefinedValue_Throws
                  - LintMarkConfig_Ignore_DefaultArray_Throws
                  - LintMarkConfig_Ignore_InvalidElement_Throws
                  - LintMarkConfig_Rules_InvalidKeyOrMissingRule_Throws
                  - LintMarkConfig_Rules_CaseInsensitiveComparer_StoredOrdinal
                  - LintMarkConfig_LinkRefactor_Null_Throws
                  - LinkRefactorOptions_ThresholdOrLabelLengthOutOfRange_Throws
                  - LinkRefactorOptions_MarkerNotSingleLineHtmlComment_Throws

              - id: LintMark-Configuration-LintMarkConfig-ImmutableSettings
                title: >-
                  The LintMarkConfig class shall expose its rule states and ignore patterns as collections that
                  cannot be changed by their holders, and shall be unaffected by later changes to the collections
                  it was built from.
                justification: |
                  One configuration is shared by many files and threads. A collection that anyone could
                  modify would let one consumer change the behavior for all the others.
                tests:
                  - LintMarkConfig_Rules_CastToMutableTypes_CannotBeModified
                  - LintMarkConfig_Ignore_CastToMutableTypes_CannotBeModified
                  - LintMarkConfig_Ignore_SourceArrayChangedAfterAssignment_ConfigUnchanged
                  - LintMarkConfig_DefaultIgnore_IsImmutableArray
