---
# Software Unit Requirements for the LintMarkConfig Unit
#
# The LintMarkConfig unit holds the complete settings of a run; its defaults are the documented behavior of
# the tool when a setting is not given.

sections:
  - title: LintMark Requirements
    sections:
      - title: Configuration Requirements
        sections:
          - title: LintMarkConfig Requirements
            requirements:
              - id: LintMark-Configuration-LintMarkConfig-Defaults
                title: >-
                  The LintMarkConfig unit shall give every setting its documented default when the configuration
                  does not state it, with no line ending specified.
                justification: |
                  Users get the preferred style without writing a configuration, and a configuration file only
                  has to state the settings that differ.
                tests:
                  - LintMarkConfig_Default_EverySetting_HasDocumentedValue

              - id: LintMark-Configuration-LintMarkConfig-RuleDefaults
                title: >-
                  The LintMarkConfig unit shall hold an enabled state for every configurable rule, with all rules
                  enabled by default except the opt-in rules descriptive-link-text, dollar-sign-in-shell-code, and
                  table-grid-unformatted.
                justification: |
                  Users need a complete and predictable rule set without configuration, while rules that are
                  judged noisy stay opt-in.
                tests:
                  - LintMarkConfig_Default_Rules_HoldEveryConfigurableRuleWithOptInRulesOff

              - id: LintMark-Configuration-LintMarkConfig-LinkRefactor
                title: >-
                  The LintMarkConfig unit shall keep the link-refactor conversion off by default and shall accept
                  only a single-line HTML comment as the marker that introduces the link definitions.
                justification: |
                  Converting links rewrites documents more than most users expect, so it is opt-in, and a marker
                  that is not one comment on one line would corrupt the document.
                tests:
                  - LintMarkConfig_Default_LinkRefactor_IsDisabledWithDocumentedOptions
                  - LinkRefactorOptions_IsValidMarker_SingleLineHtmlComment_ReturnsTrue
                  - LinkRefactorOptions_IsValidMarker_NotSingleLineHtmlComment_ReturnsFalse
