---
# Software Unit Requirements for the EditorConfigResolver Unit
#
# The EditorConfigResolver unit determines the line ending that the editor settings (.editorconfig files) state
# for a Markdown file.

sections:
  - title: LintMark Requirements
    sections:
      - title: Configuration Requirements
        sections:
          - title: EditorConfigResolver Requirements
            requirements:
              - id: LintMark-Configuration-EditorConfigResolver-EndOfLine
                title: >-
                  The EditorConfigResolver unit shall resolve the end_of_line setting that applies to a file to
                  LF or CRLF, matching the setting name and value in any letter case, also for a file that does
                  not exist.
                justification: |
                  Teams already state their line ending in the editor settings, and the tool should follow it
                  instead of requiring the same setting twice.
                children:
                  - LintMark-OTS-EditorConfig-Resolution
                tests:
                  - EditorConfigResolver_Resolve_LfSection_ReturnsLf
                  - EditorConfigResolver_Resolve_CrLfSection_ReturnsCrLf
                  - EditorConfigResolver_Resolve_UpperCaseValueAndKey_Accepted
                  - EditorConfigResolver_Resolve_NonexistentFileInMissingDirectory_StillResolves

              - id: LintMark-Configuration-EditorConfigResolver-Precedence
                title: >-
                  The EditorConfigResolver unit shall apply a nearer settings file over a farther one, a later
                  section over an earlier one, and stop at a settings file marked as root, and shall ignore
                  malformed lines.
                justification: |
                  Editor settings are layered and shared with other tools, so the tool must read them the way
                  editors do and must not fail because of unrelated mistakes in them.
                tests:
                  - EditorConfigResolver_Resolve_NestedEditorConfigFiles_NearestFileWinsPerProperty
                  - EditorConfigResolver_Resolve_RootTrue_StopsSearch
                  - EditorConfigResolver_Resolve_NoRoot_NearerFileLacksProperty_UsesFartherFile
                  - EditorConfigResolver_Resolve_LessSpecificLaterSection_LaterSectionWins
                  - EditorConfigResolver_Resolve_MalformedEditorConfig_BadLinesIgnored_LaterSectionApplies

              - id: LintMark-Configuration-EditorConfigResolver-Unsupported
                title: >-
                  The EditorConfigResolver unit shall treat the value cr, the value unset, an invalid value, and a
                  missing setting as no line ending specified, with an unset or invalid value in a nearer file
                  hiding a value in a farther file.
                justification: |
                  The tool writes only LF or CRLF, and an unusable value must lead to the next source of the line
                  ending instead of an error or a wrong ending.
                tests:
                  - EditorConfigResolver_Resolve_CrValue_NotSpecified
                  - EditorConfigResolver_Resolve_UnsetValue_NotSpecified
                  - EditorConfigResolver_Resolve_UnsetInNearerFile_HidesFartherValue
                  - EditorConfigResolver_Resolve_InvalidValue_NotSpecified
                  - EditorConfigResolver_Resolve_NoEndOfLineSetting_NotSpecified
