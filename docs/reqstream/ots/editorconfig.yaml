---
# EditorConfig OTS Software Requirements
#
# Requirements for the editorconfig library functionality that LintMark relies on to read the end_of_line
# setting of .editorconfig files: the raw property values, the matching of sections to files, the layering of
# settings files, the tolerance of malformed content, and the safety of sharing parsers between threads.

sections:
  - title: OTS Software Requirements
    sections:
      - title: EditorConfig Requirements
        requirements:
          - id: LintMark-OTS-EditorConfig-RawProperties
            title: >-
              EditorConfig shall expose the raw text of the end_of_line property, including the value unset.
            justification: |
              The library's typed line-ending value does not honor unset or unknown values and still reports
              a value from a farther file, so LintMark interprets the raw text of end_of_line itself. The
              tests pin both the raw behavior LintMark uses and the typed behavior it avoids.
            tags: [ots]
            tests:
              - EditorConfig_Parser_UnsetValue_RawPropertyIsUnset
              - EditorConfig_Parser_TypedEndOfLine_IgnoresUnsetAndInvalidValues
              - EditorConfig_Parser_EndOfLineCr_TypedAccessorReportsCr

          - id: LintMark-OTS-EditorConfig-CaseInsensitivity
            title: >-
              EditorConfig shall match property names and values without regard to letter case.
            justification: |
              Editor settings are written by hand, and LintMark relies on the library to give the same
              property for `end_of_line = LF` as for `END_OF_LINE = lf`.
            tags: [ots]
            tests:
              - EditorConfig_Parser_PropertyAndValueCase_AreInsensitive

          - id: LintMark-OTS-EditorConfig-SectionMatching
            title: >-
              EditorConfig shall match the sections of a settings file against file paths with the glob syntax of
              the editor settings format, in a case-sensitive way, also for a file that does not exist.
            justification: |
              LintMark takes the line ending of the first section that applies to a Markdown file, so the
              result is only as correct as the library's matching.
            tags: [ots]
            tests:
              - EditorConfig_Parser_GlobPatterns_MatchPerSpecification
              - EditorConfig_Parser_SectionPatternCase_IsCaseSensitive
              - EditorConfig_Parser_NonexistentFile_StillResolved

          - id: LintMark-OTS-EditorConfig-Layering
            title: >-
              EditorConfig shall combine the settings files from a file's directory upward with a nearer file
              overriding a farther one, a later section overriding an earlier one, and a settings file marked as
              root ending the search, and shall give the same result from a resolved chain as from a direct parse.
            justification: |
              LintMark resolves the chain of settings files once per directory and evaluates every file
              of the directory against it. The tests confirm that the layering rules hold and that the
              chain gives the same answer as a direct parse.
            tags: [ots]
            tests:
              - EditorConfig_Parser_RootTrue_StopsSearch
              - EditorConfig_Parser_NestedFiles_NearerFileOverridesFarther
              - EditorConfig_Parser_LessSpecificLaterSection_OverridesEarlier
              - EditorConfig_Parser_DirectoryChain_ParseWithChain_EqualsDirectParse

          - id: LintMark-OTS-EditorConfig-MalformedLines
            title: >-
              EditorConfig shall ignore malformed lines in a settings file without failing.
            justification: |
              Editor settings files are shared with other tools, and mistakes in them must not stop LintMark.
            tags: [ots]
            tests:
              - EditorConfig_Parser_MalformedLines_AreIgnored

          - id: LintMark-OTS-EditorConfig-Concurrency
            title: >-
              EditorConfig shall give identical results when one parser instance, one parser instance per
              thread, or one resolved chain of settings files evaluates files on several threads at once.
            justification: |
              Line endings are resolved by parallel workers through one shared parser that evaluates files
              against shared, cached chains of settings files. The tests confirm that sharing is safe.
            tags: [ots]
            tests:
              - EditorConfig_Parser_SharedParser_ParallelParse_IdenticalResults
              - EditorConfig_Parser_SharedResolvedChain_ParallelParse_IdenticalResults
              - EditorConfig_Parser_ParserPerThread_ParallelParse_IdenticalResults
