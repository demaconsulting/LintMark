---
# YamlDotNet OTS Software Requirements
#
# Requirements for the YamlDotNet YAML parsing library functionality that LintMark relies on to read
# .lintmark.yaml. The configuration loader works with the library's event-level parser only.

sections:
  - title: OTS Software Requirements
    sections:
      - title: YamlDotNet Requirements
        requirements:
          - id: LintMark-OTS-YamlDotNet-Positions
            title: >-
              YamlDotNet shall report the 1-based line and column of every key and value that it parses, for
              block and flow collections, and number lines the same way for LF and CRLF input.
            justification: |
              LintMark reports each configuration problem at its exact position in the file, and the position
              must match what the user's editor shows whatever the line ending. The tests pin the position
              convention so that a library update that changes it is noticed.
            tags: [ots]
            tests:
              - YamlDotNet_Parser_BlockMapping_ReportsKeysAndValuesWithOneBasedPositions
              - YamlDotNet_Parser_FlowMapping_ReportsPositions
              - YamlDotNet_Parser_CrlfInput_ReportsSameLinesAsLf

          - id: LintMark-OTS-YamlDotNet-Errors
            title: >-
              YamlDotNet shall fail on malformed input, including tab indentation and unclosed collections,
              instead of returning content, shall give the position of a failure that carries one, and shall
              parse nested collections up to the documented nesting limit without failing.
            justification: |
              LintMark turns every parsing failure into a positioned report, so malformed input must never be
              mistaken for content. Everything the loader admits (up to its nesting limit) must be parsed
              reliably, and the depth the library handles is well above that limit.
            tags: [ots]
            tests:
              - YamlDotNet_Parser_TabIndentation_ThrowsYamlException
              - YamlDotNet_Parser_UnclosedFlowSequence_ThrowsInvalidOperationException
              - YamlDotNet_Parser_MalformedInput_ThrowsYamlExceptionWithPosition
              - YamlDotNet_Parser_DeeplyNestedFlowInput_ParsesWithoutStackExhaustion

          - id: LintMark-OTS-YamlDotNet-Documents
            title: >-
              YamlDotNet shall report to the caller how each scalar was written, every occurrence of a repeated
              key, anchors, aliases and tags, the start of each document, and no document for empty input.
            justification: |
              LintMark accepts numbers and booleans only when unquoted, detects duplicate settings itself,
              rejects anchors, aliases, tags and more than one document, and treats a file with no content like
              having no configuration. It can only decide these things if the library reports each of them
              instead of deciding for the caller.
            tags: [ots]
            tests:
              - YamlDotNet_Parser_ScalarStyles_ReportPlainAndQuoted
              - YamlDotNet_Parser_EmptyValue_IsEmptyPlainScalar
              - YamlDotNet_Parser_DuplicateKeys_AreNotRejected
              - YamlDotNet_Parser_AnchorAliasAndTag_AreReported
              - YamlDotNet_Parser_MultipleDocuments_AreReported
              - YamlDotNet_Parser_EmptyAndCommentOnlyStreams_ProduceNoDocument
              - YamlDotNet_Parser_DocumentMarkerOnly_ProducesEmptyScalarDocument
